<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پرتفوی من | آکادمی شمعدون</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
    <link rel="stylesheet" href="jalali-datepicker.css">
    <meta name="theme-color" content="#d4af37">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #14141c;
            --bg-card: #1a1a24;
            --gold: #d4af37;
            --gold-light: #f4d47c;
            --gold-dark: #a8862a;
            --green: #10b981;
            --red: #ef4444;
            --blue: #3b82f6;
            --purple: #8b5cf6;
            --orange: #f97316;
            --pink: #ec4899;
            --cyan: #06b6d4;
            --white: #f8fafc;
            --gray: #94a3b8;
        }
        [data-theme="light"] {
            --bg-primary: #f8fafc;
            --bg-secondary: #eef2f7;
            --bg-card: #ffffff;
            --gold: #b8860b;
            --gold-light: #d4af37;
            --gold-dark: #8b6508;
            --green: #059669;
            --red: #dc2626;
            --blue: #2563eb;
            --purple: #7c3aed;
            --orange: #ea580c;
            --pink: #db2777;
            --cyan: #0891b2;
            --white: #0f172a;
            --gray: #64748b;
        }
        [data-theme="light"] body {
            background-image:
                radial-gradient(circle at 0% 0%, rgba(184, 134, 11, 0.06) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(37, 99, 235, 0.05) 0%, transparent 40%),
                linear-gradient(rgba(0, 0, 0, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.025) 1px, transparent 1px);
        }
        [data-theme="light"] .btn-secondary {
            background: rgba(248, 250, 252, 0.8);
            color: #334155;
            border-color: rgba(0, 0, 0, 0.1);
        }
        [data-theme="light"] .quick-btn {
            background: rgba(248, 250, 252, 0.8);
            border-color: rgba(184, 134, 11, 0.2);
        }
        [data-theme="light"] .category-group {
            background: rgba(248, 250, 252, 0.4);
            border-color: rgba(184, 134, 11, 0.15);
        }
        [data-theme="light"] .asset-card {
            border-top-color: rgba(0, 0, 0, 0.03);
        }
        [data-theme="light"] .asset-icon-wrapper {
            background: rgba(184, 134, 11, 0.1);
        }
        [data-theme="light"] .info-item {
            background: rgba(248, 250, 252, 0.7);
        }
        [data-theme="light"] .icon-btn {
            background: rgba(248, 250, 252, 0.8);
            border-color: rgba(0, 0, 0, 0.08);
        }
        [data-theme="light"] .compare-card {
            background: rgba(248, 250, 252, 0.6);
            border-color: rgba(0, 0, 0, 0.06);
        }
        [data-theme="light"] .asset-weight-bar .bar {
            background: rgba(0, 0, 0, 0.06);
        }
        [data-theme="light"] .form-group input,
        [data-theme="light"] .form-group select,
        [data-theme="light"] .form-group textarea {
            background: #ffffff;
            border-color: rgba(0, 0, 0, 0.1);
        }
        [data-theme="light"] .stock-search-results {
            background: #ffffff;
            border-color: rgba(184, 134, 11, 0.3);
        }
        [data-theme="light"] .stock-result-item .stock-name {
            color: #0f172a;
        }
        [data-theme="light"] .stock-selected-box {
            background: rgba(184, 134, 11, 0.1);
            border-color: rgba(184, 134, 11, 0.3);
        }
        [data-theme="light"] .stock-selected-box .name {
            color: #0f172a;
        }
        [data-theme="light"] .toast {
            background: #ffffff;
            color: #0f172a;
        }
        [data-theme="light"] .modal {
            background: #ffffff;
            border-color: rgba(184, 134, 11, 0.3);
        }
        [data-theme="light"] .modal h2 {
            color: #b8860b;
            border-bottom-color: rgba(184, 134, 11, 0.2);
        }
        [data-theme="light"] .form-group label {
            color: #334155;
        }
        [data-theme="light"] .ai-insight {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(59, 130, 246, 0.03));
            border-color: rgba(37, 99, 235, 0.3);
        }
        [data-theme="light"] .ai-title {
            color: #2563eb;
        }
        [data-theme="light"] .ai-text {
            color: #334155;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background-color: var(--bg-primary);
            background-image:
                radial-gradient(circle at 0% 0%, rgba(212, 175, 55, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(59, 130, 246, 0.06) 0%, transparent 40%),
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 60px 60px, 60px 60px;
            background-attachment: fixed;
            color: var(--white);
            min-height: 100vh;
            direction: rtl;
            overflow-x: hidden;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 100px 20px 40px;
        }
        .page-header { text-align: center; margin-bottom: 30px; animation: fadeInUp 0.6s ease-out; }
        .page-header h1 {
            font-size: 36px;
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .page-header p { color: var(--gray); font-size: 14px; }
        .loading-screen { text-align: center; padding: 100px 20px; color: var(--gray); }
        .spinner {
            width: 50px; height: 50px;
            border: 4px solid rgba(212, 175, 55, 0.2);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
            animation: fadeInUp 0.6s ease-out 0.1s backwards;
        }
        .summary-card {
            background: linear-gradient(135deg, var(--bg-card), var(--bg-secondary));
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 18px;
            padding: 20px;
            text-align: center;
            transition: 0.3s;
        }
        .summary-card:hover {
            transform: translateY(-4px);
            border-color: rgba(212, 175, 55, 0.4);
            box-shadow: 0 15px 40px rgba(212, 175, 55, 0.15);
        }
        .summary-card .icon { font-size: 28px; margin-bottom: 10px; }
        .summary-card .value {
            color: var(--white);
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 6px;
            font-variant-numeric: tabular-nums;
        }
        .summary-card .value.gold { color: var(--gold); }
        .summary-card .value.green { color: var(--green); }
        .summary-card .value.red { color: var(--red); }
        .summary-card .label { color: var(--gray); font-size: 12px; }
        .summary-card .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 800;
            margin-top: 8px;
        }
        .summary-card .badge.up { background: rgba(16, 185, 129, 0.15); color: var(--green); }
        .summary-card .badge.down { background: rgba(239, 68, 68, 0.15); color: var(--red); }
        .actions-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            animation: fadeInUp 0.6s ease-out 0.15s backwards;
        }
        .btn {
            padding: 12px 20px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 13.5px;
            font-weight: 800;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--bg-primary);
            flex: 1;
            justify-content: center;
            padding: 15px;
            font-size: 15px;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.4);
        }
        .btn-secondary {
            background: rgba(20, 20, 28, 0.8);
            color: var(--white);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-secondary:hover {
            border-color: rgba(212, 175, 55, 0.4);
            color: var(--gold);
        }
        .quick-add {
            display: flex;
            gap: 8px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            animation: fadeInUp 0.6s ease-out 0.2s backwards;
        }
        .quick-btn {
            padding: 8px 14px;
            background: rgba(20, 20, 28, 0.6);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 10px;
            color: var(--gray);
            font-size: 12px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .quick-btn:hover {
            background: rgba(212, 175, 55, 0.1);
            color: var(--gold);
            border-color: var(--gold);
        }
        .quick-btn img { width: 18px; height: 18px; object-fit: contain; }
        .chart-section {
            background: linear-gradient(135deg, var(--bg-card), var(--bg-secondary));
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            animation: fadeInUp 0.6s ease-out 0.25s backwards;
        }
        .chart-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            align-items: center;
        }
        .chart-title {
            color: var(--white);
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chart-wrapper { position: relative; height: 300px; }
        .portfolio-section {
            background: linear-gradient(135deg, var(--bg-card), var(--bg-secondary));
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            animation: fadeInUp 0.6s ease-out 0.3s backwards;
        }
        .category-group {
            margin-bottom: 20px;
            border: 1px solid rgba(212, 175, 55, 0.1);
            border-radius: 15px;
            overflow: hidden;
            background: rgba(10, 10, 15, 0.3);
        }
        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 18px;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.1), rgba(212, 175, 55, 0.03));
            cursor: pointer;
            transition: 0.3s;
            user-select: none;
        }
        .category-header:hover {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.15), rgba(212, 175, 55, 0.05));
        }
        .category-header-left { display: flex; align-items: center; gap: 12px; }
        .category-icon { font-size: 24px; }
        .category-name { color: var(--gold); font-size: 15px; font-weight: 800; }
        .category-count { color: var(--gray); font-size: 11px; margin-right: 8px; }
        .category-total { color: var(--white); font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; }
        .category-toggle { color: var(--gray); font-size: 16px; transition: transform 0.3s; }
        .category-group.collapsed .category-toggle { transform: rotate(-90deg); }
        .category-group.collapsed .category-content { display: none; }
        .asset-card { padding: 18px; border-top: 1px solid rgba(255, 255, 255, 0.03); transition: 0.3s; }
        .asset-card:hover { background: rgba(212, 175, 55, 0.03); }
        .asset-card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
            flex-wrap: wrap;
        }
        .asset-card-left { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 200px; }
        .asset-icon-wrapper {
            width: 46px; height: 46px;
            border-radius: 12px;
            background: rgba(212, 175, 55, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
        }
        .asset-icon-wrapper img { width: 32px; height: 32px; object-fit: contain; }
        .asset-icon-wrapper .emoji { font-size: 24px; }
        .asset-name-info h4 { color: var(--white); font-size: 15px; font-weight: 800; margin-bottom: 3px; }
        .asset-name-info .symbol { color: var(--gray); font-size: 11px; font-family: monospace; direction: ltr; }
        .asset-card-actions { display: flex; gap: 6px; }
        .icon-btn {
            width: 34px; height: 34px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(10, 10, 15, 0.6);
            color: var(--gray);
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-btn:hover {
            border-color: var(--gold);
            color: var(--gold);
            background: rgba(212, 175, 55, 0.1);
        }
        .icon-btn.danger:hover {
            border-color: var(--red);
            color: var(--red);
            background: rgba(239, 68, 68, 0.1);
        }
        .asset-card-info {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        .info-item {
            background: rgba(10, 10, 15, 0.5);
            padding: 10px 12px;
            border-radius: 10px;
        }
        .info-item .label { color: var(--gray); font-size: 10.5px; margin-bottom: 4px; }
        .info-item .value {
            color: var(--white);
            font-size: 14px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
        }
        .info-item .value.green { color: var(--green); }
        .info-item .value.red { color: var(--red); }
        .info-item .value.gold { color: var(--gold); }
        .asset-weight-bar {
            margin-top: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .asset-weight-bar .bar {
            flex: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
            overflow: hidden;
        }
        .asset-weight-bar .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--gold), var(--gold-dark));
            border-radius: 3px;
            transition: width 0.5s;
        }
        .asset-weight-bar .percent {
            color: var(--gold);
            font-size: 12px;
            font-weight: 800;
            min-width: 45px;
            text-align: left;
        }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--gray); }
        .empty-state .icon { font-size: 80px; margin-bottom: 20px; opacity: 0.5; }
        .empty-state h2 { color: var(--gold); margin-bottom: 10px; font-size: 20px; }
        .empty-state p { margin-bottom: 25px; font-size: 14px; }
        .ai-insight {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.08), rgba(59, 130, 246, 0.02));
            border: 1px solid rgba(59, 130, 246, 0.25);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            display: flex;
            gap: 18px;
            align-items: flex-start;
            animation: fadeInUp 0.6s ease-out 0.35s backwards;
        }
        .ai-icon { font-size: 36px; flex-shrink: 0; }
        .ai-content { flex: 1; }
        .ai-title { color: #60a5fa; font-size: 15px; font-weight: 800; margin-bottom: 12px; }
        .ai-text { color: #cbd5e1; font-size: 13.5px; line-height: 1.9; margin-bottom: 15px; }
        .ai-analyze-btn {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: #fff;
            padding: 12px 24px;
            border-radius: 10px;
            border: none;
            font-family: inherit;
            font-size: 13.5px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .ai-analyze-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.4);
        }
        .ai-analyze-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .compare-section {
            background: linear-gradient(135deg, var(--bg-card), var(--bg-secondary));
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            animation: fadeInUp 0.6s ease-out 0.4s backwards;
        }
        .compare-title { color: var(--gold); font-size: 16px; font-weight: 800; margin-bottom: 15px; }
        .compare-desc { color: var(--gray); font-size: 13px; margin-bottom: 20px; line-height: 1.7; }
        .compare-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }
        .compare-card {
            background: rgba(10, 10, 15, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            transition: 0.3s;
        }
        .compare-card:hover {
            transform: translateY(-3px);
            border-color: rgba(212, 175, 55, 0.3);
        }
        .compare-card .label { color: var(--gray); font-size: 11px; margin-bottom: 8px; }
        .compare-card .value { color: var(--white); font-size: 18px; font-weight: 800; margin-bottom: 4px; }
        .compare-card .value.up { color: var(--green); }
        .compare-card .value.down { color: var(--red); }
        .compare-card .desc { color: var(--gray); font-size: 10px; }
        .compare-highlight {
            border: 2px solid var(--gold);
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.1), rgba(212, 175, 55, 0.02));
        }
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: var(--bg-card);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 20px;
            padding: 25px;
            max-width: 550px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal h2 {
            color: var(--gold);
            margin-bottom: 20px;
            font-size: 18px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.15);
        }
        .form-group { margin-bottom: 15px; }
        .form-group label {
            display: block;
            color: #cbd5e1;
            font-size: 13px;
            margin-bottom: 6px;
            font-weight: 700;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            background: rgba(10, 10, 15, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: var(--white);
            font-family: inherit;
            font-size: 13px;
            transition: 0.3s;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }
        .modal-actions .btn { flex: 1; justify-content: center; }
        .stock-search-wrapper { position: relative; }
        .stock-search-results {
            position: absolute;
            top: 100%;
            right: 0;
            left: 0;
            background: var(--bg-card);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 10px;
            max-height: 300px;
            overflow-y: auto;
            z-index: 100;
            margin-top: 4px;
            display: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .stock-search-results.show { display: block; }
        .stock-result-item {
            padding: 10px 14px;
            cursor: pointer;
            transition: 0.2s;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .stock-result-item:hover { background: rgba(212, 175, 55, 0.1); }
        .stock-result-item:last-child { border-bottom: none; }
        .stock-result-item .stock-name { color: var(--white); font-size: 13px; font-weight: 700; }
        .stock-result-item .stock-symbol { color: var(--gray); font-size: 11px; font-family: monospace; direction: ltr; }
        .stock-result-item .stock-price { color: var(--gold); font-size: 12px; font-weight: 800; direction: rtl; text-align: left; min-width: 90px; }
        .stock-result-item .stock-price small { display: block; color: var(--gray); font-size: 9px; font-weight: 400; }
        .stock-selected-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            background: rgba(212, 175, 55, 0.08);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 10px;
            margin-bottom: 15px;

    function toFa(num) {
        if (num === null || num === undefined) return '۰';
        const persianDigits = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
        return String(num).replace(/\d/g, d => persianDigits[d]);
    }

    function formatNum(num, decimals = 0) {
        if (num === null || num === undefined || num === '') return '۰';
        const n = Number(num);
        if (isNaN(n)) return '۰';
        let result;
        if (decimals > 0) {
            result = n.toFixed(decimals);
            if (result.includes('.')) {
                result = result.replace(/0+$/, '').replace(/\.$/, '');
            }
        } else {
            result = Math.round(n).toString();
        }
        const parts = result.split('.');
        parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        result = parts.join('.');
        const persianDigits = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
        return result.replace(/\d/g, d => persianDigits[d]);
    }

    function formatBigNum(num) {
        if (num === null || num === undefined || num === '') return '۰';
        const n = Number(num);
        if (isNaN(n)) return '۰';
        if (Math.abs(n) >= 1e12) return formatNum(n / 1e12, 2) + ' همت';
        if (Math.abs(n) >= 1e9) return formatNum(n / 1e9, 2) + ' میلیارد';
        if (Math.abs(n) >= 1e6) return formatNum(n / 1e6, 2) + ' میلیون';
        if (Math.abs(n) >= 1e3) return formatNum(n / 1e3, 1) + ' هزار';
        return formatNum(n);
    }

        } catch (e) {

            if (!res.ok) throw new Error('API error');
            const text = await res.text();
            if (text.trim().startsWith('<!DOCTYPE')) throw new Error('Invalid response');
            return JSON.parse(text);

        // ==========================================

        // ==========================================
        function calculateStats() {
            let totalValue = 0;
            let totalInvested = 0;
            const categoryStats = {};

            const portfolioWithPrices = portfolio.map(item => {
                const quantity = Number(item.quantity) || 0;
                const buyPrice = Number(item.buy_price) || 0;
                const currentPrice = Number(priceCache[item.asset_symbol]) || buyPrice;
                const invested = quantity * buyPrice;
                const value = quantity * currentPrice;
                const profit = value - invested;
                const profitPercent = invested > 0 ? (profit / invested) * 100 : 0;

                totalValue += value;
                totalInvested += invested;

                if (!categoryStats[item.asset_category]) {
                    categoryStats[item.asset_category] = { value: 0, count: 0 };
                }
                categoryStats[item.asset_category].value += value;
                categoryStats[item.asset_category].count++;

                return { ...item, quantity, buy_price: buyPrice, currentPrice, value, invested, profit, profitPercent };
            });

            const totalProfit = totalValue - totalInvested;
            const totalProfitPercent = totalInvested > 0 ? (totalProfit / totalInvested) * 100 : 0;

            return { totalValue, totalInvested, totalProfit, totalProfitPercent, categoryStats, items: portfolioWithPrices };
        }

        // ==========================================

        // ==========================================
        function renderPieChart(stats) {
            const ctx = document.getElementById('pieChart');
            if (!ctx) return;
            if (pieChart) pieChart.destroy();

            const labels = [];
            const data = [];
            const colors = ['#d4af37', '#10b981', '#8b5cf6', '#3b82f6', '#f97316', '#ec4899', '#06b6d4', '#84cc16'];

            Object.entries(stats.categoryStats).forEach(([catKey, cat]) => {
                const catInfo = ASSETS[catKey];
                labels.push(catInfo ? catInfo.name : catKey);
                data.push(cat.value);
            });

            pieChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels,
                    datasets: [{
                        data,
                        backgroundColor: colors.slice(0, labels.length),
                        borderColor: '#1a1a24',
                        borderWidth: 3,
                        hoverOffset: 10
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                color: '#cbd5e1',
                                font: { family: 'Vazirmatn', size: 12 },
                                padding: 12,
                                usePointStyle: true,
                                pointStyle: 'circle'
                            }
                        },
                        tooltip: {
                            backgroundColor: '#1a1a24',
                            titleColor: '#d4af37',
                            bodyColor: '#f8fafc',
                            borderColor: '#d4af37',
                            borderWidth: 1,
                            padding: 12,
                            titleFont: { family: 'Vazirmatn', size: 13, weight: 'bold' },
                            bodyFont: { family: 'Vazirmatn', size: 12 },
                            callbacks: {
                                label: function(context) {
                                    const value = context.parsed;
                                    const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                    const percent = total > 0 ? ((value / total) * 100).toFixed(1) : 0;
                                    return ` ${context.label}: ${formatBigNum(value)} (${toFa(percent)}٪)`;
                                }
                            }
                        }
                    },
                    cutout: '65%'
                }
            });
        }

        function renderBarChart(stats) {
            const ctx = document.getElementById('barChart');
            if (!ctx) return;
            if (barChart) barChart.destroy();

            const items = stats.items.slice(0, 10);
            const labels = items.map(i => i.asset_name);
            const data = items.map(i => i.profit / 1e6);

                            bodyFont: { family: 'Vazirmatn', size: 12 },

        // ==========================================
        // Add/Edit Asset
        // ==========================================
        function openAddModal(categoryKey = 'gold', symbol = null) {
            document.getElementById('assetModalTitle').textContent = '➕ افزودن دارایی';
            document.getElementById('assetId').value = '';
            document.getElementById('assetCategory').value = categoryKey;
            selectedStock = null;
            onCategoryChange();

            if (symbol && categoryKey !== 'stock') {
                document.getElementById('assetSelect').value = symbol;
                onAssetChange();
            }

            // مقدار پیش‌فرض: امروز (میلادی ISO) → picker خودش شمسی نشون می‌ده
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            const todayIso = `${yyyy}-${mm}-${dd}`;
            const dp = JalaliDatePicker.get('assetBuyDate');
            if (dp) dp.setValue(todayIso);
            else document.getElementById('assetBuyDate').value = todayIso;

            document.getElementById('assetQuantity').value = '';
            document.getElementById('assetBuyPrice').value = '';
            document.getElementById('assetNotes').value = '';
            document.getElementById('assetModal').classList.add('show');

        function onCategoryChange() {
            const catKey = document.getElementById('assetCategory').value;
            const stockSearchGroup = document.getElementById('stockSearchGroup');
            const assetSelectGroup = document.getElementById('assetSelectGroup');
            const stockSelectedBox = document.getElementById('stockSelectedBox');

            selectedStock = null;
            stockSelectedBox.style.display = 'none';

            if (catKey === 'stock' || catKey === 'fund') {
                stockSearchGroup.style.display = 'block';
                assetSelectGroup.style.display = 'none';
                document.getElementById('stockSearchInput').value = '';
                document.getElementById('stockSearchResults').classList.remove('show');
                document.getElementById('assetUnit').value = catKey === 'stock' ? 'سهم' : 'واحد';
            } else {
                stockSearchGroup.style.display = 'none';
                assetSelectGroup.style.display = 'block';
                const cat = ASSETS[catKey];
                const select = document.getElementById('assetSelect');
                select.innerHTML = cat.items.map(item => `<option value="${item.symbol}">${item.name}</option>`).join('');
                onAssetChange();
            }
        }

        function onAssetChange() {
            const catKey = document.getElementById('assetCategory').value;
            const symbol = document.getElementById('assetSelect').value;
            const cat = ASSETS[catKey];
            const item = cat.items.find(i => i.symbol === symbol);
            if (item) {
                document.getElementById('assetUnit').value = item.unit || '';
            }

        // ==========================================
        // Stock Search
        // ==========================================
        function filterStockSymbols() {
            const query = document.getElementById('stockSearchInput').value.trim().toLowerCase();
            const resultsBox = document.getElementById('stockSearchResults');
            const catKey = document.getElementById('assetCategory').value;

            if (!query || query.length < 2) {
                resultsBox.classList.remove('show');
                return;
            }

            const items = ASSETS[catKey]?.items || [];
            const filtered = items
                .filter(item => item.name.toLowerCase().includes(query) || item.symbol.toLowerCase().includes(query))
                .slice(0, 30);

            if (filtered.length === 0) {
                resultsBox.innerHTML = '<div class="stock-result-item"><span class="stock-name">نتیجه‌ای یافت نشد</span></div>';
                resultsBox.classList.add('show');
                return;
            }

            resultsBox.innerHTML = filtered.map(item => `
                <div class="stock-result-item" onclick="selectStock('${escapeHtml(item.symbol)}', '${escapeHtml(item.name)}', ${item.currentPrice || 0})">
                    <div>
                        <div class="stock-name">${escapeHtml(item.name)}</div>
                        <div class="stock-symbol">${escapeHtml(item.symbol)}</div>
                    </div>
                    ${item.currentPrice ? `
                        <div class="stock-price">
                            ${formatNum(item.currentPrice)}
                            <small>قیمت فعلی</small>
                        </div>
                    ` : ''}
                </div>
            `).join('');
            resultsBox.classList.add('show');
        }

            selectedStock = { symbol, name, price };

            let symbol, assetName, assetIcon;
            if (category === 'stock' || category === 'fund') {
                if (!selectedStock) {
                    showToast('❌ لطفاً یک نماد انتخاب کن', 'error');
                    return;
                }
                symbol = selectedStock.symbol;
                assetName = selectedStock.name;
                assetIcon = '📊';
            } else {
                symbol = document.getElementById('assetSelect').value;
                const cat = ASSETS[category];
                const item = cat.items.find(i => i.symbol === symbol);
                assetName = item ? item.name : symbol;
                assetIcon = item && item.icon ? item.icon : '📊';
            }

            if (!quantity || quantity <= 0) {
                showToast('❌ لطفاً مقدار معتبر وارد کن', 'error');
                return;
            }
            if (!buyPrice || buyPrice <= 0) {
                showToast('❌ لطفاً قیمت خرید معتبر وارد کن', 'error');
                return;
            }
            if (!buyDate) {
                showToast('❌ لطفاً تاریخ خرید رو وارد کن', 'error');
                return;
            }

            const payload = {
                user_id: currentUser.id,
                asset_category: category,
                asset_symbol: symbol,
                asset_name: assetName,
                asset_icon: assetIcon,
                quantity,
                unit,
                buy_price: buyPrice,
                buy_date: buyDate,
                notes: notes || null
            };

            let error;
            if (id) {
                ({ error } = await db.from('user_portfolio').update(payload).eq('id', id));
            } else {
                ({ error } = await db.from('user_portfolio').insert(payload));
            }

            if (error) {
                showToast('❌ خطا: ' + error.message, 'error');
                return;
            }

            showToast(id ? '✅ دارایی ویرایش شد' : '✅ دارایی اضافه شد');
            closeModal('assetModal');
            await render();
        }

        async function editAsset(id) {
            const item = portfolio.find(p => p.id === id);
            if (!item) return;

            document.getElementById('assetModalTitle').textContent = '✏️ ویرایش دارایی';
            document.getElementById('assetId').value = item.id;
            document.getElementById('assetCategory').value = item.asset_category;
            selectedStock = null;
            onCategoryChange();

            if (item.asset_category === 'stock' || item.asset_category === 'fund') {
                const foundStock = ASSETS[item.asset_category]?.items.find(s => s.symbol === item.asset_symbol);
                if (foundStock) {
                    selectStock(foundStock.symbol, foundStock.name, foundStock.currentPrice);
                } else {
                    selectedStock = { symbol: item.asset_symbol, name: item.asset_name, price: 0 };
                    document.getElementById('stockSearchInput').value = item.asset_name;
                    document.getElementById('stockSelectedBox').innerHTML = `
                        <div class="stock-selected-box">
                            <div class="info">
                                <div class="name">📊 ${escapeHtml(item.asset_name)}</div>
                                <div class="price">نماد انتخابی</div>
                            </div>
                            <button class="icon-btn danger" onclick="clearStockSelection()">✕</button>
                        </div>
                    `;
                    document.getElementById('stockSelectedBox').style.display = 'block';
                }
            } else {
                document.getElementById('assetSelect').value = item.asset_symbol;
                onAssetChange();
            }

            document.getElementById('assetQuantity').value = item.quantity;
            document.getElementById('assetUnit').value = item.unit;
            document.getElementById('assetBuyPrice').value = item.buy_price;

            // ✅ مقدار ویرایش از picker (میلادی ISO)
            const dp = JalaliDatePicker.get('assetBuyDate');
            if (dp) dp.setValue(item.buy_date);
            else document.getElementById('assetBuyDate').value = item.buy_date;

            document.getElementById('assetNotes').value = item.notes || '';
            document.getElementById('assetModal').classList.add('show');
        }

        async function deleteAsset(id) {
            if (!confirm('مطمئنی می‌خوای این دارایی رو حذف کنی؟')) return;

            const { error } = await db.from('user_portfolio').delete().eq('id', id);
            if (error) {
                showToast('❌ خطا: ' + error.message, 'error');
                return;
            }
            showToast('🗑️ دارایی حذف شد');
            await render();
        }

        // ==========================================
        // CSV Export
        // ==========================================
        function exportCSV() {
            const stats = calculateStats();
            let csv = 'نام دارایی,نماد,دسته,مقدار,واحد,قیمت خرید,قیمت فعلی,سرمایه,ارزش فعلی,سود/ضرر,درصد,تاریخ خرید\n';
            stats.items.forEach(item => {
                csv += `"${item.asset_name}","${item.asset_symbol}","${ASSETS[item.asset_category]?.name || ''}",${item.quantity},"${item.unit}",${item.buy_price},${item.currentPrice},${item.invested},${item.value},${item.profit},${item.profitPercent.toFixed(2)},${item.buy_date}\n`;
            });

            const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `portfolio-${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
            showToast('✅ فایل CSV دانلود شد');
        }

        // ==========================================
        // UI Helpers
        // ==========================================
        function toggleCategory(header) {
            const group = header.parentElement;
            group.classList.toggle('collapsed');
        }

        document.getElementById('assetModal').addEventListener('click', (e) => {
            if (e.target.id === 'assetModal') closeModal('assetModal');
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal('assetModal');
        });

        document.addEventListener('click', (e) => {
            const resultsBox = document.getElementById('stockSearchResults');
            const searchInput = document.getElementById('stockSearchInput');
            if (resultsBox && searchInput && !resultsBox.contains(e.target) && e.target !== searchInput) {
                resultsBox.classList.remove('show');
            }
        });

        // ==========================================
        // Init
        // ==========================================
        document.addEventListener('DOMContentLoaded', async () => {
            // ✅ فعال‌سازی تقویم شمسی
            JalaliDatePicker.initAll();

            const { data: { session } } = await db.auth.getSession();

            if (!session) {
                window.location.href = 'login.html';
                return;
            }

            currentUser = session.user;
            await render();
        });
        // ==========================================
        // 🌙 تم شب/روز
        // ==========================================
        function applyTheme() {
            const saved = localStorage.getItem('shamdun-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', saved);
            const icon = document.getElementById('snThemeIcon');
            if (icon) icon.textContent = saved === 'dark' ? '🌙' : '☀️';
        }

        function addThemeButtonToNavbar() {
            // صبر کن تا navbar.js لود بشه
            const navbarContainer = document.querySelector('.sn-navbar-container');
            if (!navbarContainer) {
                // navbar.js هنوز لود نشده، دوباره تلاش کن
                setTimeout(addThemeButtonToNavbar, 200);
                return;
            }
            
            // اگه دکمه تم قبلاً اضافه شده، کاری نکن
            if (document.getElementById('snThemeBtn')) return;
            
            // ساخت دکمه تم
            const themeBtn = document.createElement('button');
            themeBtn.className = 'sn-action-btn';
            themeBtn.id = 'snThemeBtn';
            themeBtn.setAttribute('aria-label', 'تغییر تم');
            themeBtn.setAttribute('title', 'تغییر تم');
            themeBtn.style.cssText = 'width:42px;height:42px;border-radius:12px;background:rgba(212,175,55,0.08);border:1px solid rgba(212,175,55,0.25);color:var(--gold);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:inherit;';
            themeBtn.innerHTML = '<span id="snThemeIcon">🌙</span>';
            
            // اضافه کن قبل از userArea
            const userArea = navbarContainer.querySelector('.sn-user-area');
            if (userArea) {
                navbarContainer.insertBefore(themeBtn, userArea);
            } else {
                navbarContainer.appendChild(themeBtn);
            }
            
            // listener
            themeBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                
                const current = document.documentElement.getAttribute('data-theme') || 'dark';
                const newTheme = current === 'dark' ? 'light' : 'dark';
                
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('shamdun-theme', newTheme);
                
                const icon = document.getElementById('snThemeIcon');
                if (icon) icon.textContent = newTheme === 'dark' ? '🌙' : '☀️';
            });
        }

        // اجرا
        setTimeout(applyTheme, 100);
        setTimeout(addThemeButtonToNavbar, 500);
        setTimeout(addThemeButtonToNavbar, 1500);
    </script>
</body>
</html>
