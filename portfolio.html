    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #14141c;
            --bg-card: #1a1a24;
            --gold: #d4af37;
            --gold-light: #f4d47c;
            --gold-dark: #a8862a;
            --green: #10b981;
            --red: #ef4444;
            --blue: #3b82f6;
            --purple: #8b5cf6;
            --orange: #f97316;
            --pink: #ec4899;
            --cyan: #06b6d4;
            --white: #f8fafc;
            --gray: #94a3b8;
        }
        [data-theme="light"] {
            --bg-primary: #f8fafc;
            --bg-secondary: #eef2f7;
            --bg-card: #ffffff;
            --gold: #b8860b;
            --gold-light: #d4af37;
            --gold-dark: #8b6508;
            --green: #059669;
            --red: #dc2626;
            --blue: #2563eb;
            --purple: #7c3aed;
            --orange: #ea580c;
            --pink: #db2777;
            --cyan: #0891b2;
            --white: #0f172a;
            --gray: #64748b;
        }
        [data-theme="light"] body {
            background-image:
                radial-gradient(circle at 0% 0%, rgba(184, 134, 11, 0.06) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(37, 99, 235, 0.05) 0%, transparent 40%),
                linear-gradient(rgba(0, 0, 0, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.025) 1px, transparent 1px);
        }
        [data-theme="light"] .btn-secondary {
            background: rgba(248, 250, 252, 0.8);
            color: #334155;
            border-color: rgba(0, 0, 0, 0.1);
        }
        [data-theme="light"] .quick-btn {
            background: rgba(248, 250, 252, 0.8);
            border-color: rgba(184, 134, 11, 0.2);
        }
        [data-theme="light"] .category-group {
            background: rgba(248, 250, 252, 0.4);
            border-color: rgba(184, 134, 11, 0.15);
        }
        [data-theme="light"] .asset-card {
            border-top-color: rgba(0, 0, 0, 0.03);
        }
        [data-theme="light"] .asset-icon-wrapper {
            background: rgba(184, 134, 11, 0.1);
        }
        [data-theme="light"] .info-item {
            background: rgba(248, 250, 252, 0.7);
        }
        [data-theme="light"] .icon-btn {
            background: rgba(248, 250, 252, 0.8);
            border-color: rgba(0, 0, 0, 0.08);
        }
        [data-theme="light"] .compare-card {
            background: rgba(248, 250, 252, 0.6);
            border-color: rgba(0, 0, 0, 0.06);
        }
        [data-theme="light"] .asset-weight-bar .bar {
            background: rgba(0, 0, 0, 0.06);
        }
        [data-theme="light"] .form-group input,
        [data-theme="light"] .form-group select,
        [data-theme="light"] .form-group textarea {
            background: #ffffff;
            border-color: rgba(0, 0, 0, 0.1);
        }
        [data-theme="light"] .stock-search-results {
            background: #ffffff;
            border-color: rgba(184, 134, 11, 0.3);
        }
        [data-theme="light"] .stock-result-item .stock-name {
            color: #0f172a;
        }
        [data-theme="light"] .stock-selected-box {
            background: rgba(184, 134, 11, 0.1);
            border-color: rgba(184, 134, 11, 0.3);
        }
        [data-theme="light"] .stock-selected-box .name {
            color: #0f172a;
        }
        [data-theme="light"] .toast {
            background: #ffffff;
            color: #0f172a;
        }
        [data-theme="light"] .modal {
            background: #ffffff;
            border-color: rgba(184, 134, 11, 0.3);
        }
        [data-theme="light"] .modal h2 {
            color: #b8860b;
            border-bottom-color: rgba(184, 134, 11, 0.2);
        }
        [data-theme="light"] .form-group label {
            color: #334155;
        }
        [data-theme="light"] .ai-insight {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(59, 130, 246, 0.03));
            border-color: rgba(37, 99, 235, 0.3);
        }
        [data-theme="light"] .ai-title {
            color: #2563eb;
        }
        [data-theme="light"] .ai-text {
            color: #334155;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background-color: var(--bg-primary);
            background-image:
                radial-gradient(circle at 0% 0%, rgba(212, 175, 55, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(59, 130, 246, 0.06) 0%, transparent 40%),
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 60px 60px, 60px 60px;
            background-attachment: fixed;
            color: var(--white);
            min-height: 100vh;
            direction: rtl;
            overflow-x: hidden;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 100px 20px 40px;
        }
        .page-header { text-align: center; margin-bottom: 30px; animation: fadeInUp 0.6s ease-out; }
        .page-header h1 {
            font-size: 36px;
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .page-header p { color: var(--gray); font-size: 14px; }
        .loading-screen { text-align: center; padding: 100px 20px; color: var(--gray); }
        .spinner {
            width: 50px; height: 50px;
            border: 4px solid rgba(212, 175, 55, 0.2);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
            animation: fadeInUp 0.6s ease-out 0.1s backwards;
        }
        .summary-card {
            background: linear-gradient(135deg, var(--bg-card), var(--bg-secondary));
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 18px;
            padding: 20px;
            text-align: center;
            transition: 0.3s;
        }
        .summary-card:hover {
            transform: translateY(-4px);
            border-color: rgba(212, 175, 55, 0.4);
            box-shadow: 0 15px 40px rgba(212, 175, 55, 0.15);
        }
        .summary-card .icon { font-size: 28px; margin-bottom: 10px; }
        .summary-card .value {
            color: var(--white);
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 6px;
            font-variant-numeric: tabular-nums;
        }
        .summary-card .value.gold { color: var(--gold); }
        .summary-card .value.green { color: var(--green); }
        .summary-card .value.red { color: var(--red); }
        .summary-card .label { color: var(--gray); font-size: 12px; }
        .summary-card .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 800;
            margin-top: 8px;
        }
        .summary-card .badge.up { background: rgba(16, 185, 129, 0.15); color: var(--green); }
        .summary-card .badge.down { background: rgba(239, 68, 68, 0.15); color: var(--red); }
        .actions-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            animation: fadeInUp 0.6s ease-out 0.15s backwards;
        }
        .btn {
            padding: 12px 20px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 13.5px;
            font-weight: 800;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--bg-primary);
            flex: 1;
            justify-content: center;
            padding: 15px;
            font-size: 15px;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.4);
        }
        .btn-secondary {
            background: rgba(20, 20, 28, 0.8);
            color: var(--white);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-secondary:hover {
            border-color: rgba(212, 175, 55, 0.4);
            color: var(--gold);
        }
        .quick-add {
            display: flex;
            gap: 8px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            animation: fadeInUp 0.6s ease-out 0.2s backwards;
        }
        .quick-btn {
            padding: 8px 14px;
            background: rgba(20, 20, 28, 0.6);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 10px;
            color: var(--gray);
            font-size: 12px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .quick-btn:hover {
            background: rgba(212, 175, 55, 0.1);
            color: var(--gold);
            border-color: var(--gold);
        }
        .quick-btn img { width: 18px; height: 18px; object-fit: contain; }
        .chart-section {
            background: linear-gradient(135deg, var(--bg-card), var(--bg-secondary));
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            animation: fadeInUp 0.6s ease-out 0.25s backwards;
        }
        .chart-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            align-items: center;
        }
        .chart-title {
            color: var(--white);
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chart-wrapper { position: relative; height: 300px; }
        .portfolio-section {
            background: linear-gradient(135deg, var(--bg-card), var(--bg-secondary));
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            animation: fadeInUp 0.6s ease-out 0.3s backwards;
        }
        .category-group {
            margin-bottom: 20px;
            border: 1px solid rgba(212, 175, 55, 0.1);
            border-radius: 15px;
            overflow: hidden;
            background: rgba(10, 10, 15, 0.3);
        }
        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 18px;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.1), rgba(212, 175, 55, 0.03));
            cursor: pointer;
            transition: 0.3s;
            user-select: none;
        }
        .category-header:hover {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.15), rgba(212, 175, 55, 0.05));
        }
        .category-header-left { display: flex; align-items: center; gap: 12px; }
        .category-icon { font-size: 24px; }
        .category-name { color: var(--gold); font-size: 15px; font-weight: 800; }
        .category-count { color: var(--gray); font-size: 11px; margin-right: 8px; }
        .category-total { color: var(--white); font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; }
        .category-toggle { color: var(--gray); font-size: 16px; transition: transform 0.3s; }
        .category-group.collapsed .category-toggle { transform: rotate(-90deg); }
        .category-group.collapsed .category-content { display: none; }
        .asset-card { padding: 18px; border-top: 1px solid rgba(255, 255, 255, 0.03); transition: 0.3s; }
        .asset-card:hover { background: rgba(212, 175, 55, 0.03); }
        .asset-card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
            flex-wrap: wrap;
        }
        .asset-card-left { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 200px; }
        .asset-icon-wrapper {
            width: 46px; height: 46px;
            border-radius: 12px;
            background: rgba(212, 175, 55, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
        }
        .asset-icon-wrapper img { width: 32px; height: 32px; object-fit: contain; }
        .asset-icon-wrapper .emoji { font-size: 24px; }
        .asset-name-info h4 { color: var(--white); font-size: 15px; font-weight: 800; margin-bottom: 3px; }
        .asset-name-info .symbol { color: var(--gray); font-size: 11px; font-family: monospace; direction: ltr; }
        .asset-card-actions { display: flex; gap: 6px; }
        .icon-btn {
            width: 34px; height: 34px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(10, 10, 15, 0.6);
            color: var(--gray);
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-btn:hover {
            border-color: var(--gold);
            color: var(--gold);
            background: rgba(212, 175, 55, 0.1);
        }
        .icon-btn.danger:hover {
            border-color: var(--red);
            color: var(--red);
            background: rgba(239, 68, 68, 0.1);
        }
        .table-delete-btn { width:32px; height:32px; border-radius:9px; border:1px solid rgba(239,68,68,.16); background:rgba(239,68,68,.045); color:var(--gray); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; font-size:15px; transition:.2s ease; }
        .table-delete-btn:hover { color:#fff; border-color:rgba(239,68,68,.55); background:rgba(239,68,68,.14); transform:translateY(-1px); }
        .table-action-buttons {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .table-edit-btn,
        .table-delete-btn {
            width: 34px;
            height: 34px;
            padding: 0;
            border-radius: 9px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-family: inherit;
            transition: all .2s ease;
        } 

        .table-edit-btn {
            background: rgba(59, 130, 246, 0.10);
            border: 1px solid rgba(59, 130, 246, 0.25);
        }

        .table-edit-btn:hover {
            background: rgba(59, 130, 246, 0.18);
            transform: translateY(-1px);
        }

        .table-delete-btn:hover {
            transform: translateY(-1px);
        }
        .compare-edit-btn { width:26px; height:26px; border-radius:7px; border:1px solid rgba(212,175,55,.22); background:rgba(212,175,55,.06); color:var(--gold); cursor:pointer; font-family:inherit; font-size:12px; margin-inline-start:5px; vertical-align:middle; }
        .compare-edit-btn:hover { background:rgba(212,175,55,.14); border-color:rgba(212,175,55,.5); }
        .asset-card-info {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        .info-item {
            background: rgba(10, 10, 15, 0.5);
            padding: 10px 12px;
            border-radius: 10px;
        }
        .info-item .label { color: var(--gray); font-size: 10.5px; margin-bottom: 4px; }
        .info-item .value {
            color: var(--white);
            font-size: 14px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
        }
        .info-item .value.green { color: var(--green); }
        .info-item .value.red { color: var(--red); }
        .info-item .value.gold { color: var(--gold); }
        .asset-weight-bar {
            margin-top: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .asset-weight-bar .bar {
            flex: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
            overflow: hidden;
        }
        .asset-weight-bar .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--gold), var(--gold-dark));
            border-radius: 3px;
            transition: width 0.5s;
        }
        .asset-weight-bar .percent {
            color: var(--gold);
            font-size: 12px;
            font-weight: 800;
            min-width: 45px;
            text-align: left;
        }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--gray); }
        .empty-state .icon { font-size: 80px; margin-bottom: 20px; opacity: 0.5; }
        .empty-state h2 { color: var(--gold); margin-bottom: 10px; font-size: 20px; }
        .empty-state p { margin-bottom: 25px; font-size: 14px; }
        .ai-insight {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.08), rgba(59, 130, 246, 0.02));
            border: 1px solid rgba(59, 130, 246, 0.25);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            display: flex;
            gap: 18px;
            align-items: flex-start;
            animation: fadeInUp 0.6s ease-out 0.35s backwards;
        }
        .ai-icon { font-size: 36px; flex-shrink: 0; }
        .ai-content { flex: 1; }
        .ai-title { color: #60a5fa; font-size: 15px; font-weight: 800; margin-bottom: 12px; }
        .ai-text { color: #cbd5e1; font-size: 13.5px; line-height: 1.9; margin-bottom: 15px; }
        .ai-analyze-btn {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: #fff;
            padding: 12px 24px;
            border-radius: 10px;
            border: none;
            font-family: inherit;
            font-size: 13.5px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .ai-analyze-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.4);
        }
        .ai-analyze-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .compare-section {
            background: linear-gradient(135deg, var(--bg-card), var(--bg-secondary));
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            animation: fadeInUp 0.6s ease-out 0.4s backwards;
        }
        .compare-title { color: var(--gold); font-size: 16px; font-weight: 800; margin-bottom: 15px; }
        .compare-desc { color: var(--gray); font-size: 13px; margin-bottom: 20px; line-height: 1.7; }
        .compare-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }
        .compare-card {
            background: rgba(10, 10, 15, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            transition: 0.3s;
        }
        .compare-card:hover {
            transform: translateY(-3px);
            border-color: rgba(212, 175, 55, 0.3);
        }
        .compare-card .label { color: var(--gray); font-size: 11px; margin-bottom: 8px; }
        .compare-card .value { color: var(--white); font-size: 18px; font-weight: 800; margin-bottom: 4px; }
        .compare-card .value.up { color: var(--green); }
        .compare-card .value.down { color: var(--red); }
        .compare-card .desc { color: var(--gray); font-size: 10px; }
        .compare-highlight {
            border: 2px solid var(--gold);
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.1), rgba(212, 175, 55, 0.02));

    function toFa(num) {
        if (num === null || num === undefined) return '۰';
        const persianDigits = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
        return String(num).replace(/\d/g, d => persianDigits[d]);
    }

    function formatNum(num, decimals = 0) {
        if (num === null || num === undefined || num === '') return '۰';
        const n = Number(num);
        if (isNaN(n)) return '۰';
        let result;
        if (decimals > 0) {
            result = n.toFixed(decimals);
            if (result.includes('.')) {
                result = result.replace(/0+$/, '').replace(/\.$/, '');
            }
        } else {
            result = Math.round(n).toString();
        }
        const parts = result.split('.');
        parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        result = parts.join('.');
        const persianDigits = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
        return result.replace(/\d/g, d => persianDigits[d]);
    }

    function formatBigNum(num) {
        if (num === null || num === undefined || num === '') return '۰';
        const n = Number(num);
        if (isNaN(n)) return '۰';
        if (Math.abs(n) >= 1e12) return formatNum(n / 1e12, 2) + ' همت';
        if (Math.abs(n) >= 1e9) return formatNum(n / 1e9, 2) + ' میلیارد';
        if (Math.abs(n) >= 1e6) return formatNum(n / 1e6, 2) + ' میلیون';
        if (Math.abs(n) >= 1e3) return formatNum(n / 1e3, 1) + ' هزار';
        return formatNum(n);
    }

        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;

    function formatDate(dateStr) {
        if (!dateStr) return '—';
        try {
            if (window.jalaliHelpers && /^\d{4}-\d{2}-\d{2}$/.test(dateStr)) {
                return window.jalaliHelpers.gregToJalaliStr(dateStr);
            }
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return '—';
            return new Intl.DateTimeFormat('fa-IR', { year: 'numeric', month: 'short', day: 'numeric' }).format(d);
        } catch (e) {
            return '—';
        }
    }

        async function fetchBrsApi(url) {
            const separator = url.includes('?') ? '&' : '?';
            const res = await fetch(`${url}${separator}key=${encodeURIComponent(BRS_API_KEY)}`);
            const text = await res.text();
            if (text.trim().startsWith('<!DOCTYPE')) throw new Error('Invalid response');
            let data;
            try { data = JSON.parse(text); } catch { throw new Error('Invalid JSON response'); }
            if (!res.ok) {
                const msg = data?.message_error || data?.message || `HTTP ${res.status}`;
                throw new Error(msg);
            }
            return data;
        }

        function getAssetDefinition(category, symbol) {
            const cat = ASSETS[category];
            return cat?.items?.find(i => i.symbol === symbol) || null;
        }

        function assetCurrency(itemOrDef) {
            const def = itemOrDef?.currency ? itemOrDef : getAssetDefinition(itemOrDef?.asset_category, itemOrDef?.asset_symbol);
            if (def?.currency) return def.currency;
            if (itemOrDef?.asset_category === 'crypto' || itemOrDef?.asset_category === 'global') return 'USD';
            return 'IRR';
        }

        function currencyLabel(currency) {
            return currency === 'USD' ? 'دلار' : 'تومان';
        }

        function getUsdRate() {
            const n = Number(priceCache.usd);
            return n > 0 ? n : null;
        }

        function toToman(amount, currency) {
            const n = Number(amount) || 0;
            if (currency === 'USD') {
                const rate = getUsdRate();
                return rate ? n * rate : null;
            }
            return n;
        }

        function formatMoney(value, currency = 'IRR', compact = false) {
            if (value === null || value === undefined || !Number.isFinite(Number(value))) return '—';
            const n = Number(value);
            const text = compact ? formatBigNum(Math.abs(n)) : formatNum(Math.abs(n));
            return `${n < 0 ? '−' : ''}${text} ${currencyLabel(currency)}`;
        }

        function holdingDays(dateStr) {
            if (!dateStr) return null;
            const d = new Date(`${dateStr}T00:00:00`);
            if (isNaN(d.getTime())) return null;
            return Math.max(0, Math.floor((Date.now() - d.getTime()) / 86400000));
        }

        function holdingDuration(dateStr) {
            const days = holdingDays(dateStr);
            if (days === null) return '—';
            if (days < 30) return `${toFa(days)} روز`;
            if (days < 365) return `${toFa(Math.floor(days / 30))} ماه · ${toFa(days)} روز`;
            return `${toFa(Math.floor(days / 365))} سال · ${toFa(days % 365)} روز`;
        }

                const quantity = Number(item.quantity) || 0;
                const buyPrice = Number(item.buy_price) || 0;
                const liveRaw = priceCache[item.asset_symbol];
                const hasLive = Number.isFinite(Number(liveRaw)) && Number(liveRaw) > 0;
                const currentPrice = hasLive ? Number(liveRaw) : null;
                const investedToman = toToman(quantity * buyPrice, currency);
                const valueToman = hasLive ? toToman(quantity * currentPrice, currency) : null;
                const profit = (investedToman !== null && valueToman !== null) ? valueToman - investedToman : null;
                const profitPercent = (profit !== null && investedToman > 0) ? (profit / investedToman) * 100 : null;
                if (investedToman !== null) totalInvested += investedToman;
                if (valueToman !== null) totalValue += valueToman;
                const category = item.asset_category || 'other';
                if (!categoryStats[category]) categoryStats[category] = { value: 0, count: 0 };
                if (valueToman !== null) categoryStats[category].value += valueToman;
                categoryStats[category].count++;
                return {
                    ...item,
                    quantity,
                    buy_price: buyPrice,
                    currentPrice,
                    currency,
                    unit: item.unit || def?.unit || 'واحد',
                    currentValue: valueToman,
                    invested: investedToman,
                    profit,
                    profitPercent,
                    holdingDuration: holdingDuration(item.buy_date),
                    hasLivePrice: hasLive,
                    liveUnit: currencyLabel(currency),
                    tvSymbol: def?.tv || null
                };
            });
            const totalProfit = totalValue - totalInvested;
            const totalProfitPercent = totalInvested > 0 ? (totalProfit / totalInvested) * 100 : 0;
            return { totalValue, totalInvested, totalProfit, totalProfitPercent, categoryStats, items: portfolioWithPrices, usdRate: getUsdRate() };
        }

        function renderPieChart(stats) {
            const canvas = document.getElementById('pieChart');
            if (!canvas || typeof Chart === 'undefined') return;

            if (pieChart) {
                try { pieChart.destroy(); } catch (e) {}
                pieChart = null;
            }

            const labels = [];
            const values = [];
            const categoryStats = stats?.categoryStats || {};
            const orderedKeys = [
                ...Object.keys(ASSETS || {}).filter(key => categoryStats[key]),
                ...Object.keys(categoryStats).filter(key => !(ASSETS || {})[key])
            ];

            orderedKeys.forEach(key => {
                const value = Number(categoryStats[key]?.value) || 0;
                if (value <= 0) return;
                const category = ASSETS[key] || { name: key, icon: '🌟' };
                labels.push(category.name || key);
                values.push(value);
            });

            if (!values.length) {
                const ctx = canvas.getContext('2d');
                if (ctx) {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.font = '12px Vazirmatn';
                    ctx.fillStyle = '#94A3B8';
                    ctx.textAlign = 'center';
                    ctx.fillText('داده‌ای برای نمایش تخصیص دارایی وجود ندارد', canvas.width / 2, canvas.height / 2);
                }
                return;
            }

            const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
            const textColor = isDark ? '#F8FAFC' : '#1F2937';
            const gridColor = isDark ? 'rgba(148,163,184,.12)' : 'rgba(71,85,105,.12)';

            pieChart = new Chart(canvas.getContext('2d'), {
                type: 'doughnut',
                data: {
                    labels,
                    datasets: [{
                        data: values,
                        borderWidth: 2,
                        borderColor: isDark ? '#101116' : '#FFFFFF',
                        backgroundColor: [
                            '#D4AF37', '#3B82F6', '#35C58A', '#F97316', '#A855F7',
                            '#14B8A6', '#EAB308', '#EC4899', '#64748B', '#06B6D4'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '58%',
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                color: textColor,
                                font: { family: 'Vazirmatn', size: 11 },
                                padding: 14,
                                usePointStyle: true
                            }
                        },
                        tooltip: {
                            backgroundColor: isDark ? '#1A1A24' : '#FFFFFF',
                            titleColor: textColor,
                            bodyColor: textColor,
                            borderColor: gridColor,
                            borderWidth: 1,
                            callbacks: {
                                label: context => {
                                    const total = values.reduce((a, b) => a + b, 0);
                                    const value = Number(context.raw) || 0;
                                    const percent = total > 0 ? (value / total) * 100 : 0;
                                    return ` ${formatMoney(value, 'IRR', true)} · ${toFa(percent.toFixed(1))}٪`;
                                }
                            }
                        }
                    }
                }
            });
        }

        function trendSvg(change) {
            const c = Number(change) || 0;
            const color = c > 0 ? '#35c58a' : c < 0 ? '#f06b6b' : '#94A3B8';
            const path = c > 0 ? 'M3 17 L9 12 L14 14 L20 8 L27 10 L35 3' : c < 0 ? 'M3 4 L9 9 L14 7 L20 14 L27 12 L35 20' : 'M3 12 L10 12 L17 12 L24 12 L31 12 L37 12';
            return `<svg viewBox="0 0 40 24" width="40" height="24" aria-hidden="true"><path d="${path}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
        }

        const CHARTABLE_CRYPTO = new Set(['btc','eth','xaut','paxg','usdt-erc','usdc','sol','xrp','doge','ada','bnb','trx','avax']);

        function canChartAsset(item) {

            if (['usd', 'gold18', 'bourse'].includes(item.asset_symbol)) return true;
            if (item.asset_category === 'stock' || item.asset_category === 'fund' || item.asset_category === 'ayar') return true;
            return item.asset_category === 'global' && !!getAssetDefinition(item.asset_category, item.asset_symbol)?.tv;
        }

        const tgjuHistoryCache = {};
        const cryptoHistoryCache = {};
        const compareHistoryCache = {};

        const TGJU_HISTORY_SLUGS = {
            gold18: 'geram18',
            'ounce-gold': 'ons',
            xauusd: 'ons',
            'ounce-silver': 'silver',
            xagusd: 'silver',
            usd: 'price_dollar_rl'
        };

        const CRYPTO_IDS = {
            btc:'bitcoin', eth:'ethereum', xaut:'tether-gold', paxg:'pax-gold',
            'usdt-erc':'tether', usdc:'usd-coin', sol:'solana', xrp:'ripple',
            doge:'dogecoin', ada:'cardano', bnb:'binancecoin', trx:'tron', avax:'avalanche-2'
        };

        function cleanNumeric(v) {
            if (v === null || v === undefined) return null;
            const n = Number(String(v).replace(/<[^>]*>/g,'').replace(/,/g,'').replace(/[^0-9.\-]/g,''));
            return Number.isFinite(n) ? n : null;
        }

        function parseTgjuRows(payload) {
            const rows = Array.isArray(payload?.data) ? payload.data : [];
            return rows.map(row => {
                if (!Array.isArray(row)) return null;
                const close = cleanNumeric(row[3]);
                const greg = String(row[6] || '').replace(/<[^>]*>/g,'').trim();
                const jalali = String(row[7] || '').replace(/<[^>]*>/g,'').trim();
                const m = greg.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/);
                const iso = m ? `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}` : null;
                return { close, greg, jalali, iso };
            }).filter(x => x && x.close !== null && x.iso);
        }

        async function fetchTgjuHistory(slug) {
            if (tgjuHistoryCache[slug]) return tgjuHistoryCache[slug];
            const params = new URLSearchParams({lang:'fa',order_dir:'asc',draw:'2'});
            for(let i=0;i<8;i++){
                params.append(`columns[${i}][data]`,String(i));
                params.append(`columns[${i}][name]`,'');
                params.append(`columns[${i}][searchable]`,'true');
                params.append(`columns[${i}][orderable]`,'true');
                params.append(`columns[${i}][search][value]`,'');
                params.append(`columns[${i}][search][regex]`,'false');
            }
            params.append('start','0');
            params.append('length','5000');
            params.append('search','');
            params.append('order_col','');
            params.append('order_dir','');
            params.append('from','');
            params.append('to','');
            params.append('convert_to_ad','1');
            params.append('_',String(Date.now()));
            const res = await fetch(`https://api.tgju.org/v1/market/indicator/summary-table-data/${encodeURIComponent(slug)}?${params.toString()}`);
            if (!res.ok) throw new Error(`TGJU ${res.status}`);
            const data = await res.json();
            const rows = parseTgjuRows(data).sort((a,b)=>a.iso.localeCompare(b.iso));
            if (!rows.length) throw new Error('empty-history');
            tgjuHistoryCache[slug] = rows;
            return rows;
        }

        function normalizeHistoryIso(value) {
            if (!value) return null;
            const raw = String(value).trim();
            const m = raw.match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);
            return m ? `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}` : null;
        }

        function findHistoryAtOrBefore(rows, dateValue) {
            if (!dateValue || !Array.isArray(rows) || !rows.length) return null;
            const target = normalizeHistoryIso(dateValue);
            if (!target) return null;
            let best = null;
            for (const r of rows) {
                const rowDate = normalizeHistoryIso(r?.iso || r?.greg);
                if (!rowDate) continue;
                if (rowDate <= target) best = r;
                else break;
            }
            // مهم: اگر هیچ رکوردی قبل/در تاریخ خرید وجود ندارد، رکورد دیگری را
            // به‌عنوان قیمت خرید جا نمی‌زنیم؛ باید «—» نمایش داده شود.
            return best;
        }

        function sliceHistory(rows, period) {
            const days = period === '1D' ? 2 : period === '1W' ? 7 : period === '1M' ? 31 : period === '3M' ? 93 : period === '6M' ? 186 : 366;
            const cutoff = Date.now() - days * 86400000;
            const filtered = rows.filter(r => new Date(r.iso+'T00:00:00').getTime() >= cutoff);
            return filtered.length >= 2 ? filtered : rows.slice(-Math.max(2, Math.min(rows.length, days)));
        }

        async function fetchSilver999History() {
            if (tgjuHistoryCache.__silver999) return tgjuHistoryCache.__silver999;
            try {
                const direct = await fetchTgjuHistory('silver_999');
                tgjuHistoryCache.__silver999 = direct;
                return direct;
            } catch (_) {}
            try {
                const direct = await fetchTgjuHistory('silver-999');
                tgjuHistoryCache.__silver999 = direct;
                return direct;
            } catch (_) {}

            const [silverUsd, usdIrr] = await Promise.all([fetchTgjuHistory('silver'), fetchTgjuHistory('price_dollar_rl')]);
            const derived = silverUsd.map(r => {
                const fx = findHistoryAtOrBefore(usdIrr, r.iso);
                const close = fx ? (r.close * fx.close * 0.999 / 31.1035) : null;
                return { ...r, close };
            }).filter(r => Number.isFinite(r.close));
            if (!derived.length) throw new Error('silver999-history-unavailable');
            tgjuHistoryCache.__silver999 = derived;
            return derived;
        }

        async function fetchCryptoHistory(symbol, days = 370) {
            if (cryptoHistoryCache[symbol]) return cryptoHistoryCache[symbol];
            const coinId = CRYPTO_IDS[symbol];
            if (!coinId) throw new Error('unsupported-crypto');
            const url = `https://api.coingecko.com/api/v3/coins/${coinId}/market_chart?vs_currency=usd&days=${days}&interval=daily`;
            const res = await fetch(url);
            if (!res.ok) throw new Error(`CoinGecko ${res.status}`);
            const data = await res.json();
            const rows = (Array.isArray(data?.prices) ? data.prices : [])
                .map(p => ({ timestamp:Number(p[0]), close:Number(p[1]), iso:new Date(Number(p[0])).toISOString().slice(0,10) }))
                .filter(r => Number.isFinite(r.close) && r.close > 0)
                .sort((a,b)=>a.timestamp-b.timestamp);
            if (!rows.length) throw new Error('empty-crypto-history');
            cryptoHistoryCache[symbol] = rows;
            return rows;
        }

        function findCryptoAtOrBefore(rows, isoDate) {
            let best = null;
            for (const r of rows) {
                if (r.iso <= isoDate) best = r;
                else break;
            }
            return best || rows[0];
        }

        async function getBenchmarkHistory(key) {
            if (compareHistoryCache[key]) return compareHistoryCache[key];
            if (key === 'gold18') {
                const rows = await fetchTgjuHistory('geram18');
                return compareHistoryCache[key] = { type:'irr', rows, label:'طلا ۱۸ عیار', icon:'🥇', source:'TGJU' };
            }
            if (key === 'silver999') {
                const rows = await fetchSilver999History();
                return compareHistoryCache[key] = { type:'irr', rows, label:'نقره ۹۹۹', icon:'🥈', source:'TGJU' };
            }
            if (key === 'btc') {
                const rows = await fetchCryptoHistory('btc', 370);
                const fx = await fetchTgjuHistory('price_dollar_rl');
                return compareHistoryCache[key] = { type:'usdfx', rows, fx, label:'بیت‌کوین', icon:'₿', source:'CoinGecko + TGJU' };
            }
            if (key === 'xauusd') {
                const rows = await fetchTgjuHistory('ons');
                const fx = await fetchTgjuHistory('price_dollar_rl');
                return compareHistoryCache[key] = { type:'usd', rows, fx, label:'انس طلا', icon:'🌕', source:'TGJU' };
            }
            if (key === 'xagusd') {
                const rows = await fetchTgjuHistory('silver');
                const fx = await fetchTgjuHistory('price_dollar_rl');
                return compareHistoryCache[key] = { type:'usd', rows, fx, label:'انس نقره', icon:'🌑', source:'TGJU' };
            }
            throw new Error('unsupported-benchmark');
        }

        async function benchmarkReturn(key, buyDate) {
            if (!buyDate) return null;
            const h = await getBenchmarkHistory(key);
            if (h.type === 'irr') {
                const base = findHistoryAtOrBefore(h.rows, buyDate);
                const latest = h.rows[h.rows.length - 1];
                if (!base || !latest || !base.close || !latest.close) return null;
                return { buy:base.close, latest:latest.close, percent:(latest.close/base.close-1)*100, label:h.label, icon:h.icon, source:h.source, local:true };
            }
            const baseAsset = findCryptoAtOrBefore(h.rows, buyDate) || findHistoryAtOrBefore(h.rows, buyDate);
            const latestAsset = h.rows[h.rows.length - 1];
            const baseFx = findHistoryAtOrBefore(h.fx, buyDate);
            const latestFx = h.fx[h.fx.length - 1];
            if (!baseAsset || !latestAsset || !baseFx || !latestFx) return null;
            const baseLocal = baseAsset.close * baseFx.close;
            const latestLocal = latestAsset.close * latestFx.close;
            if (!(baseLocal > 0 && latestLocal > 0)) return null;
            return { buy:baseLocal, latest:latestLocal, percent:(latestLocal/baseLocal-1)*100, label:h.label, icon:h.icon, source:h.source, local:true };
        }

        function destroyChartInBox(box) {
            const old = box.querySelector('canvas');
            if (old) {
                const existing = Chart.getChart(old);
                if (existing) existing.destroy();
            }
        }

        function renderLineChart(box, values, borderColor, labels=[]) {
            destroyChartInBox(box);
            box.innerHTML='<canvas></canvas>';

        function parseBrsHistoryRowsForChart(payload) {
            const raw = Array.isArray(payload) ? payload : (Array.isArray(payload?.data) ? payload.data : []);
            return raw.map(r => {
                if (!Array.isArray(r)) return null;
                const close = cleanNumeric(r[3]);
                const greg = String(r[6] ?? '').replace(/<[^>]*>/g, '').trim();
                const jalali = String(r[7] ?? '').replace(/<[^>]*>/g, '').trim();
                const iso = normalizeHistoryIso(greg);
                return close !== null && iso ? { close: close / 10, greg, jalali, iso } : null;
            }).filter(Boolean).sort((a,b) => a.iso.localeCompare(b.iso));
        }

        async function loadAssetChart(id, period = '1D', button = null) {
            const item = calculateStats().items.find(x => String(x.id) === String(id));
            const box = document.getElementById(`asset-chart-${id}`);
            if (!item || !box) return;
            if (button) { button.parentElement.querySelectorAll('.chart-period').forEach(b=>b.classList.remove('active')); button.classList.add('active'); }
            box.innerHTML='<div class="chart-message">در حال دریافت تاریخچه قیمت…</div>';

            try {
                if (CHARTABLE_CRYPTO.has(item.asset_symbol)) {
                    const rows = await fetchCryptoHistory(item.asset_symbol, period === '1Y' ? 370 : period === '6M' ? 190 : period === '3M' ? 100 : period === '1M' ? 35 : period === '1W' ? 10 : 3);
                    const sliced = sliceHistory(rows.map(r=>({ ...r, greg:r.iso })), period);
                    renderLineChart(box, sliced.map(x=>x.close), '#d4af37', sliced.map(x=>formatDate(x.iso)));
                    return;
                }

                if (item.asset_symbol === 'gold18') {
                    const rows = sliceHistory(await fetchTgjuHistory('geram18'), period);
                    renderLineChart(box, rows.map(x=>x.close), '#d4af37', rows.map(x=>x.jalali || x.greg));
                    return;
                }

                if (item.asset_symbol === 'usd') {
                    const rows = sliceHistory(await fetchTgjuHistory('price_dollar_rl'), period);
                    renderLineChart(box, rows.map(x=>x.close), '#35c58a', rows.map(x=>x.jalali || x.greg));
                    return;
                }

                if (item.asset_category === 'stock' || item.asset_category === 'fund' || item.asset_category === 'ayar') {
                    const payload = await fetchBrsApi('https://Api.BrsApi.ir/Tsetmc/History.php?l18=' + encodeURIComponent(item.asset_symbol) + '&type=0');
                    const rows = sliceHistory(parseBrsHistoryRowsForChart(payload), period);
                    if (!rows.length) throw new Error('empty-tsetmc-history');
                    renderLineChart(box, rows.map(x=>x.close), '#d4af37', rows.map(x=>x.jalali || x.greg));
                    return;
                }

                if (item.asset_symbol === 'silver999') {
                    const rows = sliceHistory(await fetchSilver999History(), period);
                    renderLineChart(box, rows.map(x=>x.close), '#94a3b8', rows.map(x=>x.jalali || x.greg));
                    return;
                }

                if (item.asset_symbol === 'ounce-gold' || item.asset_symbol === 'xauusd') {
                    const rows = sliceHistory(await fetchTgjuHistory('ons'), period);
                    renderLineChart(box, rows.map(x=>x.close), '#d4af37', rows.map(x=>x.jalali || x.greg));
                    return;
                }

                if (item.asset_symbol === 'ounce-silver' || item.asset_symbol === 'xagusd') {
                    const rows = sliceHistory(await fetchTgjuHistory('silver'), period);
                    renderLineChart(box, rows.map(x=>x.close), '#94a3b8', rows.map(x=>x.jalali || x.greg));
                    return;
                }

                const def = getAssetDefinition(item.asset_category, item.asset_symbol);
                if (item.asset_category === 'global' && def?.tv) {
                    renderTradingViewChart(box, def.tv, period);
                    return;
                }

                throw new Error('unsupported-chart');
            } catch (e) {
                console.error('Asset chart error:', item.asset_symbol, e);
                box.innerHTML='<div class="chart-message">تاریخچه واقعی این دارایی از منبع فعلی در دسترس نیست؛ عدد یا نمودار ساختگی نمایش داده نمی‌شود.</div>';
            }
        }

        // اگر تاریخچه قیمت خرید در دسترس نباشد، قیمت مرجع را می‌توان دستی وارد و ذخیره کرد.
        function manualCompareKey(item, benchmarkKey) {
            const id = item.id || `${item.asset_symbol || item.asset_name}_${item.buy_date}`;

                return raw.map(r => {
                    if (!Array.isArray(r)) return null;
                    const pc = cleanNumeric(r[3]);

                    const jalali = String(r[7] ?? '').replace(/<[^>]*>/g,'').trim();
                    const iso = normalizeHistoryIso(gregRaw);

                }).filter(Boolean).sort((a,b)=>a.iso.localeCompare(b.iso));

            }

            const cache = {};
            function marketCurrentPrice(key) {
                if (key === 'gold18') return Number(priceCache.gold18) > 0 ? Number(priceCache.gold18) : null;

                    catch(e) { console.warn('gold18 history request failed:',e); return cache[key] = {rows:[],currency:'IRR',label:'طلا ۱۸ عیار',icon:'🥇',source:'TGJU',type:'market',currentClose:marketCurrentPrice(key)}; }

                    catch(e) { console.warn('usd history request failed:',e); return cache[key] = {rows:[],currency:'IRR',label:'دلار آزاد',icon:'💵',source:'TGJU',type:'market',currentClose:marketCurrentPrice(key)}; }

                throw new Error('unsupported benchmark');

            function atPurchase(history, buyDate, manualBase) {
                if (history.type === 'bank') {
                    const start = new Date(buyDate);
                    const end = new Date();
                    const days = Number.isFinite(start.getTime()) ? Math.max(0, Math.floor((end-start)/86400000)) : 0;
                    const rate = Number(history.annualRate) || 0;
                    const percent = rate > 0 ? (Math.pow(1 + rate/100, days/365) - 1) * 100 : 0;
                    return {...history,base:{close:1,iso:buyDate,greg:'',jalali:''},latest:{close:1+percent/100,iso:null,greg:'',jalali:''},percent,days};
                }
                const rows = Array.isArray(history.rows) ? history.rows : [];
                const realBase = rows.length ? findHistoryAtOrBefore(rows,buyDate) : null;
                const latest = rows.length ? rows[rows.length-1] : (history.currentClose > 0 ? {close:history.currentClose, iso:null, greg:'', jalali:''} : null);
                const base = realBase && realBase.close > 0 ? realBase : (manualBase > 0 ? {close:manualBase, iso:buyDate, greg:'', jalali:'', manual:true} : null);
                if (!latest || !(latest.close>0)) return {...history,base,latest:null,percent:null};
                if (!base || !(base.close>0)) return {...history,base:null,latest,percent:null};
                return {...history,base,latest,percent:(latest.close/base.close-1)*100};

            function priceText(result,value) {

            function hypothetical(invested,result) {

                    !result ||
                    !result.base ||
                    !(result.base.close > 0) ||

            for (const item of stats.items) {

                const basket=comparable.length===benchmarks.length ? comparable.reduce((sum,x)=>sum+x.result.percent,0)/benchmarks.length : null;
                const best=comparable.length?Math.max(...comparable.map(x=>x.result.percent)):null;

            document.getElementById('stockSearchResults').classList.remove('show');

            const box = document.getElementById('stockSelectedBox');
            box.innerHTML = `
                <div class="stock-selected-box">
                    <div class="info">
                        <div class="name">📊 ${escapeHtml(name)}</div>
                        <div class="price">${price ? 'قیمت فعلی: ' + formatNum(price) + ' تومان' : 'قیمت لحظه‌ای موجود نیست'}</div>
                    </div>
                    <button class="icon-btn danger" onclick="clearStockSelection()" title="حذف">✕</button>
                </div>
            `;
            box.style.display = 'block';
        }

        function clearStockSelection() {
            selectedStock = null;
            document.getElementById('stockSearchInput').value = '';
            document.getElementById('stockSelectedBox').style.display = 'none';
        }

        function quickAdd(categoryKey, symbol) {
            openAddModal(categoryKey, symbol);
        }

        // ==========================================
        // Save Asset
        // ==========================================
        async function saveAsset() {
            const id = document.getElementById('assetId').value;
            const category = document.getElementById('assetCategory').value;
            const quantityRaw = document.getElementById('assetQuantity').value;
            let unit = document.getElementById('assetUnit').value;
            const buyPriceRaw = document.getElementById('assetBuyPrice').value;

            // ✅ خواندن تاریخ از picker (میلادی ISO)
            const input = document.getElementById('assetBuyDate');
            const dp = JalaliDatePicker.get(input);
            const buyDate = dp ? dp.getIsoValue() : (input.dataset.iso || input.value);

            const notes = document.getElementById('assetNotes').value.trim();
            const quantity = parseFloat(quantityRaw);
            const buyPrice = parseFloat(buyPriceRaw);

            let symbol, assetName, assetIcon;
            if (category === 'stock') {
                if (!selectedStock) {
                    showToast('❌ لطفاً یک نماد انتخاب کن', 'error');
                    return;
                }
                symbol = selectedStock.symbol;
                assetName = selectedStock.name;
                assetIcon = '📊';
                unit = category === 'stock' ? 'سهم' : 'واحد';
            } else {
                symbol = document.getElementById('assetSelect').value;
                const cat = ASSETS[category];
                const item = cat.items.find(i => i.symbol === symbol);
                assetName = item ? item.name : symbol;
                assetIcon = item && item.icon ? item.icon : '📊';
                unit = item?.unit || unit;
            }

            if (!quantity || quantity <= 0) {
                showToast('❌ لطفاً مقدار معتبر وارد کن', 'error');
                return;
            }
            if (!buyPrice || buyPrice <= 0) {
                showToast('❌ لطفاً قیمت خرید معتبر وارد کن', 'error');
                return;
            }
            if (!buyDate) {
                showToast('❌ لطفاً تاریخ خرید رو وارد کن', 'error');
                return;
            }

            const payload = {
                user_id: currentUser.id,
                asset_category: category,
                asset_symbol: symbol,
                asset_name: assetName,
                asset_icon: assetIcon,
                quantity,
                unit,
                buy_price: buyPrice,
                buy_date: buyDate,
                notes: notes || null
            };

            let error;
            if (id) {
                ({ error } = await db.from('user_portfolio').update(payload).eq('id', id));
            } else {
                ({ error } = await db.from('user_portfolio').insert(payload));
            }

            if (error) {
                showToast('❌ خطا: ' + error.message, 'error');
                return;
            }

            showToast(id ? '✅ دارایی ویرایش شد' : '✅ دارایی اضافه شد');
            closeModal('assetModal');
            await render();
        }

        async function editAsset(id) {
            const item = portfolio.find(p => p.id === id);
            if (!item) return;

            document.getElementById('assetModalTitle').textContent = '✏️ ویرایش دارایی';
            document.getElementById('assetId').value = item.id;
            document.getElementById('assetCategory').value = item.asset_category;
            selectedStock = null;
            onCategoryChange();

            if (item.asset_category === 'stock' || item.asset_category === 'fund') {
                const foundStock = ASSETS[item.asset_category]?.items.find(s => s.symbol === item.asset_symbol);
                if (foundStock) {
                    selectStock(foundStock.symbol, foundStock.name, foundStock.currentPrice);
                } else {
                    selectedStock = { symbol: item.asset_symbol, name: item.asset_name, price: 0 };
                    document.getElementById('stockSearchInput').value = item.asset_name;
                    document.getElementById('stockSelectedBox').innerHTML = `
                        <div class="stock-selected-box">
                            <div class="info">
                                <div class="name">📊 ${escapeHtml(item.asset_name)}</div>
                                <div class="price">نماد انتخابی</div>
                            </div>
                            <button class="icon-btn danger" onclick="clearStockSelection()">✕</button>
                        </div>
                    `;
                    document.getElementById('stockSelectedBox').style.display = 'block';
                }
            } else {
                document.getElementById('assetSelect').value = item.asset_symbol;
                onAssetChange();
            }

            document.getElementById('assetQuantity').value = item.quantity;
            document.getElementById('assetUnit').value = item.unit;
            document.getElementById('assetBuyPrice').value = item.buy_price;

            // ✅ مقدار ویرایش از picker (میلادی ISO)
            const dp = JalaliDatePicker.get('assetBuyDate');
            if (dp) dp.setValue(item.buy_date);
            else document.getElementById('assetBuyDate').value = item.buy_date;

            document.getElementById('assetNotes').value = item.notes || '';
            document.getElementById('assetModal').classList.add('show');
        }

        async function deleteAsset(id) {
            if (!confirm('مطمئنی می‌خوای این دارایی رو حذف کنی؟')) return;

            const { error } = await db.from('user_portfolio').delete().eq('id', id);
            if (error) {
                showToast('❌ خطا: ' + error.message, 'error');
                return;
            }
            showToast('🗑️ دارایی حذف شد');
            await render();
        }

        // ==========================================
        // CSV Export
        // ==========================================
        function exportCSV() {
            const stats = calculateStats();
            let csv = 'نام دارایی,نماد,دسته,مقدار,واحد,قیمت خرید,قیمت فعلی,سرمایه,ارزش فعلی,سود/ضرر,درصد,تاریخ خرید\n';
            stats.items.forEach(item => {
                csv += `"${item.asset_name}","${item.asset_symbol}","${ASSETS[item.asset_category]?.name || ''}",${item.quantity},"${item.unit}",${item.buy_price},${item.currentPrice ?? ""},${item.invested ?? ""},${item.currentValue ?? ""},${item.profit ?? ""},${item.profitPercent == null ? "" : item.profitPercent.toFixed(2)},${item.buy_date}\n`;
            });

            const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `portfolio-${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
            showToast('✅ فایل CSV دانلود شد');
        }

        // ==========================================
        // UI Helpers
        // ==========================================
        function toggleCategory(header) {
            const group = header.parentElement;
            group.classList.toggle('collapsed');
        }

        document.getElementById('assetModal').addEventListener('click', (e) => {
            if (e.target.id === 'assetModal') closeModal('assetModal');
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal('assetModal');
        });

        document.addEventListener('click', (e) => {
            const resultsBox = document.getElementById('stockSearchResults');
            const searchInput = document.getElementById('stockSearchInput');
            if (resultsBox && searchInput && !resultsBox.contains(e.target) && e.target !== searchInput) {
                resultsBox.classList.remove('show');
            }
        });

        // ==========================================
        // Init
        // ==========================================
        document.addEventListener('DOMContentLoaded', async () => {
            // ✅ فعال‌سازی تقویم شمسی
            JalaliDatePicker.initAll();

            const { data: { session } } = await db.auth.getSession();

            if (!session) {
                window.location.href = 'login.html';
                return;
            }

            currentUser = session.user;
            await render();
        });
        // ==========================================
        // 🌙 تم شب/روز
        // ==========================================
        function applyTheme() {
            const saved = localStorage.getItem('shamdun-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', saved);
            const icon = document.getElementById('snThemeIcon');
            if (icon) icon.textContent = saved === 'dark' ? '🌙' : '☀️';
        }

        function addThemeButtonToNavbar() {
            // صبر کن تا navbar.js لود بشه
            const navbarContainer = document.querySelector('.sn-navbar-container');
            if (!navbarContainer) {
                // navbar.js هنوز لود نشده، دوباره تلاش کن
                setTimeout(addThemeButtonToNavbar, 200);
                return;
            }
            
            // اگه دکمه تم قبلاً اضافه شده، کاری نکن
            if (document.getElementById('snThemeBtn')) return;
            
            // ساخت دکمه تم
            const themeBtn = document.createElement('button');
            themeBtn.className = 'sn-action-btn';
            themeBtn.id = 'snThemeBtn';
            themeBtn.setAttribute('aria-label', 'تغییر تم');
            themeBtn.setAttribute('title', 'تغییر تم');
            themeBtn.style.cssText = 'width:42px;height:42px;border-radius:12px;background:rgba(212,175,55,0.08);border:1px solid rgba(212,175,55,0.25);color:var(--gold);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:inherit;';
            themeBtn.innerHTML = '<span id="snThemeIcon">🌙</span>';
            
            // اضافه کن قبل از userArea
            const userArea = navbarContainer.querySelector('.sn-user-area');
            if (userArea) {
                navbarContainer.insertBefore(themeBtn, userArea);
            } else {
                navbarContainer.appendChild(themeBtn);
            }
            
            // listener
            themeBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                
                const current = document.documentElement.getAttribute('data-theme') || 'dark';
                const newTheme = current === 'dark' ? 'light' : 'dark';
                
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('shamdun-theme', newTheme);
                
                const icon = document.getElementById('snThemeIcon');
                if (icon) icon.textContent = newTheme === 'dark' ? '🌙' : '☀️';
            });
        }

        // اجرا
        setTimeout(applyTheme, 100);
        setTimeout(addThemeButtonToNavbar, 500);
        setTimeout(addThemeButtonToNavbar, 1500);
    </script>
</body>
</html>
