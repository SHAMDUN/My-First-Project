name: Test TSETMC Access

on:
  workflow_dispatch:

jobs:
  test-tsetmc:
    runs-on: ubuntu-latest

    steps:
      - name: Test TSETMC CDN
        run: |
          echo "Testing TSETMC CDN..."
          curl -sS -L --max-time 20 \
            -o /tmp/tsetmc-cdn.json \
            -w "HTTP_STATUS=%{http_code}\nTIME=%{time_total}\n" \
            "https://cdn.tsetmc.com/api/Instrument/GetInstrumentOptionMarketWatch/1"

          echo "Response size:"
          wc -c /tmp/tsetmc-cdn.json

          echo "First 500 characters:"
          head -c 500 /tmp/tsetmc-cdn.json

      - name: Test TSETMC WebGW
        run: |
          echo "Testing TSETMC WebGW..."
          curl -sS -L --max-time 20 \
            -o /tmp/tsetmc-webgw.json \
            -w "HTTP_STATUS=%{http_code}\nTIME=%{time_total}\n" \
            "https://webgw.tse.ir/InstrumentProvider/api/v1/MarketWatch/MarketWatchOption/fa"

          echo "Response size:"
          wc -c /tmp/tsetmc-webgw.json

          echo "First 500 characters:"
          head -c 500 /tmp/tsetmc-webgw.json
