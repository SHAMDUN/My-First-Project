      - name: Find option symbols
        run: |
          echo "Searching for option symbols..."

          python3 - <<'PY'
          import json

          with open("/tmp/brs.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          print("Total records:", len(data))

          matches = []

          for row in data:
              text = " ".join(
                  str(row.get(k, ""))
                  for k in ["l18", "l30", "cs", "isin"]
              )

              if (
                  "اختیار" in text
                  or "هخ" in text
                  or "هف" in text
              ):
                  matches.append(row)

          print("Option-like records:", len(matches))
          print("")

          for row in matches[:30]:
              print({
                  "l18": row.get("l18"),
                  "l30": row.get("l30"),
                  "cs": row.get("cs"),
                  "isin": row.get("isin"),
                  "id": row.get("id")
              })
          PY
