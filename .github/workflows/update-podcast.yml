name: Update Podcast Playlist

on:
  push:
    paths:
      - 'audio/**'
  workflow_dispatch:

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Generate Playlist JSON
        run: node generate-playlist.js

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.json
          git diff --staged --quiet || git commit -m "به‌روزرسانی خودکار لیست پادکست"
          git push
