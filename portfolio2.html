<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پرتفوی من | آکادمی شمعدون</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
    <link rel="stylesheet" href="jalali-datepicker.css">
    <meta name="theme-color" content="#d4af37">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #14141c;
            --bg-card: #1a1a24;
            --gold: #d4af37;
            --gold-light: #f4d47c;
            --gold-dark: #a8862a;
            --green: #10b981;
            --red: #ef4444;
            --blue: #3b82f6;
            --white: #f8fafc;
            --gray: #94a3b8;
        }
        [data-theme="light"] {
            --bg-primary: #f8fafc;
            --bg-secondary: #eef2f7;
            --bg-card: #ffffff;
            --gold: #b8860b;
            --gold-light: #d4af37;
            --gold-dark: #8b6508;
            --green: #059669;
            --red: #dc2626;
            --blue: #2563eb;
            --white: #0f172a;
            --gray: #64748b;
        }
        [data-theme="light"] .form-group input,
        [data-theme="light"] .form-group select,
        [data-theme="light"] .form-group textarea {
            background: #ffffff;
            border-color: rgba(0, 0, 0, 0.1);
            color: #0f172a;
        }
        [data-theme="light"] .modal {
            background: #ffffff;
            border-color: rgba(184, 134, 11, 0.3);
        }
        [data-theme="light"] .modal h2 {
            color: #b8860b;
            border-bottom-color: rgba(184, 134, 11, 0.2);
        }
        [data-theme="light"] .form-group label { color: #334155; }
        html[data-theme="light"] .compare-selector,
        body.light-theme .compare-selector {
            background: #ffffff !important;
            border-color: #e5d9b8 !important;
        }
        html[data-theme="light"] .compare-option,
        body.light-theme .compare-option {
            background: #f5f6f8 !important;
            color: #1f2937 !important;
            border-color: #e5e7eb !important;
        }
        html[data-theme="light"] .option-text,
        body.light-theme .option-text { color: #1f2937 !important; }
        html[data-theme="light"] .compare-asset-card,
        body.light-theme .compare-asset-card {
            background: #ffffff !important;
            color: #1f2937 !important;
            border-color: #e5e7eb !important;
        }
        html[data-theme="light"] .compare-table th,
        body.light-theme .compare-table th {
            background: #f5f6f8 !important;
            color: #475569 !important;
        }
        html[data-theme="light"] .compare-table td,
        body.light-theme .compare-table td {
            background: #ffffff !important;
            color: #1f2937 !important;
            border-color: #e5e7eb !important;
        }
        html[data-theme="light"] .compare-table tr:nth-child(even) td,
        body.light-theme .compare-table tr:nth-child(even) td {
            background: #fafafa !important;
        }
        html[data-theme="light"] .compare-table .price,
        body.light-theme .compare-table .price { color: #1f2937 !important; }
        html[data-theme="light"] .compare-asset-date,
        body.light-theme .compare-asset-date { color: #64748b !important; }
        html[data-theme="light"] .compare-title,
        body.light-theme .compare-title { color: #1f2937 !important; }
        html[data-theme="light"] .compare-desc,
        body.light-theme .compare-desc { color: #64748b !important; }
        html[data-theme="light"] .compare-selector-title,
        body.light-theme .compare-selector-title { color: #1f2937 !important; }
        html[data-theme="light"] .compare-bank-rate,
        body.light-theme .compare-bank-rate {
            color: #475569 !important;
            border-top-color: #e5e7eb !important;
        }
        html[data-theme="light"] #compareBankRate,
        body.light-theme #compareBankRate {
            background: #ffffff !important;
            color: #0f172a !important;
            border-color: #e5e7eb !important;
            -webkit-text-fill-color: #0f172a !important;
        }
        html[data-theme="light"] .compare-table-wrap,
        body.light-theme .compare-table-wrap { border-color: #e5e7eb !important; }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background-color: var(--bg-primary);
            color: var(--white);
            min-height: 100vh;
            direction: rtl;
        }
        .main-container { max-width: 1200px; margin: 0 auto; padding: 100px 20px 40px; }
        .page-header { text-align: center; margin-bottom: 30px; }
        .page-header h1 {
            font-size: 36px; font-weight: 900; margin-bottom: 10px;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .page-header p { color: var(--gray); font-size: 14px; }
        .loading-screen { text-align: center; padding: 100px 20px; color: var(--gray); }
        .spinner {
            width: 50px; height: 50px;
            border: 4px solid rgba(212, 175, 55, 0.2);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .summary-grid {
            display: grid; grid-template-columns: repeat(4, 1fr);
            gap: 15px; margin-bottom: 25px;
        }
        .summary-card {
            background: linear-gradient(135deg, var(--bg-card), var(--bg-secondary));
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 18px; padding: 20px; text-align: center;
        }
        .summary-card .icon { font-size: 28px; margin-bottom: 10px; }
        .summary-card .value { font-size: 22px; font-weight: 900; margin-bottom: 6px; }
        .summary-card .value.gold { color: var(--gold); }
        .summary-card .value.green { color: var(--green); }
        .summary-card .value.red { color: var(--red); }
        .summary-card .label { color: var(--gray); font-size: 12px; }
        .actions-bar { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
        .btn {
            padding: 12px 20px; border-radius: 12px; border: none;
            cursor: pointer; font-family: inherit; font-size: 13.5px; font-weight: 800;
            display: inline-flex; align-items: center; gap: 8px;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--bg-primary); flex: 1; justify-content: center;
            padding: 15px; font-size: 15px;
        }
        .btn-secondary {
            background: rgba(20, 20, 28, 0.8); color: var(--white);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .portfolio-table-card {
            margin: 20px 0; background: var(--bg-card);
            border: 1px solid rgba(148,163,184,.14);
            border-radius: 18px; overflow: hidden;
        }
        .table-card-head {
            padding: 18px 20px; display: flex; justify-content: space-between;
            align-items: center; gap: 15px;
            border-bottom: 1px solid rgba(148,163,184,.14);
        }
        .table-subtitle { font-size: 12px; color: var(--gray); margin-top: 4px; }
        .usd-rate-badge {
            font-size: 12px; color: var(--gray); padding: 9px 12px;
            border: 1px solid rgba(148,163,184,.14); border-radius: 10px; white-space: nowrap;
        }
        .usd-rate-badge strong { color: var(--gold); }
        .table-scroll { width: 100%; overflow-x: auto; }
        .smart-portfolio-table { width: 100%; min-width: 1380px; border-collapse: collapse; }
        .smart-portfolio-table th, .smart-portfolio-table td {
            padding: 13px 10px; border-bottom: 1px solid rgba(148,163,184,.14);
            text-align: right; vertical-align: middle; font-size: 12px;
        }
        .smart-portfolio-table th {
            color: var(--gray); font-weight: 700;
            background: rgba(255,255,255,.02); white-space: nowrap;
        }
        .smart-portfolio-table tfoot td {
            background: rgba(212,175,55,.06); border-bottom: 0;
        }
        .table-asset { display: flex; align-items: center; gap: 9px; min-width: 170px; }
        .table-icon {
            width: 34px; height: 34px; border-radius: 9px;
            background: rgba(212,175,55,.08);
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; flex: 0 0 auto;
        }
        .table-icon img { width: 25px; height: 25px; object-fit: contain; }
        .table-asset small {
            display: block; color: var(--gray); font-size: 10px;
            margin-top: 1px; direction: ltr; text-align: right;
        }

        /* ==========================================
           دکمه ✏️ قیمت دستی — واضح و بزرگ
           ========================================== */
        .manual-price-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            min-width: 34px;
            border-radius: 9px;
            border: 2px solid #d4af37;
            background: rgba(212, 175, 55, 0.2);
            color: #d4af37;
            cursor: pointer;
            font-family: inherit;
            font-size: 15px;
            padding: 0;
            margin: 0 6px;
            vertical-align: middle;
            box-shadow: 0 2px 8px rgba(212, 175, 55, 0.3);
            transition: all 0.15s;
        }
        .manual-price-btn:hover {
            background: rgba(212, 175, 55, 0.4);
            transform: scale(1.1);
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.5);
        }
        .manual-price-btn.wide {
            width: auto;
            padding: 0 14px;
            font-size: 12px;
            font-weight: 800;
        }
        [data-theme="light"] .manual-price-btn {
            background: rgba(184, 134, 11, 0.15);
            border-color: #b8860b;
            color: #b8860b;
            box-shadow: 0 2px 8px rgba(184, 134, 11, 0.25);
        }
        [data-theme="light"] .manual-price-btn:hover {
            background: rgba(184, 134, 11, 0.3);
        }

        .profit { color: #35c58a !important; }
        .loss { color: #f06b6b !important; }
        .neutral { color: var(--gray) !important; }
        .table-action-buttons {
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .table-edit-btn, .table-delete-btn {
            width: 34px; height: 34px; padding: 0; border-radius: 9px;
            display: inline-flex; align-items: center; justify-content: center;
            cursor: pointer; font-family: inherit;
        }
        .table-edit-btn {
            background: rgba(59,130,246,.10);
            border: 1px solid rgba(59,130,246,.25);
        }
        .table-delete-btn {
            background: rgba(239,68,68,.10);
            border: 1px solid rgba(239,68,68,.25);
        }
        .modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px); z-index: 1000;
            align-items: center; justify-content: center;
            padding: 20px; overflow-y: auto;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: var(--bg-card);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 20px; padding: 25px;
            max-width: 550px; width: 100%;
            max-height: 90vh; overflow-y: auto;
        }
        .modal h2 {
            color: var(--gold); margin-bottom: 20px; font-size: 18px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.15);
        }
        .form-group { margin-bottom: 15px; }
        .form-group label {
            display: block; color: #cbd5e1; font-size: 13px;
            margin-bottom: 6px; font-weight: 700;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 12px 14px;
            background: rgba(10, 10, 15, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px; color: var(--white);
            font-family: inherit; font-size: 13px;
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .modal-actions {
            display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end;
        }
        .modal-actions .btn { flex: 1; justify-content: center; }
        .toast {
            position: fixed; bottom: 30px; left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-card); color: var(--white);
            padding: 14px 24px; border-radius: 12px;
            border-right: 4px solid var(--gold);
            z-index: 2000; transition: 0.4s;
            font-size: 14px; font-weight: 700;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.success { border-right-color: var(--green); }
        .toast.error { border-right-color: var(--red); }
        .footer {
            text-align: center; padding: 30px 20px; color: var(--gray);
            font-size: 12px;
            border-top: 1px solid rgba(212, 175, 55, 0.1);
            margin-top: 40px;
        }
        .compare-section {
            background: linear-gradient(135deg, var(--bg-card), var(--bg-secondary));
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 20px; padding: 25px; margin-bottom: 25px;
        }
        .compare-title {
            color: var(--gold); font-size: 16px;
            font-weight: 800; margin-bottom: 15px;
        }
        .compare-desc {
            color: var(--gray); font-size: 13px;
            margin-bottom: 20px; line-height: 1.7;
        }
        .compare-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }
        .compare-loading {
            padding: 22px; text-align: center;
            color: var(--gray); font-size: 12px;
        }
        .compare-selector {
            margin: 16px 0 14px; padding: 14px;
            border: 1px solid rgba(212,175,55,.18);
            border-radius: 14px; background: rgba(255,255,255,.018);
        }
        .compare-selector-title {
            color: var(--white); font-size: 12px;
            font-weight: 800; margin-bottom: 10px;
        }
        .compare-selector-grid {
            display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px;
        }
        .compare-option {
            position: relative; display: flex; align-items: center;
            gap: 9px; padding: 10px 11px;
            border: 1px solid rgba(148,163,184,.14);
            border-radius: 11px; background: rgba(10,10,15,.35);
            cursor: pointer;
        }
        .compare-option input { position: absolute; opacity: 0; pointer-events: none; }
        .compare-option .check {
            width: 18px; height: 18px;
            border: 1px solid rgba(148,163,184,.35);
            border-radius: 5px;
            display: flex; align-items: center; justify-content: center;
            color: transparent; font-size: 11px; font-weight: 900;
        }
        .compare-option input:checked + .check {
            background: var(--gold); border-color: var(--gold); color: #111;
        }
        .option-text { color: var(--gray); font-size: 11px; font-weight: 700; }
        .compare-bank-rate {
            display: flex; align-items: center; gap: 9px;
            margin-top: 11px; padding-top: 11px;
            border-top: 1px solid rgba(148,163,184,.1);
            color: var(--gray); font-size: 10px;
        }
        .compare-bank-rate input {
            width: 90px; padding: 7px 9px;
            background: rgba(10,10,15,.8);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 8px; color: var(--white);
            font-family: inherit; text-align: center;
        }
        .compare-asset-card {
            grid-column: 1 / -1; background: rgba(10,10,15,.42);
            border: 1px solid rgba(148,163,184,.14);
            border-radius: 16px; padding: 16px;
        }
        .compare-asset-head {
            display: flex; justify-content: space-between;
            gap: 14px; align-items: flex-start;
            margin-bottom: 14px; flex-wrap: wrap;
        }
        .compare-asset-name {
            font-weight: 800; color: var(--white); font-size: 14px;
        }
        .compare-asset-date {
            color: var(--gray); font-size: 10px; margin-top: 4px;
        }
        .compare-actual {
            font-weight: 800; font-size: 14px; white-space: nowrap;
        }
        .compare-table-wrap {
            overflow-x: auto;
            border: 1px solid rgba(148,163,184,.12);
            border-radius: 12px;
        }
        .compare-table {
            width: 100%; min-width: 850px; border-collapse: collapse;
        }
        .compare-table th, .compare-table td {
            padding: 10px 9px;
            border-bottom: 1px solid rgba(148,163,184,.1);
            font-size: 11px; text-align: right;
        }
        .compare-table th {
            color: var(--gray); font-weight: 700;
            background: rgba(255,255,255,.025);
        }
        .compare-table .price { white-space: nowrap; }
        .compare-table .return { font-weight: 900; white-space: nowrap; }
        .compare-table .hypothetical { font-weight: 800; white-space: nowrap; }
        .chart-section {
            background: linear-gradient(135deg, var(--bg-card), var(--bg-secondary));
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 20px; padding: 25px; margin-bottom: 25px;
        }
        .chart-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 25px; align-items: center;
        }
        .chart-title {
            color: var(--white); font-size: 16px;
            font-weight: 800; margin-bottom: 15px;
        }
        .chart-wrapper { position: relative; height: 300px; }
        .portfolio-section {
            background: linear-gradient(135deg, var(--bg-card), var(--bg-secondary));
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 20px; padding: 25px; margin-bottom: 25px;
        }
        .empty-state {
            text-align: center; padding: 60px 20px; color: var(--gray);
        }
        .empty-state .icon { font-size: 80px; margin-bottom: 20px; opacity: 0.5; }
        .empty-state h2 {
            color: var(--gold); margin-bottom: 10px; font-size: 20px;
        }
        @media (max-width: 1000px) {
            .summary-grid { grid-template-columns: repeat(2, 1fr); }
            .chart-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="main-container" id="mainContent">
        <div class="loading-screen">
            <div class="spinner"></div>
            ⏳ در حال بارگذاری پرتفوی...
        </div>
    </div>

    <footer class="footer">
        © ۱۴۰۵ آکادمی شمعدون | تمامی حقوق محفوظ است
    </footer>

    <div class="modal-overlay" id="assetModal">
        <div class="modal">
            <h2 id="assetModalTitle">➕ افزودن دارایی</h2>
            <input type="hidden" id="assetId">
            <div class="form-group">
                <label>دسته‌بندی *</label>
                <select id="assetCategory" onchange="onCategoryChange()">
                    <option value="gold">🥇 طلا</option>
                    <option value="currency">💵 ارز</option>
                    <option value="stock">📊 بورس ایران</option>
                    <option value="ayar">🟡 صندوق طلای عیار</option>
                    <option value="fund">💼 صندوق درآمد ثابت آوند</option>
                    <option value="bank">🏦 سپرده بانکی</option>
                    <option value="other">🌟 سایر</option>
                </select>
            </div>
            <div class="form-group" id="assetSelectGroup">
                <label>دارایی *</label>
                <select id="assetSelect" onchange="onAssetChange()"></select>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>مقدار *</label>
                    <input type="number" id="assetQuantity" step="any" min="0">
                </div>
                <div class="form-group">
                    <label>واحد</label>
                    <input type="text" id="assetUnit" readonly>
                </div>
            </div>
            <div class="form-group">
                <label>قیمت خرید (هر واحد) *</label>
                <input type="number" id="assetBuyPrice" step="any" min="0">
            </div>
            <div class="form-group">
                <label>تاریخ خرید *</label>
                <input type="text" id="assetBuyDate" data-jalali-picker>
            </div>
            <div class="form-group">
                <label>یادداشت (اختیاری)</label>
                <textarea id="assetNotes" rows="2"></textarea>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal('assetModal')">لغو</button>
                <button class="btn btn-primary" onclick="saveAsset()">💾 ذخیره</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="navbar.js"></script>
    <script src="supabase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jalaali-js@1.2.6/dist/jalaali.min.js"></script>
    <script src="jalali-datepicker.js"></script>
    <script>
        const ASSETS = {
            gold: {
                name: 'طلا و فلزات گرانبها', icon: '🥇',
                items: [
                    { symbol: 'gold18', name: 'طلا ۱۸ عیار', unit: 'گرم', icon: '🥇', tgju: 'geram18' },
                    { symbol: 'gold-melted', name: 'طلای آب‌شده', unit: 'مثقال', icon: '🟡', tgju: 'mesghal' },
                    { symbol: 'silver999', name: 'نقره ۹۹۹', unit: 'گرم', icon: '🥈', tgju: 'silver_999' },
                    { symbol: 'ounce-gold', name: 'انس طلا', unit: 'انس', icon: '🏅', tgju: 'ons' },
                    { symbol: 'ounce-silver', name: 'انس نقره', unit: 'انس', icon: '🥈', tgju: 'silver' },
                    { symbol: 'coin-emami', name: 'سکه امامی', unit: 'عدد', icon: '🪙' },
                    { symbol: 'coin-bahar', name: 'سکه بهار آزادی', unit: 'عدد', icon: '🏅' },
                    { symbol: 'coin-half', name: 'نیم سکه', unit: 'عدد', icon: '🥈' },
                    { symbol: 'coin-quarter', name: 'ربع سکه', unit: 'عدد', icon: '🥉' },
                    { symbol: 'coin-1g', name: 'سکه گرمی', unit: 'عدد', icon: '⭕' }
                ]
            },
            currency: {
                name: 'ارز', icon: '💵',
                items: [

        function toFa(num) {
            if (num === null || num === undefined) return '۰';
            const p = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
            return String(num).replace(/\d/g, d => p[d]);
        }

        function formatNum(num, decimals = 0) {
            if (num === null || num === undefined || num === '') return '۰';
            const n = Number(num);
            if (isNaN(n)) return '۰';
            let result;
            if (decimals > 0) result = n.toFixed(decimals).replace(/0+$/, '').replace(/\.$/, '');
            else result = Math.round(n).toString();
            const parts = result.split('.');
            parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
            result = parts.join('.');
            const p = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
            return result.replace(/\d/g, d => p[d]);
        }

        function formatBigNum(num) {
            if (num === null || num === undefined || num === '') return '۰';
            const n = Number(num);
            if (isNaN(n)) return '۰';
            if (Math.abs(n) >= 1e12) return formatNum(n / 1e12, 2) + ' همت';
            if (Math.abs(n) >= 1e9) return formatNum(n / 1e9, 2) + ' میلیارد';
            if (Math.abs(n) >= 1e6) return formatNum(n / 1e6, 2) + ' میلیون';
            if (Math.abs(n) >= 1e3) return formatNum(n / 1e3, 1) + ' هزار';
            return formatNum(n);
        }

                return new Intl.DateTimeFormat('fa-IR', { year: 'numeric', month: 'short', day: 'numeric' }).format(d);
            } catch { return '—'; }

        function parseTgjuRows(payload) {
            const rows = Array.isArray(payload?.data) ? payload.data : [];
            return rows.map(row => {
                if (!Array.isArray(row)) return null;
                const close = Number(String(row[3] || '').replace(/<[^>]*>/g,'').replace(/,/g,'').replace(/[^0-9.\-]/g,''));
                const greg = String(row[6] || '').replace(/<[^>]*>/g,'').trim();
                const jalali = String(row[7] || '').replace(/<[^>]*>/g,'').trim();
                const m = greg.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/);
                const iso = m ? `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}` : null;
                return Number.isFinite(close) && iso ? { close, greg, jalali, iso } : null;
            }).filter(Boolean);
        }

        async function fetchTgjuHistory(slug, length = 5000) {
            const cacheKey = `${slug}_${length}`;
            if (tgjuHistoryCache[cacheKey]) return tgjuHistoryCache[cacheKey];
            const params = new URLSearchParams({lang:'fa',order_dir:'asc',draw:'2'});
            for (let i = 0; i < 8; i++) {
                params.append(`columns[${i}][data]`, String(i));
                params.append(`columns[${i}][name]`, '');
                params.append(`columns[${i}][searchable]`, 'true');
                params.append(`columns[${i}][orderable]`, 'true');
                params.append(`columns[${i}][search][value]`, '');
                params.append(`columns[${i}][search][regex]`, 'false');
            }
            params.append('start', '0');
            params.append('length', String(length));
            params.append('search', '');
            params.append('order_col', '');
            params.append('order_dir', '');
            params.append('from', '');
            params.append('to', '');
            params.append('convert_to_ad', '1');
            params.append('_', String(Date.now()));
            const url = `https://api.tgju.org/v1/market/indicator/summary-table-data/${encodeURIComponent(slug)}?${params}`;
            const res = await fetch(url);
            if (!res.ok) throw new Error(`TGJU ${res.status}`);
            const data = await res.json();
            const rows = parseTgjuRows(data).sort((a,b) => a.iso.localeCompare(b.iso));
            if (!rows.length) throw new Error('empty-history');
            tgjuHistoryCache[cacheKey] = rows;
            return rows;
        }

            });
            const results = [];
            for (const slug of Array.from(tgjuSlugs)) {
                try {
                    const rows = await fetchTgjuHistory(slug, 5000);
                    if (rows.length) {
                        const raw = rows[rows.length - 1].close;
                        const price = NON_RIAL_SLUGS.has(slug) ? raw : raw / 10;
                        results.push({ status: 'fulfilled', value: { slug, price } });
                    } else {
                        results.push({ status: 'rejected', reason: new Error('empty') });
                    }
                } catch (e) { results.push({ status: 'rejected', reason: e }); }
                await new Promise(r => setTimeout(r, 100));
            }
            results.forEach(r => {
                if (r.status === 'fulfilled') {
                    const { slug, price } = r.value;
                    const symbol = slugToSymbol[slug];
                    if (symbol) priceCache[symbol] = { price, source: 'TGJU', slug };
                }
            });
            try {
                const ids = 'bitcoin,ethereum,tether-gold,pax-gold,tether,usd-coin,solana,ripple,dogecoin,cardano,binancecoin,tron,avalanche-2';
                const res = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd`);

                const map = {

                });
            } catch (e) { console.error('CoinGecko error:', e); }
            console.log('📊 Prices loaded:', priceCache);
        }

        function toToman(amount, currency) {

            }
            return n;

        function holdingDays(dateStr) {
            if (!dateStr) return null;
            const d = new Date(`${dateStr}T00:00:00`);
            if (isNaN(d.getTime())) return null;
            return Math.max(0, Math.floor((Date.now() - d.getTime()) / 86400000));
        }
        function holdingDuration(dateStr) {
            const days = holdingDays(dateStr);
            if (days === null) return '—';
            if (days < 30) return `${toFa(days)} روز`;
            if (days < 365) return `${toFa(Math.floor(days / 30))} ماه · ${toFa(days)} روز`;
            return `${toFa(Math.floor(days / 365))} سال · ${toFa(days % 365)} روز`;
        }

        function calculateStats() {
            let totalValue = 0, totalInvested = 0, totalInvestedWithLive = 0;
            const categoryStats = {};
            const portfolioWithPrices = portfolio.map(item => {
                const def = getAssetDefinition(item.asset_category, item.asset_symbol);
                const currency = assetCurrency(item);
                const quantity = Number(item.quantity) || 0;
                const buyPrice = Number(item.buy_price) || 0;
                const live = getCurrentPrice(item);
                const currentPrice = live ? live.price : null;
                const investedToman = toToman(quantity * buyPrice, currency);
                const valueToman = currentPrice !== null ? toToman(quantity * currentPrice, currency) : null;
                const profit = (investedToman !== null && valueToman !== null) ? valueToman - investedToman : null;
                const profitPercent = (profit !== null && investedToman > 0) ? (profit / investedToman) * 100 : null;
                if (investedToman !== null) totalInvested += investedToman;
                if (valueToman !== null) { totalValue += valueToman; totalInvestedWithLive += investedToman; }
                const category = item.asset_category || 'other';
                if (!categoryStats[category]) categoryStats[category] = { value: 0, count: 0 };
                if (valueToman !== null) categoryStats[category].value += valueToman;
                categoryStats[category].count++;
                return {
                    ...item, quantity, buy_price: buyPrice, currentPrice,
                    priceSource: live?.source || null,
                    isManualPrice: live?.manual || false,
                    currency,
                    unit: item.unit || def?.unit || 'واحد',
                    currentValue: valueToman, invested: investedToman,
                    profit, profitPercent,
                    holdingDuration: holdingDuration(item.buy_date),
                    hasLivePrice: currentPrice !== null
                };
            });
            const totalProfit = totalValue - totalInvestedWithLive;
            const totalProfitPercent = totalInvestedWithLive > 0 ? (totalProfit / totalInvestedWithLive) * 100 : 0;
            return { totalValue, totalInvested, totalInvestedWithLive, totalProfit, totalProfitPercent, categoryStats, items: portfolioWithPrices, usdRate: getUsdRate() };
        }

                            <span>نرخ سود سالانه بانک:</span>
                            <input id="compareBankRate" type="number" min="0" max="100" step="0.1" onchange="refreshComparison()">
                            <span>٪</span>
                        </div>
                    </div>
                    <div id="compareGrid" class="compare-grid"><div class="compare-loading">⏳ در حال دریافت...</div></div>
                </div>

                <div class="chart-section">
                    <div class="chart-grid">
                        <div>
                            <div class="chart-title">📊 تخصیص دارایی‌ها</div>
                            <div class="chart-wrapper"><canvas id="pieChart"></canvas></div>
                        </div>
                        <div>
                            <div class="chart-title">📈 سود/ضرر هر دارایی</div>
                            <div class="chart-wrapper"><canvas id="barChart"></canvas></div>
                        </div>
                    </div>
                </div>
            `;
            setTimeout(() => {
                renderPieChart(stats);
                renderBarChart(stats);
                renderCompare(stats);
            }, 100);
        }

        function renderSmartRow(item) {
            const pClass = item.profit === null ? 'neutral' : item.profit >= 0 ? 'profit' : 'loss';
            const pSign = item.profit === null ? '' : item.profit >= 0 ? '+' : '−';
            const buyText = `${formatNum(item.buy_price)} ${currencyLabel(item.currency)}`;

            // دکمه ✏️ همیشه هست
            let priceText;
            if (item.hasLivePrice) {
                const manualLabel = item.isManualPrice
                    ? ' <span style="color:#d4af37;font-weight:800;font-size:11px;">(دستی)</span>'
                    : '';
                priceText = `${formatNum(item.currentPrice)} ${currencyLabel(item.currency)}${manualLabel} <button class="manual-price-btn" onclick="editManualPrice('${String(item.id).replace(/'/g,"\\'")}')" title="ثبت/ویرایش قیمت دستی">✏️</button>`;
            } else {
                priceText = `<button class="manual-price-btn wide" onclick="editManualPrice('${String(item.id).replace(/'/g,"\\'")}')" title="ثبت قیمت دستی">✏️ ثبت قیمت</button>`;
            }

            const profitText = item.profit === null ? '—' : `${pSign}${formatBigNum(Math.abs(item.profit))} تومان`;

            return `
                <tr>
                    <td><div class="table-asset"><span class="table-icon">${item.asset_icon && String(item.asset_icon).startsWith('http') ? `<img src="${escapeHtml(item.asset_icon)}">` : (item.asset_icon || '📊')}</span><div><strong>${escapeHtml(item.asset_name)}</strong><small>${escapeHtml(item.asset_symbol)}</small></div></div></td>
                    <td>${formatNum(item.quantity, 4)}</td>
                    <td>${escapeHtml(item.unit || 'واحد')}</td>
                    <td>${buyText}</td>
                    <td>${priceText}</td>
                    <td>${formatBigNum(item.invested)} تومان</td>
                    <td>${item.currentValue === null ? '—' : formatBigNum(item.currentValue) + ' تومان'}</td>
                    <td>${item.holdingDuration}</td>
                    <td class="${pClass}"><strong>${profitText}</strong></td>
                    <td>
                        <div class="table-action-buttons">
                            <button class="table-edit-btn" onclick="editAsset('${String(item.id).replace(/'/g,"\\'")}')" title="ویرایش">✏️</button>
                            <button class="table-delete-btn" onclick="deleteAsset('${String(item.id).replace(/'/g,"\\'")}')" title="حذف">🗑️</button>
                        </div>
                    </td>
                </tr>
            `;
        }

        function editManualPrice(itemId) {
            const item = calculateStats().items.find(x => String(x.id) === String(itemId));
            if (!item) return;
            const current = getManualPrice(itemId);
            const hint = current ? `فعلی: ${formatNum(current)} تومان` : 'هنوز ثبت نشده';
            const value = prompt(`قیمت فعلی "${item.asset_name}" را به تومان وارد کن:\n(${hint})\n\nبرای حذف قیمت دستی، خالی بگذار و OK بزن:`, current || '');
            if (value === null) return;
            if (value.trim() === '') { clearManualPrice(itemId); return; }
            setManualPrice(itemId, value);
        }

        function renderPieChart(stats) {
            const canvas = document.getElementById('pieChart');
            if (!canvas) return;
            if (pieChart) try { pieChart.destroy(); } catch {}
            const labels = [], values = [];
            Object.keys(stats.categoryStats).forEach(key => {
                const cat = ASSETS[key];
                const v = stats.categoryStats[key].value;
                if (v > 0) { labels.push(cat?.name || key); values.push(v); }
            });
            if (!values.length) return;
            const isLight = document.documentElement.getAttribute('data-theme') === 'light';
            pieChart = new Chart(canvas.getContext('2d'), {
                type: 'doughnut',
                data: { labels, datasets: [{ data: values, backgroundColor: ['#D4AF37','#3B82F6','#35C58A','#F97316','#A855F7','#14B8A6','#EAB308','#EC4899','#64748B','#06B6D4'] }] },
                options: { responsive: true, maintainAspectRatio: false, cutout: '58%', plugins: { legend: { position: 'bottom', labels: { color: isLight ? '#1f2937' : '#F8FAFC', font: { family: 'Vazirmatn', size: 11 } } } } }
            });
        }

        function renderBarChart(stats) {
            const canvas = document.getElementById('barChart');
            if (!canvas) return;
            if (barChart) try { barChart.destroy(); } catch {}
            const items = stats.items.filter(i => Number.isFinite(Number(i.profitPercent)));
            if (!items.length) return;
            const isLight = document.documentElement.getAttribute('data-theme') === 'light';
            barChart = new Chart(canvas.getContext('2d'), {
                type: 'bar',
                data: {
                    labels: items.map(i => i.asset_name),
                    datasets: [{ data: items.map(i => Number(i.profitPercent)), backgroundColor: items.map(i => i.profitPercent >= 0 ? '#35C58A' : '#F06B6B') }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { color: isLight ? '#475569' : '#94A3B8' } }, y: { ticks: { color: isLight ? '#475569' : '#94A3B8' } } } }
            });
        }

        function getSelectedCompareKeys() {
            return Array.from(document.querySelectorAll('.compare-check:checked')).map(el => el.value);
        }
        function refreshComparison() { renderCompare(calculateStats()); }

        async function renderCompare(stats) {
            const grid = document.getElementById('compareGrid');
            if (!grid) return;
            grid.innerHTML = '<div class="compare-loading">⏳ در حال دریافت...</div>';

            const selected = getSelectedCompareKeys();
            const tgjuDefs = {
                gold18: { slug: 'geram18', label: 'طلا ۱۸ عیار', icon: '🥇' },
                usd: { slug: 'price_dollar_rl', label: 'دلار آزاد', icon: '💵' },
                bourse: { slug: 'bourse', label: 'شاخص کل بورس', icon: '📊', noRial: true },
                silver999: { slug: 'silver_999', label: 'نقره ۹۹۹', icon: '🥈' }
            };

            const sources = {};
            for (const key of selected) {
                if (!tgjuDefs[key]) continue;
                try { sources[key] = await fetchTgjuHistory(tgjuDefs[key].slug); }
                catch (e) { sources[key] = null; }
            }

            const bankRate = Number(document.getElementById('compareBankRate')?.value) || 0;
            const ayarItem = portfolio.find(p => p.asset_symbol === 'ayar');
            const avandItem = portfolio.find(p => p.asset_symbol === 'avand');

            for (const item of stats.items) {
                const invested = Number(item.invested) || 0;
                const actual = Number.isFinite(Number(item.profitPercent)) ? item.profitPercent : null;
                const rows = [];

                for (const key of selected) {
                    if (key === 'bank') {
                        const days = holdingDays(item.buy_date) || 0;
                        const percent = bankRate > 0 ? (Math.pow(1 + bankRate / 100, days / 365) - 1) * 100 : 0;
                        rows.push({ label: 'سپرده بانکی', icon: '🏦', baseText: '—', latestText: '—', percent, hypothetical: invested * (1 + percent / 100) });
                        continue;
                    }
                    if (key === 'ayar') {
                        const editBtn = ayarItem
                            ? `<button class="manual-price-btn" onclick="editManualPrice('${String(ayarItem.id).replace(/'/g,"\\'")}')" title="ثبت قیمت دستی عیار">✏️</button>`
                            : '';
                        const manual = ayarItem ? getManualPrice(ayarItem.id) : null;
                        const buy = ayarItem ? Number(ayarItem.buy_price) : null;
                        if (buy && manual && buy > 0) {
                            const percent = (manual / buy - 1) * 100;
                            rows.push({ label: 'صندوق طلای عیار', icon: '🟡', baseText: formatNum(buy) + ' تومان', latestText: formatNum(manual) + ' تومان', percent, hypothetical: invested * (manual / buy), editBtn });
                        } else {
                            rows.push({ label: 'صندوق طلای عیار', icon: '🟡', baseText: buy ? formatNum(buy) + ' تومان' : '—', latestText: '—', percent: null, hypothetical: null, hint: 'قیمت دستی ثبت نشده', editBtn });
                        }
                        continue;
                    }
                    if (key === 'avand') {
                        const editBtn = avandItem
                            ? `<button class="manual-price-btn" onclick="editManualPrice('${String(avandItem.id).replace(/'/g,"\\'")}')" title="ثبت قیمت دستی آوند">✏️</button>`
                            : '';
                        const manual = avandItem ? getManualPrice(avandItem.id) : null;
                        const buy = avandItem ? Number(avandItem.buy_price) : null;
                        if (buy && manual && buy > 0) {
                            const percent = (manual / buy - 1) * 100;
                            rows.push({ label: 'صندوق آوند', icon: '💼', baseText: formatNum(buy) + ' تومان', latestText: formatNum(manual) + ' تومان', percent, hypothetical: invested * (manual / buy), editBtn });
                        } else {
                            rows.push({ label: 'صندوق آوند', icon: '💼', baseText: buy ? formatNum(buy) + ' تومان' : '—', latestText: '—', percent: null, hypothetical: null, hint: 'قیمت دستی ثبت نشده', editBtn });
                        }
                        continue;
                    }
                    const def = tgjuDefs[key];
                    const src = sources[key];
                    if (!src || !def) {
                        rows.push({ label: def?.label || key, icon: def?.icon || '📊', baseText: '—', latestText: '—', percent: null, hypothetical: null });
                        continue;
                    }
                    const base = findHistoryAtOrBefore(src, item.buy_date);
                    const latest = src[src.length - 1];
                    if (!base || !latest) {
                        rows.push({ label: def.label, icon: def.icon, baseText: '—', latestText: '—', percent: null, hypothetical: null });
                        continue;
                    }
                    const percent = (latest.close / base.close - 1) * 100;
                    const divisor = def.noRial ? 1 : 10;
                    rows.push({
                        label: def.label, icon: def.icon,
                        baseText: formatNum(base.close / divisor) + ' تومان',
                        latestText: formatNum(latest.close / divisor) + ' تومان',
                        percent, hypothetical: invested * (latest.close / base.close)
                    });
                }

                const tableRows = rows.map(r => {
                    const p = Number.isFinite(Number(r.percent)) ? Number(r.percent) : null;
                    const cls = p === null ? 'neutral' : p >= 0 ? 'profit' : 'loss';
                    const sign = p === null ? '' : p >= 0 ? '+' : '−';
                    const hint = r.hint ? `<div style="font-size:9px;color:#94a3b8">${r.hint}</div>` : '';
                    const editBtn = r.editBtn ? ` ${r.editBtn}` : '';
                    return `<tr>
                        <td>${r.icon} ${escapeHtml(r.label)}${hint}${editBtn}</td>
                        <td>${r.baseText}</td>
                        <td>${r.latestText}</td>
                        <td class="${cls}">${p === null ? '—' : sign + toFa(Math.abs(p).toFixed(2)) + '٪'}</td>
                        <td>${r.hypothetical === null ? '—' : formatBigNum(r.hypothetical) + ' تومان'}</td>
                    </tr>`;
                }).join('');

                const actualText = actual === null ? 'عملکرد واقعی: —' : `عملکرد واقعی: ${actual >= 0 ? '+' : '−'}${toFa(Math.abs(actual).toFixed(2))}٪`;

                grid.insertAdjacentHTML('beforeend', `
                    <div class="compare-asset-card">
                        <div class="compare-asset-head">
                            <div>
                                <div class="compare-asset-name">${escapeHtml(item.asset_name)}</div>
                                <div class="compare-asset-date">تاریخ خرید: ${formatDate(item.buy_date)}</div>
                            </div>
                            <div class="compare-actual ${actual === null ? 'neutral' : actual >= 0 ? 'profit' : 'loss'}">${actualText}</div>
                        </div>
                        <div class="compare-table-wrap">
                            <table class="compare-table">
                                <thead><tr><th>مرجع</th><th>قیمت در تاریخ خرید</th><th>قیمت امروز</th><th>بازده</th><th>ارزش فرضی</th></tr></thead>
                                <tbody>${tableRows}</tbody>
                            </table>
                        </div>
                    </div>
                `);
            }
        }

        function findHistoryAtOrBefore(rows, dateStr) {
            if (!dateStr || !rows?.length) return null;
            const target = String(dateStr).trim();
            let best = null;
            for (const r of rows) {
                if (r.iso <= target) best = r;
                else break;
            }
            return best;
        }

        function openAddModal(categoryKey = 'gold', symbol = null) {
            document.getElementById('assetModalTitle').textContent = '➕ افزودن دارایی';
            document.getElementById('assetId').value = '';
            document.getElementById('assetCategory').value = categoryKey;
            onCategoryChange();
            if (symbol) {
                document.getElementById('assetSelect').value = symbol;
                onAssetChange();
            }
            const today = new Date();
            const iso = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
            const dp = JalaliDatePicker.get('assetBuyDate');
            if (dp) dp.setValue(iso);
            document.getElementById('assetQuantity').value = '';
            document.getElementById('assetBuyPrice').value = '';
            document.getElementById('assetNotes').value = '';
            document.getElementById('assetModal').classList.add('show');
        }

        function onCategoryChange() {
            const catKey = document.getElementById('assetCategory').value;
            const cat = ASSETS[catKey];
            const select = document.getElementById('assetSelect');
            select.innerHTML = (cat?.items || []).map(i => `<option value="${i.symbol}">${i.name}</option>`).join('');
            onAssetChange();
        }

        function onAssetChange() {
            const catKey = document.getElementById('assetCategory').value;
            const symbol = document.getElementById('assetSelect').value;
            const item = ASSETS[catKey]?.items?.find(i => i.symbol === symbol);
            if (item) document.getElementById('assetUnit').value = item.unit || '';
        }

        async function saveAsset() {
            const id = document.getElementById('assetId').value;
            const category = document.getElementById('assetCategory').value;
            const symbol = document.getElementById('assetSelect').value;
            const cat = ASSETS[category];
            const item = cat?.items?.find(i => i.symbol === symbol);
            const quantity = parseFloat(document.getElementById('assetQuantity').value);
            const buyPrice = parseFloat(document.getElementById('assetBuyPrice').value);
            const input = document.getElementById('assetBuyDate');
            const dp = JalaliDatePicker.get(input);
            const buyDate = dp ? dp.getIsoValue() : input.value;

            if (!quantity || quantity <= 0) { showToast('❌ مقدار معتبر وارد کن', 'error'); return; }
            if (!buyPrice || buyPrice <= 0) { showToast('❌ قیمت معتبر وارد کن', 'error'); return; }
            if (!buyDate) { showToast('❌ تاریخ را وارد کن', 'error'); return; }

            const payload = {
                user_id: currentUser.id,
                asset_category: category,
                asset_symbol: symbol,
                asset_name: item?.name || symbol,
                asset_icon: item?.icon || '📊',
                quantity,
                unit: item?.unit || 'واحد',
                buy_price: buyPrice,
                buy_date: buyDate,
                notes: document.getElementById('assetNotes').value.trim() || null
            };

            let error;
            if (id) ({ error } = await db.from('user_portfolio').update(payload).eq('id', id));
            else ({ error } = await db.from('user_portfolio').insert(payload));

            if (error) { showToast('❌ ' + error.message, 'error'); return; }
            showToast(id ? '✅ ویرایش شد' : '✅ اضافه شد');
            closeModal('assetModal');
            await render();
        }

        function editAsset(id) {
            const item = portfolio.find(p => String(p.id) === String(id));
            if (!item) return;
            document.getElementById('assetModalTitle').textContent = '✏️ ویرایش';
            document.getElementById('assetId').value = item.id;
            document.getElementById('assetCategory').value = item.asset_category;
            onCategoryChange();
            document.getElementById('assetSelect').value = item.asset_symbol;
            onAssetChange();
            document.getElementById('assetQuantity').value = item.quantity;
            document.getElementById('assetBuyPrice').value = item.buy_price;
            const dp = JalaliDatePicker.get('assetBuyDate');
            if (dp) dp.setValue(item.buy_date);
            document.getElementById('assetNotes').value = item.notes || '';
            document.getElementById('assetModal').classList.add('show');
        }

        async function deleteAsset(id) {
            if (!confirm('مطمئنی؟')) return;
            const { error } = await db.from('user_portfolio').delete().eq('id', id);
            if (error) { showToast('❌ ' + error.message, 'error'); return; }
            localStorage.removeItem(manualPriceKey(id));
            showToast('🗑️ حذف شد');
            await render();
        }

        function exportCSV() {
            const stats = calculateStats();
            let csv = 'نام,نماد,دسته,مقدار,واحد,قیمت خرید,قیمت فعلی,سرمایه,ارزش فعلی,سود,درصد,تاریخ\n';
            stats.items.forEach(i => {
                csv += `"${i.asset_name}","${i.asset_symbol}","${ASSETS[i.asset_category]?.name||''}",${i.quantity},"${i.unit}",${i.buy_price},${i.currentPrice??''},${i.invested??''},${i.currentValue??''},${i.profit??''},${i.profitPercent==null?'':i.profitPercent.toFixed(2)},${i.buy_date}\n`;
            });
            const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `portfolio-${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
        }

        document.addEventListener('DOMContentLoaded', async () => {
            JalaliDatePicker.initAll();
            const { data: { session } } = await db.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return; }
            currentUser = session.user;
            await render();
        });
    </script>
</body>
</html>
