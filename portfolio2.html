<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پرتفوی من | آکادمی شمعدون</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
    <link rel="stylesheet" href="jalali-datepicker.css">
    <meta name="theme-color" content="#d4af37">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://s3.tradingview.com/tv.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #14141c;
            --bg-card: #1a1a24;
            --gold: #d4af37;
            --gold-light: #f4d47c;
            --gold-dark: #a8862a;
            --green: #10b981;
            --red: #ef4444;
            --blue: #3b82f6;
            --white: #f8fafc;
            --gray: #94a3b8;
        }
        [data-theme="light"] {
            --bg-primary: #f8fafc;
            --bg-secondary: #eef2f7;
            --bg-card: #ffffff;
            --gold: #b8860b;
            --gold-light: #d4af37;
            --gold-dark: #8b6508;
            --green: #059669;
            --red: #dc2626;
            --blue: #2563eb;
            --white: #0f172a;
            --gray: #64748b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background-color: var(--bg-primary);
            color: var(--white);
            min-height: 100vh;
            direction: rtl;
        }
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 100px 20px 40px;
        }
        .page-header { text-align: center; margin-bottom: 30px; }
        .page-header h1 {
            font-size: 36px;
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .page-header p { color: var(--gray); font-size: 14px; }
        .loading-screen { text-align: center; padding: 100px 20px; color: var(--gray); }
        .spinner {
            width: 50px; height: 50px;
            border: 4px solid rgba(212, 175, 55, 0.2);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }
        .summary-card {
            background: linear-gradient(135deg, var(--bg-card), var(--bg-secondary));
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 18px;
            padding: 20px;
            text-align: center;
        }
        .summary-card .icon { font-size: 28px; margin-bottom: 10px; }
        .summary-card .value { color: var(--white); font-size: 22px; font-weight: 900; margin-bottom: 6px; }
        .summary-card .value.gold { color: var(--gold); }
        .summary-card .value.green { color: var(--green); }
        .summary-card .value.red { color: var(--red); }
        .summary-card .label { color: var(--gray); font-size: 12px; }
        .actions-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 20px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 13.5px;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--bg-primary);
            flex: 1;
            justify-content: center;
            padding: 15px;
            font-size: 15px;
        }
        .btn-secondary {
            background: rgba(20, 20, 28, 0.8);
            color: var(--white);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .quick-add { display: flex; gap: 8px; margin-bottom: 25px; flex-wrap: wrap; }
        .quick-btn {
            padding: 8px 14px;
            background: rgba(20, 20, 28, 0.6);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 10px;
            color: var(--gray);
            font-size: 12px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
        }
        .portfolio-table-card {
            margin: 20px 0;
            background: var(--bg-card);
            border: 1px solid rgba(148,163,184,.14);
            border-radius: 18px;
            overflow: hidden;
        }
        .table-card-head {
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid rgba(148,163,184,.14);
        }
        .table-subtitle { font-size: 12px; color: var(--gray); margin-top: 4px; }
        .usd-rate-badge {
            font-size: 12px;
            color: var(--gray);
            padding: 9px 12px;
            border: 1px solid rgba(148,163,184,.14);
            border-radius: 10px;
            white-space: nowrap;
        }
        .usd-rate-badge strong { color: var(--gold); }
        .table-scroll { width: 100%; overflow-x: auto; }
        .smart-portfolio-table { width: 100%; min-width: 1380px; border-collapse: collapse; }
        .smart-portfolio-table th, .smart-portfolio-table td {
            padding: 13px 10px;
            border-bottom: 1px solid rgba(148,163,184,.14);
            text-align: right;
            vertical-align: middle;
            font-size: 12px;
        }
        .smart-portfolio-table th {
            color: var(--gray);
            font-weight: 700;
            background: rgba(255,255,255,.02);
            white-space: nowrap;
        }
        .smart-portfolio-table tfoot td {
            background: rgba(212,175,55,.06);
            border-bottom: 0;
        }
        .table-asset { display: flex; align-items: center; gap: 9px; min-width: 170px; }
        .table-icon {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            background: rgba(212,175,55,.08);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex: 0 0 auto;
        }
        .table-icon img { width: 25px; height: 25px; object-fit: contain; }
        .table-asset small {
            display: block;
            color: var(--gray);
            font-size: 10px;
            margin-top: 1px;
            direction: ltr;
            text-align: right;
        }
        .table-chart-btn {
            width: 52px;
            height: 36px;
            border: 1px solid rgba(59,130,246,.25);
            background: rgba(59,130,246,.06);
            border-radius: 9px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .asset-chart-row { display: none; }
        .asset-chart-row.open { display: table-row; }
        .asset-chart-panel {
            background: var(--bg-secondary);
            border-radius: 13px;
            padding: 14px;
            margin: 4px 0 8px;
        }
        .asset-chart-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .asset-chart-head span { color: var(--gray); font-size: 12px; }
        .chart-periods { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
        .chart-period {
            border: 1px solid rgba(148,163,184,.14);
            background: var(--bg-card);
            color: var(--gray);
            border-radius: 8px;
            padding: 6px 10px;
            font-family: inherit;
            font-size: 11px;
        }
        .chart-period.active { color: var(--gold); border-color: rgba(212,175,55,.55); }
        .asset-chart-canvas { height: 300px; position: relative; }
        .asset-chart-canvas canvas { width: 100% !important; height: 100% !important; }
        .chart-message {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gray);
            font-size: 12px;
            text-align: center;
        }
        .profit { color: #35c58a !important; }
        .loss { color: #f06b6b !important; }
        .neutral { color: var(--gray) !important; }
        .table-action-buttons { display: flex; align-items: center; justify-content: center; gap: 6px; }
        .table-edit-btn, .table-delete-btn {
            width: 34px;
            height: 34px;
            padding: 0;
            border-radius: 9px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-family: inherit;
        }
        .table-edit-btn { background: rgba(59,130,246,.10); border: 1px solid rgba(59,130,246,.25); }
        .table-delete-btn { background: rgba(239,68,68,.10); border: 1px solid rgba(239,68,68,.25); }
        .manual-price-btn {
            width: 28px;
            height: 28px;
            border-radius: 7px;
            border: 1px solid rgba(212,175,55,.3);
            background: rgba(212,175,55,.08);
            color: var(--gold);
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
            margin-inline-start: 5px;
            vertical-align: middle;
        }
        .manual-price-input {
            width: 100px;
            padding: 6px 8px;
            border: 1px solid rgba(212,175,55,.4);
            border-radius: 7px;
            background: var(--bg-primary);
            color: var(--white);
            font-family: inherit;
            font-size: 11px;
            text-align: center;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: var(--bg-card);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 20px;
            padding: 25px;
            max-width: 550px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal h2 {
            color: var(--gold);
            margin-bottom: 20px;
            font-size: 18px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.15);
        }
        .form-group { margin-bottom: 15px; }
        .form-group label {
            display: block;
            color: #cbd5e1;
            font-size: 13px;
            margin-bottom: 6px;
            font-weight: 700;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            background: rgba(10, 10, 15, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: var(--white);
            font-family: inherit;
            font-size: 13px;
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }
        .modal-actions .btn { flex: 1; justify-content: center; }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-card);
            color: var(--white);
            padding: 14px 24px;
            border-radius: 12px;
            border-right: 4px solid var(--gold);
            z-index: 2000;
            transition: 0.4s;
            font-size: 14px;
            font-weight: 700;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.success { border-right-color: var(--green); }
        .toast.error { border-right-color: var(--red); }
        .footer {
            text-align: center;
            padding: 30px 20px;
            color: var(--gray);
            font-size: 12px;
            border-top: 1px solid rgba(212, 175, 55, 0.1);
            margin-top: 40px;
        }
        .compare-section {
            background: linear-gradient(135deg, var(--bg-card), var(--bg-secondary));
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
        }
        .compare-title { color: var(--gold); font-size: 16px; font-weight: 800; margin-bottom: 15px; }
        .compare-desc { color: var(--gray); font-size: 13px; margin-bottom: 20px; line-height: 1.7; }
        .compare-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
        .compare-loading { padding: 22px; text-align: center; color: var(--gray); font-size: 12px; }
        .compare-selector {
            margin: 16px 0 14px;
            padding: 14px;
            border: 1px solid rgba(212,175,55,.18);
            border-radius: 14px;
            background: rgba(255,255,255,.018);
        }
        .compare-selector-title { color: var(--white); font-size: 12px; font-weight: 800; margin-bottom: 10px; }
        .compare-selector-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; }
        .compare-option {
            position: relative;
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 10px 11px;
            border: 1px solid rgba(148,163,184,.14);
            border-radius: 11px;
            background: rgba(10,10,15,.35);
            cursor: pointer;
        }
        .compare-option input { position: absolute; opacity: 0; pointer-events: none; }
        .compare-option .check {
            width: 18px;
            height: 18px;
            border: 1px solid rgba(148,163,184,.35);
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: transparent;
            font-size: 11px;
            font-weight: 900;
        }
        .compare-option input:checked + .check { background: var(--gold); border-color: var(--gold); color: #111; }
        .option-text { color: var(--gray); font-size: 11px; font-weight: 700; }
        .compare-bank-rate {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-top: 11px;
            padding-top: 11px;
            border-top: 1px solid rgba(148,163,184,.1);
            color: var(--gray);
            font-size: 10px;
        }
        .compare-bank-rate input {
            width: 90px;
            padding: 7px 9px;
            background: rgba(10,10,15,.8);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 8px;
            color: var(--white);
            font-family: inherit;
            text-align: center;
        }
        .compare-asset-card {
            grid-column: 1 / -1;
            background: rgba(10,10,15,.42);
            border: 1px solid rgba(148,163,184,.14);
            border-radius: 16px;
            padding: 16px;
        }
        .compare-asset-head {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            align-items: flex-start;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .compare-asset-name { font-weight: 800; color: var(--white); font-size: 14px; }
        .compare-asset-date { color: var(--gray); font-size: 10px; margin-top: 4px; }
        .compare-actual { font-weight: 800; font-size: 14px; white-space: nowrap; }
        .compare-table-wrap {
            overflow-x: auto;
            border: 1px solid rgba(148,163,184,.12);
            border-radius: 12px;
        }
        .compare-table { width: 100%; min-width: 850px; border-collapse: collapse; }
        .compare-table th, .compare-table td {
            padding: 10px 9px;
            border-bottom: 1px solid rgba(148,163,184,.1);
            font-size: 11px;
            text-align: right;
        }
        .compare-table th {
            color: var(--gray);
            font-weight: 700;
            background: rgba(255,255,255,.025);
        }
        .compare-table .price { white-space: nowrap; }
        .compare-table .return { font-weight: 900; white-space: nowrap; }
        .compare-table .hypothetical { font-weight: 800; white-space: nowrap; }
        .compare-basket-summary {
            margin-top: 12px;
            padding: 11px 13px;
            border-radius: 11px;
            background: rgba(16,185,129,.045);
            border: 1px solid rgba(16,185,129,.12);
            color: var(--gray);
            font-size: 10px;
            line-height: 1.8;
        }
        .manual-price-box { display: flex; gap: 5px; align-items: center; min-width: 145px; }
        .manual-price-box input {
            width: 92px;
            padding: 6px 7px;
            border: 1px solid rgba(212,175,55,.35);
            border-radius: 7px;
            background: var(--bg-card);
            color: var(--white);
            font-family: inherit;
            font-size: 10px;
        }
        .manual-price-box button {
            padding: 6px 8px;
            border: 1px solid rgba(212,175,55,.45);
            border-radius: 7px;
            background: rgba(212,175,55,.12);
            color: var(--gold);
            font-family: inherit;
            font-size: 10px;
            cursor: pointer;
        }
        .compare-edit-btn {
            width: 26px;
            height: 26px;
            border-radius: 7px;
            border: 1px solid rgba(212,175,55,.22);
            background: rgba(212,175,55,.06);
            color: var(--gold);
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
            margin-inline-start: 5px;
            vertical-align: middle;
        }
        .chart-section {
            background: linear-gradient(135deg, var(--bg-card), var(--bg-secondary));
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
        }
        .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; align-items: center; }
        .chart-title { color: var(--white); font-size: 16px; font-weight: 800; margin-bottom: 15px; }
        .chart-wrapper { position: relative; height: 300px; }
        .portfolio-section {
            background: linear-gradient(135deg, var(--bg-card), var(--bg-secondary));
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
        }
        .category-group {
            margin-bottom: 20px;
            border: 1px solid rgba(212, 175, 55, 0.1);
            border-radius: 15px;
            overflow: hidden;
            background: rgba(10, 10, 15, 0.3);
        }
        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 18px;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.1), rgba(212, 175, 55, 0.03));
            cursor: pointer;
        }
        .category-header-left { display: flex; align-items: center; gap: 12px; }
        .category-icon { font-size: 24px; }
        .category-name { color: var(--gold); font-size: 15px; font-weight: 800; }
        .category-count { color: var(--gray); font-size: 11px; margin-right: 8px; }
        .category-total { color: var(--white); font-size: 14px; font-weight: 800; }
        .category-toggle { color: var(--gray); font-size: 16px; }
        .category-group.collapsed .category-content { display: none; }
        .asset-card { padding: 18px; border-top: 1px solid rgba(255, 255, 255, 0.03); }
        .asset-card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; gap: 10px; flex-wrap: wrap; }
        .asset-card-left { display: flex; align-items: center; gap: 12px; flex: 1; }
        .asset-icon-wrapper {
            width: 46px; height: 46px;
            border-radius: 12px;
            background: rgba(212, 175, 55, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .asset-icon-wrapper img { width: 32px; height: 32px; object-fit: contain; }
        .asset-icon-wrapper .emoji { font-size: 24px; }
        .asset-name-info h4 { color: var(--white); font-size: 15px; font-weight: 800; }
        .asset-name-info .symbol { color: var(--gray); font-size: 11px; font-family: monospace; direction: ltr; }
        .asset-card-info { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        .info-item { background: rgba(10, 10, 15, 0.5); padding: 10px 12px; border-radius: 10px; }
        .info-item .label { color: var(--gray); font-size: 10.5px; margin-bottom: 4px; }
        .info-item .value { color: var(--white); font-size: 14px; font-weight: 800; }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--gray); }
        .empty-state .icon { font-size: 80px; margin-bottom: 20px; opacity: 0.5; }
        .empty-state h2 { color: var(--gold); margin-bottom: 10px; font-size: 20px; }
        @media (max-width: 1000px) {
            .summary-grid { grid-template-columns: repeat(2, 1fr); }
            .chart-grid { grid-template-columns: 1fr; }
            .asset-card-info { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="main-container" id="mainContent">
        <div class="loading-screen">
            <div class="spinner"></div>
            ⏳ در حال بارگذاری پرتفوی...
        </div>
    </div>

    <footer class="footer">
        © ۱۴۰۵ آکادمی شمعدون | تمامی حقوق محفوظ است
    </footer>

    <div class="modal-overlay" id="assetModal">
        <div class="modal">
            <h2 id="assetModalTitle">➕ افزودن دارایی</h2>
            <input type="hidden" id="assetId">

            <div class="form-group">
                <label>دسته‌بندی *</label>
                <select id="assetCategory" onchange="onCategoryChange()">
                    <option value="gold">🥇 طلا</option>
                    <option value="currency">💵 ارز</option>
                    <option value="stock">📊 بورس ایران</option>
                    <option value="ayar">🟡 صندوق طلای عیار</option>
                    <option value="fund">💼 صندوق درآمد ثابت آوند</option>
                    <option value="bank">🏦 سپرده بانکی</option>
                    <option value="other">🌟 سایر</option>
                </select>
            </div>

            <div class="form-group" id="assetSelectGroup">
                <label>دارایی *</label>
                <select id="assetSelect" onchange="onAssetChange()"></select>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>مقدار *</label>
                    <input type="number" id="assetQuantity" step="any" min="0">
                </div>
                <div class="form-group">
                    <label>واحد</label>
                    <input type="text" id="assetUnit" readonly>
                </div>
            </div>

        function toFa(num) {
            if (num === null || num === undefined) return '۰';
            const p = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
            return String(num).replace(/\d/g, d => p[d]);
        }

        function formatNum(num, decimals = 0) {
            if (num === null || num === undefined || num === '') return '۰';
            const n = Number(num);
            if (isNaN(n)) return '۰';
            let result;
            if (decimals > 0) {
                result = n.toFixed(decimals).replace(/0+$/, '').replace(/\.$/, '');
            } else {
                result = Math.round(n).toString();
            }
            const parts = result.split('.');
            parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
            result = parts.join('.');
            const p = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
            return result.replace(/\d/g, d => p[d]);
        }

        function formatBigNum(num) {
            if (num === null || num === undefined || num === '') return '۰';
            const n = Number(num);
            if (isNaN(n)) return '۰';
            if (Math.abs(n) >= 1e12) return formatNum(n / 1e12, 2) + ' همت';
            if (Math.abs(n) >= 1e9) return formatNum(n / 1e9, 2) + ' میلیارد';
            if (Math.abs(n) >= 1e6) return formatNum(n / 1e6, 2) + ' میلیون';
            if (Math.abs(n) >= 1e3) return formatNum(n / 1e3, 1) + ' هزار';
            return formatNum(n);
        }

        function escapeHtml(text) {

            } catch { return '—'; }
        }

        // ==========================================
        // TGJU — Fetch + Parse
        // ==========================================
        function parseTgjuRows(payload) {
            const rows = Array.isArray(payload?.data) ? payload.data : [];
            return rows.map(row => {
                if (!Array.isArray(row)) return null;
                const close = Number(String(row[3] || '').replace(/<[^>]*>/g,'').replace(/,/g,'').replace(/[^0-9.\-]/g,''));
                const greg = String(row[6] || '').replace(/<[^>]*>/g,'').trim();
                const jalali = String(row[7] || '').replace(/<[^>]*>/g,'').trim();
                const m = greg.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/);
                const iso = m ? `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}` : null;
                return Number.isFinite(close) && iso ? { close, greg, jalali, iso } : null;
            }).filter(Boolean);
        }

        async function fetchTgjuHistory(slug, length = 5000) {
            const cacheKey = `${slug}_${length}`;
            if (tgjuHistoryCache[cacheKey]) return tgjuHistoryCache[cacheKey];
            const params = new URLSearchParams({lang:'fa',order_dir:'asc',draw:'2'});
            for (let i = 0; i < 8; i++) {
                params.append(`columns[${i}][data]`, String(i));
                params.append(`columns[${i}][name]`, '');
                params.append(`columns[${i}][searchable]`, 'true');
                params.append(`columns[${i}][orderable]`, 'true');
                params.append(`columns[${i}][search][value]`, '');
                params.append(`columns[${i}][search][regex]`, 'false');
            }
            params.append('start', '0');
            params.append('length', String(length));
            params.append('search', '');
            params.append('order_col', '');
            params.append('order_dir', '');
            params.append('from', '');
            params.append('to', '');
            params.append('convert_to_ad', '1');
            params.append('_', String(Date.now()));

            const url = `https://api.tgju.org/v1/market/indicator/summary-table-data/${encodeURIComponent(slug)}?${params}`;
            const res = await fetch(url);
            if (!res.ok) throw new Error(`TGJU ${res.status}`);
            const data = await res.json();
            const rows = parseTgjuRows(data).sort((a,b) => a.iso.localeCompare(b.iso));
            if (!rows.length) throw new Error('empty-history');
            tgjuHistoryCache[cacheKey] = rows;
            return rows;
        }

        async function fetchTgjuLatest(slug) {
            const rows = await fetchTgjuHistory(slug, 5);
            return rows[rows.length - 1];
        }

        // ==========================================
        // LOAD PRICES — یک منبع برای همه
        // ==========================================
        async function loadPrices() {
            priceCache = {};
            const usd = Number(priceCache?.usd) || null;

            // جمع‌آوری همه slugهای TGJU
            const tgjuSlugs = new Set();
            Object.values(ASSETS).forEach(cat => {
                (cat.items || []).forEach(item => {
                    if (item.tgju) tgjuSlugs.add(item.tgju);
                });
            });

            // موازی: همه رو از TGJU بگیر
            const results = await Promise.allSettled(
                Array.from(tgjuSlugs).map(async slug => {
                    const latest = await fetchTgjuLatest(slug);
                    return { slug, price: latest.close };
                })
            );

            // نگاشت slug به symbol
            const slugToSymbol = {};
            Object.values(ASSETS).forEach(cat => {
                (cat.items || []).forEach(item => {
                    if (item.tgju) slugToSymbol[item.tgju] = item.symbol;
                });
            });

            results.forEach(r => {
                if (r.status === 'fulfilled') {
                    const { slug, price } = r.value;
                    const symbol = slugToSymbol[slug];
                    if (symbol) {
                        priceCache[symbol] = { price, source: 'TGJU', slug };
                    }
                }
            });

            // اگه دلار نیومد، همه چیز از TGJU null می‌شه
            if (!priceCache['usd']) {
                console.warn('⚠️ دلار از TGJU نیامد');
            }

            // کریپتو از CoinGecko
            try {
                const ids = 'bitcoin,ethereum,tether-gold,pax-gold,tether,usd-coin,solana,ripple,dogecoin,cardano,binancecoin,tron,avalanche-2';
                const res = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd`);
                const data = await res.json();
                const map = {
                    bitcoin: 'btc', ethereum: 'eth', 'tether-gold': 'xaut', 'pax-gold': 'paxg',
                    tether: 'usdt-erc', 'usd-coin': 'usdc', solana: 'sol', ripple: 'xrp',
                    dogecoin: 'doge', cardano: 'ada', binancecoin: 'bnb', tron: 'trx', 'avalanche-2': 'avax'
                };
                Object.keys(map).forEach(k => {
                    if (data[k]?.usd) priceCache[map[k]] = { price: data[k].usd, source: 'CoinGecko' };
                });
            } catch (e) { console.error('CoinGecko error:', e); }

            console.log('📊 Prices loaded:', priceCache);
        }

        // ==========================================
        // GET PRICE — یکپارچه
        // ==========================================
        function getAssetDefinition(category, symbol) {
            const cat = ASSETS[category];
            return cat?.items?.find(i => i.symbol === symbol) || null;
        }

        function getCurrentPrice(item) {
            const def = getAssetDefinition(item.asset_category, item.asset_symbol);

            // ۱. اگه TGJU داره
            if (def?.tgju && priceCache[def.symbol]?.price) {
                return { price: priceCache[def.symbol].price, source: 'TGJU', manual: false };
            }

            // ۲. اگه manual ئه، از localStorage
            if (def?.manual) {
                const manual = getManualPrice(item.id);
                if (manual) return { price: manual, source: 'دستی', manual: true };
                return null;
            }

            // ۳. کریپتو
            if (def && priceCache[def.symbol]?.price) {
                return { price: priceCache[def.symbol].price, source: 'CoinGecko', manual: false };
            }

            return null;
        }

        function currencyLabel(currency) { return currency === 'USD' ? 'دلار' : 'تومان'; }
        function assetCurrency(item) {
            if (item.asset_category === 'crypto') return 'USD';
            return 'IRR';
        }
        function getUsdRate() {
            const n = priceCache['usd']?.price;
            return Number.isFinite(n) && n > 0 ? n : null;
        }

        function toToman(amount, currency) {
            const n = Number(amount) || 0;
            if (currency === 'USD') {
                const rate = getUsdRate();
                return rate ? n * rate : null;
            }
            return n;
        }

        function formatMoney(value, currency = 'IRR', compact = false) {
            if (value === null || value === undefined || !Number.isFinite(Number(value))) return '—';
            const n = Number(value);
            const text = compact ? formatBigNum(Math.abs(n)) : formatNum(Math.abs(n));
            return `${n < 0 ? '−' : ''}${text} ${currencyLabel(currency)}`;
        }

        function holdingDays(dateStr) {
            if (!dateStr) return null;
            const d = new Date(`${dateStr}T00:00:00`);
            if (isNaN(d.getTime())) return null;
            return Math.max(0, Math.floor((Date.now() - d.getTime()) / 86400000));
        }

        function holdingDuration(dateStr) {
            const days = holdingDays(dateStr);
            if (days === null) return '—';
            if (days < 30) return `${toFa(days)} روز`;
            if (days < 365) return `${toFa(Math.floor(days / 30))} ماه · ${toFa(days)} روز`;
            return `${toFa(Math.floor(days / 365))} سال · ${toFa(days % 365)} روز`;
        }

        // ==========================================
        // CALCULATE STATS
        // ==========================================
        function calculateStats() {
            let totalValue = 0;
            let totalInvested = 0;
            let totalInvestedWithLive = 0;
            const categoryStats = {};

            const portfolioWithPrices = portfolio.map(item => {
                const def = getAssetDefinition(item.asset_category, item.asset_symbol);
                const currency = assetCurrency(item);
                const quantity = Number(item.quantity) || 0;
                const buyPrice = Number(item.buy_price) || 0;
                const live = getCurrentPrice(item);
                const currentPrice = live ? live.price : null;
                const investedToman = toToman(quantity * buyPrice, currency);
                const valueToman = currentPrice !== null ? toToman(quantity * currentPrice, currency) : null;
                const profit = (investedToman !== null && valueToman !== null) ? valueToman - investedToman : null;
                const profitPercent = (profit !== null && investedToman > 0) ? (profit / investedToman) * 100 : null;

                if (investedToman !== null) totalInvested += investedToman;
                if (valueToman !== null) {
                    totalValue += valueToman;
                    totalInvestedWithLive += investedToman;
                }

                const category = item.asset_category || 'other';
                if (!categoryStats[category]) categoryStats[category] = { value: 0, count: 0 };
                if (valueToman !== null) categoryStats[category].value += valueToman;
                categoryStats[category].count++;

                return {
                    ...item,
                    quantity,
                    buy_price: buyPrice,
                    currentPrice,
                    priceSource: live?.source || null,
                    isManualPrice: live?.manual || false,
                    currency,
                    unit: item.unit || def?.unit || 'واحد',
                    currentValue: valueToman,
                    invested: investedToman,
                    profit,
                    profitPercent,
                    holdingDuration: holdingDuration(item.buy_date),
                    hasLivePrice: currentPrice !== null
                };
            });

            const totalProfit = totalValue - totalInvestedWithLive;
            const totalProfitPercent = totalInvestedWithLive > 0 ? (totalProfit / totalInvestedWithLive) * 100 : 0;

            return {
                totalValue, totalInvested, totalInvestedWithLive,
                totalProfit, totalProfitPercent,
                categoryStats, items: portfolioWithPrices,
                usdRate: getUsdRate()
            };
        }

        function renderFullPage(container, stats) {
            const profitClass = stats.totalProfit >= 0 ? 'green' : 'red';

            container.innerHTML = `
                <div class="page-header"><h1>💼 پرتفوی من</h1><p>مدیریت و تحلیل هوشمند دارایی‌ها</p></div>

                <div class="summary-grid">

        async function renderCompare(stats) {
            const grid = document.getElementById('compareGrid');
            if (!grid) return;
            grid.innerHTML = '<div class="compare-loading">⏳ در حال دریافت...</div>';

            const selected = getSelectedCompareKeys();
            const defs = {
                gold18: { slug: 'geram18', label: 'طلا ۱۸ عیار', icon: '🥇' },
                usd: { slug: 'price_dollar_rl', label: 'دلار آزاد', icon: '💵' },
                bourse: { slug: 'bourse', label: 'شاخص کل بورس', icon: '📊' },
                ayar: { slug: 'gc3', label: 'صندوق طلای عیار', icon: '🟡' },
                silver999: { slug: 'silver_999', label: 'نقره ۹۹۹', icon: '🥈' }
            };

            const sources = {};
            for (const key of selected) {
                if (key === 'bank') continue;
                const def = defs[key];
                if (!def) continue;
                try {
                    sources[key] = await fetchTgjuHistory(def.slug);
                } catch (e) {
                    sources[key] = null;
                }
            }

            const bankRate = Number(document.getElementById('compareBankRate')?.value) || 0;

            for (const item of stats.items) {
                const invested = Number(item.invested) || 0;
                const actual = Number.isFinite(Number(item.profitPercent)) ? item.profitPercent : null;
                const rows = [];

                for (const key of selected) {
                    if (key === 'bank') {
                        const days = holdingDays(item.buy_date) || 0;
                        const percent = bankRate > 0 ? (Math.pow(1 + bankRate / 100, days / 365) - 1) * 100 : 0;
                        rows.push({ label: 'سپرده بانکی', icon: '🏦', base: null, latest: null, percent, hypothetical: invested * (1 + percent / 100) });
                        continue;
                    }
                    const src = sources[key];
                    if (!src) {
                        rows.push({ label: defs[key].label, icon: defs[key].icon, base: null, latest: null, percent: null, hypothetical: null });
                        continue;
                    }
                    const base = findHistoryAtOrBefore(src, item.buy_date);
                    const latest = src[src.length - 1];
                    if (!base || !latest) {
                        rows.push({ label: defs[key].label, icon: defs[key].icon, base: null, latest: null, percent: null, hypothetical: null });
                        continue;
                    }
                    const percent = (latest.close / base.close - 1) * 100;
                    rows.push({
                        label: defs[key].label, icon: defs[key].icon,
                        base: base.close, latest: latest.close, percent,
                        hypothetical: invested * (latest.close / base.close)
                    });
                }

                const tableRows = rows.map(r => {
                    const p = Number.isFinite(Number(r.percent)) ? Number(r.percent) : null;
                    const cls = p === null ? 'neutral' : p >= 0 ? 'profit' : 'loss';
                    const sign = p === null ? '' : p >= 0 ? '+' : '−';
                    return `<tr>
                        <td>${r.icon} ${escapeHtml(r.label)}</td>
                        <td>${r.base === null ? '—' : formatNum(r.base)}</td>
                        <td>${r.latest === null ? '—' : formatNum(r.latest)}</td>
                        <td class="${cls}">${p === null ? '—' : sign + toFa(Math.abs(p).toFixed(2)) + '٪'}</td>
                        <td>${r.hypothetical === null ? '—' : formatBigNum(r.hypothetical) + ' تومان'}</td>
                    </tr>`;
                }).join('');

                const actualText = actual === null ? 'عملکرد واقعی: —' : `عملکرد واقعی: ${actual >= 0 ? '+' : '−'}${toFa(Math.abs(actual).toFixed(2))}٪`;

                grid.insertAdjacentHTML('beforeend', `
                    <div class="compare-asset-card">
                        <div class="compare-asset-head">
                            <div>
                                <div class="compare-asset-name">${escapeHtml(item.asset_name)}</div>
                                <div class="compare-asset-date">تاریخ خرید: ${formatDate(item.buy_date)}</div>
                            </div>
                            <div class="compare-actual ${actual === null ? 'neutral' : actual >= 0 ? 'profit' : 'loss'}">${actualText}</div>
                        </div>
                        <div class="compare-table-wrap">
                            <table class="compare-table">
                                <thead><tr><th>مرجع</th><th>قیمت در تاریخ خرید</th><th>قیمت امروز</th><th>بازده</th><th>ارزش فرضی</th></tr></thead>
                                <tbody>${tableRows}</tbody>
                            </table>
                        </div>
                    </div>
                `);
            }
        }

        function findHistoryAtOrBefore(rows, dateStr) {
            if (!dateStr || !rows?.length) return null;
            const target = String(dateStr).trim();
            let best = null;
            for (const r of rows) {
                if (r.iso <= target) best = r;
                else break;
            }
            return best;
        }

        // ==========================================
        // CHART — TGJU history for each asset
        // ==========================================
        function toggleAssetChart(id) {
            const row = document.getElementById(`chart-row-${id}`);
            if (!row) return;
            const open = row.classList.toggle('open');
            if (open) loadAssetChart(id, '1M', row.querySelector('.chart-period'));
        }

        async function loadAssetChart(id, period, button) {
            const item = calculateStats().items.find(x => String(x.id) === String(id));
            const box = document.getElementById(`asset-chart-${id}`);
            if (!item || !box) return;
            if (button) {
                button.parentElement.querySelectorAll('.chart-period').forEach(b => b.classList.remove('active'));
                button.classList.add('active');
            }
            box.innerHTML = '<div class="chart-message">در حال دریافت تاریخچه…</div>';

            const def = getAssetDefinition(item.asset_category, item.asset_symbol);
            let rows = null;

            try {
                if (def?.tgju) {
                    rows = await fetchTgjuHistory(def.tgju);
                } else if (item.asset_category === 'crypto') {
                    rows = await fetchCryptoHistory(item.asset_symbol, 370);
                }
            } catch (e) {
                console.error('Chart error:', e);
            }

            if (!rows || !rows.length) {
                box.innerHTML = '<div class="chart-message">تاریخچه از TGJU در دسترس نیست.</div>';
                return;
            }

            const sliced = sliceHistory(rows, period);
            const values = sliced.map(r => r.close);
            const labels = sliced.map(r => r.jalali || r.greg || r.iso);
            renderLineChart(box, values, '#d4af37', labels);
        }

        function sliceHistory(rows, period) {
            const days = period === '1M' ? 31 : period === '3M' ? 93 : period === '6M' ? 186 : 366;
            const cutoff = Date.now() - days * 86400000;
            const filtered = rows.filter(r => new Date(r.iso + 'T00:00:00').getTime() >= cutoff);
            return filtered.length >= 2 ? filtered : rows.slice(-Math.max(2, Math.min(rows.length, days)));
        }

        async function fetchCryptoHistory(symbol, days) {
            if (cryptoHistoryCache[symbol]) return cryptoHistoryCache[symbol];
            const map = {
                btc: 'bitcoin', eth: 'ethereum', xaut: 'tether-gold', paxg: 'pax-gold',
                'usdt-erc': 'tether', usdc: 'usd-coin', sol: 'solana', xrp: 'ripple',
                doge: 'dogecoin', ada: 'cardano', bnb: 'binancecoin', trx: 'tron', avax: 'avalanche-2'
            };
            const coinId = map[symbol];
            if (!coinId) throw new Error('unsupported');
            const res = await fetch(`https://api.coingecko.com/api/v3/coins/${coinId}/market_chart?vs_currency=usd&days=${days}&interval=daily`);
            const data = await res.json();
            const rows = (data.prices || []).map(p => ({
                close: p[1],
                iso: new Date(p[0]).toISOString().slice(0, 10)
            })).filter(r => Number.isFinite(r.close) && r.close > 0);
            if (!rows.length) throw new Error('empty');
            cryptoHistoryCache[symbol] = rows;
            return rows;
        }

        function renderLineChart(box, values, color, labels) {
            const old = box.querySelector('canvas');
            if (old) { const c = Chart.getChart(old); if (c) c.destroy(); }
            box.innerHTML = '<canvas></canvas>';
            new Chart(box.querySelector('canvas'), {
                type: 'line',
                data: {
                    labels: labels.length ? labels : values.map((_, i) => toFa(i + 1)),
                    datasets: [{ data: values, borderColor: color, backgroundColor: 'rgba(59,130,246,.08)', borderWidth: 2, pointRadius: 0, tension: .22, fill: true }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ` ${formatNum(c.parsed.y, 2)}` } } },
                    scales: { x: { ticks: { color: '#94A3B8', maxTicksLimit: 8 } }, y: { ticks: { color: '#94A3B8' } } }
                }
            });
        }

        async function saveAsset() {
            const id = document.getElementById('assetId').value;
            const category = document.getElementById('assetCategory').value;
            const symbol = document.getElementById('assetSelect').value;
            const cat = ASSETS[category];
            const item = cat?.items?.find(i => i.symbol === symbol);
            const quantity = parseFloat(document.getElementById('assetQuantity').value);
            const buyPrice = parseFloat(document.getElementById('assetBuyPrice').value);
            const input = document.getElementById('assetBuyDate');
            const dp = JalaliDatePicker.get(input);
            const buyDate = dp ? dp.getIsoValue() : input.value;

            if (!quantity || quantity <= 0) { showToast('❌ مقدار معتبر وارد کن', 'error'); return; }
            if (!buyPrice || buyPrice <= 0) { showToast('❌ قیمت معتبر وارد کن', 'error'); return; }
            if (!buyDate) { showToast('❌ تاریخ را وارد کن', 'error'); return; }

            const payload = {
                user_id: currentUser.id,
                asset_category: category,
                asset_symbol: symbol,
                asset_name: item?.name || symbol,
                asset_icon: item?.icon || '📊',
                quantity,
                unit: item?.unit || 'واحد',
                buy_price: buyPrice,
                buy_date: buyDate,
                notes: document.getElementById('assetNotes').value.trim() || null
            };

            let error;
            if (id) ({ error } = await db.from('user_portfolio').update(payload).eq('id', id));
            else ({ error } = await db.from('user_portfolio').insert(payload));

            if (error) { showToast('❌ ' + error.message, 'error'); return; }
            showToast(id ? '✅ ویرایش شد' : '✅ اضافه شد');
            closeModal('assetModal');
            await render();
        }

        function editAsset(id) {
            const item = portfolio.find(p => String(p.id) === String(id));
            if (!item) return;
            document.getElementById('assetModalTitle').textContent = '✏️ ویرایش';
            document.getElementById('assetId').value = item.id;
            document.getElementById('assetCategory').value = item.asset_category;
            onCategoryChange();
            document.getElementById('assetSelect').value = item.asset_symbol;
            onAssetChange();
            document.getElementById('assetQuantity').value = item.quantity;
            document.getElementById('assetBuyPrice').value = item.buy_price;
            const dp = JalaliDatePicker.get('assetBuyDate');
            if (dp) dp.setValue(item.buy_date);
            document.getElementById('assetNotes').value = item.notes || '';
            document.getElementById('assetModal').classList.add('show');
        }

        async function deleteAsset(id) {
            if (!confirm('مطمئنی؟')) return;
            const { error } = await db.from('user_portfolio').delete().eq('id', id);
            if (error) { showToast('❌ ' + error.message, 'error'); return; }
            localStorage.removeItem(manualPriceKey(id));
            showToast('🗑️ حذف شد');
            await render();
        }

        function exportCSV() {
            const stats = calculateStats();
            let csv = 'نام,نماد,دسته,مقدار,واحد,قیمت خرید,قیمت فعلی,سرمایه,ارزش فعلی,سود,درصد,تاریخ\n';
            stats.items.forEach(i => {
                csv += `"${i.asset_name}","${i.asset_symbol}","${ASSETS[i.asset_category]?.name||''}",${i.quantity},"${i.unit}",${i.buy_price},${i.currentPrice??''},${i.invested??''},${i.currentValue??''},${i.profit??''},${i.profitPercent==null?'':i.profitPercent.toFixed(2)},${i.buy_date}\n`;
            });
            const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `portfolio-${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
        }

        // ==========================================
        // INIT
        // ==========================================
        document.addEventListener('DOMContentLoaded', async () => {
            JalaliDatePicker.initAll();
            const { data: { session } } = await db.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return; }
            currentUser = session.user;
            await render();
        });
    </script>
</body>
</html>
