<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بورس ایران | آکادمی شمعدون</title>
    <script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Tahoma, sans-serif;
            /* ===== پس‌زمینه ترکیبی حرفه‌ای ===== */
            background-color: #0f172a;
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(245, 158, 11, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(59, 130, 246, 0.08) 0%, transparent 40%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 50px 50px, 50px 50px;
            background-attachment: fixed;
            color: #e2e8f0;
            direction: rtl;
            min-height: 100vh;
            padding: 15px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .header h1 { color: #f59e0b; font-size: 22px; }
        .header a {
            color: #94a3b8;
            text-decoration: none;
            font-weight: bold;
            border: 2px solid #334155;
            padding: 8px 16px;
            border-radius: 25px;
            font-size: 14px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
        }
        .header a:hover { background: #334155; color: #fff; }

        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .search-box input {
            flex: 1;
            min-width: 200px;
            padding: 12px 18px;
            border-radius: 12px;
            border: 2px solid #334155;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(10px);
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        .search-box input:focus { border-color: #f59e0b; }
        .search-box button {
            background: #f59e0b;
            color: #0f172a;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }
        .search-box button:hover { background: #d97706; }

        .status-box {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(10px);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 13px;
            color: #94a3b8;
        }

        .symbol-list {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            max-height: 250px;
            overflow-y: auto;
        }
        .symbol-list h3 { color: #f59e0b; font-size: 15px; margin-bottom: 10px; }
        .symbol-list .tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .symbol-tag {
            background: rgba(15, 23, 42, 0.8);
            color: #94a3b8;
            padding: 6px 14px;
            border-radius: 15px;
            font-size: 13px;
            cursor: pointer;
            border: 1px solid #334155;
            transition: 0.2s;
        }
        .symbol-tag:hover { background: #f59e0b; color: #0f172a; }
        .symbol-tag.active { background: #f59e0b; color: #0f172a; }

        .ranking-section {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .ranking-section h3 { color: #f59e0b; font-size: 16px; margin-bottom: 12px; }
        .ranking-tabs {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        .ranking-tab {
            background: rgba(15, 23, 42, 0.8);
            color: #94a3b8;
            border: 1px solid #334155;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
        }
        .ranking-tab.active { background: #f59e0b; color: #0f172a; border-color: #f59e0b; }
        
        .ranking-sort {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
        }
        .sort-btn {
            background: rgba(15, 23, 42, 0.8);
            color: #94a3b8;
            border: 1px solid #334155;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
        }
        .sort-btn.active { background: #22c55e; color: #fff; border-color: #22c55e; }
        .sort-btn.desc { background: #ef4444; color: #fff; border-color: #ef4444; }

        .ranking-list {
            max-height: 500px;
            overflow-y: auto;
        }
        .ranking-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-bottom: 1px solid #334155;
            cursor: pointer;
            transition: 0.2s;
        }
        .ranking-item:hover { background: rgba(15, 23, 42, 0.8); }
        .ranking-item:last-child { border-bottom: none; }
        .ranking-item .rank { 
            background: rgba(15, 23, 42, 0.8);
            color: #94a3b8; 
            width: 28px; 
            height: 28px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }
        .ranking-item .rank.top-3 { background: #f59e0b; color: #0f172a; }
        .ranking-item .name { flex: 1; margin-right: 10px; font-weight: bold; font-size: 14px; }
        .ranking-item .price { color: #94a3b8; font-size: 12px; margin-left: 8px; }
        .ranking-item .change { font-weight: bold; font-size: 15px; min-width: 70px; text-align: left; }
        .ranking-item .change.up { color: #4ade80; }
        .ranking-item .change.down { color: #f87171; }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }
        .info-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(10px);
            padding: 12px;
            border-radius: 12px;
            border-right: 4px solid #f59e0b;
        }
        .info-card .label { font-size: 12px; color: #94a3b8; }
        .info-card .value { font-size: 16px; font-weight: bold; margin-top: 5px; }
        .up { color: #4ade80; }
        .down { color: #f87171; }

        .chart-section {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 12px;
        }
        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .chart-header h3 { color: #f59e0b; font-size: 18px; }
        .chart-tabs { display: flex; gap: 5px; flex-wrap: wrap; }
        .chart-tab {
            background: rgba(15, 23, 42, 0.8);
            color: #94a3b8;
            border: 1px solid #334155;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
        }
        .chart-tab.active { background: #f59e0b; color: #0f172a; border-color: #f59e0b; }
        #tvchart { width: 100%; height: 450px; }

        .loading { text-align: center; padding: 20px; color: #94a3b8; }
        .error { color: #f87171; text-align: center; padding: 20px; }

        .refresh-btn {
            background: #334155;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
        }
        .refresh-btn:hover { background: #475569; }
    </style>
</head>
<body>

    <div class="header">
        <h1>📊 بورس ایران</h1>
        <a href="index.html">⬅ بازگشت به خانه</a>
    </div>

    <div class="search-box">
        <input type="text" id="symbolSearch" placeholder="نام نماد (مثال: فولاد، خودرو، شپنا)" value="فولاد">
        <button onclick="searchAndLoad()">🔍 جستجو و نمایش</button>
    </div>

    <div class="status-box" id="statusBox">💡 نام نماد را وارد کنید و جستجو را بزنید</div>

    <div class="symbol-list" id="symbolListContainer" style="display:none;">
        <h3>📌 نتایج جستجو (کلیک کنید)</h3>
        <div class="tags" id="searchResults"></div>
    </div>

    <div class="ranking-section">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
            <h3>🏆 رتبه‌بندی سهام بورس</h3>
            <button class="refresh-btn" onclick="loadRanking(true)">🔄 بروزرسانی</button>
        </div>
        
        <div class="ranking-tabs">
            <button class="ranking-tab active" onclick="changeRankingPeriod('1w', this)">۱ هفته</button>
            <button class="ranking-tab" onclick="changeRankingPeriod('1m', this)">۱ ماه</button>
            <button class="ranking-tab" onclick="changeRankingPeriod('3m', this)">۳ ماه</button>
            <button class="ranking-tab" onclick="changeRankingPeriod('6m', this)">۶ ماه</button>
            <button class="ranking-tab" onclick="changeRankingPeriod('1y', this)">۱ سال</button>
        </div>

        <div class="ranking-sort">
            <button class="sort-btn active" onclick="changeSortOrder('desc', this)">🔻 بیشترین سود</button>
            <button class="sort-btn" onclick="changeSortOrder('asc', this)">🔺 بیشترین ضرر</button>
        </div>

        <div class="ranking-list" id="rankingList">
            <div class="loading">⏳ در حال دریافت لیست نمادها...</div>
        </div>
    </div>

    <div class="info-grid" id="infoGrid">
        <div class="info-card"><div class="label">قیمت پایانی</div><div class="value" id="pc">--</div></div>
        <div class="info-card"><div class="label">آخرین معامله</div><div class="value" id="pl">--</div></div>
        <div class="info-card"><div class="label">تغییر قیمت</div><div class="value" id="pcc">--</div></div>
        <div class="info-card"><div class="label">درصد تغییر</div><div class="value" id="pcp">--</div></div>
        <div class="info-card"><div class="label">حجم معاملات</div><div class="value" id="tvol">--</div></div>
        <div class="info-card"><div class="label">ارزش معاملات</div><div class="value" id="tval">--</div></div>
    </div>

    <div class="chart-section">
        <div class="chart-header">
            <h3 id="chartTitle">📈 چارت قیمت</h3>
            <div class="chart-tabs">
                <button class="chart-tab active" onclick="changeTimeframe('daily', this)">روزانه</button>
                <button class="chart-tab" onclick="changeTimeframe('weekly', this)">هفتگی</button>
                <button class="chart-tab" onclick="changeTimeframe('monthly', this)">ماهانه</button>
            </div>
        </div>
        <div id="tvchart"></div>
    </div>

    <script>
        const TSETMC_API = 'https://cdn.tsetmc.com/api';
        let chart, candleSeries;
        let currentSymbol = '';
        let currentInsCode = '';
        let chartInitialized = false;
        let currentTimeframe = 'daily';
        let allDailyData = [];

        let rankingData = [];
        let currentRankingPeriod = '1w';
        let currentSortOrder = 'desc';
        let rankingLoaded = false;

        // ===== مقداردهی چارت =====
        function initChart() {
            if (chartInitialized) return;
            try {
                const chartContainer = document.getElementById('tvchart');
                const width = chartContainer.clientWidth || window.innerWidth - 60;

                chart = LightweightCharts.createChart(chartContainer, {
                    width: width,
                    height: 450,
                    layout: { 
                        background: { color: '#0f172a' }, 
                        textColor: '#94a3b8' 
                    },
                    grid: { 
                        vertLines: { color: 'rgba(30, 41, 59, 0.5)' }, 
                        horzLines: { color: 'rgba(30, 41, 59, 0.5)' } 
                    },
                    timeScale: { timeVisible: true, secondsVisible: false }
                });

                candleSeries = chart.addCandlestickSeries({
                    upColor: '#4ade80', downColor: '#f87171',
                    borderVisible: false,
                    wickUpColor: '#4ade80', wickDownColor: '#f87171'
                });

                chartInitialized = true;
            } catch (e) {
                console.error('خطا در مقداردهی چارت:', e);
            }
        }

        // ===== جستجوی نماد =====
        async function searchAndLoad() {
            const query = document.getElementById('symbolSearch').value.trim();
            if (!query) return;
            document.getElementById('statusBox').textContent = '⏳ در حال جستجو...';

            try {
                const res = await fetch(`${TSETMC_API}/Instrument/GetInstrumentSearch/${encodeURIComponent(query)}`);
                const data = await res.json();

                if (data && data.instrumentSearch && data.instrumentSearch.length > 0) {
                    const results = data.instrumentSearch;
                    document.getElementById('symbolListContainer').style.display = 'block';
                    document.getElementById('searchResults').innerHTML = results.map(item => {
                        const name = item.lVal18AFC || item.lVal30 || '';
                        const insCode = item.insCode || '';
                        return `<span class="symbol-tag ${insCode === currentInsCode ? 'active' : ''}" onclick="loadSymbolByCode('${insCode}', '${name}')">${name}</span>`;
                    }).join('');
                    document.getElementById('statusBox').textContent = `✅ ${results.length} نتیجه یافت شد.`;
                } else {
                    document.getElementById('statusBox').textContent = '❌ نمادی یافت نشد.';
                }
            } catch (e) {
                document.getElementById('statusBox').textContent = '❌ خطا: ' + e.message;
            }
        }

        // ===== بارگذاری اطلاعات نماد =====
        async function loadSymbolByCode(insCode, symbolName) {
            currentSymbol = symbolName;
            currentInsCode = insCode;
            document.getElementById('chartTitle').textContent = '📈 چارت ' + symbolName;
            document.getElementById('infoGrid').innerHTML = '<div class="loading">⏳ در حال دریافت اطلاعات...</div>';
            document.getElementById('statusBox').textContent = `⏳ در حال دریافت اطلاعات ${symbolName}...`;

            try {
                const res = await fetch(`${TSETMC_API}/ClosingPrice/GetClosingPriceInfo/${insCode}`);
                const data = await res.json();

                if (data && data.closingPriceInfo) {
                    displayInfo(data.closingPriceInfo);
                    document.getElementById('statusBox').textContent = `✅ اطلاعات ${symbolName} بارگذاری شد.`;
                    await loadChartData(insCode);
                } else {
                    document.getElementById('infoGrid').innerHTML = '<div class="error">❌ اطلاعات یافت نشد.</div>';
                }
            } catch (e) {
                document.getElementById('infoGrid').innerHTML = '<div class="error">❌ خطا: ' + e.message + '</div>';
            }
        }

        // ===== نمایش اطلاعات لحظه‌ای =====
        function displayInfo(info) {
            const pc = (parseInt(info.pClosing || 0) / 10).toLocaleString('fa-IR');
            const pl = (parseInt(info.pDrCotVal || 0) / 10).toLocaleString('fa-IR');
            const pClosing = parseInt(info.pClosing || 0);
            const pYesterday = parseInt(info.priceYesterday || 0);
            const pccRaw = pClosing - pYesterday;
            const pcpRaw = pYesterday > 0 ? (pccRaw / pYesterday) * 100 : 0;
            const pcc = (pccRaw / 10).toLocaleString('fa-IR');
            const pcp = pcpRaw.toFixed(2);
            const tvol = parseInt(info.qTotTran5J || 0).toLocaleString('fa-IR');
            const tval = (parseInt(info.qTotCap || 0) / 10000000000).toFixed(1) + ' میلیارد';

            document.getElementById('infoGrid').innerHTML = `
                <div class="info-card"><div class="label">قیمت پایانی</div><div class="value">${pc} تومان</div></div>
                <div class="info-card"><div class="label">آخرین معامله</div><div class="value">${pl} تومان</div></div>
                <div class="info-card"><div class="label">تغییر قیمت</div><div class="value ${pccRaw >= 0 ? 'up' : 'down'}">${(pccRaw > 0 ? '+' : '') + pcc}</div></div>
                <div class="info-card"><div class="label">درصد تغییر</div><div class="value ${pcpRaw >= 0 ? 'up' : 'down'}">${(pcpRaw > 0 ? '+' : '') + pcp}%</div></div>
                <div class="info-card"><div class="label">حجم معاملات</div><div class="value">${tvol}</div></div>
                <div class="info-card"><div class="label">ارزش معاملات</div><div class="value">${tval}</div></div>
            `;
        }

        // ===== بارگذاری داده‌های چارت =====
        async function loadChartData(insCode) {
            try {
                if (!chartInitialized) initChart();
                const res = await fetch(`${TSETMC_API}/ClosingPrice/GetClosingPriceDailyList/${insCode}/0`);
                const data = await res.json();

                if (!data || !data.closingPriceDaily || data.closingPriceDaily.length === 0) return;
                allDailyData = data.closingPriceDaily;
                renderChart(currentTimeframe);
            } catch (e) {
                console.error('خطا در چارت:', e);
            }
        }

        // ===== رسم چارت با فیلتر دقیق =====
        function renderChart(timeframe) {
            if (!allDailyData || allDailyData.length === 0) return;
            
            // فیلتر دقیق: حذف داده‌های خراب
            const filtered = allDailyData.filter(d => {
                if (!d.dEven || d.dEven === 0 || d.dEven === '0') return false;
                if (d.pClosing <= 0 || d.priceFirst <= 0 || d.priceMax <= 0 || d.priceMin <= 0) return false;
                if (d.pClosing < 1 || d.priceFirst < 1) return false;
                const year = parseInt(d.dEven.toString().substring(0, 4));
                if (year < 2020 || year > 2030) return false;
                return true;
            });
            
            // حذف تاریخ‌های تکراری
            const uniqueByDate = [];
            const seenDates = new Set();
            for (let i = filtered.length - 1; i >= 0; i--) {
                if (!seenDates.has(filtered[i].dEven)) {
                    seenDates.add(filtered[i].dEven);
                    uniqueByDate.unshift(filtered[i]);
                }
            }
            
            const sorted = uniqueByDate.sort((a, b) => a.dEven - b.dEven);
            console.log('تعداد داده‌های معتبر:', sorted.length);
            
            let chartData = [];

            if (timeframe === 'daily') {
                const recent = sorted.slice(-200);
                chartData = recent.map(item => ({
                    time: dateToTimestamp(item.dEven),
                    open: parseInt(item.priceFirst) / 10,
                    high: parseInt(item.priceMax) / 10,
                    low: parseInt(item.priceMin) / 10,
                    close: parseInt(item.pClosing) / 10
                })).filter(item => item.time > 0);
            } else if (timeframe === 'weekly') {
                chartData = groupByWeek(sorted);
            } else if (timeframe === 'monthly') {
                chartData = groupByMonth(sorted);
            }

            if (chartData.length > 0) {
                candleSeries.setData(chartData);
                chart.timeScale().fitContent();
                console.log('✅ چارت با ' + chartData.length + ' کندل رسم شد');
            }
        }

        function dateToTimestamp(dateNum) {
            const str = dateNum.toString();
            const year = parseInt(str.substring(0, 4));
            const month = parseInt(str.substring(4, 6)) - 1;
            const day = parseInt(str.substring(6, 8));
            return Math.floor(new Date(year, month, day).getTime() / 1000);
        }

        function groupByWeek(sorted) {
            const grouped = [];
            let currentGroup = null;
            for (const item of sorted) {
                const timestamp = dateToTimestamp(item.dEven);
                const date = new Date(timestamp * 1000);
                const weekStart = new Date(date);
                weekStart.setDate(date.getDate() - date.getDay());
                const weekKey = weekStart.getTime();
                if (!currentGroup || currentGroup.key !== weekKey) {
                    if (currentGroup) grouped.push(currentGroup);
                    currentGroup = {
                        key: weekKey, time: timestamp,
                        open: parseInt(item.priceFirst) / 10,
                        high: parseInt(item.priceMax) / 10,
                        low: parseInt(item.priceMin) / 10,
                        close: parseInt(item.pClosing) / 10
                    };
                } else {
                    currentGroup.high = Math.max(currentGroup.high, parseInt(item.priceMax) / 10);
                    currentGroup.low = Math.min(currentGroup.low, parseInt(item.priceMin) / 10);
                    currentGroup.close = parseInt(item.pClosing) / 10;
                }
            }
            if (currentGroup) grouped.push(currentGroup);
            return grouped.slice(-100);
        }

        function groupByMonth(sorted) {
            const grouped = [];
            let currentGroup = null;
            for (const item of sorted) {
                const str = item.dEven.toString();
                const year = parseInt(str.substring(0, 4));
                const month = parseInt(str.substring(4, 6));
                const monthKey = year * 100 + month;
                const timestamp = dateToTimestamp(item.dEven);
                if (!currentGroup || currentGroup.key !== monthKey) {
                    if (currentGroup) grouped.push(currentGroup);
                    currentGroup = {
                        key: monthKey, time: timestamp,
                        open: parseInt(item.priceFirst) / 10,
                        high: parseInt(item.priceMax) / 10,
                        low: parseInt(item.priceMin) / 10,
                        close: parseInt(item.pClosing) / 10
                    };
                } else {
                    currentGroup.high = Math.max(currentGroup.high, parseInt(item.priceMax) / 10);
                    currentGroup.low = Math.min(currentGroup.low, parseInt(item.priceMin) / 10);
                    currentGroup.close = parseInt(item.pClosing) / 10;
                }
            }
            if (currentGroup) grouped.push(currentGroup);
            return grouped.slice(-60);
        }

        function changeTimeframe(timeframe, btn) {
            document.querySelectorAll('.chart-tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            currentTimeframe = timeframe;
            renderChart(timeframe);
        }

        // ===== رتبه‌بندی =====
        async function loadRanking(forceReload = false) {
            if (rankingLoaded && !forceReload && rankingData.length > 0) {
                renderRanking();
                return;
            }

            document.getElementById('rankingList').innerHTML = '<div class="loading">⏳ در حال دریافت لیست نمادها...</div>';
            
            try {
                const searchQueries = ['ا', 'ب', 'پ', 'ت', 'ث', 'ج', 'چ', 'ح', 'خ', 'د', 'ذ', 'ر', 'ز', 'ژ', 'س', 'ش', 'ص', 'ض', 'ط', 'ظ', 'ع', 'غ', 'ف', 'ق', 'ک', 'گ', 'ل', 'م', 'ن', 'و', 'ه', 'ی'];
                const allSymbolsMap = new Map();
                
                for (const query of searchQueries) {
                    try {
                        const res = await fetch(`${TSETMC_API}/Instrument/GetInstrumentSearch/${encodeURIComponent(query)}`);
                        const data = await res.json();
                        if (data && data.instrumentSearch) {
                            data.instrumentSearch.forEach(item => {
                                if (item.insCode && item.lVal18AFC) {
                                    allSymbolsMap.set(item.insCode, {
                                        name: item.lVal18AFC,
                                        insCode: item.insCode
                                    });
                                }
                            });
                        }
                    } catch (e) {}
                }
                
                const allSymbols = Array.from(allSymbolsMap.values());
                console.log('✅ تعداد نمادها:', allSymbols.length);
                
                if (allSymbols.length === 0) {
                    document.getElementById('rankingList').innerHTML = '<div class="error">❌ لیست نمادها دریافت نشد</div>';
                    return;
                }
                
                document.getElementById('rankingList').innerHTML = `<div class="loading">⏳ در حال محاسبه سود/ضرر برای ${allSymbols.length} نماد...<br><small>این ممکنه ۲-۳ دقیقه طول بکشه</small></div>`;
                
                const results = [];
                const batchSize = 15;
                
                for (let i = 0; i < allSymbols.length; i += batchSize) {
                    const batch = allSymbols.slice(i, i + batchSize);
                    
                    const batchPromises = batch.map(async (symbol) => {
                        try {
                            const res = await fetch(`${TSETMC_API}/ClosingPrice/GetClosingPriceDailyList/${symbol.insCode}/0`);
                            const data = await res.json();
                            
                            if (data && data.closingPriceDaily && data.closingPriceDaily.length > 0) {
                                const sorted = data.closingPriceDaily
                                    .filter(d => d.pClosing > 0 && d.dEven > 0)
                                    .sort((a, b) => a.dEven - b.dEven);
                                if (sorted.length < 2) return null;

                                const latestPrice = sorted[sorted.length - 1].pClosing;
                                const periods = { '1w': 5, '1m': 22, '3m': 66, '6m': 132, '1y': 250 };
                                
                                const changes = {};
                                for (const [key, days] of Object.entries(periods)) {
                                    const index = Math.max(0, sorted.length - 1 - days);
                                    const oldPrice = sorted[index].pClosing;
                                    changes[key] = ((latestPrice - oldPrice) / oldPrice) * 100;
                                }

                                return {
                                    name: symbol.name,
                                    insCode: symbol.insCode,
                                    latestPrice: latestPrice / 10,
                                    changes: changes
                                };
                            }
                        } catch (e) {}
                        return null;
                    });
                    
                    const batchResults = await Promise.all(batchPromises);
                    results.push(...batchResults.filter(r => r !== null));
                    
                    const progress = Math.min(i + batchSize, allSymbols.length);
                    document.getElementById('rankingList').innerHTML = `<div class="loading">⏳ در حال پردازش... ${progress} از ${allSymbols.length} نماد (${results.length} نتیجه)</div>`;
                }
                
                rankingData = results;
                rankingLoaded = true;
                renderRanking();
                
            } catch (e) {
                console.error('خطا در رتبه‌بندی:', e);
                document.getElementById('rankingList').innerHTML = '<div class="error">❌ خطا: ' + e.message + '</div>';
            }
        }

        function renderRanking() {
            if (rankingData.length === 0) {
                document.getElementById('rankingList').innerHTML = '<div class="error">❌ داده‌ای وجود ندارد</div>';
                return;
            }

            const sorted = [...rankingData].sort((a, b) => {
                const changeA = a.changes[currentRankingPeriod];
                const changeB = b.changes[currentRankingPeriod];
                return currentSortOrder === 'desc' ? changeB - changeA : changeA - changeB;
            });

            document.getElementById('rankingList').innerHTML = sorted.map((item, index) => {
                const change = item.changes[currentRankingPeriod];
                const rankClass = index < 3 ? 'top-3' : '';
                return `
                    <div class="ranking-item" onclick="loadSymbolByCode('${item.insCode}', '${item.name}')">
                        <span class="rank ${rankClass}">${index + 1}</span>
                        <span class="name">${item.name}</span>
                        <span class="price">${item.latestPrice.toLocaleString('fa-IR')} ت</span>
                        <span class="change ${change >= 0 ? 'up' : 'down'}">
                            ${(change >= 0 ? '+' : '') + change.toFixed(2)}%
                        </span>
                    </div>
                `;
            }).join('');
        }

        function changeRankingPeriod(period, btn) {
            document.querySelectorAll('.ranking-tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            currentRankingPeriod = period;
            renderRanking();
        }

        function changeSortOrder(order, btn) {
            document.querySelectorAll('.sort-btn').forEach(t => {
                t.classList.remove('active', 'desc');
            });
            btn.classList.add(order === 'desc' ? 'active' : 'desc');
            currentSortOrder = order;
            renderRanking();
        }

        // ===== راه‌اندازی =====
        window.addEventListener('load', function() {
            setTimeout(() => {
                initChart();
                searchAndLoad();
                loadRanking();
            }, 500);
        });

        window.addEventListener('resize', () => {
            if (chart && chartInitialized) {
                chart.applyOptions({ width: document.getElementById('tvchart').clientWidth });
            }
        });
    </script>
</body>
</html>
