<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پرتفوی من | آکادمی شمعدون</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root {
    --bg-primary: #0a0a0f;
    --bg-secondary: #14141c;
    --bg-card: #1a1a24;
    --gold: #d4af37;
    --gold-light: #f4d47c;
    --green: #10b981;
    --red: #ef4444;
    --white: #f8fafc;
    --gray: #94a3b8;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    background: var(--bg-primary);
    color: var(--white);
    min-height: 100vh;
    direction: rtl;
    padding: 20px;
}
.main-container { max-width: 1200px; margin: 0 auto; padding: 20px; }
.page-header { text-align: center; margin-bottom: 30px; }
.page-header h1 {
    font-size: 32px;
    font-weight: 900;
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}
.loading-screen { text-align: center; padding: 100px 20px; color: var(--gray); }
.spinner {
    width: 50px; height: 50px;
    border: 4px solid rgba(212,175,55,0.2);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 20px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.summary-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 25px;
}
.summary-card {
    background: linear-gradient(135deg, var(--bg-card), var(--bg-secondary));
    border: 1px solid rgba(212,175,55,0.15);
    border-radius: 18px;
    padding: 20px;
    text-align: center;
}
.summary-card .icon { font-size: 28px; margin-bottom: 10px; }
.summary-card .value { color: var(--white); font-size: 22px; font-weight: 900; margin-bottom: 6px; }
.summary-card .value.gold { color: var(--gold); }
.summary-card .value.green { color: var(--green); }
.summary-card .value.red { color: var(--red); }
.summary-card .label { color: var(--gray); font-size: 12px; }
.portfolio-section {
    background: linear-gradient(135deg, var(--bg-card), var(--bg-secondary));
    border: 1px solid rgba(212,175,55,0.15);
    border-radius: 20px;
    padding: 25px;
    margin-bottom: 25px;
}
.chart-title { color: var(--white); font-size: 16px; font-weight: 800; margin-bottom: 15px; }
.asset-card {
    padding: 15px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
}
.asset-card:last-child { border-bottom: none; }
.asset-left { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 200px; }
.asset-icon {
    width: 45px; height: 45px;
    border-radius: 12px;
    background: rgba(212,175,55,0.1);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
}
.asset-info h4 { color: var(--white); font-size: 15px; font-weight: 800; margin-bottom: 3px; }
.asset-info .symbol { color: var(--gray); font-size: 11px; font-family: monospace; direction: ltr; }
.asset-stats { display: flex; gap: 20px; flex-wrap: wrap; }
.stat { text-align: center; }
.stat .label { color: var(--gray); font-size: 10px; margin-bottom: 4px; }
.stat .value { color: var(--white); font-size: 13px; font-weight: 800; }
.stat .value.gold { color: var(--gold); }
.stat .value.green { color: var(--green); }
.stat .value.red { color: var(--red); }
.empty-state { text-align: center; padding: 60px 20px; color: var(--gray); }
.empty-state .icon { font-size: 80px; margin-bottom: 20px; opacity: 0.5; }
.empty-state h2 { color: var(--gold); margin-bottom: 10px; }
@media (max-width: 768px) {
    .summary-grid { grid-template-columns: repeat(2, 1fr); }
    .asset-stats { gap: 10px; }
    .stat .value { font-size: 12px; }
}
</style>
</head>
<body>

<div class="main-container" id="mainContent">
    <div class="loading-screen">
        <div class="spinner"></div>
        ⏳ در حال بارگذاری پرتفوی...
    </div>
</div>

<script>
// ==========================================
// ۱. Supabase Configuration
// ==========================================
const SUPABASE_URL = 'https://jcwwilatvstjrohvhtss.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impjd3dpbGF0dnN0anJvaHZodHNzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3MDY4NTYsImV4cCI6MjEwNTI4Mjg1Nn0.eUC89RJy6-60nNGrSeYeDADzLxz-kWTGy4DbNGVi6MM';

let db = null;

// ==========================================
// ۲. تعریف دارایی‌ها
// ==========================================
const ASSETS = {
    gold: { name: 'طلا و فلزات گرانبها', icon: '🥇' },
    currency: { name: 'ارز', icon: '💵' },
    crypto: { name: 'کریپتوکارنسی', icon: '₿' },
    global: { name: 'بازار جهانی', icon: '🌍' },
    stock: { name: 'بورس ایران', icon: '📊' },
    fund: { name: 'صندوق درآمد ثابت', icon: '💼' },
    realestate: { name: 'املاک', icon: '🏠' },
    bank: { name: 'سپرده بانکی', icon: '🏦' },
    other: { name: 'سایر', icon: '🌟' }
};

// ==========================================
// ۳. قیمت‌های نمونه (برای تست)
// ==========================================
const PRICE_CACHE = {
    btc: 95000,
    eth: 3500,
    sol: 200,
    gold18: 4500000,
    'coin-emami': 55000000,
    silver999: 55000,
    usd: 85000,
    usdt: 85500,
    فولاد: 5000,
    'custom-other': 100000
};

// ==========================================
// ۴. توابع کمکی
// ==========================================
function toFa(num) {
    if (num === null || num === undefined) return '۰';
    const p = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
    return String(num).replace(/\d/g, d => p[d]);
}

function formatNum(num) {
    if (num === null || num === undefined) return '۰';
    const n = Number(num);
    if (isNaN(n)) return '۰';
    const result = Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    const p = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
    return result.replace(/\d/g, d => p[d]);
}

function formatBigNum(num) {
    const n = Number(num);
    if (isNaN(n)) return '۰';
    if (Math.abs(n) >= 1e9) return formatNum(n / 1e9) + ' میلیارد';
    if (Math.abs(n) >= 1e6) return formatNum(n / 1e6) + ' میلیون';
    if (Math.abs(n) >= 1e3) return formatNum(n / 1e3) + ' هزار';
    return formatNum(n);
}

// ==========================================
// ۵. بارگذاری پرتفوی
// ==========================================
async function loadPortfolio() {
    const container = document.getElementById('mainContent');
    
    try {
        console.log('🚀 Starting...');
        
        if (typeof window.supabase === 'undefined') {
            throw new Error('کتابخانه Supabase لود نشده');
        }
        
        db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        console.log('✅ Supabase connected');
        
        const { data, error } = await db
            .from('user_portfolio')
            .select('*')
            .order('created_at', { ascending: false });
        
        if (error) throw error;
        
        console.log('📊 Data loaded:', data.length, 'items');
        
        if (!data || data.length === 0) {
            container.innerHTML = `
                <div class="page-header"><h1>💼 پرتفوی من</h1></div>
                <div class="portfolio-section">
                    <div class="empty-state">
                        <div class="icon">💼</div>
                        <h2>هنوز دارایی ثبت نکردی</h2>
                    </div>
                </div>
            `;
            return;
        }
        
        renderPortfolio(container, data);
    } catch (e) {
        console.error('❌ Error:', e);
        container.innerHTML = `
            <div class="loading-screen">
                ❌ خطا: ${e.message}<br><br>
                <button onclick="location.reload()" style="padding:10px 20px; border-radius:8px; background:#d4af37; border:none; cursor:pointer; font-family:inherit; font-weight:700;">🔄 تلاش مجدد</button>
            </div>
        `;
    }
}

// ==========================================
// ۶. رندر پرتفوی
// ==========================================
function renderPortfolio(container, portfolio) {
    let totalValue = 0;
    let totalInvested = 0;
    
    const items = portfolio.map(item => {
        const quantity = Number(item.quantity) || 0;
        const buyPrice = Number(item.buy_price) || 0;
        const currentPrice = PRICE_CACHE[item.asset_symbol] || buyPrice;
        const invested = quantity * buyPrice;
        const currentValue = quantity * currentPrice;
        const profit = currentValue - invested;
        
        totalValue += currentValue;
        totalInvested += invested;
        
        return { ...item, quantity, buyPrice, currentPrice, invested, currentValue, profit };
    });
    
    const totalProfit = totalValue - totalInvested;
    const totalProfitPercent = totalInvested > 0 ? (totalProfit / totalInvested) * 100 : 0;
    
    container.innerHTML = `
        <div class="page-header">
            <h1>💼 پرتفوی من</h1>
        </div>
        
        <div class="summary-grid">
            <div class="summary-card">
                <div class="icon">💰</div>
                <div class="value gold">${formatBigNum(totalValue)}</div>
                <div class="label">ارزش کل سبد</div>
            </div>
            <div class="summary-card">
                <div class="icon">${totalProfit >= 0 ? '📈' : '📉'}</div>
                <div class="value ${totalProfit >= 0 ? 'green' : 'red'}">${totalProfit >= 0 ? '+' : ''}${formatBigNum(totalProfit)}</div>
                <div class="label">سود/ضرر کل (${toFa(totalProfitPercent.toFixed(1))}٪)</div>
            </div>
            <div class="summary-card">
                <div class="icon">📊</div>
                <div class="value">${formatBigNum(totalInvested)}</div>
                <div class="label">سرمایه اولیه</div>
            </div>
            <div class="summary-card">
                <div class="icon">🏷️</div>
                <div class="value">${toFa(portfolio.length)}</div>
                <div class="label">تعداد دارایی</div>
            </div>
        </div>
        
        <div class="portfolio-section">
            <div class="chart-title">📋 دارایی‌های من</div>
            ${items.map(item => {
                const cat = ASSETS[item.asset_category] || { name: item.asset_category, icon: '📊' };
                const profitClass = item.profit >= 0 ? 'green' : 'red';
                const profitSign = item.profit >= 0 ? '+' : '';
                return `
                    <div class="asset-card">
                        <div class="asset-left">
                            <div class="asset-icon">${cat.icon}</div>
                            <div class="asset-info">
                                <h4>${item.asset_name || cat.name}</h4>
                                <div class="symbol">${item.asset_symbol}</div>
                            </div>
                        </div>
                        <div class="asset-stats">
                            <div class="stat">
                                <div class="label">مقدار</div>
                                <div class="value">${formatNum(item.quantity)} ${item.unit || ''}</div>
                            </div>
                            <div class="stat">
                                <div class="label">ارزش فعلی</div>
                                <div class="value gold">${formatBigNum(item.currentValue)} تومان</div>
                            </div>
                            <div class="stat">
                                <div class="label">سود/ضرر</div>
                                <div class="value ${profitClass}">${profitSign}${formatBigNum(item.profit)} تومان</div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('')}
        </div>
    `;
    
    console.log('✅ Rendered:', items.length, 'items');
}

// ==========================================
// ۷. Init
// ==========================================
window.addEventListener('DOMContentLoaded', () => {
    console.log('🚀 Page loaded');
    console.log('Supabase lib:', typeof window.supabase);
    loadPortfolio();
});
</script>
</body>
</html>
