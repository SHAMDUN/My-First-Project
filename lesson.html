                    {
                        title: 'جمع‌بندی و آزمون',
                        duration: '۱۰ دقیقه',
                        content: `
                            <h2>جمع‌بندی دوره</h2>
                            <p>در این دوره یاد گرفتیم که:</p>
                            <ul>
                                <li>اقتصاد چیست و چرا مهم است</li>
                                <li>عرضه و تقاضا چگونه قیمت‌ها را تعیین می‌کند</li>
                                <li>تورم و دفلاسیون چه تأثیری بر بازارها دارند</li>
                                <li>نرخ بهره چگونه بر بازارهای مالی تأثیر می‌گذارد</li>
                                <li>GDP، بیکاری و سیاست‌های اقتصادی چه هستند</li>
                            </ul>

                            <div class="tip-box">
                                ✅ <strong>آماده‌ای برای دوره بعدی؟</strong> در دوره‌ی «آشنایی با بازارهای مالی»، با انواع بازارها آشنا می‌شوی.
                            </div>
                        `
                    }
                ]
            }
        };

        let currentUser = null;
        let completedLessons = {};

        // ===== بارگذاری =====
        async function init() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            
            if (!session) {
                window.location.href = 'login.html';
                return;
            }

            currentUser = session.user;
            completedLessons = currentUser.user_metadata?.completed_lessons || {};

            const params = new URLSearchParams(window.location.search);
            const courseId = parseInt(params.get('course'));
            const lessonNum = parseInt(params.get('lesson'));

            if (!courseId || !lessonNum) {
                document.getElementById('content').innerHTML = `
                    <div class="loading">
                        ❌ درس مورد نظر پیدا نشد.
                        <br><br>
                        <a href="courses.html" style="color: #f59e0b;">⬅ بازگشت به دوره‌ها</a>
                    </div>
                `;
                return;
            }

            const course = coursesContent[courseId];
            if (!course) {
                document.getElementById('content').innerHTML = `
                    <div class="loading">
                        ❌ محتوای این دوره به زودی اضافه می‌شود.
                        <br><br>
                        <a href="course-detail.html?id=${courseId}" style="color: #f59e0b;">⬅ بازگشت به دوره</a>
                    </div>
                `;
                return;
            }

            const lesson = course.lessons[lessonNum - 1];
            if (!lesson) {
                document.getElementById('content').innerHTML = `
                    <div class="loading">❌ این درس وجود ندارد.</div>
                `;
                return;
            }

            renderLesson(courseId, lessonNum, course, lesson);
        }

        // ===== نمایش درس =====
        function renderLesson(courseId, lessonNum, course, lesson) {
            const totalLessons = course.lessons.length;
            const progressPercent = Math.round((lessonNum / totalLessons) * 100);
            const isCompleted = (completedLessons[courseId] || []).includes(lessonNum);

            const prevLesson = lessonNum > 1 ? lessonNum - 1 : null;
            const nextLesson = lessonNum < totalLessons ? lessonNum + 1 : null;

            document.getElementById('content').innerHTML = `
                <!-- هدر -->
                <div class="header">
                    <div class="header-info">
                        <div class="header-icon">${course.icon}</div>
                        <div class="header-title">
                            <h1>${course.title}</h1>
                            <p>درس ${lessonNum} از ${totalLessons}</p>
                        </div>
                    </div>
                    <a href="course-detail.html?id=${courseId}">⬅ بازگشت به دوره</a>
                </div>

                <!-- پیشرفت -->
                <div class="progress-section">
                    <div class="progress-info">
                        <span>پیشرفت دوره</span>
                        <span>${progressPercent}٪</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${progressPercent}%"></div>
                    </div>
                </div>

                <!-- محتوای درس -->
                <div class="lesson-card">
                    <div class="lesson-header">
                        <div class="lesson-number">📖 درس ${lessonNum}</div>
                        <h1 class="lesson-title">${lesson.title}</h1>
                        <div class="lesson-meta">
                            <span>⏱️ ${lesson.duration}</span>
                            ${isCompleted ? '<span style="color: #4ade80;">✅ تکمیل شده</span>' : ''}
                        </div>
                    </div>

                    <div class="lesson-content">
                        ${lesson.content}
                    </div>

                    <!-- تمرین -->
                    <div class="exercise-box">
                        <h3>✏️ تمرین این درس</h3>
                        <p>برای تثبیت مطالب این درس، موارد زیر را انجام دهید:</p>
                        <ul>
                            <li>مطالب درس را یک بار دیگر مرور کنید.</li>
                            <li>مفاهیم کلیدی را در دفترچه یادداشت خود بنویسید.</li>
                            <li>سعی کنید مفاهیم را با مثال‌های واقعی از بازار تطبیق دهید.</li>
                        </ul>
                    </div>
                </div>

                <!-- دکمه‌های ناوبری -->
                <div class="nav-buttons">
                    ${prevLesson ? `
                        <a href="lesson.html?course=${courseId}&lesson=${prevLesson}" class="btn btn-secondary">
                            ⬅ درس قبلی
                        </a>
                    ` : `
                        <button class="btn btn-secondary" disabled>⬅ درس قبلی</button>
                    `}

                    ${!isCompleted ? `
                        <button class="btn btn-success" onclick="markComplete(${courseId}, ${lessonNum})">
                            ✅ تکمیل این درس
                        </button>
                    ` : `
                        <button class="btn btn-success" disabled>✅ تکمیل شده</button>
                    `}

                    ${nextLesson ? `
                        <a href="lesson.html?course=${courseId}&lesson=${nextLesson}" class="btn btn-primary">
                            درس بعدی ➡
                        </a>
                    ` : `
                        <a href="course-detail.html?id=${courseId}" class="btn btn-primary">
                            🎉 پایان دوره
                        </a>
                    `}
                </div>
            `;
        }

        // ===== تکمیل درس =====
        async function markComplete(courseId, lessonNum) {
            try {
                const courseLessons = completedLessons[courseId] || [];
                if (!courseLessons.includes(lessonNum)) {
                    courseLessons.push(lessonNum);
                }
                completedLessons[courseId] = courseLessons;

                // بررسی تکمیل کل دوره
                const course = coursesContent[courseId];
                const totalLessons = course.lessons.length;
                const isCourseComplete = courseLessons.length >= totalLessons;

                // آپدیت user_metadata
                const updates = {
                    completed_lessons: completedLessons
                };

                if (isCourseComplete) {
                    const completedCourses = currentUser.user_metadata?.completed_courses || [];
                    const inProgressCourses = currentUser.user_metadata?.in_progress_courses || [];

                    if (!completedCourses.includes(courseId)) {
                        completedCourses.push(courseId);
                    }

                    updates.completed_courses = completedCourses;
                    updates.in_progress_courses = inProgressCourses.filter(id => id !== courseId);
                }

                const { error } = await supabaseClient.auth.updateUser({ data: updates });

                if (error) {
                    alert('❌ خطا در ذخیره: ' + error.message);
                    return;
                }

                // رفرش صفحه
                window.location.reload();

            } catch (e) {
                alert('❌ خطای شبکه');
            }
        }

        // ===== راه‌اندازی =====
        init();
    </script>

</body>
</html>
