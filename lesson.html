<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>درس | آکادمی شمعدون</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Tahoma, sans-serif;
            background-color: #0f172a;
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(245, 158, 11, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(59, 130, 246, 0.08) 0%, transparent 40%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 50px 50px, 50px 50px;
            background-attachment: fixed;
            min-height: 100vh;
            direction: rtl;
            padding: 20px 15px;
        }

        .container { max-width: 800px; margin: 0 auto; }

        /* ===== هدر ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header-info { display: flex; align-items: center; gap: 10px; }
        .header-icon {
            width: 40px; height: 40px; border-radius: 12px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
        }
        .header-title h1 { color: #f1f5f9; font-size: 15px; margin-bottom: 2px; }
        .header-title p { color: #94a3b8; font-size: 12px; }
        .header a {
            color: #94a3b8; text-decoration: none; font-size: 13px;
            padding: 8px 15px; border: 1px solid #334155;
            border-radius: 20px; background: rgba(30, 41, 59, 0.7);
            transition: 0.3s;
        }
        .header a:hover { background: #334155; color: #fff; }

        /* ===== پیشرفت ===== */
        .progress-section {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(15px);
            border-radius: 15px;
            padding: 15px 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .progress-info {
            display: flex; justify-content: space-between;
            margin-bottom: 8px; color: #94a3b8; font-size: 13px;
        }
        .progress-bar {
            width: 100%; height: 8px;
            background: rgba(15, 23, 42, 0.8);
            border-radius: 10px; overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #f59e0b, #d97706);
            border-radius: 10px; transition: width 0.4s;
        }

        /* ===== درس ===== */
        .lesson-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .lesson-header {
            text-align: center; padding-bottom: 20px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .lesson-number {
            color: #f59e0b; font-size: 13px;
            font-weight: bold; margin-bottom: 8px;
        }
        .lesson-title {
            color: #f1f5f9; font-size: 22px;
            margin-bottom: 10px; line-height: 1.4;
        }
        .lesson-meta {
            color: #94a3b8; font-size: 13px;
            display: flex; justify-content: center;
            gap: 15px; flex-wrap: wrap;
        }

        /* ===== محتوای درس ===== */
        .lesson-content {
            color: #cbd5e1; font-size: 15px; line-height: 2;
        }
        .lesson-content h2 {
            color: #f59e0b; font-size: 18px;
            margin-top: 25px; margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid rgba(245, 158, 11, 0.2);
        }
        .lesson-content h3 {
            color: #f1f5f9; font-size: 16px;
            margin-top: 20px; margin-bottom: 10px;
        }
        .lesson-content p { margin-bottom: 15px; }
        .lesson-content ul, .lesson-content ol {
            padding-right: 25px; margin-bottom: 15px;
        }
        .lesson-content li { margin-bottom: 8px; }
        .lesson-content strong { color: #f59e0b; }
        .lesson-content .highlight-box {
            background: rgba(245, 158, 11, 0.1);
            border-right: 4px solid #f59e0b;
            padding: 15px 20px; border-radius: 10px;
            margin: 15px 0; color: #f1f5f9;
        }
        .lesson-content .tip-box {
            background: rgba(59, 130, 246, 0.1);
            border-right: 4px solid #3b82f6;
            padding: 15px 20px; border-radius: 10px;
            margin: 15px 0; color: #cbd5e1;
        }
        .lesson-content .warning-box {
            background: rgba(239, 68, 68, 0.1);
            border-right: 4px solid #ef4444;
            padding: 15px 20px; border-radius: 10px;
            margin: 15px 0; color: #fecaca;
        }
        .lesson-content table {
            width: 100%; border-collapse: collapse;
            margin: 15px 0; font-size: 13px;
        }
        .lesson-content th, .lesson-content td {
            border: 1px solid #334155;
            padding: 10px; text-align: center;
        }
        .lesson-content th {
            background: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
        }
        .lesson-content td { color: #cbd5e1; }

        /* ===== تمرین ===== */
        .exercise-box {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 15px;
            padding: 20px; margin-top: 25px;
        }
        .exercise-box h3 {
            color: #4ade80; font-size: 16px;
            margin-bottom: 12px;
            display: flex; align-items: center; gap: 8px;
        }
        .exercise-box p, .exercise-box li {
            color: #cbd5e1; font-size: 14px; line-height: 1.8;
        }
        .exercise-box ul { padding-right: 20px; }

        /* ===== دکمه‌های ناوبری ===== */
        .nav-buttons {
            display: flex; gap: 10px;
            margin-top: 25px; flex-wrap: wrap;
        }
        .btn {
            flex: 1; min-width: 130px;
            padding: 14px 20px; border-radius: 12px;
            font-size: 14px; font-weight: bold;
            cursor: pointer; transition: all 0.3s;
            font-family: Tahoma, sans-serif;
            border: none; display: flex;
            align-items: center; justify-content: center;
            gap: 8px; text-decoration: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #0f172a;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(245, 158, 11, 0.4);
        }
        .btn-success {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #fff;
        }
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(34, 197, 94, 0.4);
        }
        .btn-secondary {
            background: rgba(15, 23, 42, 0.6);
            color: #f1f5f9;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-secondary:hover {
            background: rgba(15, 23, 42, 0.9);
            border-color: rgba(245, 158, 11, 0.3);
        }
        .btn:disabled {
            opacity: 0.4; cursor: not-allowed; transform: none;
        }

        .loading {
            text-align: center; padding: 50px 20px; color: #94a3b8;
        }

        @media (max-width: 600px) {
            .lesson-title { font-size: 18px; }
            .lesson-content { font-size: 14px; }
            .lesson-content h2 { font-size: 16px; }
            .nav-buttons { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="container" id="content">
        <div class="loading">⏳ در حال بارگذاری درس...</div>
    </div>

    <script>
        const SUPABASE_URL = 'https://jcwwilatvstjrohvhtss.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_R7tCe030dGeJ0IRWfcgxww_MgEfh95O';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let completedLessons = {};
        let courseData = null;
        let courseId = null;
        let lessonNum = null;

        // ===== بارگذاری =====
        async function init() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            
            if (!session) {
                window.location.href = 'login.html';
                return;
            }

            currentUser = session.user;
            completedLessons = currentUser.user_metadata?.completed_lessons || {};

            const params = new URLSearchParams(window.location.search);
            courseId = parseInt(params.get('course'));
            lessonNum = parseInt(params.get('lesson'));

            if (!courseId || !lessonNum) {
                showError('❌ درس مورد نظر پیدا نشد.');
                return;
            }

            // ===== خواندن فایل JSON =====
            try {
                const response = await fetch(`course-${courseId}.json`);
                
                if (!response.ok) {
                    showError('❌ محتوای این دوره به زودی اضافه می‌شود.');
                    return;
                }

                courseData = await response.json();
                const lesson = courseData.lessons[lessonNum - 1];

                if (!lesson) {
                    showError('❌ این درس وجود ندارد.');
                    return;
                }

                renderLesson(courseId, lessonNum, courseData, lesson);

            } catch (error) {
                console.error('خطا در خواندن فایل:', error);
                showError('❌ خطا در بارگذاری محتوای درس.');
            }
        }

        // ===== نمایش خطا =====
        function showError(message) {
            document.getElementById('content').innerHTML = `
                <div class="loading">
                    ${message}
                    <br><br>
                    <a href="courses.html" style="color: #f59e0b;">⬅ بازگشت به دوره‌ها</a>
                </div>
            `;
        }

        // ===== نمایش درس =====
        function renderLesson(courseId, lessonNum, course, lesson) {
            const totalLessons = course.lessons.length;
            const progressPercent = Math.round((lessonNum / totalLessons) * 100);
            const isCompleted = (completedLessons[courseId] || []).includes(lessonNum);

            const prevLesson = lessonNum > 1 ? lessonNum - 1 : null;
            const nextLesson = lessonNum < totalLessons ? lessonNum + 1 : null;

            document.getElementById('content').innerHTML = `
                <!-- هدر -->
                <div class="header">
                    <div class="header-info">
                        <div class="header-icon">${course.icon}</div>
                        <div class="header-title">
                            <h1>${course.title}</h1>
                            <p>درس ${lessonNum} از ${totalLessons}</p>
                        </div>
                    </div>
                    <a href="course-detail.html?id=${courseId}">⬅ بازگشت به دوره</a>
                </div>

                <!-- پیشرفت -->
                <div class="progress-section">
                    <div class="progress-info">
                        <span>پیشرفت دوره</span>
                        <span>${progressPercent}٪</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${progressPercent}%"></div>
                    </div>
                </div>

                <!-- محتوای درس -->
                <div class="lesson-card">
                    <div class="lesson-header">
                        <div class="lesson-number">📖 درس ${lessonNum}</div>
                        <h1 class="lesson-title">${lesson.title}</h1>
                        <div class="lesson-meta">
                            <span>⏱️ ${lesson.duration}</span>
                            ${isCompleted ? '<span style="color: #4ade80;">✅ تکمیل شده</span>' : ''}
                        </div>
                    </div>

                    <div class="lesson-content">
                        ${lesson.content}
                    </div>

                    <!-- تمرین -->
                    <div class="exercise-box">
                        <h3>✏️ تمرین این درس</h3>
                        <p>برای تثبیت مطالب این درس، موارد زیر را انجام دهید:</p>
                        <ul>
                            <li>مطالب درس را یک بار دیگر مرور کنید.</li>
                            <li>مفاهیم کلیدی را در دفترچه یادداشت خود بنویسید.</li>
                            <li>سعی کنید مفاهیم را با مثال‌های واقعی از بازار تطبیق دهید.</li>
                        </ul>
                    </div>
                </div>

                <!-- دکمه‌های ناوبری -->
                <div class="nav-buttons">
                    ${prevLesson ? `
                        <a href="lesson.html?course=${courseId}&lesson=${prevLesson}" class="btn btn-secondary">
                            ⬅ درس قبلی
                        </a>
                    ` : `
                        <button class="btn btn-secondary" disabled>⬅ درس قبلی</button>
                    `}

                    ${!isCompleted ? `
                        <button class="btn btn-success" onclick="markComplete(${courseId}, ${lessonNum})">
                            ✅ تکمیل این درس
                        </button>
                    ` : `
                        <button class="btn btn-success" disabled>✅ تکمیل شده</button>
                    `}

                    ${nextLesson ? `
                        <a href="lesson.html?course=${courseId}&lesson=${nextLesson}" class="btn btn-primary">
                            درس بعدی ➡
                        </a>
                    ` : `
                        <a href="course-detail.html?id=${courseId}" class="btn btn-primary">
                            🎉 پایان دوره
                        </a>
                    `}
                </div>
            `;
        }

        // ===== تکمیل درس =====
        async function markComplete(courseId, lessonNum) {
            try {
                const courseLessons = completedLessons[courseId] || [];
                if (!courseLessons.includes(lessonNum)) {
                    courseLessons.push(lessonNum);
                }
                completedLessons[courseId] = courseLessons;

                // بررسی تکمیل کل دوره
                const totalLessons = courseData.lessons.length;
                const isCourseComplete = courseLessons.length >= totalLessons;

                const updates = {
                    completed_lessons: completedLessons
                };

                if (isCourseComplete) {
                    const completedCourses = currentUser.user_metadata?.completed_courses || [];
                    const inProgressCourses = currentUser.user_metadata?.in_progress_courses || [];

                    if (!completedCourses.includes(courseId)) {
                        completedCourses.push(courseId);
                    }

                    updates.completed_courses = completedCourses;
                    updates.in_progress_courses = inProgressCourses.filter(id => id !== courseId);
                }

                const { error } = await supabaseClient.auth.updateUser({ data: updates });

                if (error) {
                    alert('❌ خطا در ذخیره: ' + error.message);
                    return;
                }

                // رفرش صفحه
                window.location.reload();

            } catch (e) {
                alert('❌ خطای شبکه');
            }
        }

        // ===== راه‌اندازی =====
        init();
    </script>

</body>
</html>
