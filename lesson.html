<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>درس | آکادمی شمعدون</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Tahoma, sans-serif;
            background-color: #0f172a;
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(245, 158, 11, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(59, 130, 246, 0.08) 0%, transparent 40%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 50px 50px, 50px 50px;
            background-attachment: fixed;
            min-height: 100vh;
            direction: rtl;
            padding: 20px 15px;
        }

        .container { max-width: 800px; margin: 0 auto; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header-info { display: flex; align-items: center; gap: 10px; }
        .header-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .header-title h1 { color: #f1f5f9; font-size: 15px; margin-bottom: 2px; }
        .header-title p { color: #94a3b8; font-size: 12px; }
        .header a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 13px;
            padding: 8px 15px;
            border: 1px solid #334155;
            border-radius: 20px;
            background: rgba(30, 41, 59, 0.7);
            transition: 0.3s;
        }
        .header a:hover { background: #334155; color: #fff; }

        .progress-section {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(15px);
            border-radius: 15px;
            padding: 15px 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            color: #94a3b8;
            font-size: 13px;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(15, 23, 42, 0.8);
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #f59e0b, #d97706);
            border-radius: 10px;
            transition: width 0.4s;
        }

        .lesson-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .lesson-header {
            text-align: center;
            padding-bottom: 20px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .lesson-number { color: #f59e0b; font-size: 13px; font-weight: bold; margin-bottom: 8px; }
        .lesson-title { color: #f1f5f9; font-size: 22px; margin-bottom: 10px; line-height: 1.4; }
        .lesson-meta {
            color: #94a3b8;
            font-size: 13px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        /* ===== محتوای درس ===== */
        .lesson-content { color: #cbd5e1; font-size: 15px; line-height: 2; }
        .lesson-content h1 { color: #f59e0b; font-size: 22px; margin-top: 25px; margin-bottom: 15px; padding-bottom: 8px; border-bottom: 2px solid rgba(245, 158, 11, 0.3); }
        .lesson-content h2 { color: #f59e0b; font-size: 18px; margin-top: 25px; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid rgba(245, 158, 11, 0.2); }
        .lesson-content h3 { color: #f1f5f9; font-size: 16px; margin-top: 20px; margin-bottom: 10px; }
        .lesson-content p { margin-bottom: 15px; }
        .lesson-content ul, .lesson-content ol { padding-right: 25px; margin-bottom: 15px; }
        .lesson-content li { margin-bottom: 8px; }
        .lesson-content strong { color: #f59e0b; }
        .lesson-content em { color: #cbd5e1; font-style: italic; }
        .lesson-content a { color: #60a5fa; text-decoration: underline; }
        .lesson-content img { max-width: 100%; height: auto; border-radius: 12px; margin: 15px 0; box-shadow: 0 8px 25px rgba(0,0,0,0.3); display: block; }
        .lesson-content blockquote {
            border-right: 4px solid #f59e0b;
            padding: 15px 20px;
            background: rgba(245, 158, 11, 0.08);
            border-radius: 10px;
            margin: 15px 0;
            color: #f1f5f9;
        }
        .lesson-content code {
            background: rgba(15, 23, 42, 0.8);
            color: #f59e0b;
            padding: 2px 8px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 13px;
        }
        .lesson-content pre {
            background: rgba(15, 23, 42, 0.9);
            padding: 15px;
            border-radius: 10px;
            overflow-x: auto;
            margin: 15px 0;
            border: 1px solid #334155;
        }
        .lesson-content pre code { background: none; padding: 0; }
        .lesson-content hr { border: none; border-top: 1px solid rgba(255,255,255,0.1); margin: 20px 0; }
        .lesson-content table { width: 100%; border-collapse: collapse; margin: 15px 0; font-size: 13px; }
        .lesson-content th, .lesson-content td { border: 1px solid #334155; padding: 10px; text-align: center; }
        .lesson-content th { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        .lesson-content td { color: #cbd5e1; }

        .exercise-box {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 15px;
            padding: 20px;
            margin-top: 25px;
        }
        .exercise-box h3 {
            color: #4ade80;
            font-size: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .exercise-box p, .exercise-box li { color: #cbd5e1; font-size: 14px; line-height: 1.8; }
        .exercise-box ul { padding-right: 20px; }

        .nav-buttons { display: flex; gap: 10px; margin-top: 25px; flex-wrap: wrap; }
        .btn {
            flex: 1;
            min-width: 130px;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-family: Tahoma, sans-serif;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
        }
        .btn-primary { background: linear-gradient(135deg, #f59e0b, #d97706); color: #0f172a; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(245, 158, 11, 0.4); }
        .btn-success { background: linear-gradient(135deg, #22c55e, #16a34a); color: #fff; }
        .btn-success:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(34, 197, 94, 0.4); }
        .btn-secondary { background: rgba(15, 23, 42, 0.6); color: #f1f5f9; border: 1px solid rgba(255,255,255,0.1); }
        .btn-secondary:hover { background: rgba(15, 23, 42, 0.9); border-color: rgba(245, 158, 11, 0.3); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        .loading { text-align: center; padding: 50px 20px; color: #94a3b8; }

        @media (max-width: 600px) {
            .lesson-title { font-size: 18px; }
            .lesson-content { font-size: 14px; }
            .lesson-content h2 { font-size: 16px; }
            .nav-buttons { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container" id="content">
        <div class="loading">⏳ در حال بارگذاری درس...</div>
    </div>

    <script>
        const SUPABASE_URL = 'https://jcwwilatvstjrohvhtss.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impjd3dpbGF0dnN0anJvaHZodHNzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3MDY4NTYsImV4cCI6MjEwNTI4Mjg1Nn0.eUC89RJy6-60nNGrSeYeDADzLxz-kWTGy4DbNGVi6MM';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let completedLessons = {};
        let courseData = null;
        let courseKey = null;   // برای ذخیره در user_metadata
        let lessonNum = null;
        let isDynamicCourse = false;

        // ===== بارگذاری =====
        async function init() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = 'login.html';
                return;
            }
            currentUser = session.user;
            completedLessons = currentUser.user_metadata?.completed_lessons || {};

            const params = new URLSearchParams(window.location.search);
            const courseParam = params.get('course');
            const type = params.get('type');
            lessonNum = parseInt(params.get('lesson'));

            if (!courseParam || !lessonNum) {
                showError('❌ درس مورد نظر پیدا نشد.');
                return;
            }

            // ===== تشخیص نوع دوره =====
            if (type === 'db' || courseParam.startsWith('db-')) {
                // دوره داینامیک
                const dbId = parseInt(courseParam.replace('db-', ''));
                await loadDynamicLesson(dbId, lessonNum);
            } else {
                // دوره ثابت
                const staticId = parseInt(courseParam);
                await loadStaticLesson(staticId, lessonNum);
            }
        }

        // ===== دوره ثابت (از JSON) =====
        async function loadStaticLesson(courseId, lessonNum) {
            try {
                const response = await fetch(`course-${courseId}.json`);
                if (!response.ok) {
                    showError('❌ محتوای این دوره به زودی اضافه می‌شود.');
                    return;
                }
                courseData = await response.json();
                const lesson = courseData.lessons[lessonNum - 1];

                if (!lesson) {
                    showError('❌ این درس وجود ندارد.');
                    return;
                }

                courseKey = courseId;
                isDynamicCourse = false;
                renderLesson(courseData, lesson, lessonNum);
            } catch (error) {
                console.error('خطا در خواندن فایل:', error);
                showError('❌ خطا در بارگذاری محتوای درس.');
            }
        }

        // ===== دوره داینامیک (از Supabase) =====
        async function loadDynamicLesson(dbId, lessonNum) {
            try {
                // لود اطلاعات دوره
                const { data: course, error: courseError } = await supabaseClient
                    .from('courses')
                    .select('*')
                    .eq('id', dbId)
                    .single();

                if (courseError || !course) {
                    showError('❌ دوره مورد نظر پیدا نشد.');
                    return;
                }

                // لود دروس
                const { data: lessons, error: lessonsError } = await supabaseClient
                    .from('lessons')
                    .select('*')
                    .eq('course_id', dbId)
                    .order('order_num', { ascending: true });

                if (lessonsError || !lessons || lessons.length === 0) {
                    showError('❌ هنوز درسی برای این دوره ثبت نشده است.');
                    return;
                }

                const lesson = lessons[lessonNum - 1];
                if (!lesson) {
                    showError('❌ این درس وجود ندارد.');
                    return;
                }

                // تبدیل به فرمت مورد نیاز
                courseData = {
                    title: course.title,
                    icon: course.icon || '📚',
                    lessons: lessons.map(l => ({
                        title: l.title,
                        duration: '—',
                        content: l.content || '',
                        video_url: l.video_url
                    }))
                };

                courseKey = dbId;  // برای ذخیره پیشرفت
                isDynamicCourse = true;
                renderLesson(courseData, {
                    title: lesson.title,
                    duration: '—',
                    content: lesson.content || 'محتوایی برای این درس ثبت نشده است.',
                    video_url: lesson.video_url,
                    image_url: lesson.image_url,
                    pdf_url: lesson.pdf_url,
                    word_url: lesson.word_url,
                    powerpoint_url: lesson.powerpoint_url,
                    notes_url: lesson.notes_url
               }, lessonNum);
            } catch (error) {
                console.error('خطا:', error);
                showError('❌ خطا در بارگذاری محتوای درس.');
            }
        }

        // ===== نمایش خطا =====
        function showError(message) {
            document.getElementById('content').innerHTML = `
                <div class="loading">
                    ${message}
                    <br><br>
                    <a href="courses.html" style="color: #f59e0b;">⬅ بازگشت به دوره‌ها</a>
                </div>
            `;
        }

        // ===== نمایش درس =====
        function renderLesson(course, lesson, lessonNum) {
            const totalLessons = course.lessons.length;
            const progressPercent = Math.round((lessonNum / totalLessons) * 100);
            const isCompleted = (completedLessons[courseKey] || []).includes(lessonNum);

            const prevLesson = lessonNum > 1 ? lessonNum - 1 : null;
            const nextLesson = lessonNum < totalLessons ? lessonNum + 1 : null;

            // ساخت لینک‌های دوره داینامیک
            const courseUrl = isDynamicCourse 
                ? `course-detail.html?id=${courseKey}&type=db`
                : `course-detail.html?id=${courseKey}`;
            
            const lessonUrlBase = isDynamicCourse
                ? `lesson.html?course=db-${courseKey}&lesson=`
                : `lesson.html?course=${courseKey}&lesson=`;

            // ویدیو
            const videoHTML = lesson.video_url ? `
                <div style="margin: 20px 0;">
                    <h3 style="color: #f59e0b; margin-bottom: 10px;">🎥 ویدیو آموزشی</h3>
                    <div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 15px;">
                        <iframe src="${lesson.video_url}" 
                                style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; border-radius: 15px;"
                               allowfullscreen></iframe>
                    </div>
                </div>
            ` : '';

            // تصویر
            const imageHTML = lesson.image_url ? `
                <div style="margin: 20px 0;">
                    <img src="${lesson.image_url}" alt="${lesson.title}" 
                         style="width: 100%; border-radius: 15px; box-shadow: 0 8px 25px rgba(0,0,0,0.3);">
                </div>
            ` : '';

            // فایل‌های پیوست
            const attachments = [];
            if (lesson.pdf_url) attachments.push({ icon: '📄', label: 'دانلود PDF', url: lesson.pdf_url, color: '#ef4444' });
            if (lesson.word_url) attachments.push({ icon: '📝', label: 'دانلود Word', url: lesson.word_url, color: '#3b82f6' });
            if (lesson.powerpoint_url) attachments.push({ icon: '📊', label: 'دانلود PowerPoint', url: lesson.powerpoint_url, color: '#f59e0b' });
            if (lesson.notes_url) attachments.push({ icon: '📚', label: 'دانلود جزوه', url: lesson.notes_url, color: '#22c55e' });

            const attachmentsHTML = attachments.length > 0 ? `
                <div style="margin: 20px 0; padding: 20px; background: rgba(15, 23, 42, 0.6); border-radius: 15px; border: 1px solid rgba(245, 158, 11, 0.3);">
                    <h3 style="color: #f59e0b; margin-bottom: 15px;">📎 فایل‌های آموزشی</h3>
                    <div style="display: flex; flex-direction: column; gap: 10px;">
                        ${attachments.map(a => `
                            <a href="${a.url}" target="_blank" download 
                               style="display: flex; align-items: center; gap: 12px; padding: 12px 15px; background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; text-decoration: none; color: #f1f5f9; transition: 0.3s;">
                                <span style="font-size: 20px;">${a.icon}</span>
                                <span style="flex: 1; font-size: 14px; font-weight: bold;">${a.label}</span>
                                <span style="color: ${a.color}; font-size: 18px;">⬇️</span>
                            </a>
                        `).join('')}
                    </div>
                </div>
            ` : '';

            document.getElementById('content').innerHTML = `
                <!-- هدر -->
                <div class="header">
                    <div class="header-info">
                        <div class="header-icon">${course.icon}</div>
                        <div class="header-title">
                            <h1>${escapeHtml(course.title)}</h1>
                            <p>درس ${lessonNum} از ${totalLessons}</p>
                        </div>
                    </div>
                    <a href="${courseUrl}">⬅ بازگشت به دوره</a>
                </div>

                <!-- پیشرفت -->
                <div class="progress-section">
                    <div class="progress-info">
                        <span>پیشرفت دوره</span>
                        <span>${progressPercent}٪</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${progressPercent}%"></div>
                    </div>
                </div>

                <!-- محتوای درس -->
                <div class="lesson-card">
                    <div class="lesson-header">
                        <div class="lesson-number">📖 درس ${lessonNum}</div>
                        <h1 class="lesson-title">${escapeHtml(lesson.title)}</h1>
                        <div class="lesson-meta">
                            <span>⏱️ ${lesson.duration}</span>
                            ${isCompleted ? '<span style="color: #4ade80;">✅ تکمیل شده</span>' : ''}
                        </div>
                    </div>

                    ${imageHTML}
                    ${videoHTML}

                    <div class="lesson-content">
                        ${lesson.content}
                    </div>

                   ${attachmentsHTML}

                    <!-- تمرین -->
                    <div class="exercise-box">
                        <h3>✏️ تمرین این درس</h3>
                        <p>برای تثبیت مطالب این درس، موارد زیر را انجام دهید:</p>
                        <ul>
                            <li>مطالب درس را یک بار دیگر مرور کنید.</li>
                            <li>مفاهیم کلیدی را در دفترچه یادداشت خود بنویسید.</li>
                            <li>سعی کنید مفاهیم را با مثال‌های واقعی از بازار تطبیق دهید.</li>
                        </ul>
                    </div>
                </div>

                <!-- دکمه‌های ناوبری -->
                <div class="nav-buttons">
                    ${prevLesson ? `
                        <a href="${lessonUrlBase}${prevLesson}" class="btn btn-secondary">
                            ⬅ درس قبلی
                        </a>
                    ` : `
                        <button class="btn btn-secondary" disabled>⬅ درس قبلی</button>
                    `}

                    ${!isCompleted ? `
                        <button class="btn btn-success" onclick="markComplete(${courseKey}, ${lessonNum})">
                            ✅ تکمیل این درس
                        </button>
                    ` : `
                        <button class="btn btn-success" disabled>✅ تکمیل شده</button>
                    `}

                    ${nextLesson ? `
                        <a href="${lessonUrlBase}${nextLesson}" class="btn btn-primary">
                            درس بعدی ➡
                        </a>
                    ` : `
                        <a href="${courseUrl}" class="btn btn-primary">
                            🎉 پایان دوره
                        </a>
                    `}
                </div>
            `;
        }

        // ===== تکمیل درس =====
        async function markComplete(courseKey, lessonNum) {
            try {
                const courseLessons = completedLessons[courseKey] || [];
                if (!courseLessons.includes(lessonNum)) {
                    courseLessons.push(lessonNum);
                }
                completedLessons[courseKey] = courseLessons;

                // بررسی تکمیل کل دوره
                const totalLessons = courseData.lessons.length;
                const isCourseComplete = courseLessons.length >= totalLessons;

                const updates = { completed_lessons: completedLessons };

                if (isCourseComplete) {
                    const completedCourses = currentUser.user_metadata?.completed_courses || [];
                    const inProgressCourses = currentUser.user_metadata?.in_progress_courses || [];

                    if (!completedCourses.includes(courseKey)) {
                        completedCourses.push(courseKey);
                    }

                    updates.completed_courses = completedCourses;
                    updates.in_progress_courses = inProgressCourses.filter(id => id !== courseKey);
                }

                const { error } = await supabaseClient.auth.updateUser({ data: updates });

                if (error) {
                    alert('❌ خطا در ذخیره: ' + error.message);
                    return;
                }

                window.location.reload();
            } catch (e) {
                alert('❌ خطای شبکه');
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        init();
    </script>
</body>
</html>
