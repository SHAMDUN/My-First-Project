<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آکادمی شمعدون | پنل تحلیلی بازار</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f59e0b">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="شمعدون">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Tahoma, sans-serif;
            background-color: #0f172a;
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(245, 158, 11, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(59, 130, 246, 0.1) 0%, transparent 40%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 50px 50px, 50px 50px;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            direction: rtl;
            padding: 20px;
        }

        .welcome-container {
            max-width: 480px;
            width: 100%;
            text-align: center;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .logo-container {
            width: 140px;
            height: 140px;
            margin: 0 auto 25px;
            border-radius: 50%;
            overflow: hidden;
            border: 5px solid #f59e0b;
            box-shadow: 0 0 40px rgba(245, 158, 11, 0.5);
            animation: float 3s ease-in-out infinite;
            background: #0f172a;
        }

        .logo-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            color: #f59e0b;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 15px;
            line-height: 1.4;
            text-shadow: 0 0 30px rgba(245, 158, 11, 0.4);
        }

        .subtitle {
            color: #cbd5e1;
            font-size: 17px;
            margin-bottom: 8px;
            line-height: 1.6;
        }

        .description {
            color: #94a3b8;
            font-size: 15px;
            margin-bottom: 40px;
            line-height: 1.8;
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 40px;
        }

        .btn {
            width: 100%;
            padding: 18px 24px;
            border-radius: 15px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: Tahoma, sans-serif;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #0f172a;
            box-shadow: 0 10px 30px rgba(245, 158, 11, 0.4);
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(245, 158, 11, 0.6);
        }

        .btn-secondary {
            background: transparent;
            color: #f59e0b;
            border: 2px solid #f59e0b;
        }
        .btn-secondary:hover {
            background: rgba(245, 158, 11, 0.1);
            transform: translateY(-3px);
        }

        .install-btn {
            display: none;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #fff;
            box-shadow: 0 10px 30px rgba(34, 197, 94, 0.4);
            margin-top: 15px;
        }
        .install-btn.show {
            display: flex;
        }
        .install-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(34, 197, 94, 0.6);
        }

        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .feature {
            text-align: center;
        }

        .feature-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .feature-text {
            color: #94a3b8;
            font-size: 12px;
            line-height: 1.5;
        }

        .footer {
            margin-top: 30px;
            color: #64748b;
            font-size: 13px;
        }

        @media (max-width: 400px) {
            h1 { font-size: 24px; }
            .logo-container { width: 110px; height: 110px; }
            .btn { padding: 15px 20px; font-size: 15px; }
            .features { grid-template-columns: 1fr; gap: 10px; }
        }
    </style>
</head>
<body>

    <div class="welcome-container">
        <div class="logo-container">
            <img src="519.png" alt="آکادمی شمعدون" class="logo-image">
        </div>

        <h1>🚀 به آکادمی شمعدون خوش آمدید</h1>
        <p class="subtitle">پنل تحلیلی و آموزشی بازارهای مالی</p>
        <p class="description">
            با ثبت‌نام رایگان، به تمام امکانات تحلیلی و آموزشی دسترسی پیدا می‌کنید.
        </p>

        <div class="buttons-container">
            <a href="login.html" class="btn btn-primary">
                ✨ شروع رایگان
            </a>
            <a href="login.html" class="btn btn-secondary">
                🔐 ورود به حساب
            </a>
            <button class="btn install-btn" id="installBtn" onclick="installPWA()">
                📱 نصب روی گوشی
            </button>
        </div>

        <div class="features">
            <div class="feature">
                <div class="feature-icon">📊</div>
                <div class="feature-text">چارت زنده<br>بازار</div>
            </div>
            <div class="feature">
                <div class="feature-icon">📚</div>
                <div class="feature-text">دوره‌های<br>آموزشی</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🤖</div>
                <div class="feature-text">دستیار<br>هوشمند</div>
            </div>
        </div>

        <p class="footer">© ۱۴۰۵ آکادمی شمعدون | تمامی حقوق محفوظ است</p>
    </div>

    <script>
        // ===== ثبت Service Worker =====
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/My-First-Project/service-worker.js')
                    .then(registration => {
                        console.log('✅ Service Worker registered:', registration.scope);
                    })
                    .catch(error => {
                        console.log('❌ Service Worker registration failed:', error);
                    });
            });
        }

        // ===== نصب PWA =====
        let deferredPrompt;

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            
            // نمایش دکمه نصب
            document.getElementById('installBtn').classList.add('show');
            console.log('✅ PWA قابل نصب است');
        });

        async function installPWA() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                console.log('نصب:', outcome);
                deferredPrompt = null;
                document.getElementById('installBtn').classList.remove('show');
            } else {
                alert('📱 برای نصب:\n\n1. روی منوی مرورگر (سه نقطه) کلیک کنید\n2. گزینه "Add to Home screen" یا "Install app" را انتخاب کنید');
            }
        }

        // ===== بررسی نصب‌شده =====
        window.addEventListener('appinstalled', () => {
            console.log('✅ اپلیکیشن نصب شد');
            document.getElementById('installBtn').classList.remove('show');
        });

        // ===== اگه قبلاً نصب شده، دکمه رو نشون نده =====
        if (window.matchMedia('(display-mode: standalone)').matches) {
            document.getElementById('installBtn')?.classList.remove('show');
        }
    </script>

</body>
</html>
