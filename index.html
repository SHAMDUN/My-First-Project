<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آکادمی شمعدون‌قسم</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            direction: rtl;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            margin: 0 auto 20px;
            overflow: hidden;
            border: 4px solid #667eea;
            background: #667eea;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        h1 {
            color: #333;
            margin: 10px 0;
        }
        p {
            color: #666;
            font-size: 18px;
        }
        .emoji {
            font-size: 30px;
        }
        .info-box {
            margin-top: 20px;
            background: #f0f0f0;
            padding: 15px;
            border-radius: 10px;
            font-size: 18px;
            color: #333;
        }
        .price-box {
            margin-top: 20px;
            background: #e8f4f8;
            padding: 15px;
            border-radius: 10px;
            direction: ltr;
        }
        .price-box h3 {
            color: #333;
            margin-bottom: 10px;
        }
        .price-item {
            padding: 5px 0;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- آواتار -->
        <div class="avatar">
           <img src="me.png" alt=”عکس مدیر آکادمی شمعدون” style=”width:100%; height:100%; object-fit:cover;”>
        </div>

        <h1>سلام! من مدیر آکادمی شمعدون هستم</h1>
        <p>👨‍💻 تازه‌کار برنامه‌نویسی وب</p>
        <p class="emoji">🚀 به دنیای کدنویسی خوش اومدی!</p>

        <!-- ساعت و تقویم شمسی -->
        <div class="info-box">
            <span id="date"></span> - <span id="time"></span>
        </div>

        <!-- قیمت‌های لحظه‌ای -->
        <div class="price-box">
            <h3>💰 قیمت‌های لحظه‌ای</h3>
            <div class="price-item" id="gold-price">🥇 طلا ۱۸ عیار: در حال دریافت...</div>
            <div class="price-item" id="silver-price">🥈 نقره: در حال دریافت...</div>
            <div class="price-item" id="usd-price">💵 دلار: در حال دریافت...</div>
        </div>
    </div>

    <script>
        // ===== ساعت و تقویم شمسی =====
        function updateDateTime() {
            const now = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            const persianDate = new Intl.DateTimeFormat('fa-IR', options).format(now);
            const timeString = now.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('date').textContent = persianDate;
            document.getElementById('time').textContent = timeString;
        }
        updateDateTime();
        setInterval(updateDateTime, 1000);

        // ===== قیمت‌های لحظه‌ای (نمونه) =====
        function fetchPrices() {
            // اینجا قیمت‌های نمونه رو نمایش میدیم
            document.getElementById('gold-price').textContent = '🥇 طلا ۱۸ عیار: ۴,۲۰۰,۰۰۰ تومان';
            document.getElementById('silver-price').textContent = '🥈 نقره: ۴۸,۰۰۰ تومان';
            document.getElementById('usd-price').textContent = '💵 دلار: ۵۸,۵۰۰ تومان';
        }
        fetchPrices();
        setInterval(fetchPrices, 60000); // هر ۱ دقیقه آپدیت میشه
    </script>

</body>
</html>
