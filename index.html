<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه اول من</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            direction: rtl;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
        }
        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: #667eea;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
            font-size: 60px;
            color: white;
        }
        h1 {
            color: #333;
            margin: 10px 0;
        }
        p {
            color: #666;
            font-size: 18px;
        }
        .emoji {
            font-size: 30px;
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- اینجا عکس یا آواتار شما -->
        <div class="avatar">
            <img src="me.png" alt="عکس من" style="width:100%;height: 100%;border-radius: 50%;object-fit: cover ;">
        </div>
        <h1>سلام! من مدیر آکادمی شمعدون هستم</h1>
        <p>👨‍💻 تازه‌کار برنامه‌نویسی وب</p>
        <p class="emoji">🚀 به دنیای کدنویسی خوش اومدی!</p>
    </div>
</body>
</html>
