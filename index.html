<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آکادمی شمعدون</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f7971e">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Tahoma, sans-serif;
            background-image: url(BG.png); /* ← اسم عکس خودت رو اینجا بنویس */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            min-height: 100vh;
            direction: rtl;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px 20px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 15px;
            overflow: hidden;
            border: 4px solid #f7971e;
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            color: #222;
            font-size: 22px;
            margin: 10px 0 5px;
        }
        p {
            color: #555;
            font-size: 16px;
            margin: 5px 0;
        }

        .info-box {
            background: #eef2f7;
            padding: 12px;
            border-radius: 15px;
            margin: 15px 0;
            font-size: 18px;
            font-weight: bold;
            color: #1a1a2e;
        }

        .price-box {
            background: #f8f9fc;
            padding: 15px;
            border-radius: 15px;
            margin-top: 15px;
        }
        .price-box h3 {
            color: #1a1a2e;
            font-size: 20px;
            margin-bottom: 10px;
            border-bottom: 2px solid #f7971e;
            display: inline-block;
            padding-bottom: 5px;
        }
        .price-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #ddd;
            font-size: 16px;
        }
        .price-item:last-child {
            border-bottom: none;
        }
        .gold { color: #D4AF37; }
        .silver { color: #A8A8A8; }
        .usd { color: #2E8B57; }
        .update-time {
            font-size: 12px;
            color: #888;
            margin-top: 10px;
        }
        /* ===== دکمه شناور اینستاگرام ===== */
.instagram-btn {
    position: fixed;
    bottom: 20px;          /* فاصله از پایین صفحه */
    left: 20px;            /* فاصله از چپ صفحه */
    z-index: 999;          /* برای اینکه بالای همه عناصر باشه */
    background: #E4405F;   /* رنگ قرمز اینستاگرام */
    color: #fff;
    padding: 12px 20px;
    border-radius: 50px;
    text-decoration: none;
    font-weight: bold;
    box-shadow: 0 4px 15px rgba(228, 64, 95, 0.4);
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 16px;
    transition: 0.3s;
}

.instagram-btn:hover {
    transform: scale(1.05);
    background: #c13584;
}
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar">
            <img src="me.png" alt="عکس مدیر آکادمی">
        </div>
<a href="https://www.instagram.com/shamdun.trade/" target="_blank" class="instagram-btn">
    📸 اینستاگرام
</a>
        <h1>سلام! من مدیر آکادمی شمعدون هستم</h1>
        <p>👨‍💻 تازه‌کار برنامه‌نویسی وب</p>
        <p>🚀 به دنیای کدنویسی خوش اومدی!</p>

        <div class="info-box">
            <span id="date"></span> - <span id="time"></span>
        </div>

        <div class="price-box">
            <h3>💰 قیمت‌های لحظه‌ای</h3>
            <div class="price-item gold">🥇 طلا ۱۸ عیار: ۴,۲۰۰,۰۰۰ تومان</div>
            <div class="price-item silver">🥈 نقره: ۴۸,۰۰۰ تومان</div>
            <div class="price-item usd">💵 دلار آمریکا: ۵۸,۵۰۰ تومان</div>
            <div class="update-time" id="update-time">آخرین بروزرسانی: --</div>
        </div>
    </div>

    <script>
        function updateDateTime() {
            const now = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            const persianDate = new Intl.DateTimeFormat('fa-IR', options).format(now);
            const timeString = now.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('date').textContent = persianDate;
            document.getElementById('time').textContent = timeString;
        }

        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('update-time').textContent = '✅ آخرین بروزرسانی: ' + timeString;
        }

        updateDateTime();
        updateTime();
        setInterval(updateDateTime, 1000);
        setInterval(updateTime, 1000);
    </script>

</body>
</html>
