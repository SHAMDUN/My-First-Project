<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آکادمی شمعدون</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Tahoma, sans-serif;
            background-image: url('BG.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            direction: rtl;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px 20px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 15px;
            overflow: hidden;
            border: 4px solid #f7971e;
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        h1 { color: #222; font-size: 22px; margin: 10px 0 5px; }
        p { color: #555; font-size: 16px; margin: 5px 0; }
        .info-box {
            background: #eef2f7;
            padding: 12px;
            border-radius: 15px;
            margin: 15px 0;
            font-size: 18px;
            font-weight: bold;
            color: #1a1a2e;
        }
        .chart-container {
            margin-top: 20px;
            background: #fff;
            border-radius: 15px;
            padding: 10px;
        }
        .chart-buttons {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .chart-buttons button {
            background: #f7971e;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .chart-buttons button.active { background: #1e293b; }
        .chart-buttons button:hover { opacity: 0.8; }
        
        /* کانتینر چارت TradingView */
        #tvchart {
            width: 100%;
            height: 400px;
        }
        .instagram-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 999;
            background: #E4405F;
            color: #fff;
            padding: 12px 20px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(228, 64, 95, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            transition: 0.3s;
        }
        .instagram-btn:hover { transform: scale(1.05); background: #c13584; }

        /* منوی همبرگری */
        .menu-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }
        .menu-icon {
            width: 45px;
            height: 45px;
            background: rgba(255,255,255,0.95);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: none;
        }
        .menu-icon span {
            display: block;
            width: 28px;
            height: 3px;
            background: #1e293b;
            border-radius: 5px;
        }
        .menu-dropdown {
            display: none;
            position: absolute;
            top: 55px;
            right: 0;
            background: rgba(255,255,255,0.98);
            padding: 12px 8px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            flex-direction: column;
            gap: 6px;
            min-width: 200px;
        }
        .menu-dropdown.show { display: flex; }
        .menu-dropdown a {
            color: #1e293b;
            text-decoration: none;
            padding: 12px 18px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 15px;
            border-bottom: 1px solid #f1f5f9;
        }
        .menu-dropdown a:last-child { border-bottom: none; }
        .menu-dropdown a:hover { background: #f1f5f9; color: #d97706; }
    </style>
</head>
<body>

    <!-- منوی همبرگری -->
    <div class="menu-container">
        <div class="menu-icon" onclick="toggleMenu(event)">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="menu-dropdown" id="menuDropdown">
            <a href="gold-analysis.html">📊 تحلیل روزانه</a>
            <a href="about.html">📘 درباره ما</a>
            <a href="courses.html">🎓 دوره‌های آموزشی</a>
            <a href="contact.html">📞 تماس با ما</a>
        </div>
    </div>

    <!-- کارت اصلی -->
    <div class="card">
        <div class="avatar">
            <img src="me.png" alt="عکس مدیر آکادمی">
        </div>

        <h1>سلام! من مدیر آکادمی شمعدون هستم</h1>
        <p>👨‍💻 تازه‌کار برنامه‌نویسی وب</p>
        <p>🚀 به دنیای کدنویسی خوش اومدی!</p>

        <div class="info-box">
            <span id="date"></span> - <span id="time"></span>
        </div>

        <!-- بخش چارت -->
        <div class="chart-container">
            <h3 style="color:#1a1a2e; margin-bottom:15px;">📈 چارت زنده بازار</h3>
            <div class="chart-buttons">
                <button class="active" onclick="switchChart('BINANCE:BTCUSDT', this)">بیت‌کوین</button>
                <button onclick="switchChart('BINANCE:ETHUSDT', this)">اتریوم</button>
                <button onclick="switchChart('BINANCE:SOLUSDT', this)">سولانا</button>
                <button onclick="switchChart('TVC:GOLD', this)">انس طلا</button>
            </div>
            <!-- این div جایگزین چارت می‌شود -->
            <div id="tvchart"></div>
        </div>
    </div>

    <!-- دکمه اینستاگرام -->
    <a href="https://www.instagram.com/shamdun.trade/" target="_blank" class="instagram-btn">
        📸 اینستاگرام
    </a>

    <script src="https://s3.tradingview.com/tv.js"></script>
    <script>
        // ===== منوی همبرگری =====
        function toggleMenu(event) {
            event.stopPropagation();
            document.getElementById('menuDropdown').classList.toggle('show');
        }
        window.onclick = function(event) {
            if (!event.target.closest('.menu-container')) {
                document.getElementById('menuDropdown').classList.remove('show');
            }
        }

        // ===== ساعت و تاریخ شمسی =====
        function updateDateTime() {
            const now = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            const persianDate = new Intl.DateTimeFormat('fa-IR', options).format(now);
            const timeString = now.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('date').textContent = persianDate;
            document.getElementById('time').textContent = timeString;
        }
        updateDateTime();
        setInterval(updateDateTime, 1000);

        // ===== چارت TradingView =====
        let tvWidget = null;
        
        function initChart(symbol) {
            // اگر چارت قبلی وجود دارد، آن را حذف کن
            if (tvWidget) {
                document.getElementById('tvchart').innerHTML = '';
            }

            // تنظیمات ویجت TradingView
            tvWidget = new TradingView.widget({
                "container_id": "tvchart",
                "autosize": true,
                "symbol": symbol,
                "interval": "60", // تایم‌فریم 1 ساعته
                "timezone": "Asia/Tehran",
                "theme": "light",
                "style": "1",
                "locale": "fa_IR",
                "toolbar_bg": "#f1f3f6",
                "enable_publishing": false,
                "hide_side_toolbar": false,
                "allow_symbol_change": true,
                "details": true,
                "withdateranges": true,
                "news": [],
                "studies": [
                    "RSI@tv-basicstudies"
                ]
            });
        }

        function switchChart(symbol, btn) {
            // تغییر دکمه فعال
            document.querySelectorAll('.chart-buttons button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            // مقداردهی مجدد چارت با نماد جدید
            initChart(symbol);
        }

        // بارگذاری چارت اولیه با بیت‌کوین
        initChart('BINANCE:BTCUSDT');
    </script>

</body>
</html>
