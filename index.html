<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آکادمی شمعدون</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f7971e">
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            direction: rtl;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            margin: 0 auto 20px;
            overflow: hidden;
            border: 4px solid #667eea;
            background: #667eea;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        h1 {
            color: #333;
            margin: 10px 0;
            font-size: 22px;
        }
        p {
            color: #666;
            font-size: 18px;
        }
        .emoji {
            font-size: 30px;
        }
        .info-box {
            margin-top: 20px;
            background: #f0f0f0;
            padding: 15px;
            border-radius: 10px;
            font-size: 18px;
            color: #333;
        }
        .price-box {
            margin-top: 20px;
            background: #e8f4f8;
            padding: 15px;
            border-radius: 10px;
        }
        .price-box h3 {
            color: #333;
            margin-bottom: 10px;
        }
        .price-item {
            padding: 8px 0;
            font-size: 17px;
            border-bottom: 1px solid #ddd;
        }
        .price-item:last-child {
            border-bottom: none;
        }
        .gold { color: #D4AF37; }
        .silver { color: #A8A8A8; }
        .usd { color: #2E8B57; }
        .update-time {
            font-size: 12px;
            color: #999;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar">
            <img src="me.png" alt="عکس مدیر آکادمی">
        </div>

        <h1>سلام! من مدیر آکادمی شمعدون هستم</h1>
        <p>👨‍💻 تازه‌کار برنامه‌نویسی وب</p>
        <p class="emoji">🚀 به دنیای کدنویسی خوش اومدی!</p>

        <div class="info-box">
            <span id="date"></span> - <span id="time"></span>
        </div>

        <div class="price-box">
            <h3>💰 قیمت‌های لحظه‌ای بازار</h3>
            <div class="price-item gold" id="gold-price">🥇 طلا ۱۸ عیار: در حال دریافت...</div>
            <div class="price-item silver" id="silver-price">🥈 نقره: در حال دریافت...</div>
            <div class="price-item usd" id="usd-price">💵 دلار آمریکا: در حال دریافت...</div>
            <div class="update-time" id="update-time">آخرین بروزرسانی: --</div>
        </div>
    </div>

    <script>
        // ===== کلید API خودت رو اینجا بذار =====
        const API_KEY = '67d3ffa63bc3418d8a2967aaf90da674';
'; // <-- کلید خودت رو جایگزین کن

        // ===== ساعت و تقویم شمسی =====
        function updateDateTime() {
            const now = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            const persianDate = new Intl.DateTimeFormat('fa-IR', options).format(now);
            const timeString = now.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('date').textContent = persianDate;
            document.getElementById('time').textContent = timeString;
        }
        updateDateTime();
        setInterval(updateDateTime, 1000);

        // ===== دریافت قیمت‌های واقعی از API =====
        async function fetchPrices() {
            try {
                const response = await fetch(`https://api.currencyfreaks.com/latest?apikey=${API_KEY}&symbols=USD,IRR`);
                const data = await response.json();

                // قیمت دلار (به تومان)
                const usdPrice = data.rates.USD;
                const irrPrice = data.rates.IRR;
                const usdToToman = Math.round(irrPrice / 10); // تبدیل ریال به تومان

                // قیمت طلا و نقره (از API دیگه - فعلاً نمونه)
                // برای قیمت واقعی طلا و نقره باید از API مخصوص استفاده کنی
                const goldPrice = 4200000 + Math.floor(Math.random() * 10000); // نمونه با تغییر تصادفی
                const silverPrice = 48000 + Math.floor(Math.random() * 100);

                document.getElementById('usd-price').textContent = `💵 دلار آمریکا: ${usdToToman.toLocaleString('fa-IR')} تومان`;
                document.getElementById('gold-price').textContent = `🥇 طلا ۱۸ عیار: ${goldPrice.toLocaleString('fa-IR')} تومان`;
                document.getElementById('silver-price').textContent = `🥈 نقره: ${silverPrice.toLocaleString('fa-IR')} تومان`;

                // زمان بروزرسانی
                const now = new Date();
                const timeString = now.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                document.getElementById('update-time').textContent = `آخرین بروزرسانی: ${timeString}`;

            } catch (error) {
                document.getElementById('usd-price').textContent = '❌ خطا در دریافت قیمت دلار';
                document.getElementById('gold-price').textContent = '❌ خطا در دریافت قیمت طلا';
                document.getElementById('silver-price').textContent = '❌ خطا در دریافت قیمت نقره';
                document.getElementById('update-time').textContent = '❌ خطا در بروزرسانی';
            }
        }

        // اجرای اولیه و آپدیت هر ۶۰ ثانیه
        fetchPrices();
        setInterval(fetchPrices, 60000);
    </script>

</body>
</html>
