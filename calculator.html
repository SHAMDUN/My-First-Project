<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>در حال انتقال... | آکادمی شمعدون</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
    <meta name="robots" content="noindex, nofollow">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background: #0a0a0f;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            direction: rtl;
            padding: 20px;
        }
        .box {
            text-align: center;
            max-width: 500px;
        }
        .icon {
            font-size: 64px;
            margin-bottom: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h1 {
            color: #d4af37;
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 12px;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.8;
            margin-bottom: 25px;
        }
        a {
            display: inline-block;
            background: linear-gradient(135deg, #d4af37, #a8862a);
            color: #0a0a0f;
            text-decoration: none;
            padding: 14px 30px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 15px;
            transition: 0.3s;
        }
        a:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.4);
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon">🔄</div>
        <h1>ماشین‌حساب بازنشسته شد</h1>
        <p>
            از این به بعد از <strong>همراه مالی هوشمند</strong> استفاده کن — نسخه‌ی جدید با امکانات بیشتر، تحلیل AI، و گزارش PDF/Excel.
        </p>
        <a href="calculator-v2.html">🚀 رفتن به همراه مالی هوشمند</a>
    </div>
    <script>
        // انتقال خودکار بعد از ۳ ثانیه
        setTimeout(() => {
            window.location.replace('calculator-v2.html');
        }, 3000);
    </script>
</body>
</html>
