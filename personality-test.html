    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#d4af37">

    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #14141c;
            --bg-card: #1a1a24;
            --gold: #d4af37;
            --gold-light: #f4d47c;
            --gold-dark: #a8862a;
            --green: #10b981;
            --red: #ef4444;
            --blue: #3b82f6;
            --white: #f8fafc;
            --gray: #94a3b8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background-color: var(--bg-primary);
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(212, 175, 55, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(59, 130, 246, 0.06) 0%, transparent 40%),
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 60px 60px, 60px 60px;
            background-attachment: fixed;
            color: var(--white);
            min-height: 100vh;
            direction: rtl;
            overflow-x: hidden;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .main-container {
            max-width: 700px;
            margin: 0 auto;
            padding: 100px 20px 40px;
        }
        .page-header {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeInUp 0.6s ease-out;
        }
        .page-header h1 {
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .page-header p { color: var(--gray); font-size: 14px; line-height: 1.7; }

        .card {
            background: linear-gradient(135deg, var(--bg-card), var(--bg-secondary));
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 20px;
            padding: 25px 22px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        /* ===== Progress ===== */
        .progress-container { margin-bottom: 25px; }
        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            color: var(--gray);
            font-size: 13px;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(10, 10, 15, 0.8);
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--gold), var(--gold-light));
            border-radius: 10px;
            transition: width 0.4s ease;
            width: 0%;
        }

        /* ===== Question ===== */
        .question-container { animation: fadeInUp 0.5s ease-out; }
        .question-number {
            color: var(--gold);
            font-size: 13px;
            font-weight: 800;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .question-number .dimension-tag {
            background: rgba(212, 175, 55, 0.15);
            color: var(--gold);
            padding: 3px 10px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 700;
        }
        .question-text {
            color: var(--white);
            font-size: 17px;
            font-weight: 800;
            margin-bottom: 20px;
            line-height: 1.7;
        }
        .question-hint {
            color: var(--gray);
            font-size: 12px;
            font-style: italic;
            margin-top: -10px;
            margin-bottom: 18px;
            padding-right: 8px;
            border-right: 2px solid rgba(212, 175, 55, 0.3);
            padding-right: 12px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option {
            background: rgba(10, 10, 15, 0.6);
            padding: 16px 18px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            border: 2px solid transparent;
            color: #cbd5e1;
            font-size: 14px;
            text-align: right;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 10px;
            line-height: 1.6;
        }
        .option:hover {
            background: rgba(10, 10, 15, 0.9);
            border-color: rgba(212, 175, 55, 0.3);
            transform: translateX(-3px);
        }
        .option.selected {
            background: rgba(212, 175, 55, 0.15);
            border-color: var(--gold);
            color: var(--white);
            font-weight: 700;
        }
        .option .checkbox {
            width: 20px; height: 20px;
            border: 2px solid #64748b;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 14px;
        }
        .option.selected .checkbox {
            background: var(--gold);
            border-color: var(--gold);
            color: var(--bg-primary);
        }

        /* ===== Buttons ===== */
        .buttons { display: flex; gap: 10px; margin-top: 20px; }
        .btn {
            flex: 1;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            border: none;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--bg-primary);
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.4);
        }
        .btn-secondary {
            background: rgba(10, 10, 15, 0.6);
            color: var(--white);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-secondary:hover { background: rgba(10, 10, 15, 0.9); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* ===== Result ===== */
        .result-container {
            text-align: center;
            animation: fadeInUp 0.6s ease-out;
        }
        .result-icon {
            font-size: 80px;
            margin-bottom: 15px;
            animation: float 3s ease-in-out infinite;
        }
        .result-title {
            color: var(--gold);
            font-size: 26px;
            font-weight: 900;
            margin-bottom: 10px;
        }
        .result-subtitle {
            color: #cbd5e1;
            font-size: 15px;
            margin-bottom: 20px;
            font-weight: 700;
        }
        .result-score-badge {
            display: inline-block;
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: var(--gold);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 800;
            margin-bottom: 20px;
        }
        .result-description {
            background: rgba(10, 10, 15, 0.6);
            padding: 18px;
            border-radius: 15px;
            color: #cbd5e1;
            font-size: 14px;
            line-height: 1.9;
            text-align: right;
            margin-bottom: 20px;
            border-right: 3px solid var(--gold);
        }

        /* ===== Portfolio ===== */
        .portfolio-section {
            background: rgba(10, 10, 15, 0.6);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }
        .portfolio-title {
            color: var(--white);
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 15px;
            text-align: right;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .portfolio-item {
            padding: 14px 0;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
        }
        .portfolio-item:last-child { border-bottom: none; }
        .portfolio-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .portfolio-label {
            color: #cbd5e1;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
        }
        .portfolio-percent {
            color: var(--gold);
            font-size: 17px;
            font-weight: 900;
        }
        .portfolio-detail {
            color: var(--gray);
            font-size: 12px;
            padding-right: 28px;
            line-height: 1.7;
        }
        .portfolio-bar {
            height: 6px;
            background: rgba(10, 10, 15, 0.8);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 8px;
        }
        .portfolio-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--gold), var(--gold-light));
            border-radius: 10px;
        }

        /* ===== Loading ===== */
        .loading {
            text-align: center;
            padding: 50px 20px;
            color: var(--gray);
        }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid rgba(212, 175, 55, 0.2);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        /* ===== Footer ===== */
        .footer {
            text-align: center;
            padding: 30px 20px;
            color: var(--gray);
            font-size: 12px;
            border-top: 1px solid rgba(212, 175, 55, 0.1);
            margin-top: 40px;
        }

        @media (max-width: 500px) {
            .main-container { padding: 90px 15px 30px; }
            .page-header h1 { font-size: 24px; }
            .question-text { font-size: 15px; }
            .option { font-size: 13px; padding: 14px; }
            .result-title { font-size: 22px; }
            .result-icon { font-size: 65px; }
        }
    </style>
</head>

            {

        // ==========================================
        // انواع شخصیت
        // ==========================================
        const personalities = {
            conservative: {

                range: [20, 40],
                desc: 'شما فردی محتاط و ریسک‌گریز هستید. اولویت اولتان حفظ سرمایه و جلوگیری از ضرر است. سبد شما ترکیبی از دارایی‌های کم‌ریسک و درآمد ثابت است که با آن می‌توانید با آرامش بخوابید و نگران نوسانات بازار نباشید. توصیه می‌کنیم روی صندوق‌های درآمد ثابت، طلا و ارز تمرکز کنید و از بازارهای پرنوسان مثل کریپتو دوری کنید.',
                portfolio: [
                    { label: '🏦 درآمد ثابت (صندوق‌های ETF)', percent: '۵۰٪', detail: 'صندوق‌های درآمد ثابت بورسی، سود روزشمار و نقدشوندگی بالا' },
                    { label: '🥇 طلا و نقره', percent: '۱۰٪', detail: '۸۰٪ طلا (لنگر) + ۲۰٪ نقره (پوشش تورم)' },
                    { label: '💵 ارز (دلار، یورو)', percent: '۲۵٪', detail: 'ذخیره ارزش در برابر تورم' },
                    { label: '📊 سهام کم‌ریسک', percent: '۱۵٪', detail: 'سهام شرکت‌های بزرگ و باسابقه بورس' }
                ]
            },
            balanced: {
                title: '⚖️ متعادل',
                icon: '⚖️',
                range: [41, 55],
                desc: 'شما فردی متعادل هستید. هم به دنبال رشد سرمایه هستید و هم از ریسک زیاد دوری می‌کنید. سبد شما ترکیبی از درآمد ثابت، فلزات، سهام و ارز است که تعادل خوبی بین ریسک و بازدهی ایجاد می‌کند. این رویکرد برای اکثر سرمایه‌گذاران مناسب‌ترین گزینه است.',
                portfolio: [
                    { label: '🏦 درآمد ثابت (صندوق‌های ETF)', percent: '۳۰٪', detail: 'پشتوانه سبد و تأمین نقدشوندگی' },
                    { label: '🥇 طلا و نقره', percent: '۲۰٪', detail: '۷۰٪ طلا (لنگر) + ۳۰٪ نقره (تنوع صنعتی)' },
                    { label: '📊 سهام بورس', percent: '۳۰٪', detail: 'سهام شرکت‌های بزرگ و متوسط بورس' },
                    { label: '💵 ارز (دلار، یورو)', percent: '۲۰٪', detail: 'دلار و یورو برای حفظ ارزش' }
                ]
            },
            aggressive: {
                title: '🚀 جسور',
                icon: '🚀',
                range: [56, 75],
                desc: 'شما فردی جسور و ریسک‌پذیر هستید. به دنبال بازدهی بالا هستید و نوسانات بازار شما را نمی‌ترساند. سبد شما وزن بیشتری روی سهام، فلزات و بخشی از کریپتو دارد. توجه داشته باشید که در دوره‌های ریزش بازار، ممکن است افت‌های قابل توجهی تجربه کنید ولی در بلندمدت پتانسیل بازدهی بالاتری دارید.',
                portfolio: [
                    { label: '🏦 درآمد ثابت (صندوق‌های ETF)', percent: '۱۵٪', detail: 'حداقل نقدشوندگی و پشتوانه' },
                    { label: '🥇 طلا و نقره', percent: '۲۵٪', detail: '۶۰٪ طلا (لنگر) + ۴۰٪ نقره (بازدهی بالاتر)' },
                    { label: '📊 سهام بورس', percent: '۳۵٪', detail: 'سهام رشد و شرکت‌های متوسط' },
                    { label: '₿ ارز دیجیتال', percent: '۱۰٪', detail: 'بیت‌کوین و اتریوم برای بازدهی بالا' },
                    { label: '💵 ارز (دلار، یورو)', percent: '۱۵٪', detail: 'حفظ ارزش در برابر تورم' }
                ]
            },
            professional: {
                title: '🎯 حرفه‌ای',
                icon: '🎯',
                range: [76, 100],
                desc: 'شما فردی حرفه‌ای و بسیار ریسک‌پذیر هستید. دانش و تجربه کافی برای مدیریت پرتفوی پرریسک دارید و به دنبال حداکثر بازدهی هستید. سبد شما ترکیبی از سهام رشد، ارز دیجیتال و فلزات گرانبهاست. توصیه می‌کنیم حتماً مدیریت ریسک و حد ضرر را جدی بگیرید.',
                portfolio: [
                    { label: '🏦 درآمد ثابت (صندوق‌های ETF)', percent: '۱۰٪', detail: 'حداقل برای نقدشوندگی' },
                    { label: '🥇 طلا و نقره', percent: '۲۰٪', detail: '۵۰٪ طلا (لنگر) + ۵۰٪ نقره (حداکثر وزن فلزات)' },
                    { label: '📊 سهام بورس', percent: '۳۵٪', detail: 'سهام رشد و شرکت‌های پرنوسان' },
                    { label: '₿ ارز دیجیتال', percent: '۲۵٪', detail: 'بیت‌کوین، اتریوم و آلت‌کوین‌های منتخب' },
                    { label: '💵 ارز (دلار، یورو)', percent: '۱۰٪', detail: 'حفظ ارزش در برابر تورم' }
                ]
            }
        };

        let currentQuestion = 0;
        let answers = [];
        let selectedOptions = [];

        // ==========================================
        // Init
        // ==========================================
        async function init() {
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (!session) {
                    window.location.href = 'login.html';
                    return;
                }

                const savedResult = session.user.user_metadata?.personality_result;
                if (savedResult && personalities[savedResult]) {
                    showPreviousResult(savedResult);
                } else {
                    renderQuestion();
                }
            } catch (e) {
                console.log('Init error:', e);
                renderQuestion();
            }
        }

        function showPreviousResult(resultKey) {
            const p = personalities[resultKey];
            if (!p) { renderQuestion(); return; }

            document.getElementById('content').innerHTML = `
                <div class="result-container">
                    <div class="result-icon">${p.icon}</div>
                    <h2 class="result-title">شخصیت مالی شما: ${p.title}</h2>
                    <p class="result-subtitle">نتیجه‌ی تست قبلی شما</p>
                    <div class="result-description">${p.desc}</div>
                    ${renderPortfolio(p.portfolio)}
                    <button class="btn btn-primary" onclick="resetTest()" style="width:100%;">
                        🔄 انجام مجدد تست
                    </button>
                </div>
            `;
        }

        function renderPortfolio(portfolio) {
            return `
                <div class="portfolio-section">
                    <div class="portfolio-title">💼 سبد پیشنهادی برای شما:</div>
                    ${portfolio.map(item => `
                        <div class="portfolio-item">
                            <div class="portfolio-header">
                                <span class="portfolio-label">${item.label}</span>
                                <span class="portfolio-percent">${item.percent}</span>
                            </div>
                            <div class="portfolio-detail">${item.detail}</div>
                            <div class="portfolio-bar">
                                <div class="portfolio-bar-fill" style="width: ${item.percent}"></div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function resetTest() {
            currentQuestion = 0;
            answers = [];
            selectedOptions = [];
            renderQuestion();
        }

        function renderQuestion() {
            const q = questions[currentQuestion];
            const progress = (currentQuestion / questions.length) * 100;
            const prevAnswer = answers[currentQuestion];

            if (q.multi && Array.isArray(prevAnswer)) {
                selectedOptions = [...prevAnswer];
            } else if (!q.multi && prevAnswer !== undefined) {
                selectedOptions = [prevAnswer];
            } else {
                selectedOptions = [];
            }

            document.getElementById('content').innerHTML = `
                <div class="progress-container">
                    <div class="progress-info">
                        <span>سوال ${toFa(currentQuestion + 1)} از ${toFa(questions.length)}</span>
                        <span>${toFa(Math.round(progress))}٪</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${progress}%"></div>
                    </div>
                </div>

                <div class="question-container">
                    <div class="question-number">
                        📝 سوال ${toFa(currentQuestion + 1)}
                        <span class="dimension-tag">${q.dimension}</span>
                        ${q.multi ? '<span class="dimension-tag">چند گزینه</span>' : ''}
                    </div>
                    <div class="question-text">${q.q}</div>
                    ${q.hint ? `<div class="question-hint">💡 ${q.hint}</div>` : ''}
                    <div class="options">
                        ${q.options.map((opt, i) => `
                            <div class="option ${selectedOptions.includes(i) ? 'selected' : ''}" onclick="selectOption(${i})">
                                <div class="checkbox">${selectedOptions.includes(i) ? '✓' : ''}</div>
                                <span>${opt.text}</span>
                            </div>
                        `).join('')}
                    </div>
                    <div class="buttons">
                        ${currentQuestion > 0 ? `
                            <button class="btn btn-secondary" onclick="prevQuestion()">⬅ قبلی</button>
                        ` : ''}
                        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" ${selectedOptions.length === 0 ? 'disabled' : ''}>
                            ${currentQuestion === questions.length - 1 ? '🎯 مشاهده نتیجه' : 'بعدی ➡'}
                        </button>
                    </div>
                </div>
            `;
        }

        function selectOption(index) {
            const q = questions[currentQuestion];
            if (q.multi) {
                if (selectedOptions.includes(index)) {
                    selectedOptions = selectedOptions.filter(i => i !== index);
                } else {
                    selectedOptions.push(index);
                }
            } else {
                selectedOptions = [index];
            }

            document.querySelectorAll('.option').forEach((el, i) => {
                if (selectedOptions.includes(i)) {
                    el.classList.add('selected');
                    el.querySelector('.checkbox').textContent = '✓';
                } else {
                    el.classList.remove('selected');
                    el.querySelector('.checkbox').textContent = '';
                }
            });

            document.getElementById('nextBtn').disabled = selectedOptions.length === 0;
        }

        function nextQuestion() {
            if (selectedOptions.length === 0) return;
            const q = questions[currentQuestion];

            if (q.multi) {
                answers[currentQuestion] = [...selectedOptions];
            } else {
                answers[currentQuestion] = selectedOptions[0];
            }

            if (currentQuestion === questions.length - 1) {
                showResult();
            } else {
                currentQuestion++;
                renderQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                const q = questions[currentQuestion];
                if (q.multi) {
                    answers[currentQuestion] = [...selectedOptions];
                } else {
                    answers[currentQuestion] = selectedOptions[0];
                }
                currentQuestion--;
                renderQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        async function showResult() {
            let totalScore = 0;
            let maxScore = 0;

            answers.forEach((ans, idx) => {
                const q = questions[idx];
                if (q.multi && Array.isArray(ans)) {
                    const avgScore = ans.reduce((sum, i) => sum + q.options[i].score, 0) / ans.length;
                    totalScore += avgScore;
                    maxScore += 4;
                } else {
                    totalScore += q.options[ans].score;
                    maxScore += 4;
                }
            });

            const normalizedScore = Math.round((totalScore / maxScore) * 100);

            let resultKey = 'conservative';
            for (const [key, p] of Object.entries(personalities)) {
                if (normalizedScore >= p.range[0] && normalizedScore <= p.range[1]) {
                    resultKey = key;
                    break;
                }
            }

            const p = personalities[resultKey];

            try {
                await supabaseClient.auth.updateUser({
                    data: {
                        personality_result: resultKey,
                        personality_score: normalizedScore,
                        personality_date: new Date().toISOString()
                    }
                });
            } catch (e) {
                console.log('خطا در ذخیره نتیجه');
            }

            document.getElementById('content').innerHTML = `
                <div class="result-container">
                    <div class="result-icon">${p.icon}</div>
                    <h2 class="result-title">شخصیت مالی شما: ${p.title}</h2>
                    <div class="result-score-badge">🎯 امتیاز شما: ${toFa(normalizedScore)} از ۱۰۰</div>
                    <div class="result-description">${p.desc}</div>
                    ${renderPortfolio(p.portfolio)}
                    <div style="display:flex; gap:10px; margin-top:20px;">
                        <button class="btn btn-primary" onclick="resetTest()" style="flex:1;">
                            🔄 انجام مجدد
                        </button>
                        <a href="dashboard.html" class="btn btn-secondary" style="flex:1;">
                            🏠 بازگشت
                        </a>
                    </div>
                </div>
            `;

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toFa(num) {
            const persianDigits = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
            return String(num).replace(/\d/g, d => persianDigits[d]);
        }

        init();
    </script>
