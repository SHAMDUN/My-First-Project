<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اخبار اقتصادی | آکادمی شمعدون</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#d4af37">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #14141c;
            --bg-card: #1a1a24;
            --gold: #d4af37;
            --gold-light: #f4d47c;
            --gold-dark: #a8862a;
            --blue: #3b82f6;
            --green: #10b981;
            --red: #ef4444;
            --white: #f8fafc;
            --gray: #94a3b8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background-color: var(--bg-primary);
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(212, 175, 55, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(59, 130, 246, 0.06) 0%, transparent 40%),
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 60px 60px, 60px 60px;
            background-attachment: fixed;
            color: var(--white);
            min-height: 100vh;
            direction: rtl;
            overflow-x: hidden;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .sn-navbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: rgba(10, 10, 15, 0.92);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(212, 175, 55, 0.15);
            z-index: 9998;
            padding: 12px 0;
        }
        .sn-navbar-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }
        .sn-hamburger {
            width: 42px; height: 42px;
            border-radius: 12px;
            background: rgba(212, 175, 55, 0.08);
            border: 1px solid rgba(212, 175, 55, 0.25);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            padding: 0;
        }
        .sn-hamburger:hover { background: rgba(212, 175, 55, 0.2); }
        .sn-hamburger span {
            display: block;
            width: 18px; height: 2px;
            background: var(--gold);
            border-radius: 2px;
        }
        .sn-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            flex: 1;
            justify-content: center;
        }
        .sn-brand-logo {
            width: 38px; height: 38px;
            border-radius: 50%;
            border: 2px solid var(--gold);
            object-fit: cover;
        }
        .sn-brand-text {
            color: var(--gold);
            font-size: 17px;
            font-weight: 800;
        }
        .sn-user-area {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 42px;
            justify-content: flex-end;
        }
        .sn-user-avatar {
            width: 42px; height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--bg-primary);
            font-weight: 900;
            font-size: 15px;
            border: 2px solid var(--gold);
            text-decoration: none;
        }
        .sn-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
        }
        .sn-overlay.show { opacity: 1; visibility: visible; }
        .sn-sidebar {
            position: fixed;
            top: 0;
            right: -320px;
            width: 300px;
            height: 100vh;
            background: linear-gradient(180deg, #14141c, #0a0a0f);
            border-left: 1px solid rgba(212, 175, 55, 0.2);
            z-index: 10000;
            transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            box-shadow: -10px 0 40px rgba(0, 0, 0, 0.5);
        }
        .sn-sidebar.show { right: 0; }
        .sn-sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.15);
            position: sticky;
            top: 0;
            background: #14141c;
            z-index: 2;
        }
        .sn-sidebar-header .sn-brand { justify-content: flex-start; }
        .sn-close {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            width: 34px; height: 34px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-family: inherit;
        }
        .sn-sidebar-content { padding: 15px; }
        .sn-menu-section { display: flex; flex-direction: column; gap: 4px; }
        .sn-menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 12px;
            text-decoration: none;
            color: #cbd5e1;
            font-size: 14px;
            font-weight: 600;
            transition: 0.25s;
            border: 1px solid transparent;
        }
        .sn-menu-item:hover {
            background: rgba(212, 175, 55, 0.08);
            color: var(--gold);
            border-color: rgba(212, 175, 55, 0.2);
            transform: translateX(-4px);
        }
        .sn-menu-item.active {
            background: rgba(212, 175, 55, 0.15);
            color: var(--gold);
            border-color: rgba(212, 175, 55, 0.4);
        }
        .sn-menu-icon { font-size: 20px; width: 26px; text-align: center; }
        .sn-menu-label { flex: 1; }
        .sn-menu-divider {
            height: 1px;
            background: rgba(212, 175, 55, 0.15);
            margin: 15px 0;
        }
        .sn-logout { color: #f87171 !important; }

        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 100px 20px 40px;
        }
        .page-header {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeInUp 0.6s ease-out;
        }
        .page-header h1 {
            font-size: 36px;
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .page-header p { color: var(--gray); font-size: 14px; }

        .news-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 25px;
            overflow-x: auto;
            padding-bottom: 8px;
            scrollbar-width: thin;
        }
        .news-tab {
            padding: 12px 20px;
            background: rgba(20, 20, 28, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: var(--gray);
            font-size: 13px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: 0.3s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .news-tab:hover {
            color: var(--gold);
            border-color: rgba(212, 175, 55, 0.4);
        }
        .news-tab.active {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--bg-primary);
            border-color: var(--gold);
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.3);
        }

        .news-section { display: none; }
        .news-section.active { display: block; animation: fadeInUp 0.4s ease-out; }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .news-card {
            background: linear-gradient(135deg, var(--bg-card), var(--bg-secondary));
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 18px;
            overflow: hidden;
            transition: 0.3s;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }
        .news-card:hover {
            transform: translateY(-5px);
            border-color: rgba(212, 175, 55, 0.4);
            box-shadow: 0 15px 40px rgba(212, 175, 55, 0.15);
        }

        .news-image {
            width: 100%;
            height: 180px;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.15), rgba(20, 20, 28, 0.9));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            overflow: hidden;
        }
        .news-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .news-content {
            padding: 18px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .news-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 11px;
            color: var(--gray);
            flex-wrap: wrap;
        }
        .news-meta .source {
            padding: 3px 10px;
            border-radius: 10px;
            font-weight: 700;
        }
        .news-meta .source.eghtesadonline {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
        }
        .news-meta .source.donya {
            background: rgba(212, 175, 55, 0.15);
            color: var(--gold);
        }
        .news-meta .source.shana {
            background: rgba(16, 185, 129, 0.15);
            color: #4ade80;
        }
        .news-meta .date {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .news-title {
            color: var(--white);
            font-size: 15px;
            font-weight: 800;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .news-desc {
            color: var(--gray);
            font-size: 13px;
            line-height: 1.7;
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .news-footer {
            margin-top: 15px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }
        .news-category {
            color: var(--gold);
            font-weight: 700;
        }
        .news-read-more {
            color: var(--gold);
            font-weight: 700;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--gray);
            grid-column: 1 / -1;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(212, 175, 55, 0.2);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        .dict-section { display: none; }
        .dict-section.active { display: block; animation: fadeInUp 0.4s ease-out; }

        .dict-categories {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 8px;
        }
        .dict-cat-btn {
            padding: 10px 18px;
            background: rgba(20, 20, 28, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            color: var(--gray);
            font-size: 13px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: 0.3s;
            white-space: nowrap;
        }
        .dict-cat-btn:hover { color: var(--gold); border-color: rgba(212, 175, 55, 0.4); }
        .dict-cat-btn.active {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--bg-primary);
            border-color: var(--gold);
        }

        .dict-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
        }

        .dict-card {
            background: linear-gradient(135deg, var(--bg-card), var(--bg-secondary));
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-right: 4px solid var(--gold);
            border-radius: 15px;
            padding: 18px;
            transition: 0.3s;
        }
        .dict-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.15);
        }
        .dict-term {
            color: var(--gold);
            font-size: 15px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .dict-def {
            color: #cbd5e1;
            font-size: 13px;
            line-height: 1.8;
        }

        .footer {
            text-align: center;
            padding: 30px 20px;
            color: var(--gray);
            font-size: 12px;
            border-top: 1px solid rgba(212, 175, 55, 0.1);
            margin-top: 40px;
        }

        @media (max-width: 600px) {
            .main-container { padding: 90px 15px 30px; }
            .page-header h1 { font-size: 26px; }
            .news-grid { grid-template-columns: 1fr; }
            .dict-grid { grid-template-columns: 1fr; }
            .sn-sidebar { width: 280px; right: -300px; }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="sn-navbar">
        <div class="sn-navbar-container">
            <button class="sn-hamburger" onclick="toggleSidebar()">
                <span></span>
                <span></span>

            </button>
            <a href="index.html" class="sn-brand">

        <!-- Tabs -->

            <div class="news-grid" id="grid-donya">

            <div class="news-grid" id="grid-shana">

                </div>
            </div>

        <!-- Dictionary Section -->
        <section id="section-dict" class="dict-section">

                <button class="dict-cat-btn active" onclick="filterDict('all', this)">همه</button>
                <button class="dict-cat-btn" onclick="filterDict('بورس', this)">بورس</button>

    <script>
        // ====== Supabase Init ======
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        let supabaseClient = null;
        if (window.supabase) {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        // ====== Sidebar ======
        function toggleSidebar() {
            document.getElementById('snSidebar').classList.toggle('show');
            document.getElementById('snOverlay').classList.toggle('show');
        }

        // ====== Auth Check ======
        async function checkAuth() {
            if (!supabaseClient) return;
            const { data: { session } } = await supabaseClient.auth.getSession();
            const userArea = document.getElementById('userArea');
            if (session && session.user) {
                const email = session.user.email || '';
                const initial = email.charAt(0).toUpperCase() || '👤';
                userArea.innerHTML = `<a href="profile.html" class="sn-user-avatar" title="${email}">${initial}</a>`;
            } else {
                userArea.innerHTML = `<a href="login.html" class="sn-user-avatar">؟</a>`;
            }
        }

        async function logout() {
            if (supabaseClient) await supabaseClient.auth.signOut();
            window.location.href = 'login.html';
        }

        // ====== Tabs ======
        function switchTab(tab, btn) {
            document.querySelectorAll('.news-tab').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            document.querySelectorAll('.news-section, .dict-section').forEach(s => s.classList.remove('active'));

            if (tab === 'dict') {
                document.getElementById('section-dict').classList.add('active');
                if (!document.getElementById('dictGrid').hasChildNodes()) loadDictionary();
            } else {
                const section = document.getElementById('section-' + tab);
                if (section) section.classList.add('active');
                if (tab !== 'all') loadNews(tab);
                else loadAllNews();
            }
        }

        // ====== News Loader ======
        const loadedSources = new Set();

        function sourceClass(src) {
            if (src.includes('eghtesad')) return 'eghtesadonline';
            if (src.includes('donya')) return 'donya';
            if (src.includes('shana')) return 'shana';
            return '';
        }

        function formatDate(str) {
            if (!str) return '';
            try {
                const d = new Date(str);
                return d.toLocaleDateString('fa-IR', { year: 'numeric', month: 'short', day: 'numeric' });
            } catch { return ''; }
        }

        function renderNews(items, gridId) {
            const grid = document.getElementById(gridId);
            if (!items || items.length === 0) {
                grid.innerHTML = `<div class="loading"><p>📭 خبری یافت نشد</p></div>`;
                return;
            }
            grid.innerHTML = items.map(n => `
                <a class="news-card" href="${n.link || '#'}" target="_blank" rel="noopener">
                    <div class="news-image">
                        ${n.image ? `<img src="${n.image}" alt="" onerror="this.parentElement.innerHTML='📰'">` : '📰'}
                    </div>
                    <div class="news-content">
                        <div class="news-meta">
                            <span class="source ${sourceClass(n.source || '')}">${n.source || 'خبر'}</span>
                            <span class="date">📅 ${formatDate(n.published_at || n.date)}</span>
                        </div>
                        <h3 class="news-title">${n.title || ''}</h3>
                        <p class="news-desc">${n.description || n.summary || ''}</p>
                        <div class="news-footer">
                            <span class="news-category">${n.category || 'اقتصادی'}</span>
                            <span class="news-read-more">ادامه ←</span>
                        </div>
                    </div>
                </a>
            `).join('');
        }

        async function loadNews(source) {
            const gridId = 'grid-' + source;
            const grid = document.getElementById(gridId);
            if (!grid || loadedSources.has(source)) return;
            grid.innerHTML = `<div class="loading"><div class="spinner"></div><p>در حال بارگذاری...</p></div>`;

            try {
                const res = await fetch(`/api/news?source=${source}`);
                const data = await res.json();
                renderNews(data.items || data, gridId);
                loadedSources.add(source);
            } catch (e) {
                grid.innerHTML = `<div class="loading"><p>⚠️ خطا در دریافت اخبار</p></div>`;
            }
        }

        async function loadAllNews() {
            const grid = document.getElementById('grid-all');
            grid.innerHTML = `<div class="loading"><div class="spinner"></div><p>در حال بارگذاری...</p></div>`;
            try {
                const res = await fetch('/api/news');
                const data = await res.json();
                renderNews(data.items || data, 'grid-all');
            } catch (e) {
                grid.innerHTML = `<div class="loading"><p>⚠️ خطا در دریافت اخبار</p></div>`;
            }
        }

        // ====== Dictionary ======
        const dictData = [
            { term: 'بورس', def: 'بازاری سازمان‌یافته که در آن اوراق بهادار مانند سهام و اوراق قرضه معامله می‌شود.', cat: 'بورس' },
            { term: 'شاخص کل', def: 'معیاری برای سنجش عملکرد کلی بازار بورس که تغییرات قیمت سهام را نشان می‌دهد.', cat: 'بورس' },
            { term: 'سهام', def: 'بخشی از مالکیت یک شرکت که قابل خرید و فروش است.', cat: 'بورس' },
            { term: 'نرخ ارز', def: 'قیمت تبدیل یک واحد پول به پول دیگر در بازار.', cat: 'ارز' },
            { term: 'دلار آزاد', def: 'نرخ دلار در بازار غیررسمی که معمولاً بالاتر از نرخ رسمی است.', cat: 'ارز' },
            { term: 'طلا ۱۸ عیار', def: 'طلای خالص با عیار ۷۵۰ که رایج‌ترین واحد معاملاتی در ایران است.', cat: 'طلا' },
            { term: 'انس طلا', def: 'واحد جهانی سنجش طلا که معادل ۳۱.۱ گرم است.', cat: 'طلا' },
            { term: 'نفت خام', def: 'نفت استخراج‌شده از زمین که برای پالایش و تبدیل به فرآورده‌ها استفاده می‌شود.', cat: 'نفت' },
            { term: 'اوپک', def: 'سازمان کشورهای صادرکننده نفت که سیاست‌های تولید و قیمت را تنظیم می‌کند.', cat: 'نفت' },
            { term: 'تورم', def: 'افزایش مداوم سطح عمومی قیمت‌ها که باعث کاهش قدرت خرید می‌شود.', cat: 'اقتصاد کلان' },
            { term: 'تولید ناخالص داخلی (GDP)', def: 'ارزش کل کالاها و خدمات تولیدشده در یک کشور طی یک دوره زمانی.', cat: 'اقتصاد کلان' },
            { term: 'نقدینگی', def: 'مجموع پول در گردش و سپرده‌های بانکی در اقتصاد.', cat: 'اقتصاد کلان' }
        ];

        function renderDict(filter) {
            const grid = document.getElementById('dictGrid');
            const items = filter === 'all' ? dictData : dictData.filter(d => d.cat === filter);
            if (items.length === 0) {
                grid.innerHTML = `<div class="loading"><p>موردی یافت نشد</p></div>`;
                return;
            }
            grid.innerHTML = items.map(d => `
                <div class="dict-card">
                    <div class="dict-term">📖 ${d.term}</div>
                    <div class="dict-def">${d.def}</div>
                </div>
            `).join('');
        }

        function filterDict(cat, btn) {
            document.querySelectorAll('.dict-cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderDict(cat);
        }

        function loadDictionary() {
            renderDict('all');
        }

        // ====== Init ======
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            loadAllNews();
        });
    </script>
</body>
</html>
