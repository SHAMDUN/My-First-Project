<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دستیار هوشمند | آکادمی شمعدون</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Tahoma, sans-serif;
            background-color: #0f172a;
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(245, 158, 11, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(59, 130, 246, 0.08) 0%, transparent 40%);
            background-size: 100% 100%, 100% 100%;
            background-attachment: fixed;
            height: 100vh;
            direction: rtl;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(15px);
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .header-info { display: flex; align-items: center; gap: 12px; }
        .header-icon {
            width: 42px; height: 42px; border-radius: 50%;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
        }
        .header-title h1 { color: #f1f5f9; font-size: 16px; margin-bottom: 2px; }
        .header-title p {
            color: #4ade80; font-size: 11px;
            display: flex; align-items: center; gap: 5px;
        }
        .status-dot {
            width: 6px; height: 6px; background: #4ade80;
            border-radius: 50%; animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
        .header a {
            color: #94a3b8; text-decoration: none; font-size: 13px;
            padding: 8px 14px; border: 1px solid #334155;
            border-radius: 20px; transition: 0.3s;
        }
        .header a:hover { background: #334155; color: #fff; }

        .chat-container {
            flex: 1; overflow-y: auto; padding: 20px 15px;
            display: flex; flex-direction: column; gap: 15px;
            max-width: 800px; width: 100%; margin: 0 auto;
        }
        .chat-container::-webkit-scrollbar { width: 6px; }
        .chat-container::-webkit-scrollbar-thumb {
            background: rgba(245, 158, 11, 0.3); border-radius: 10px;
        }

        .message {
            display: flex; gap: 10px;
            animation: fadeInUp 0.3s ease-out;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message-avatar {
            width: 36px; height: 36px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; flex-shrink: 0;
        }
        .message.user .message-avatar { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
        .message.assistant .message-avatar { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .message-content {
            background: rgba(30, 41, 59, 0.85);
            padding: 14px 18px; border-radius: 18px;
            color: #e2e8f0; font-size: 15px; line-height: 1.8;
            max-width: 85%; word-wrap: break-word;
            border: 1px solid rgba(255,255,255,0.05);
            white-space: pre-wrap;
        }
        .message.user .message-content {
            background: rgba(59, 130, 246, 0.15);
            border-color: rgba(59, 130, 246, 0.3);
        }

        .typing-indicator {
            display: flex; gap: 4px; padding: 4px 0;
        }
        .typing-indicator span {
            width: 8px; height: 8px; background: #64748b;
            border-radius: 50%; animation: typing 1.4s infinite;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%,60%,100% { transform: translateY(0); opacity: 0.5; }
            30% { transform: translateY(-8px); opacity: 1; }
        }

        .suggestions {
            display: flex; flex-wrap: wrap; gap: 8px;
            padding: 10px 15px; max-width: 800px;
            width: 100%; margin: 0 auto;
        }
        .suggestion-chip {
            background: rgba(30, 41, 59, 0.7);
            color: #cbd5e1; padding: 8px 14px;
            border-radius: 20px; font-size: 13px;
            cursor: pointer; border: 1px solid rgba(245, 158, 11, 0.3);
            transition: 0.3s;
        }
        .suggestion-chip:hover {
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b; transform: translateY(-2px);
        }

        .input-container {
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(15px);
            padding: 15px;
            border-top: 1px solid rgba(255,255,255,0.05);
            flex-shrink: 0;
        }
        .input-wrapper {
            max-width: 800px; margin: 0 auto;
            display: flex; gap: 10px; align-items: flex-end;
        }
        .input-wrapper textarea {
            flex: 1; background: rgba(15, 23, 42, 0.8);
            border: 2px solid #334155; border-radius: 15px;
            padding: 14px 18px; color: #f1f5f9;
            font-size: 15px; font-family: Tahoma, sans-serif;
            resize: none; outline: none; max-height: 120px;
            min-height: 52px; line-height: 1.5;
        }
        .input-wrapper textarea:focus { border-color: #f59e0b; }
        .send-btn {
            width: 52px; height: 52px; border-radius: 15px;
            border: none; background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #0f172a; font-size: 22px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; transition: 0.3s;
        }
        .send-btn:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.5);
        }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-info">
            <div class="header-icon">🤖</div>
            <div class="header-title">
                <h1>دستیار هوشمند شمعدون</h1>
                <p><span class="status-dot"></span> آنلاین</p>
            </div>
        </div>
        <a href="dashboard.html">⬅ بازگشت</a>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="message assistant">
            <div class="message-avatar">🤖</div>
            <div class="message-content">سلام! من دستیار هوشمند آکادمی شمعدون هستم. 👋

می‌تونم در مورد بازارهای مالی، طلا، ارز دیجیتال، بورس، تحلیل تکنیکال و هر سوال دیگه‌ای کمکت کنم. چطور می‌تونم کمکت کنم؟</div>
        </div>
    </div>

    <div class="suggestions" id="suggestions">
        <div class="suggestion-chip" onclick="askSuggestion('طلا بخرم یا دلار؟')">🥇 طلا بخرم یا دلار؟</div>
        <div class="suggestion-chip" onclick="askSuggestion('RSI چیه؟')">📊 RSI چیه؟</div>
        <div class="suggestion-chip" onclick="askSuggestion('بیت‌کوین بخرم؟')">₿ بیت‌کوین بخرم؟</div>
        <div class="suggestion-chip" onclick="askSuggestion('سبد سرمایه‌گذاری من چطور باشه؟')">💼 سبد سرمایه‌گذاری</div>
    </div>

    <div class="input-container">
        <div class="input-wrapper">
            <textarea id="userInput" placeholder="سوال خود را بنویسید..." rows="1" onkeydown="handleKeyDown(event)"></textarea>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script>
        const API_KEY = 'sk_Lg9fjXt4JVdWMXe7QIWUSBwfAlPP67qO';
        const API_URL = 'https://gen.pollinations.ai/v1/chat/completions';
        const MODEL = 'openai/gpt-5.4-nano';

        let conversationHistory = [];
        let isTyping = false;

        async function sendMessage() {
            if (isTyping) return;
            
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;

            addMessage('user', message);
            input.value = '';
            input.style.height = 'auto';
            document.getElementById('suggestions').style.display = 'none';

            conversationHistory.push({ role: 'user', content: message });

            showTyping();
            isTyping = true;
            document.getElementById('sendBtn').disabled = true;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: MODEL,
                        messages: [
                            { 
                                role: 'system', 
                                content: 'شما دستیار هوشمند آکادمی شمعدون هستید. پاسخ‌های خود را به فارسی، کوتاه و مفید بدهید. در مورد بازارهای مالی، طلا، نقره، ارز دیجیتال، بورس، تحلیل تکنیکال، مدیریت ریسک و سرمایه‌گذاری تخصص دارید.' 
                            },
                            ...conversationHistory
                        ]
                    })
                });

                hideTyping();

                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('API Error:', response.status, errorText);
                    addMessage('assistant', '❌ خطا در ارتباط با سرور (کد: ' + response.status + '). لطفاً دوباره تلاش کنید.');
                } else {
                    const data = await response.json();
                    const assistantMessage = data.choices[0].message.content;
                    addMessage('assistant', assistantMessage);
                    conversationHistory.push({ role: 'assistant', content: assistantMessage });
                }

            } catch (error) {
                hideTyping();
                console.error('Fetch Error:', error);
                addMessage('assistant', '❌ خطای شبکه. لطفاً اتصال اینترنت خود را بررسی کنید.');
            }

            isTyping = false;
            document.getElementById('sendBtn').disabled = false;
        }

        function addMessage(role, text) {
            const container = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            const avatar = role === 'user' ? '👤' : '🤖';
            messageDiv.innerHTML = `
                <div class="message-avatar">${avatar}</div>
                <div class="message-content">${escapeHtml(text)}</div>
            `;
            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showTyping() {
            const container = document.getElementById('chatContainer');
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message assistant';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerHTML = `
                <div class="message-avatar">🤖</div>
                <div class="message-content">
                    <div class="typing-indicator">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            `;
            container.appendChild(typingDiv);
            container.scrollTop = container.scrollHeight;
        }

        function hideTyping() {
            const typing = document.getElementById('typingIndicator');
            if (typing) typing.remove();
        }

        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        document.getElementById('userInput').addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        function askSuggestion(text) {
            document.getElementById('userInput').value = text;
            sendMessage();
        }
    </script>

</body>
</html>
