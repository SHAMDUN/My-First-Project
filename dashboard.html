<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل کاربری | آکادمی شمعدون</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: Tahoma, sans-serif;
            background-color: #0f172a;
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(245, 158, 11, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(59, 130, 246, 0.08) 0%, transparent 40%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 50px 50px, 50px 50px;
            background-attachment: fixed;
            min-height: 100vh;
            direction: rtl;
            padding: 20px 15px;
        }

        .container { max-width: 600px; margin: 0 auto; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(15px);
            padding: 25px 20px;
            border-radius: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 20px;
            animation: fadeInUp 0.6s ease-out;
        }

        .avatar-section { text-align: center; margin-bottom: 25px; }

        .avatar-large {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            margin: 0 auto 15px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: #0f172a;
            font-weight: bold;
            border: 5px solid #f59e0b;
            box-shadow: 0 0 40px rgba(245, 158, 11, 0.4);
            animation: float 3s ease-in-out infinite;
        }

        .user-name { color: #f1f5f9; font-size: 22px; font-weight: bold; margin-bottom: 5px; }
        .user-email { color: #94a3b8; font-size: 14px; margin-bottom: 8px; }
        .user-badge {
            display: inline-block;
            background: rgba(74, 222, 128, 0.15);
            color: #4ade80;
            font-size: 12px;
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid rgba(74, 222, 128, 0.3);
        }

        .section-title {
            color: #f1f5f9;
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(245, 158, 11, 0.3);
        }

        /* ===== آمار ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 10px;
        }

        .stat-card {
            background: rgba(15, 23, 42, 0.6);
            padding: 14px 8px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
            transition: 0.3s;
        }
        .stat-card:hover {
            transform: translateY(-3px);
            border-color: rgba(245, 158, 11, 0.3);
        }

        .stat-icon { font-size: 22px; margin-bottom: 5px; }
        .stat-value { color: #f59e0b; font-size: 18px; font-weight: bold; margin-bottom: 3px; }
        .stat-label { color: #94a3b8; font-size: 11px; }

        /* ===== دوره‌های من ===== */
        .my-courses-section {
            background: rgba(15, 23, 42, 0.6);
            padding: 15px;
            border-radius: 15px;
            margin-top: 15px;
        }

        .course-progress-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px dashed rgba(255,255,255,0.1);
        }
        .course-progress-item:last-child {
            border-bottom: none;
        }

        .course-progress-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: rgba(245, 158, 11, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .course-progress-info {
            flex: 1;
            text-align: right;
        }
        .course-progress-title {
            color: #f1f5f9;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .course-progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(15, 23, 42, 0.8);
            border-radius: 10px;
            overflow: hidden;
        }
        .course-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #f59e0b, #d97706);
            border-radius: 10px;
            transition: width 0.5s;
        }
        .course-progress-percent {
            color: #f59e0b;
            font-size: 12px;
            font-weight: bold;
            min-width: 40px;
            text-align: left;
        }

        .empty-courses {
            text-align: center;
            padding: 20px;
            color: #94a3b8;
            font-size: 13px;
        }
        .empty-courses a {
            color: #f59e0b;
            text-decoration: none;
            font-weight: bold;
        }

        /* ===== دکمه‌ها ===== */
        .btn {
            width: 100%;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: Tahoma, sans-serif;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 10px;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #0f172a;
            box-shadow: 0 5px 20px rgba(245, 158, 11, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(245, 158, 11, 0.5);
        }

        .btn-secondary {
            background: rgba(15, 23, 42, 0.6);
            color: #f1f5f9;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-secondary:hover {
            background: rgba(15, 23, 42, 0.9);
            border-color: rgba(245, 158, 11, 0.3);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .btn-danger:hover { background: rgba(239, 68, 68, 0.2); }

        /* دکمه ادمین */
        .btn-admin {
            background: linear-gradient(135deg, #dc2626, #b91c1c, #dc2626);
            background-size: 200% 200%;
            color: #ffffff;
            box-shadow: 0 5px 20px rgba(220, 38, 38, 0.4);
            border: 2px solid #fca5a5;
        }
        .btn-admin:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(220, 38, 38, 0.6);
        }

        /* ===== لیست دسترسی سریع ===== */
        .quick-links { display: flex; flex-direction: column; gap: 8px; }

        .quick-link {
            background: rgba(15, 23, 42, 0.6);
            padding: 14px 16px;
            border-radius: 12px;
            text-decoration: none;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            gap: 12px;
            border-right: 3px solid #f59e0b;
            transition: 0.3s;
        }

        .quick-link:hover {
            background: rgba(15, 23, 42, 0.9);
            transform: translateX(-5px);
        }

        .quick-link .icon { font-size: 24px; min-width: 30px; text-align: center; }
        .quick-link .content { flex: 1; }
        .quick-link .title { font-size: 14px; font-weight: bold; margin-bottom: 2px; }
        .quick-link .desc { font-size: 11px; color: #94a3b8; }
        .quick-link .arrow { color: #f59e0b; font-size: 18px; }

        /* ===== مودال ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 99999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.show { display: flex; }

        .modal {
            background: #1e293b;
            padding: 25px;
            border-radius: 20px;
            max-width: 400px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.1);
            animation: fadeInUp 0.3s ease-out;
        }

        .modal h3 {
            color: #f1f5f9;
            font-size: 18px;
            margin-bottom: 15px;
            text-align: center;
        }

        .modal-input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 2px solid #334155;
            background: rgba(15, 23, 42, 0.8);
            color: #fff;
            font-size: 14px;
            outline: none;
            margin-bottom: 12px;
            font-family: Tahoma, sans-serif;
        }

        .modal-input:focus { border-color: #f59e0b; }

        .modal-buttons { display: flex; gap: 10px; margin-top: 15px; }
        .modal-buttons .btn { margin-bottom: 0; }

        .message {
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 12px;
            font-size: 13px;
            text-align: center;
            display: none;
        }
        .message.success {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
            border: 1px solid #22c55e;
            display: block;
        }
        .message.error {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid #ef4444;
            display: block;
        }

        .loading {
            text-align: center;
            padding: 50px 20px;
            color: #94a3b8;
            font-size: 16px;
        }

        @media (max-width: 400px) {
            .avatar-large { width: 90px; height: 90px; font-size: 38px; }
            .user-name { font-size: 18px; }
            .stat-value { font-size: 16px; }
            .btn { padding: 12px 16px; font-size: 14px; }
        }
    </style>
</head>
<body>

    <div class="container" id="content">
        <div class="loading">⏳ در حال بارگذاری پروفایل...</div>
    </div>

    <!-- مودال ویرایش نام -->
    <div class="modal-overlay" id="editNameModal">
        <div class="modal">
            <h3>✏️ ویرایش نام</h3>
            <div class="message" id="editNameMsg"></div>
            <input type="text" id="editNameInput" class="modal-input" placeholder="نام جدید">
            <div class="modal-buttons">
                <button class="btn btn-primary" onclick="saveName()">💾 ذخیره</button>
                <button class="btn btn-secondary" onclick="closeModal('editNameModal')">لغو</button>
            </div>
        </div>
    </div>

    <!-- مودال تغییر رمز -->
    <div class="modal-overlay" id="changePassModal">
        <div class="modal">
            <h3>🔒 تغییر رمز عبور</h3>
            <div class="message" id="changePassMsg"></div>
            <input type="password" id="newPassword" class="modal-input" placeholder="رمز جدید (حداقل ۶ کاراکتر)">
            <input type="password" id="confirmPassword" class="modal-input" placeholder="تکرار رمز جدید">
            <div class="modal-buttons">
                <button class="btn btn-primary" onclick="savePassword()">💾 ذخیره</button>
                <button class="btn btn-secondary" onclick="closeModal('changePassModal')">لغو</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://jcwwilatvstjrohvhtss.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_R7tCe030dGeJ0IRWfcgxww_MgEfh95O';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const ADMIN_EMAIL = 'beat.market.office@gmail.com';

        // ===== اطلاعات دوره‌ها =====
        const coursesData = {
            1: { title: 'اقتصاد کلان و خرد', icon: '📊', lessons: 8 },
            2: { title: 'آشنایی با بازارهای مالی', icon: '💹', lessons: 10 },
            3: { title: 'مبانی تحلیل تکنیکال', icon: '📈', lessons: 12 },
            4: { title: 'مدیریت ریسک مقدماتی', icon: '🛡️', lessons: 8 },
            5: { title: 'آشنایی با ارز دیجیتال', icon: '₿', lessons: 10 }
        };

        let currentUser = null;

        async function loadProfile() {
            const { data: { session } } = await supabaseClient.auth.getSession();

            if (!session) {
                window.location.href = 'login.html';
                return;
            }

            currentUser = session.user;
            const fullName = currentUser.user_metadata?.full_name || 'کاربر عزیز';
            const email = currentUser.email;
            const firstLetter = fullName.charAt(0).toUpperCase();
            const joinDate = new Date(currentUser.created_at).toLocaleDateString('fa-IR', {
                year: 'numeric', month: 'long', day: 'numeric'
            });

            // چک کردن ادمین
            const isAdmin = (email === ADMIN_EMAIL);
            const adminBadge = isAdmin ? '👑 ادمین' : '';

            // اطلاعات دوره‌ها
            const completedCourses = currentUser.user_metadata?.completed_courses || [];
            const inProgressCourses = currentUser.user_metadata?.in_progress_courses || [];
            const completedLessons = currentUser.user_metadata?.completed_lessons || {};
            const personalityResult = currentUser.user_metadata?.personality_result;

            const totalCourses = completedCourses.length + inProgressCourses.length;

            // ساخت HTML دوره‌های من
            let myCoursesHTML = '';
            
            if (totalCourses === 0) {
                myCoursesHTML = `
                    <div class="empty-courses">
                        📚 شما هنوز در هیچ دوره‌ای ثبت‌نام نکرده‌اید.<br>
                        <a href="courses.html">مشاهده دوره‌های رایگان →</a>
                    </div>
                `;
            } else {
                completedCourses.forEach(courseId => {
                    const course = coursesData[courseId];
                    if (course) {
                        myCoursesHTML += `
                            <div class="course-progress-item">
                                <div class="course-progress-icon">${course.icon}</div>
                                <div class="course-progress-info">
                                    <div class="course-progress-title">${course.title}</div>
                                    <div class="course-progress-bar">
                                        <div class="course-progress-fill" style="width: 100%"></div>
                                    </div>
                                </div>
                                <div class="course-progress-percent">✅</div>
                            </div>
                        `;
                    }
                });

                inProgressCourses.forEach(courseId => {
                    const course = coursesData[courseId];
                    if (course) {
                        const completed = (completedLessons[courseId] || []).length;
                        const percent = Math.round((completed / course.lessons) * 100);
                        myCoursesHTML += `
                            <div class="course-progress-item">
                                <div class="course-progress-icon">${course.icon}</div>
                                <div class="course-progress-info">
                                    <div class="course-progress-title">${course.title}</div>
                                    <div class="course-progress-bar">
                                        <div class="course-progress-fill" style="width: ${percent}%"></div>
                                    </div>
                                </div>
                                <div class="course-progress-percent">${percent}٪</div>
                            </div>
                        `;
                    }
                });
            }

            // کارت ادمین
            const adminCardHTML = isAdmin ? `
                <div class="card">
                    <div class="section-title">👑 دسترسی ادمین</div>
                    <a href="admin.html" class="btn btn-admin">
                        🎯 ورود به پنل ادمین
                    </a>
                </div>
            ` : '';

            document.getElementById('content').innerHTML = `
                <!-- کارت پروفایل -->
                <div class="card">
                    <div class="avatar-section">
                        <div class="avatar-large">${firstLetter}</div>
                        <div class="user-name">${fullName} ${adminBadge}</div>
                        <div class="user-email">${email}</div>
                        <div class="user-badge">✨ عضو از ${joinDate}</div>
                    </div>
                </div>

                <!-- کارت ادمین (فقط برای ادمین) -->
                ${adminCardHTML}

                <!-- آمار فعالیت -->
                <div class="card">
                    <div class="section-title">📊 آمار فعالیت</div>
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-icon">📚</div>
                            <div class="stat-value">${totalCourses}</div>
                            <div class="stat-label">دوره ثبت‌نام شده</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">🎯</div>
                            <div class="stat-value">${personalityResult ? '✓' : '--'}</div>
                            <div class="stat-label">تست شخصیت</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">✅</div>
                            <div class="stat-value">${completedCourses.length}</div>
                            <div class="stat-label">دوره تکمیل شده</div>
                        </div>
                    </div>
                </div>

                <!-- دوره‌های من -->
                <div class="card">
                    <div class="section-title">📚 دوره‌های من</div>
                    <div class="my-courses-section">
                        ${myCoursesHTML}
                    </div>
                    <a href="courses.html" class="btn btn-primary" style="margin-top: 15px;">
                        🎓 مشاهده همه دوره‌ها
                    </a>
                </div>

                <!-- ویرایش پروفایل -->
                <div class="card">
                    <div class="section-title">✏️ ویرایش پروفایل</div>
                    <button class="btn btn-secondary" onclick="openEditName()">
                        ✏️ ویرایش نام
                    </button>
                    <button class="btn btn-secondary" onclick="openChangePass()">
                        🔒 تغییر رمز عبور
                    </button>
                </div>

                <!-- دسترسی سریع -->
                <div class="card">
                    <div class="section-title">📌 دسترسی سریع</div>
                    <div class="quick-links">
                        <a href="home.html" class="quick-link">
                            <div class="icon">🏠</div>
                            <div class="content">
                                <div class="title">پنل تحلیلی</div>
                                <div class="desc">چارت زنده و حباب طلا</div>
                            </div>
                            <div class="arrow">←</div>
                        </a>
                        <a href="courses.html" class="quick-link">
                            <div class="icon">📚</div>
                            <div class="content">
                                <div class="title">دوره‌های آموزشی</div>
                                <div class="desc">از مبتدی تا حرفه‌ای</div>
                            </div>
                            <div class="arrow">←</div>
                        </a>
                        <a href="bourse.html" class="quick-link">
                            <div class="icon">🏢</div>
                            <div class="content">
                                <div class="title">بورس ایران</div>
                                <div class="desc">رتبه‌بندی و تحلیل سهام</div>
                            </div>
                            <div class="arrow">←</div>
                        </a>
                        <a href="assistant.html" class="quick-link">
                            <div class="icon">🤖</div>
                            <div class="content">
                                <div class="title">دستیار هوشمند</div>
                                <div class="desc">پاسخ به سوالات مالی</div>
                            </div>
                            <div class="arrow">←</div>
                        </a>
                        <a href="personality-test.html" class="quick-link">
                            <div class="icon">🎯</div>
                            <div class="content">
                                <div class="title">تست شخصیت‌شناسی مالی</div>
                                <div class="desc">سبد سرمایه‌گذاری مخصوص خودت</div>
                            </div>
                            <div class="arrow">←</div>
                        </a>
                    </div>
                </div>

                <!-- خروج -->
                <div class="card">
                    <button class="btn btn-danger" onclick="handleLogout()">
                        🚪 خروج از حساب
                    </button>
                </div>
            `;
        }

        function openEditName() {
            const currentName = currentUser.user_metadata?.full_name || '';
            document.getElementById('editNameInput').value = currentName;
            document.getElementById('editNameMsg').className = 'message';
            document.getElementById('editNameModal').classList.add('show');
        }

        async function saveName() {
            const newName = document.getElementById('editNameInput').value.trim();
            const msg = document.getElementById('editNameMsg');

            if (!newName) {
                msg.textContent = '❌ لطفاً نام را وارد کنید';
                msg.className = 'message error';
                return;
            }

            const { error } = await supabaseClient.auth.updateUser({
                data: { full_name: newName }
            });

            if (error) {
                msg.textContent = '❌ خطا: ' + error.message;
                msg.className = 'message error';
            } else {
                msg.textContent = '✅ نام با موفقیت تغییر کرد';
                msg.className = 'message success';
                setTimeout(() => {
                    closeModal('editNameModal');
                    loadProfile();
                }, 1500);
            }
        }

        function openChangePass() {
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmPassword').value = '';
            document.getElementById('changePassMsg').className = 'message';
            document.getElementById('changePassModal').classList.add('show');
        }

        async function savePassword() {
            const newPass = document.getElementById('newPassword').value;
            const confirmPass = document.getElementById('confirmPassword').value;
            const msg = document.getElementById('changePassMsg');

            if (newPass.length < 6) {
                msg.textContent = '❌ رمز عبور باید حداقل ۶ کاراکتر باشد';
                msg.className = 'message error';
                return;
            }

            if (newPass !== confirmPass) {
                msg.textContent = '❌ رمز عبور و تکرار آن یکسان نیستند';
                msg.className = 'message error';
                return;
            }

            const { error } = await supabaseClient.auth.updateUser({
                password: newPass
            });

            if (error) {
                msg.textContent = '❌ خطا: ' + error.message;
                msg.className = 'message error';
            } else {
                msg.textContent = '✅ رمز عبور با موفقیت تغییر کرد';
                msg.className = 'message success';
                setTimeout(() => {
                    closeModal('changePassModal');
                }, 1500);
            }
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('show');
        }

        async function handleLogout() {
            if (confirm('آیا مطمئنید که می‌خواهید خارج شوید؟')) {
                await supabaseClient.auth.signOut();
                window.location.href = 'login.html';
            }
        }

        loadProfile();
    </script>
