<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل کاربری | آکادمی شمعدون</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #14141c;
            --bg-card: #1a1a24;
            --gold: #d4af37;
            --gold-light: #f4d47c;
            --gold-dark: #a8862a;
            --blue: #3b82f6;
            --green: #10b981;
            --red: #ef4444;
            --white: #f8fafc;
            --gray: #94a3b8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background-color: var(--bg-primary);
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(212, 175, 55, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(59, 130, 246, 0.06) 0%, transparent 40%),
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 60px 60px, 60px 60px;
            background-attachment: fixed;
            color: var(--white);
            min-height: 100vh;
            direction: rtl;
            overflow-x: hidden;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.3); }
        }

        /* ============= Navbar ============= */
        .sn-navbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: rgba(10, 10, 15, 0.92);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(212, 175, 55, 0.15);
            z-index: 9998;
            padding: 12px 0;
        }
        .sn-navbar-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }
        .sn-hamburger {
            width: 42px; height: 42px;
            border-radius: 12px;
            background: rgba(212, 175, 55, 0.08);
            border: 1px solid rgba(212, 175, 55, 0.25);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            padding: 0;
            transition: 0.3s;
        }
        .sn-hamburger:hover {
            background: rgba(212, 175, 55, 0.2);
        }
        .sn-hamburger span {
            display: block;
            width: 18px; height: 2px;
            background: #d4af37;
            border-radius: 2px;
        }
        .sn-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            flex: 1;
            justify-content: center;
        }
        .sn-brand-logo {
            width: 38px; height: 38px;
            border-radius: 50%;
            border: 2px solid #d4af37;
            object-fit: cover;
        }
        .sn-brand-text {
            color: #d4af37;
            font-size: 17px;
            font-weight: 800;
        }
        .sn-user-area {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 42px;
            justify-content: flex-end;
        }
        .sn-login-btn {
            color: #d4af37;
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
            padding: 9px 16px;
            border-radius: 10px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            background: rgba(212, 175, 55, 0.08);
            transition: 0.3s;
        }
        .sn-login-btn:hover {
            background: rgba(212, 175, 55, 0.2);
        }
        .sn-user-avatar {
            width: 42px; height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, #d4af37, #a8862a);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0a0a0f;
            font-weight: 900;
            font-size: 15px;
            border: 2px solid #d4af37;
            text-decoration: none;
            transition: 0.3s;
        }
        .sn-user-avatar:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }

        /* ============= Overlay ============= */
        .sn-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
        }
        .sn-overlay.show { opacity: 1; visibility: visible; }

        /* ============= Sidebar ============= */
        .sn-sidebar {
            position: fixed;
            top: 0;
            right: -320px;
            width: 300px;
            height: 100vh;
            background: linear-gradient(180deg, #14141c, #0a0a0f);
            border-left: 1px solid rgba(212, 175, 55, 0.2);
            z-index: 10000;
            transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            box-shadow: -10px 0 40px rgba(0, 0, 0, 0.5);
        }
        .sn-sidebar.show { right: 0; }
        .sn-sidebar::-webkit-scrollbar { width: 4px; }
        .sn-sidebar::-webkit-scrollbar-thumb {
            background: rgba(212, 175, 55, 0.3);
            border-radius: 10px;
        }
        .sn-sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.15);
            position: sticky;
            top: 0;
            background: #14141c;
            z-index: 2;
        }
        .sn-sidebar-header .sn-brand {
            justify-content: flex-start;
        }
        .sn-close {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            width: 34px; height: 34px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-family: inherit;
            transition: 0.3s;
        }
        .sn-close:hover {
            background: rgba(239, 68, 68, 0.2);
        }
        .sn-sidebar-content { padding: 15px; }
        .sn-menu-section { display: flex; flex-direction: column; gap: 4px; }
        .sn-menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 12px;
            text-decoration: none;
            color: #cbd5e1;
            font-size: 14px;
            font-weight: 600;
            transition: 0.25s;
            border: 1px solid transparent;
        }
        .sn-menu-item:hover {
            background: rgba(212, 175, 55, 0.08);
            color: #d4af37;
            border-color: rgba(212, 175, 55, 0.2);
            transform: translateX(-4px);
        }
        .sn-menu-item.active {
            background: rgba(212, 175, 55, 0.15);
            color: #d4af37;
            border-color: rgba(212, 175, 55, 0.4);
        }
        .sn-menu-icon { font-size: 20px; width: 26px; text-align: center; }
        .sn-menu-label { flex: 1; }
        .sn-menu-divider {
            height: 1px;
            background: rgba(212, 175, 55, 0.15);
            margin: 15px 0;
        }
        .sn-logout { color: #f87171 !important; }
        .sn-logout:hover {
            background: rgba(239, 68, 68, 0.1) !important;
            color: #ef4444 !important;
            border-color: rgba(239, 68, 68, 0.3) !important;
        }

        /* ============= Main Container ============= */
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 90px 20px 40px;
        }

        /* ============= Welcome Hero ============= */
        .welcome-hero {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.1), rgba(59, 130, 246, 0.05));
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 20px;
            padding: 25px 30px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .welcome-text h1 { color: var(--white); font-size: 24px; font-weight: 900; margin-bottom: 6px; }
        .welcome-text h1 .gold {
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .welcome-text p { color: var(--gray); font-size: 13px; }
        .welcome-streak {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(20, 20, 28, 0.8);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 15px;
            padding: 12px 20px;
        }
        .streak-icon { font-size: 28px; }
        .streak-info { text-align: right; }
        .streak-value { color: var(--gold); font-size: 22px; font-weight: 900; line-height: 1; }
        .streak-label { color: var(--gray); font-size: 11px; margin-top: 3px; }

        /* ============= Continue Card ============= */
        .continue-card {
            background: linear-gradient(135deg, var(--bg-card), var(--bg-secondary));
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 24px;
            box-shadow: 0 10px 40px rgba(59, 130, 246, 0.15);
        }
        .continue-header { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
        .continue-icon {
            width: 42px; height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--blue), #2563eb);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .continue-title { color: var(--white); font-size: 16px; font-weight: 800; }
        .continue-subtitle { color: var(--gray); font-size: 11px; margin-top: 2px; }
        .continue-body { background: rgba(10, 10, 15, 0.5); border-radius: 15px; padding: 18px; margin-bottom: 16px; }
        .continue-course-info { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        .continue-course-icon { font-size: 38px; }
        .continue-course-details { flex: 1; }
        .continue-course-name { color: var(--white); font-size: 16px; font-weight: 800; margin-bottom: 4px; }
        .continue-lesson-name { color: var(--gray); font-size: 12px; }
        .continue-progress-bar { width: 100%; height: 8px; background: rgba(255, 255, 255, 0.05); border-radius: 10px; overflow: hidden; margin-bottom: 8px; }
        .continue-progress-fill { height: 100%; background: linear-gradient(90deg, var(--blue), var(--gold)); border-radius: 10px; transition: width 0.5s; }
        .continue-progress-info { display: flex; justify-content: space-between; color: var(--gray); font-size: 11px; }
        .continue-btn {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--blue), #2563eb);
            color: #fff;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            border: none;
            transition: 0.3s;
        }
        .continue-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.5);
        }

        /* ============= Stats Grid ============= */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 24px; }
        .stat-card {
            background: linear-gradient(135deg, var(--bg-card), var(--bg-secondary));
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 18px;
            padding: 20px;
            text-align: center;
            transition: 0.3s;
        }
        .stat-card:hover {
            transform: translateY(-5px);
            border-color: rgba(212, 175, 55, 0.4);
            box-shadow: 0 15px 40px rgba(212, 175, 55, 0.15);
        }
        .stat-icon { font-size: 32px; margin-bottom: 10px; }
        .stat-value { color: var(--gold); font-size: 28px; font-weight: 900; margin-bottom: 5px; }
        .stat-label { color: var(--gray); font-size: 12px; }

        /* ============= Section ============= */
        .section {
            background: linear-gradient(135deg, var(--bg-card), var(--bg-secondary));
            border: 1px solid rgba(212, 175, 55, 0.1);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 24px;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.15);
        }
        .section-title { color: var(--white); font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
        .section-link { color: var(--gold); text-decoration: none; font-size: 12px; font-weight: 600; }
        .section-link:hover { text-decoration: underline; }

        /* ============= Course Item ============= */
        .course-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: rgba(10, 10, 15, 0.5);
            border-radius: 15px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: 0.3s;
        }
        .course-item:last-child { margin-bottom: 0; }
        .course-item:hover {
            background: rgba(10, 10, 15, 0.8);
            border-color: rgba(212, 175, 55, 0.3);
            transform: translateX(-5px);
        }
        .course-item-icon {
            width: 50px; height: 50px;
            border-radius: 12px;
            background: rgba(212, 175, 55, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }
        .course-item-info { flex: 1; }
        .course-item-title { color: var(--white); font-size: 14px; font-weight: 700; margin-bottom: 8px; }
        .course-item-progress { width: 100%; height: 6px; background: rgba(255, 255, 255, 0.05); border-radius: 10px; overflow: hidden; }
        .course-item-progress-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold-dark)); border-radius: 10px; }
        .course-item-percent { color: var(--gold); font-size: 14px; font-weight: 800; min-width: 50px; text-align: left; }
        .course-item-percent.done { color: var(--green); }
        .empty-state { text-align: center; padding: 30px 20px; color: var(--gray); font-size: 13px; }
        .empty-state a { color: var(--gold); text-decoration: none; font-weight: 700; }

        /* ============= AI Suggestion ============= */
        .ai-suggestion {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.08), rgba(59, 130, 246, 0.05));
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 18px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 24px;
        }
        .ai-suggestion-icon { font-size: 38px; flex-shrink: 0; }
        .ai-suggestion-content { flex: 1; }
        .ai-suggestion-title { color: var(--gold); font-size: 14px; font-weight: 800; margin-bottom: 6px; }
        .ai-suggestion-text { color: var(--white); font-size: 13px; margin-bottom: 12px; line-height: 1.7; }
        .ai-suggestion-btn {
            display: inline-block;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--bg-primary);
            padding: 10px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 12px;
            font-weight: 800;
            transition: 0.3s;
        }
        .ai-suggestion-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.4);
        }

        /* ============= Achievements ============= */
        .achievements-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .achievement {
            background: rgba(10, 10, 15, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 15px 10px;
            text-align: center;
            transition: 0.3s;
        }
        .achievement.unlocked { border-color: rgba(212, 175, 55, 0.4); background: rgba(212, 175, 55, 0.05); }
        .achievement.locked { opacity: 0.4; }
        .achievement-icon { font-size: 28px; margin-bottom: 8px; }
        .achievement-title { color: var(--white); font-size: 11px; font-weight: 700; line-height: 1.4; }

        /* ============= Quick Links ============= */
        .quick-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .quick-link {
            background: rgba(10, 10, 15, 0.5);
            padding: 15px;
            border-radius: 12px;
            text-decoration: none;
            color: var(--white);
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: 0.3s;
        }
        .quick-link:hover {
            background: rgba(10, 10, 15, 0.8);
            border-color: rgba(212, 175, 55, 0.3);
            transform: translateY(-3px);
        }
        .quick-link-icon { font-size: 22px; }
        .quick-link-title { font-size: 13px; font-weight: 700; }

        /* ============= Profile ============= */
        .profile-card {
            background: linear-gradient(135deg, var(--bg-card), var(--bg-secondary));
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 24px;
        }
        .profile-header {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.15);
        }
        .profile-avatar {
            width: 80px; height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: 900;
            color: var(--bg-primary);
            border: 3px solid var(--gold);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
            flex-shrink: 0;
        }
        .profile-info { flex: 1; min-width: 0; }
        .profile-name { color: var(--white); font-size: 18px; font-weight: 800; margin-bottom: 5px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .profile-email { color: var(--gray); font-size: 12px; margin-bottom: 8px; word-break: break-all; }
        .profile-badges { display: flex; gap: 6px; flex-wrap: wrap; }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(212, 175, 55, 0.15);
            color: var(--gold);
            font-size: 10px;
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            font-weight: 700;
        }
        .badge.admin { background: rgba(220, 38, 38, 0.15); color: #fca5a5; border-color: rgba(220, 38, 38, 0.4); }
        .profile-actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .profile-btn {
            flex: 1;
            min-width: 130px;
            padding: 12px 18px;
            border-radius: 10px;
            background: rgba(10, 10, 15, 0.6);
            color: var(--white);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-decoration: none;
        }
        .profile-btn:hover {
            background: rgba(10, 10, 15, 0.9);
            border-color: rgba(212, 175, 55, 0.4);
            color: var(--gold);
        }
        .profile-btn.danger { color: var(--red); border-color: rgba(239, 68, 68, 0.3); }
        .profile-btn.danger:hover { background: rgba(239, 68, 68, 0.1); border-color: var(--red); color: #fca5a5; }

        /* ============= Modal ============= */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: var(--bg-card);
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 25px;
            border-radius: 20px;
            max-width: 400px;
            width: 100%;
        }
        .modal h3 { color: var(--white); font-size: 17px; margin-bottom: 18px; text-align: center; }
        .modal-input {
            width: 100%;
            padding: 13px 16px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: rgba(10, 10, 15, 0.6);
            color: var(--white);
            font-size: 14px;
            outline: none;
            margin-bottom: 12px;
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            transition: 0.3s;
        }
        .modal-input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.1);
        }
        .modal-buttons { display: flex; gap: 10px; margin-top: 18px; }
        .modal-btn {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }
        .modal-btn.primary { background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: var(--bg-primary); }
        .modal-btn.primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(212, 175, 55, 0.4); }
        .modal-btn.secondary { background: rgba(10, 10, 15, 0.6); color: var(--white); border: 1px solid rgba(255, 255, 255, 0.1); }
        .modal-btn.secondary:hover { background: rgba(10, 10, 15, 0.9); }
        .message { padding: 10px 14px; border-radius: 10px; margin-bottom: 12px; font-size: 12px; text-align: center; display: none; }
        .message.success { background: rgba(16, 185, 129, 0.15); color: var(--green); border: 1px solid rgba(16, 185, 129, 0.4); display: block; }

    <script>
        // ==========================================

        const SUPABASE_URL = 'https://jcwwilatvstjrohvhtss.supabase.co';

        // ==========================================

        function setupNavbar() {
            const hamburger = document.getElementById('snHamburger');
            const sidebar = document.getElementById('snSidebar');
            const overlay = document.getElementById('snOverlay');
            const closeBtn = document.getElementById('snClose');

            hamburger.addEventListener('click', () => {
                sidebar.classList.add('show');
                overlay.classList.add('show');
            });

            closeBtn.addEventListener('click', () => {
                sidebar.classList.remove('show');
                overlay.classList.remove('show');
            });

            overlay.addEventListener('click', () => {
                sidebar.classList.remove('show');
                overlay.classList.remove('show');
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    sidebar.classList.remove('show');
                    overlay.classList.remove('show');
                }
            });

            // هایلایت صفحه فعلی
            const currentPath = window.location.pathname.split('/').pop() || 'index.html';
            document.querySelectorAll('.sn-menu-item').forEach(item => {
                if (item.getAttribute('href') === currentPath) {
                    item.classList.add('active');
                }
            });
        }

        function updateNavbarUser() {
            if (!currentUser) return;

            const fullName = currentUser.user_metadata?.full_name || currentUser.email || 'کاربر';
            const firstLetter = fullName.charAt(0).toUpperCase();
            const isAdmin = currentUser.email === ADMIN_EMAIL;

            const userArea = document.getElementById('snUserArea');
            if (userArea) {
                userArea.innerHTML = `
                    <a href="dashboard.html" class="sn-user-avatar" title="${escapeHtml(fullName)}">
                        ${firstLetter}
                    </a>
                `;
            }

            const logoutBtn = document.getElementById('snLogoutBtn');
            if (logoutBtn) {
                logoutBtn.style.display = 'flex';
                logoutBtn.addEventListener('click', async (e) => {
                    e.preventDefault();
                    if (confirm('می‌خوای خارج بشی؟')) {
                        await supabaseClient.auth.signOut();
                        window.location.href = 'login.html';
                    }
                });
            }

            if (isAdmin) {
                const adminLink = document.getElementById('snAdminLink');
                if (adminLink) adminLink.style.display = 'flex';
            }
        }

        // ==========================================
        // Load Profile
        // ==========================================
        async function loadProfile() {
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (!session) {
                    window.location.href = 'login.html';
                    return;
                }

                currentUser = session.user;
                updateNavbarUser();

                const fullName = currentUser.user_metadata?.full_name || 'کاربر عزیز';
                const email = currentUser.email;
                const firstLetter = fullName.charAt(0).toUpperCase();
                const joinDate = new Date(currentUser.created_at).toLocaleDateString('fa-IR', {
                    year: 'numeric', month: 'long', day: 'numeric'
                });

                const isAdmin = (email === ADMIN_EMAIL);
                const completedCourses = currentUser.user_metadata?.completed_courses || [];
                const inProgressCourses = currentUser.user_metadata?.in_progress_courses || [];
                const completedLessons = currentUser.user_metadata?.completed_lessons || {};
                const personalityResult = currentUser.user_metadata?.personality_result;
                const totalCourses = completedCourses.length + inProgressCourses.length;

                // Continue Learning
                let continueHTML = '';
                if (inProgressCourses.length > 0) {
                    const firstId = inProgressCourses[0];
                    const info = staticCourses[firstId];
                    if (info) {
                        const completedCount = (completedLessons[firstId] || []).length;
                        const percent = Math.round((completedCount / info.lessons) * 100);
                        const nextLesson = completedCount + 1;
                        continueHTML = `
                            <div class="continue-card">
                                <div class="continue-header">
                                    <div class="continue-icon">🎯</div>
                                    <div>
                                        <div class="continue-title">ادامه یادگیری</div>
                                        <div class="continue-subtitle">از جایی که رها کردی</div>
                                    </div>
                                </div>
                                <div class="continue-body">
                                    <div class="continue-course-info">
                                        <div class="continue-course-icon">${info.icon}</div>
                                        <div class="continue-course-details">
                                            <div class="continue-course-name">${info.title}</div>
                                            <div class="continue-lesson-name">درس ${toPersianNum(nextLesson)} از ${toPersianNum(info.lessons)}</div>
                                        </div>
                                    </div>
                                    <div class="continue-progress-bar">
                                        <div class="continue-progress-fill" style="width: ${percent}%"></div>
                                    </div>
                                    <div class="continue-progress-info">
                                        <span>${toPersianNum(completedCount)} از ${toPersianNum(info.lessons)} درس</span>
                                        <span>${toPersianNum(percent)}٪</span>
                                    </div>
                                </div>
                                <a href="lesson.html?course=${firstId}&lesson=${nextLesson}" class="continue-btn">ادامه بده ←</a>
                            </div>
                        `;
                    }
                }

                // My Courses
                let myCoursesHTML = '';
                if (totalCourses === 0) {
                    myCoursesHTML = `
                        <div class="empty-state">
                            📚 هنوز در هیچ دوره‌ای ثبت‌نام نکردی.<br><br>
                            <a href="courses.html">مشاهده دوره‌های رایگان →</a>
                        </div>
                    `;
                } else {
                    completedCourses.forEach(courseId => {
                        const info = staticCourses[courseId];
                        if (info) {
                            myCoursesHTML += `
                                <div class="course-item">
                                    <div class="course-item-icon">${info.icon}</div>
                                    <div class="course-item-info">
                                        <div class="course-item-title">${info.title}</div>
                                        <div class="course-item-progress">
                                            <div class="course-item-progress-fill" style="width: 100%"></div>
                                        </div>
                                    </div>
                                    <div class="course-item-percent done">✅</div>
                                </div>
                            `;
                        }
                    });

                    inProgressCourses.forEach(courseId => {
                        const info = staticCourses[courseId];
                        if (info) {
                            const completedCount = (completedLessons[courseId] || []).length;
                            const percent = Math.round((completedCount / info.lessons) * 100);
                            myCoursesHTML += `
                                <div class="course-item">
                                    <div class="course-item-icon">${info.icon}</div>
                                    <div class="course-item-info">
                                        <div class="course-item-title">${info.title}</div>
                                        <div class="course-item-progress">
                                            <div class="course-item-progress-fill" style="width: ${percent}%"></div>
                                        </div>
                                    </div>
                                    <div class="course-item-percent">${toPersianNum(percent)}٪</div>
                                </div>
                            `;
                        }
                    });
                }

                // Achievements
                const achievements = [
                    { icon: '🥇', title: 'کاربر طلایی', unlocked: completedCourses.length >= 3 },
                    { icon: '🎓', title: 'دانشجوی فعال', unlocked: totalCourses >= 2 },
                    { icon: '🎯', title: 'تست شخصیت', unlocked: !!personalityResult },
                    { icon: '🔥', title: 'شروع قدرتمند', unlocked: totalCourses >= 1 },
                    { icon: '⭐', title: 'عضو وفادار', unlocked: true },
                    { icon: '🏆', title: 'حرفه‌ای', unlocked: completedCourses.length >= 5 }
                ];

                const achievementsHTML = achievements.map(a => `
                    <div class="achievement ${a.unlocked ? 'unlocked' : 'locked'}">
                        <div class="achievement-icon">${a.icon}</div>
                        <div class="achievement-title">${a.title}</div>
                    </div>
                `).join('');

                // Suggestion
                let suggestionHTML = '';
                if (totalCourses === 0) {
                    suggestionHTML = `
                        <div class="ai-suggestion">
                            <div class="ai-suggestion-icon">👋</div>
                            <div class="ai-suggestion-content">
                                <div class="ai-suggestion-title">خوش آمدی!</div>
                                <div class="ai-suggestion-text">برای شروع، دوره «اقتصاد کلان» رو پیشنهاد می‌کنیم — کاملاً رایگان.</div>
                                <a href="courses.html" class="ai-suggestion-btn">شروع کن ←</a>
                            </div>
                        </div>
                    `;
                }

                document.getElementById('content').innerHTML = `
                    <div class="welcome-hero">
                        <div class="welcome-text">
                            <h1>سلام <span class="gold">${escapeHtml(fullName)}</span> 👋</h1>
                            <p>خوش برگشتی! امروز چه خبر؟</p>
                        </div>
                        <div class="welcome-streak">
                            <div class="streak-icon">🔥</div>
                            <div class="streak-info">
                                <div class="streak-value">${toPersianNum(totalCourses)}</div>
                                <div class="streak-label">دوره فعال</div>
                            </div>
                        </div>
                    </div>

                    ${continueHTML}

                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-icon">📚</div>
                            <div class="stat-value">${toPersianNum(totalCourses)}</div>
                            <div class="stat-label">دوره ثبت‌نام شده</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">✅</div>
                            <div class="stat-value">${toPersianNum(completedCourses.length)}</div>
                            <div class="stat-label">دوره تکمیل شده</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">🎯</div>
                            <div class="stat-value">${personalityResult ? '✓' : '--'}</div>
                            <div class="stat-label">تست شخصیت</div>
                        </div>
                    </div>

                    <div class="section">
                        <div class="section-header">
                            <div class="section-title">📚 دوره‌های من</div>
                            <a href="courses.html" class="section-link">مشاهده همه ←</a>
                        </div>
                        ${myCoursesHTML}
                    </div>

                    ${suggestionHTML}

                    <div class="section">
                        <div class="section-header">
                            <div class="section-title">🏆 دستاوردها</div>
                        </div>
                        <div class="achievements-grid">${achievementsHTML}</div>
                    </div>

                    <div class="section">
                        <div class="section-header">
                            <div class="section-title">⚡ دسترسی سریع</div>
                        </div>
                        <div class="quick-grid">
                            <a href="home.html" class="quick-link">
                                <div class="quick-link-icon">📊</div>
                                <div class="quick-link-title">نمای بازار</div>
                            </a>
                            <a href="assistant.html" class="quick-link">
                                <div class="quick-link-icon">🤖</div>
                                <div class="quick-link-title">دستیار هوشمند</div>
                            </a>
                            <a href="bourse.html" class="quick-link">
                                <div class="quick-link-icon">🏢</div>
                                <div class="quick-link-title">بورس ایران</div>
                            </a>
                            <a href="personality-test.html" class="quick-link">
                                <div class="quick-link-icon">🧠</div>
                                <div class="quick-link-title">آزمون خودشناسی</div>
                            </a>
                        </div>
                    </div>

                    <div class="profile-card">
                        <div class="profile-header">
                            <div class="profile-avatar">${firstLetter}</div>
                            <div class="profile-info">
                                <div class="profile-name">
                                    ${escapeHtml(fullName)}
                                    ${isAdmin ? '<span class="badge admin">👑 ادمین</span>' : ''}
                                </div>
                                <div class="profile-email">${escapeHtml(email)}</div>
                                <div class="profile-badges">
                                    <span class="badge">✨ عضو از ${joinDate}</span>
                                </div>
                            </div>
                        </div>
                        <div class="profile-actions">
                            <button class="profile-btn" onclick="openEditName()">✏️ ویرایش نام</button>
                            <button class="profile-btn" onclick="openChangePass()">🔒 تغییر رمز</button>
                            ${isAdmin ? '<a href="admin.html" class="profile-btn" style="background: rgba(220,38,38,0.15); color:#fca5a5; border-color: rgba(220,38,38,0.4);">🎯 پنل ادمین</a>' : ''}
                            <button class="profile-btn danger" onclick="handleLogout()">🚪 خروج</button>
                        </div>
                    </div>
                `;

            } catch (err) {
                console.log('Error:', err);
                document.getElementById('content').innerHTML = `
                    <div class="loading">❌ خطا در بارگذاری. لطفاً دوباره تلاش کن.</div>
                `;
            }
        }

        // ==========================================
        // Modal Functions
        // ==========================================
        function openEditName() {
            const currentName = currentUser.user_metadata?.full_name || '';
            document.getElementById('editNameInput').value = currentName;
            document.getElementById('editNameMsg').className = 'message';
            document.getElementById('editNameModal').classList.add('show');
        }

        async function saveName() {
            const newName = document.getElementById('editNameInput').value.trim();
            const msg = document.getElementById('editNameMsg');

            if (!newName) {
                msg.textContent = '❌ لطفاً نام را وارد کن';
                msg.className = 'message error';
                return;
            }

            const { error } = await supabaseClient.auth.updateUser({
                data: { full_name: newName }
            });

            if (error) {
                msg.textContent = '❌ ' + error.message;
                msg.className = 'message error';
            } else {
                msg.textContent = '✅ نام تغییر کرد';
                msg.className = 'message success';
                setTimeout(() => {
                    closeModal('editNameModal');
                    loadProfile();
                }, 1500);
            }
        }

        function openChangePass() {
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmPassword').value = '';
            document.getElementById('changePassMsg').className = 'message';
            document.getElementById('changePassModal').classList.add('show');
        }

        async function savePassword() {
            const newPass = document.getElementById('newPassword').value;
            const confirmPass = document.getElementById('confirmPassword').value;
            const msg = document.getElementById('changePassMsg');

            if (newPass.length < 6) {
                msg.textContent = '❌ رمز باید حداقل ۶ کاراکتر باشه';
                msg.className = 'message error';
                return;
            }

            if (newPass !== confirmPass) {
                msg.textContent = '❌ رمزها یکسان نیستن';
                msg.className = 'message error';
                return;
            }

            const { error } = await supabaseClient.auth.updateUser({ password: newPass });

            if (error) {
                msg.textContent = '❌ ' + error.message;
                msg.className = 'message error';
            } else {
                msg.textContent = '✅ رمز تغییر کرد';
                msg.className = 'message success';
                setTimeout(() => closeModal('changePassModal'), 1500);
            }
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('show');
        }

        async function handleLogout() {
            if (confirm('مطمئنی می‌خوای خارج بشی؟')) {
                await supabaseClient.auth.signOut();
                window.location.href = 'login.html';
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function toPersianNum(num) {
            if (num === 0 || num === null || num === undefined) return '۰';
            const persianDigits = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
            return String(num).replace(/\d/g, d => persianDigits[d]);
        }

        // ==========================================
        // راه‌اندازی
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => {
            setupNavbar();
            loadProfile();
        });
    </script>
