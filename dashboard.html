<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل کاربری | آکادمی شمعدون</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Tahoma, sans-serif;
            background-color: #0f172a;
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(245, 158, 11, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(59, 130, 246, 0.08) 0%, transparent 40%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 50px 50px, 50px 50px;
            background-attachment: fixed;
            min-height: 100vh;
            direction: rtl;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        .card {
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(15px);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.08);
            text-align: center;
            margin-bottom: 20px;
        }

        .avatar-large {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 15px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            color: #0f172a;
            font-weight: bold;
            border: 4px solid #f59e0b;
        }

        .welcome {
            color: #f59e0b;
            font-size: 26px;
            margin-bottom: 10px;
        }

        .user-name {
            color: #f1f5f9;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .user-email {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .btn-logout {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 12px 30px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
            font-family: Tahoma, sans-serif;
        }
        .btn-logout:hover {
            background: #dc2626;
            transform: translateY(-2px);
        }

        .section-title {
            color: #f1f5f9;
            font-size: 18px;
            margin-bottom: 15px;
            border-bottom: 2px solid #f59e0b;
            display: inline-block;
            padding-bottom: 5px;
        }

        .quick-links {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-top: 20px;
        }

        .quick-link {
            background: rgba(15, 23, 42, 0.6);
            padding: 18px;
            border-radius: 15px;
            text-decoration: none;
            color: #f1f5f9;
            border-top: 3px solid #f59e0b;
            transition: 0.3s;
            text-align: center;
        }
        .quick-link:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .quick-link .icon { font-size: 30px; margin-bottom: 8px; }
        .quick-link h3 { font-size: 14px; margin-bottom: 3px; }
        .quick-link p { font-size: 12px; color: #94a3b8; }

        .loading {
            color: #94a3b8;
            text-align: center;
            padding: 50px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="container" id="content">
        <div class="loading">⏳ در حال بارگذاری...</div>
    </div>

    <script>
        const SUPABASE_URL = 'https://jcwwilatvstjrohvhtss.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_R7tCe030dGeJ0IRWfcgxww_MgEfh95O';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadDashboard() {
            const { data: { session } } = await supabaseClient.auth.getSession();

            if (!session) {
                window.location.href = 'login.html';
                return;
            }

            const user = session.user;
            const fullName = user.user_metadata?.full_name || 'کاربر عزیز';
            const email = user.email;
            const firstLetter = fullName.charAt(0);

            document.getElementById('content').innerHTML = `
                <div class="card">
                    <div class="avatar-large">${firstLetter}</div>
                    <h1 class="welcome">🎉 خوش آمدید!</h1>
                    <div class="user-name">${fullName}</div>
                    <div class="user-email">${email}</div>
                    <button class="btn-logout" onclick="handleLogout()">🚪 خروج از حساب</button>
                </div>

                <div class="card">
                    <h2 class="section-title">📌 دسترسی سریع</h2>
                    <div class="quick-links">
                        <a href="index.html" class="quick-link">
                            <div class="icon">🏠</div>
                            <h3>صفحه اصلی</h3>
                            <p>پنل تحلیلی</p>
                        </a>
                        <a href="bourse.html" class="quick-link">
                            <div class="icon">🏢</div>
                            <h3>بورس ایران</h3>
                            <p>مشاهده سهام</p>
                        </a>
                        <a href="gold-analysis.html" class="quick-link">
                            <div class="icon">📊</div>
                            <h3>تحلیل روزانه</h3>
                            <p>تحلیل بازار</p>
                        </a>
                        <a href="courses.html" class="quick-link">
                            <div class="icon">🎓</div>
                            <h3>دوره‌های آموزشی</h3>
                            <p>آموزش تخصصی</p>
                        </a>
                    </div>
                </div>
            `;
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            window.location.href = 'login.html';
        }

        loadDashboard();
    </script>

</body>
</html>
