<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وبلاگ | آکادمی شمعدون</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
    <meta name="theme-color" content="#d4af37">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #14141c;
            --bg-card: #1a1a24;
            --gold: #d4af37;
            --gold-light: #f4d47c;
            --gold-dark: #a8862a;
            --green: #10b981;
            --red: #ef4444;
            --blue: #3b82f6;
            --white: #f8fafc;
            --gray: #94a3b8;
        }

        /* ===== تم روز ===== */
        [data-theme="light"] {
            --bg-primary: #f8fafc;
            --bg-secondary: #eef2f7;
            --bg-card: #ffffff;
            --gold: #b8860b;
            --gold-light: #d4af37;
            --gold-dark: #8b6508;
            --green: #059669;
            --red: #dc2626;
            --blue: #2563eb;
            --white: #0f172a;
            --gray: #64748b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background-color: var(--bg-primary);
            background-image:
                radial-gradient(circle at 0% 0%, rgba(212, 175, 55, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(59, 130, 246, 0.06) 0%, transparent 40%),
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 60px 60px, 60px 60px;
            background-attachment: fixed;
            color: var(--white);
            min-height: 100vh;
            direction: rtl;
            overflow-x: hidden;
            transition: background-color 0.3s, color 0.3s;
        }
       [data-theme="light"] body {
            background-image:
                radial-gradient(circle at 0% 0%, rgba(184, 134, 11, 0.06) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(37, 99, 235, 0.05) 0%, transparent 40%),
                linear-gradient(rgba(0, 0, 0, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.025) 1px, transparent 1px);
        }
        [data-theme="light"] .page-header h1 {
            background: linear-gradient(135deg, #b8860b, #8b6508) !important;
            -webkit-background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            background-clip: text !important;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .main-container { max-width: 1200px; margin: 0 auto; padding: 100px 20px 40px; }

        .page-header {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeInUp 0.6s ease-out;
        }
        .page-header h1 {
            font-size: 36px; font-weight: 900; margin-bottom: 10px;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .page-header p { color: var(--gray); font-size: 14px; }

        /* ===== Search ===== */
        .search-box {
            max-width: 600px;
            margin: 0 auto 25px;
            position: relative;
        }
        .search-box input {
            width: 100%;
            padding: 15px 50px 15px 20px;
            background: rgba(20, 20, 28, 0.8);
            border: 2px solid rgba(212, 175, 55, 0.2);
            border-radius: 14px;
            color: var(--white);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: 0.3s;
        }
        .search-box input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.1);
        }
        .search-box input::placeholder { color: var(--gray); }
        .search-icon {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            pointer-events: none;
        }

        /* ===== Categories ===== */
        .category-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 30px;
            overflow-x: auto;
            padding-bottom: 8px;
            scrollbar-width: thin;
            justify-content: center;
            flex-wrap: wrap;
        }
        .category-tab {
            padding: 10px 18px;
            background: rgba(20, 20, 28, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: var(--gray);
            font-size: 13px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: 0.3s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .category-tab:hover {
            color: var(--gold);
            border-color: rgba(212, 175, 55, 0.4);
        }
        .category-tab.active {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--bg-primary);
            border-color: var(--gold);
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.3);
        }
        .category-tab .count {
            background: rgba(0, 0, 0, 0.2);
            padding: 2px 8px;
            border-radius: 8px;
            font-size: 11px;
        }

        /* ===== Featured Post ===== */
        .featured-post {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.08), rgba(212, 175, 55, 0.02));
            border: 2px solid rgba(212, 175, 55, 0.35);
            border-radius: 22px;
            overflow: hidden;
            margin-bottom: 30px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            transition: 0.3s;
            text-decoration: none;
            color: inherit;
            animation: fadeInUp 0.6s ease-out 0.1s backwards;
        }
        .featured-post:hover {
            transform: translateY(-5px);
            border-color: var(--gold);
            box-shadow: 0 20px 50px rgba(212, 175, 55, 0.2);
        }
        .featured-image {
            height: 100%;
            min-height: 350px;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.2), rgba(20, 20, 28, 0.9));
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            position: relative;
        }
        .featured-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--bg-primary);
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 800;
        }
        .featured-content {
            padding: 35px 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .featured-category {
            display: inline-block;
            background: rgba(212, 175, 55, 0.15);
            color: var(--gold);
            padding: 5px 12px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 800;
            margin-bottom: 15px;
            align-self: flex-start;
        }
        .featured-title {
            color: var(--white);
            font-size: 26px;
            font-weight: 900;
            line-height: 1.4;
            margin-bottom: 15px;
        }
        .featured-excerpt {
            color: var(--gray);
            font-size: 14px;
            line-height: 1.9;
            margin-bottom: 20px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .featured-meta {
            display: flex;
            gap: 15px;
            color: var(--gray);
            font-size: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .featured-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .featured-cta {
            color: var(--gold);
            font-size: 14px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ===== Posts Grid ===== */
        .posts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }
        .post-card {
            background: linear-gradient(135deg, var(--bg-card), var(--bg-secondary));
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 18px;
            overflow: hidden;
            transition: 0.3s;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            animation: fadeInUp 0.4s ease-out backwards;
        }
        .post-card:hover {
            transform: translateY(-5px);
            border-color: rgba(212, 175, 55, 0.5);
            box-shadow: 0 15px 40px rgba(212, 175, 55, 0.15);
        }
        .post-image {
            width: 100%;
            height: 180px;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.15), rgba(20, 20, 28, 0.9));
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
        }
        .post-content {
            padding: 18px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .post-category {
            display: inline-block;
            background: rgba(212, 175, 55, 0.15);
            color: var(--gold);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 800;
            margin-bottom: 10px;
            align-self: flex-start;
        }
        .post-title {
            color: var(--white);
            font-size: 15px;
            font-weight: 800;
            line-height: 1.6;
            margin-bottom: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .post-excerpt {
            color: var(--gray);
            font-size: 12.5px;
            line-height: 1.7;
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .post-footer {
            margin-top: auto;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--gray);
        }
        .post-footer .date,
        .post-footer .read-time {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* ===== Loading / Empty ===== */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--gray);
            grid-column: 1 / -1;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid rgba(212, 175, 55, 0.2);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        /* ===== Footer ===== */
        .footer {
            text-align: center;
            padding: 30px 20px;
            color: var(--gray);
            font-size: 12px;
            border-top: 1px solid rgba(212, 175, 55, 0.1);
            margin-top: 40px;
        }

        /* ===================================================== */
        /* 🌙 تم روشن - !important برای غلبه بر رنگ‌های hardcode */
        /* ===================================================== */
        [data-theme="light"] body {
            background-color: #f8fafc !important;
            color: #0f172a !important;
        }
        [data-theme="light"] .search-box input {
            background: #ffffff !important;
            border-color: rgba(184, 134, 11, 0.3) !important;
            color: #0f172a !important;
        }
        [data-theme="light"] .search-box input::placeholder {
            color: #94a3b8 !important;
        }
        [data-theme="light"] .category-tab {
            background: rgba(255, 255, 255, 0.8) !important;
            color: #475569 !important;
            border-color: rgba(0, 0, 0, 0.1) !important;
        }
        [data-theme="light"] .category-tab:hover {
            color: #b8860b !important;
            border-color: rgba(184, 134, 11, 0.5) !important;
        }
        [data-theme="light"] .category-tab.active {
            background: linear-gradient(135deg, #d4af37, #a8862a) !important;
            color: #ffffff !important;
            border-color: #b8860b !important;
        }
        [data-theme="light"] .featured-post {
            background: linear-gradient(135deg, rgba(184, 134, 11, 0.08), rgba(184, 134, 11, 0.02)) !important;
            border-color: rgba(184, 134, 11, 0.35) !important;
        }
        [data-theme="light"] .featured-image:not([style*="background-image"]) {
            background: linear-gradient(135deg, rgba(184, 134, 11, 0.15), rgba(241, 245, 249, 0.9)) !important;
        }
        [data-theme="light"] .featured-title {
            color: #0f172a !important;
        }
        [data-theme="light"] .featured-excerpt {
            color: #475569 !important;
        }
        [data-theme="light"] .featured-meta {
            color: #64748b !important;
        }
        [data-theme="light"] .post-card {
            background: linear-gradient(135deg, #ffffff, #eef2f7) !important;
            border-color: rgba(184, 134, 11, 0.15) !important;
        }
        [data-theme="light"] .post-card:hover {
            border-color: rgba(184, 134, 11, 0.5) !important;
        }
        [data-theme="light"] .post-image:not([style*="background-image"]) {
            background: linear-gradient(135deg, rgba(184, 134, 11, 0.1), rgba(241, 245, 249, 0.9)) !important;
        }
        [data-theme="light"] .post-title {
            color: #0f172a !important;
        }
        [data-theme="light"] .post-excerpt {
            color: #475569 !important;
        }
        [data-theme="light"] .post-footer {
            border-top-color: rgba(0, 0, 0, 0.06) !important;
            color: #64748b !important;
        }
        [data-theme="light"] .loading {
            color: #64748b !important;
        }
        [data-theme="light"] .footer {
            color: #64748b !important;
        }

        /* ===== Responsive ===== */
        @media (max-width: 900px) {
            .featured-post {
                grid-template-columns: 1fr;
            }
            .featured-image {
                min-height: 220px;
            }
            .featured-title { font-size: 22px; }
        }
        @media (max-width: 600px) {
            .main-container { padding: 90px 15px 30px; }
            .page-header h1 { font-size: 26px; }
            .posts-grid { grid-template-columns: 1fr; }
            .featured-content { padding: 25px 20px; }
            .featured-title { font-size: 20px; }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="page-header">
            <h1>📝 وبلاگ شمعدون</h1>
            <p>مقالات تحلیلی و آموزشی بازارهای مالی</p>
        </div>

        <!-- ===== Search ===== -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="جستجو در مقالات..." oninput="handleSearch()">
            <span class="search-icon">🔍</span>
        </div>

        <!-- ===== Categories ===== -->
        <div class="category-tabs" id="categoryTabs">
            <button class="category-tab active" onclick="filterByCategory('all', this)">
                <span>📚 همه</span>
                <span class="count" id="count-all">۰</span>
            </button>
        </div>

        <!-- ===== Featured Post ===== -->
        <div id="featuredContainer"></div>

        <!-- ===== Posts Grid ===== -->
        <div class="posts-grid" id="postsGrid">
            <div class="loading">
                <div class="spinner"></div>
                ⏳ در حال بارگذاری مقالات...
            </div>
        </div>
    </div>

    <footer class="footer">
        © ۱۴۰۵ آکادمی شمعدون | تمامی حقوق محفوظ است
    </footer>

    <script src="navbar.js"></script>
    <script src="supabase-config.js"></script>

    <script>
        let allPosts = [];
        let filteredPosts = [];
        let currentCategory = 'all';
        let currentSearch = '';

        const CATEGORY_ICONS = {
            'همه': '📚',
            'آموزش': '📚',
            'تحلیل تکنیکال': '📈',
            'تحلیل بنیادی': '🔬',
            'روانشناسی': '🧠',
            'ابزارها': '🛠️',
            'اخبار': '📰'
        };

        const CATEGORY_NAMES = {
            'همه': 'همه',
            'آموزش': 'آموزش',
            'تحلیل تکنیکال': 'تحلیل تکنیکال',
            'تحلیل بنیادی': 'تحلیل بنیادی',
            'روانشناسی': 'روانشناسی بازار',
            'ابزارها': 'ابزارها',
            'اخبار': 'اخبار'
        };

        // ==========================================
        // ابزارها
        // ==========================================
        function toFa(num) {
            if (num === null || num === undefined) return '۰';
            const persianDigits = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
            return String(num).replace(/\d/g, d => persianDigits[d]);
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(iso) {
            if (!iso) return '';
            try {
                const d = new Date(iso);
                const now = new Date();
                const diff = Math.floor((now - d) / 1000 / 60);

                if (diff < 60) return 'همین الان';
                if (diff < 1440) return toFa(Math.floor(diff / 60)) + ' ساعت پیش';
                if (diff < 10080) return toFa(Math.floor(diff / 1440)) + ' روز پیش';

                return new Intl.DateTimeFormat('fa-IR', {
                    year: 'numeric', month: 'short', day: 'numeric'
                }).format(d);
            } catch (e) { return ''; }
        }

        // ==========================================
        // لود مقالات از Supabase
        // ==========================================
        async function loadPosts() {
            const grid = document.getElementById('postsGrid');

            try {
                const { data, error } = await db
                    .from('blog_posts')
                    .select('*')
                    .eq('status', 'published')
                    .order('published_at', { ascending: false });

                if (error) throw error;

                allPosts = data || [];

                if (allPosts.length === 0) {
                    grid.innerHTML = `
                        <div class="loading">
                            📭 هنوز مقاله‌ای منتشر نشده
                        </div>
                    `;
                    return;
                }

                buildCategoryTabs();
                renderPosts();

            } catch (e) {
                console.error('Load posts error:', e);
                grid.innerHTML = `
                    <div class="loading">
                        ❌ خطا در بارگذاری مقالات
                    </div>
                `;
            }
        }

        // ==========================================
        // ساخت تب‌های دسته‌بندی
        // ==========================================
        function buildCategoryTabs() {
            const tabs = document.getElementById('categoryTabs');

            // شمارش مقالات در هر دسته
            const counts = { all: allPosts.length };
            allPosts.forEach(p => {
                const cat = p.category || 'آموزش';
                counts[cat] = (counts[cat] || 0) + 1;
            });

            let html = `
                <button class="category-tab active" onclick="filterByCategory('all', this)">
                    <span>📚 همه</span>
                    <span class="count">${toFa(counts.all)}</span>
                </button>
            `;

            // لیست دسته‌ها به ترتیب استاندارد
            const categories = ['آموزش', 'تحلیل تکنیکال', 'تحلیل بنیادی', 'روانشناسی', 'ابزارها', 'اخبار'];

            categories.forEach(cat => {
                if (counts[cat]) {
                    const icon = CATEGORY_ICONS[cat] || '📄';
                    html += `
                        <button class="category-tab" onclick="filterByCategory('${cat}', this)">
                            <span>${icon} ${cat}</span>
                            <span class="count">${toFa(counts[cat])}</span>
                        </button>
                    `;
                }
            });

            tabs.innerHTML = html;
        }

        // ==========================================
        // فیلتر دسته‌بندی
        // ==========================================
        function filterByCategory(cat, btn) {
            currentCategory = cat;

            document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
            if (btn) btn.classList.add('active');

            renderPosts();
        }

        // ==========================================
        // جستجو
        // ==========================================
        function handleSearch() {
            currentSearch = document.getElementById('searchInput').value.trim().toLowerCase();
            renderPosts();
        }

        // ==========================================
        // رندر مقالات
        // ==========================================
        function renderPosts() {
            // فیلتر
            filteredPosts = allPosts.filter(p => {
                if (currentCategory !== 'all' && p.category !== currentCategory) return false;
                if (currentSearch) {
                    const text = ((p.title || '') + ' ' + (p.excerpt || '') + ' ' + (p.content || '')).toLowerCase();
                    if (!text.includes(currentSearch)) return false;
                }
                return true;
            });

            // مقاله ویژه (فقط اگه فیلتر «همه» و بدون جستجو)
            const featured = (currentCategory === 'all' && !currentSearch)
                ? filteredPosts.find(p => p.featured)
                : null;

            // رندر مقاله ویژه
            const featuredContainer = document.getElementById('featuredContainer');
            if (featured) {
                featuredContainer.innerHTML = `
                    <a href="blog-post.html?slug=${encodeURIComponent(featured.slug)}" class="featured-post">
                        <div class="featured-image" style="${featured.cover_image ? `background-image: url('${featured.cover_image}');` : ''}">
                            ${featured.cover_image ? '' : '🌟'}
                            <span class="featured-badge">⭐ مقاله ویژه</span>
                        </div>
                        <div class="featured-content">
                            <span class="featured-category">${CATEGORY_ICONS[featured.category] || '📄'} ${featured.category || 'مقاله'}</span>
                            <h2 class="featured-title">${escapeHtml(featured.title)}</h2>
                            <p class="featured-excerpt">${escapeHtml(featured.excerpt || '')}</p>
                            <div class="featured-meta">
                                <span>✍️ ${escapeHtml(featured.author_name || 'مهدی')}</span>
                                <span>📅 ${formatDate(featured.published_at || featured.created_at)}</span>
                                <span>⏱️ ${toFa(featured.read_time || 5)} دقیقه</span>
                            </div>
                            <div class="featured-cta">ادامه مطلب ←</div>
                        </div>
                    </a>
                `;
            } else {
                featuredContainer.innerHTML = '';
            }

            // مقالات معمولی (بدون ویژه)
            const regularPosts = filteredPosts.filter(p => !featured || p.id !== featured.id);

            const grid = document.getElementById('postsGrid');

            if (regularPosts.length === 0 && !featured) {
                grid.innerHTML = `
                    <div class="loading">
                        📭 مقاله‌ای با این فیلتر یافت نشد
                    </div>
                `;
                return;
            }

            if (regularPosts.length === 0) {
                grid.innerHTML = '';
                return;
            }

            grid.innerHTML = regularPosts.map((p, idx) => `
                <a href="blog-post.html?slug=${encodeURIComponent(p.slug)}" class="post-card" style="animation-delay: ${Math.min(idx * 0.05, 0.5)}s">
                    <div class="post-image" style="${p.cover_image ? `background-image: url('${p.cover_image}');` : ''}">
                        ${p.cover_image ? '' : (CATEGORY_ICONS[p.category] || '📄')}
                    </div>
                    <div class="post-content">
                        <span class="post-category">${CATEGORY_ICONS[p.category] || '📄'} ${p.category || 'مقاله'}</span>
                        <h3 class="post-title">${escapeHtml(p.title)}</h3>
                        <p class="post-excerpt">${escapeHtml(p.excerpt || '')}</p>
                        <div class="post-footer">
                            <span class="date">📅 ${formatDate(p.published_at || p.created_at)}</span>
                            <span class="read-time">⏱️ ${toFa(p.read_time || 5)} دقیقه</span>
                        </div>
                    </div>
                </a>
            `).join('');
        }

        // ==========================================
        // 🌙 تم شب/روز
        // ==========================================
        function applyTheme() {
            const saved = localStorage.getItem('shamdun-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', saved);
            const icon = document.getElementById('snThemeIcon');
            if (icon) icon.textContent = saved === 'dark' ? '🌙' : '☀️';
        }

        function addThemeButtonToNavbar() {
            const navbarContainer = document.querySelector('.sn-navbar-container');
            if (!navbarContainer) {
                setTimeout(addThemeButtonToNavbar, 200);
                return;
            }
            if (document.getElementById('snThemeBtn')) return;

            const themeBtn = document.createElement('button');
            themeBtn.className = 'sn-action-btn';
            themeBtn.id = 'snThemeBtn';
            themeBtn.setAttribute('aria-label', 'تغییر تم');
            themeBtn.setAttribute('title', 'تغییر تم');
            themeBtn.style.cssText = 'width:42px;height:42px;border-radius:12px;background:rgba(212,175,55,0.08);border:1px solid rgba(212,175,55,0.25);color:var(--gold);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:inherit;';
            themeBtn.innerHTML = '<span id="snThemeIcon">🌙</span>';

            const userArea = navbarContainer.querySelector('.sn-user-area');
            if (userArea) {
                navbarContainer.insertBefore(themeBtn, userArea);
            } else {
                navbarContainer.appendChild(themeBtn);
            }

            themeBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                const current = document.documentElement.getAttribute('data-theme') || 'dark';
                const newTheme = current === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('shamdun-theme', newTheme);
                const icon = document.getElementById('snThemeIcon');
                if (icon) icon.textContent = newTheme === 'dark' ? '🌙' : '☀️';
            });
        }

        // ==========================================
        // راه‌اندازی
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => {
            applyTheme();
            setTimeout(addThemeButtonToNavbar, 500);
            setTimeout(addThemeButtonToNavbar, 1500);
            loadPosts();
        });
    </script>
</body>
</html>
