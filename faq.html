<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوالات متداول | آکادمی شمعدون</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
    <meta name="theme-color" content="#d4af37">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #14141c;
            --bg-card: #1a1a24;
            --gold: #d4af37;
            --gold-light: #f4d47c;
            --gold-dark: #a8862a;
            --green: #10b981;
            --red: #ef4444;
            --blue: #3b82f6;
            --purple: #8b5cf6;
            --white: #f8fafc;
            --gray: #94a3b8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background-color: var(--bg-primary);
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(212, 175, 55, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(59, 130, 246, 0.06) 0%, transparent 40%),
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 60px 60px, 60px 60px;
            background-attachment: fixed;
            color: var(--white);
            min-height: 100vh;
            direction: rtl;
            overflow-x: hidden;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideDown {
            from { opacity: 0; max-height: 0; }
            to { opacity: 1; max-height: 500px; }
        }

        .main-container { max-width: 900px; margin: 0 auto; padding: 100px 20px 40px; }

        /* ============= Header ============= */
        .page-header {
            text-align: center;
            margin-bottom: 35px;
            animation: fadeInUp 0.6s ease-out;
        }
        .page-header h1 {
            font-size: 38px;
            font-weight: 900;
            margin-bottom: 12px;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .page-header p {
            color: var(--gray);
            font-size: 15px;
            line-height: 1.8;
        }

        /* ============= Search ============= */
        .search-box {
            max-width: 600px;
            margin: 0 auto 25px;
            position: relative;
        }
        .search-box input {
            width: 100%;
            padding: 15px 50px 15px 20px;
            background: rgba(20, 20, 28, 0.8);
            border: 2px solid rgba(212, 175, 55, 0.2);
            border-radius: 15px;
            color: var(--white);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }
        .search-box input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.1);
        }
        .search-box input::placeholder { color: var(--gray); }
        .search-icon {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            pointer-events: none;
        }

        /* ============= Category Tabs ============= */
        .category-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 30px;
            overflow-x: auto;
            padding-bottom: 8px;
            scrollbar-width: thin;
            justify-content: center;
            flex-wrap: wrap;
        }
        .category-tab {
            padding: 11px 20px;
            background: rgba(20, 20, 28, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: var(--gray);
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .category-tab:hover {
            color: var(--gold);
            border-color: rgba(212, 175, 55, 0.4);
        }
        .category-tab.active {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--bg-primary);
            border-color: var(--gold);
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.3);
        }
        .category-tab .count {
            background: rgba(0, 0, 0, 0.2);
            padding: 2px 8px;
            border-radius: 8px;
            font-size: 11px;
        }
        .category-tab.active .count {
            background: rgba(0, 0, 0, 0.15);
        }

        /* ============= FAQ List ============= */
        .faq-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 40px;
        }
        .faq-item {
            background: linear-gradient(135deg, var(--bg-card), var(--bg-secondary));
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 16px;
            overflow: hidden;
            transition: 0.3s;
            animation: fadeInUp 0.4s ease-out backwards;
        }
        .faq-item:hover {
            border-color: rgba(212, 175, 55, 0.4);
        }
        .faq-item.open {
            border-color: var(--gold);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.15);
        }
        .faq-question {
            padding: 20px 24px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            transition: 0.3s;
            user-select: none;
        }
        .faq-question:hover {
            background: rgba(212, 175, 55, 0.03);
        }
        .faq-question-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }
        .faq-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(212, 175, 55, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        .faq-question-text {
            color: var(--white);
            font-size: 15px;
            font-weight: 700;
            line-height: 1.5;
        }
        .faq-toggle {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold);
            font-size: 18px;
            font-weight: 900;
            flex-shrink: 0;
            transition: 0.3s;
        }
        .faq-item.open .faq-toggle {
            background: var(--gold);
            color: var(--bg-primary);
            transform: rotate(45deg);
        }
        .faq-answer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease;
        }
        .faq-item.open .faq-answer {
            max-height: 500px;
        }
        .faq-answer-content {
            padding: 0 24px 22px 72px;
            color: #cbd5e1;
            font-size: 14px;
            line-height: 2;
        }
        .faq-answer-content p {
            margin-bottom: 12px;
        }
        .faq-answer-content p:last-child {
            margin-bottom: 0;
        }
        .faq-answer-content strong {
            color: var(--gold-light);
            font-weight: 800;
        }
        .faq-answer-content ul,
        .faq-answer-content ol {
            margin: 10px 20px 10px 0;
            padding-right: 20px;
        }
        .faq-answer-content li {
            margin-bottom: 6px;
        }
        .faq-answer-content a {
            color: var(--gold);
            text-decoration: none;
            font-weight: 700;
        }
        .faq-answer-content a:hover {
            text-decoration: underline;
        }

        /* ============= Empty State ============= */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--gray);
        }
        .empty-state .icon {
            font-size: 60px;
            margin-bottom: 15px;
            opacity: 0.5;
        }
        .empty-state h3 {
            color: var(--gold);
            margin-bottom: 10px;
            font-size: 18px;
        }
        .empty-state p {
            font-size: 14px;
        }

        /* ============= CTA ============= */
        .cta-box {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.1), rgba(59, 130, 246, 0.05));
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            animation: fadeInUp 0.6s ease-out 0.3s backwards;
        }
        .cta-box h3 {
            color: var(--white);
            font-size: 20px;
            font-weight: 900;
            margin-bottom: 10px;
        }
        .cta-box p {
            color: var(--gray);
            font-size: 14px;
            line-height: 1.8;
            margin-bottom: 20px;
        }
        .cta-box .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 28px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--bg-primary);
            text-decoration: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 800;
            transition: 0.3s;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3);
        }
        .cta-box .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(212, 175, 55, 0.5);
        }

        /* ============= Footer ============= */
        .footer {
            text-align: center;
            padding: 40px 20px;
            color: var(--gray);
            font-size: 12px;
            border-top: 1px solid rgba(212, 175, 55, 0.1);
            margin-top: 40px;
        }
        .footer-social {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .footer-social a {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
            overflow: hidden;
        }
        .footer-social a svg {
            width: 100%;
            height: 100%;
            display: block;
        }
        .footer-social a:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.3);
        }

        /* ============= Responsive ============= */
        @media (max-width: 600px) {
            .main-container { padding: 90px 15px 30px; }
            .page-header h1 { font-size: 26px; }
            .page-header p { font-size: 13px; }
            .faq-question { padding: 16px 18px; }
            .faq-question-text { font-size: 13.5px; }
            .faq-answer-content { padding: 0 18px 18px 18px; font-size: 13px; }
            .faq-icon { width: 32px; height: 32px; font-size: 16px; }
            .faq-toggle { width: 28px; height: 28px; font-size: 16px; }
            .cta-box { padding: 25px 20px; }
            .cta-box h3 { font-size: 17px; }
        }
    </style>
</head>

        // ==========================================
        // Category Info
        // ==========================================
        const CATEGORIES = {
            all: { name: 'همه', icon: '📚' },
            account: { name: 'حساب کاربری', icon: '🔐' },
            courses: { name: 'دوره‌ها', icon: '📚' },
            finance: { name: 'مالی و سرمایه', icon: '💰' },
            analysis: { name: 'تحلیل و بازار', icon: '📊' },
            portfolio: { name: 'پرتفوی', icon: '💼' }
        };

        let currentCategory = 'all';
        let currentSearch = '';

        // ==========================================
        // Render Category Tabs
        // ==========================================
        function renderCategoryTabs() {
            const tabs = document.getElementById('categoryTabs');
            const counts = { all: FAQ_DATA.length };

            FAQ_DATA.forEach(item => {
                counts[item.category] = (counts[item.category] || 0) + 1;
            });

            let html = '';
            Object.keys(CATEGORIES).forEach(key => {
                const cat = CATEGORIES[key];
                const count = counts[key] || 0;
                if (key === 'all' || count > 0) {
                    html += `
                        <button class="category-tab ${currentCategory === key ? 'active' : ''}" onclick="switchCategory('${key}', this)">
                            <span>${cat.icon} ${cat.name}</span>
                            <span class="count">${toFa(count)}</span>
                        </button>
                    `;
                }
            });

            tabs.innerHTML = html;
        }

        // ==========================================
        // Render FAQ List
        // ==========================================
        function renderFAQ() {
            const list = document.getElementById('faqList');
            let filtered = FAQ_DATA;

            if (currentCategory !== 'all') {
                filtered = filtered.filter(item => item.category === currentCategory);
            }

            if (currentSearch) {
                const term = currentSearch.toLowerCase();
                filtered = filtered.filter(item =>
                    item.question.toLowerCase().includes(term) ||
                    item.answer.toLowerCase().includes(term)
                );
            }

            if (filtered.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">🔍</div>
                        <h3>سوالی پیدا نشد</h3>
                        <p>جستجوی دیگری امتحان کن یا با ما تماس بگیر</p>
                    </div>
                `;
                return;
            }

            list.innerHTML = filtered.map((item, idx) => `
                <div class="faq-item" style="animation-delay: ${Math.min(idx * 0.03, 0.5)}s">
                    <div class="faq-question" onclick="toggleFAQ(this)">
                        <div class="faq-question-left">
                            <div class="faq-icon">${item.icon}</div>
                            <div class="faq-question-text">${item.question}</div>
                        </div>
                        <div class="faq-toggle">+</div>
                    </div>
                    <div class="faq-answer">
                        <div class="faq-answer-content">
                            ${item.answer}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // ==========================================
        // Toggle FAQ Item
        // ==========================================
        function toggleFAQ(questionEl) {
            const item = questionEl.parentElement;
            const wasOpen = item.classList.contains('open');

            // بستن همه
            document.querySelectorAll('.faq-item').forEach(i => i.classList.remove('open'));

            // اگه بسته بود، باز کن
            if (!wasOpen) {
                item.classList.add('open');
            }
        }

        // ==========================================
        // Switch Category
        // ==========================================
        function switchCategory(category, btn) {
            currentCategory = category;
            document.querySelectorAll('.category-tab').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            renderFAQ();
        }

        // ==========================================
        // Search
        // ==========================================
        function handleSearch() {
            currentSearch = document.getElementById('searchInput').value.trim();
            renderFAQ();
        }

        // ==========================================
        // Utility
        // ==========================================
        function toFa(num) {
            if (num === null || num === undefined) return '۰';
            const persianDigits = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
            return String(num).replace(/\d/g, d => persianDigits[d]);
        }

        // ==========================================
        // Init
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => {
            renderCategoryTabs();
            renderFAQ();
        });
    </script>
