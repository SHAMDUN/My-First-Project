<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جزئیات دوره | آکادمی شمعدون</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Tahoma, sans-serif;
            background-color: #0f172a;
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(245, 158, 11, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(59, 130, 246, 0.08) 0%, transparent 40%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 50px 50px, 50px 50px;
            background-attachment: fixed;
            min-height: 100vh;
            direction: rtl;
            padding: 20px 15px;
        }

        .container { max-width: 900px; margin: 0 auto; }

        /* ===== هدر ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .header h1 { color: #f59e0b; font-size: 22px; }
        .header a {
            color: #94a3b8; text-decoration: none; font-size: 14px;
            padding: 8px 16px; border: 2px solid #334155;
            border-radius: 25px; transition: 0.3s;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
        }
        .header a:hover { background: #334155; color: #fff; }

        /* ===== کارت دوره ===== */
        .course-hero {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 30px 25px;
            margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.05);
            text-align: center;
        }
        .course-hero .icon {
            font-size: 70px;
            margin-bottom: 15px;
        }
        .course-hero .level {
            color: #f59e0b;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .course-hero h1 {
            color: #f1f5f9;
            font-size: 24px;
            margin-bottom: 12px;
        }
        .course-hero p {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.8;
            max-width: 600px;
            margin: 0 auto 15px;
        }
        .course-meta {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .course-meta span {
            color: #cbd5e1;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .course-price {
            font-size: 22px;
            font-weight: bold;
            color: #4ade80;
            margin-bottom: 15px;
        }

        /* ===== دکمه ثبت‌نام ===== */
        .enroll-btn {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #0f172a;
            border: none;
            padding: 15px 40px;
            border-radius: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            font-family: Tahoma, sans-serif;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .enroll-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(245, 158, 11, 0.4);
        }
        .enroll-btn.enrolled {
            background: linear-gradient(135deg, #22c55e, #16a34a);
        }
        .enroll-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== بخش سرفصل ===== */
        .section-title {
            color: #f1f5f9;
            font-size: 18px;
            margin-bottom: 15px;
            border-bottom: 2px solid rgba(245, 158, 11, 0.3);
            display: inline-block;
            padding-bottom: 5px;
        }

        .lessons-list {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 25px;
        }

        .lesson-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 8px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255,255,255,0.05);
            transition: 0.3s;
            cursor: pointer;
        }
        .lesson-item:hover {
            background: rgba(15, 23, 42, 0.9);
            border-color: rgba(245, 158, 11, 0.3);
        }
        .lesson-item.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .lesson-item.locked:hover {
            background: rgba(15, 23, 42, 0.6);
            border-color: rgba(255,255,255,0.05);
        }

        .lesson-number {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            flex-shrink: 0;
        }
        .lesson-item.completed .lesson-number {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
        }
        .lesson-item.locked .lesson-number {
            background: rgba(100, 116, 139, 0.2);
            color: #64748b;
        }

        .lesson-info { flex: 1; }
        .lesson-title {
            color: #f1f5f9;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 3px;
        }
        .lesson-duration {
            color: #94a3b8;
            font-size: 11px;
        }
        .lesson-status {
            font-size: 18px;
            flex-shrink: 0;
        }

        /* ===== پیشرفت ===== */
        .progress-section {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 25px;
        }
        .progress-bar-container {
            width: 100%;
            height: 10px;
            background: rgba(15, 23, 42, 0.8);
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #f59e0b, #d97706);
            border-radius: 10px;
            transition: width 0.5s ease;
        }
        .progress-text {
            color: #94a3b8;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
        }

        /* ===== دکمه بازگشت ===== */
        .back-btn {
            display: inline-block;
            background: rgba(30, 41, 59, 0.7);
            color: #94a3b8;
            padding: 12px 25px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 14px;
            border: 1px solid #334155;
            transition: 0.3s;
            margin-top: 10px;
        }
        .back-btn:hover {
            background: #334155;
            color: #fff;
        }

        .loading {
            text-align: center;
            padding: 50px 20px;
            color: #94a3b8;
        }

        .message {
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
            display: none;
        }
        .message.success {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
            border: 1px solid #22c55e;
            display: block;
        }
        .message.error {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid #ef4444;
            display: block;
        }

        @media (max-width: 600px) {
            .course-hero h1 { font-size: 20px; }
            .course-hero .icon { font-size: 55px; }
        }
    </style>
</head>
<body>

    <script>
        const SUPABASE_URL = 'https://jcwwilatvstjrohvhtss.supabase.co';

                level: '🟢 مبتدی',
                duration: '۲ ساعت',
                lessons: [

                    { title: 'بازار مسکن و املاک', duration: '۱۲ دقیقه' },
                    { title: 'مقایسه بازارها', duration: '۱۵ دقیقه' },
                    { title: 'انتخاب بازار مناسب', duration: '۱۵ دقیقه' },
                    { title: 'ریسک و بازدهی هر بازار', duration: '۱۵ دقیقه' },
                    { title: 'مقدمات سرمایه‌گذاری', duration: '18 دقیقه' },
                    { title: 'جمع‌بندی و آزمون', duration: '10 دقیقه' }
                ],
                prerequisite: 1
            },
            3: {
                id: 3,
                title: 'مبانی تحلیل تکنیکال',
                desc: 'کندل‌ها، خط روند، حمایت و مقاومت - زبان نمودارها را یاد بگیرید و اولین تحلیل‌های خود را انجام دهید.',
                icon: '📈',
                level: '🟢 مبتدی',
                duration: '۳ ساعت',
                lessons: [
                    { title: 'مقدمه تحلیل تکنیکال', duration: '15 دقیقه' },
                    { title: 'انواع نمودارها', duration: '15 دقیقه' },
                    { title: 'کندل استیک چیست؟', duration: '20 دقیقه' },
                    { title: 'الگوهای کندلی', duration: '25 دقیقه' },
                    { title: 'خط روند', duration: '18 دقیقه' },
                    { title: 'حمایت و مقاومت', duration: '20 دقیقه' },
                    { title: 'کانال‌ها', duration: '15 دقیقه' },
                    { title: 'شکست‌ها (Breakouts)', duration: '18 دقیقه' },
                    { title: 'حجم معاملات', duration: '15 دقیقه' },
                    { title: 'تایم فریم‌ها', duration: '12 دقیقه' },
                    { title: 'تمرین عملی', duration: '20 دقیقه' },
                    { title: 'جمع‌بندی و آزمون', duration: '10 دقیقه' }
                ],
                prerequisite: 2
            },
            4: {
                id: 4,
                title: 'مدیریت ریسک مقدماتی',
                desc: 'حد ضرر، حجم معامله و صندوق اضطراری - چطور سرمایه‌ات را حفظ کنی و از ضررهای بزرگ جلوگیری کنی.',
                icon: '🛡️',
                level: '🟢 مبتدی',
                duration: '۲ ساعت',
                lessons: [
                    { title: 'چرا مدیریت ریسک؟', duration: '15 دقیقه' },
                    { title: 'حد ضرر (Stop Loss)', duration: '18 دقیقه' },
                    { title: 'حد سود (Take Profit)', duration: '15 دقیقه' },
                    { title: 'حجم معامله (Position Size)', duration: '20 دقیقه' },
                    { title: 'نسبت ریسک به ریوارد', duration: '18 دقیقه' },
                    { title: 'صندوق اضطراری', duration: '15 دقیقه' },
                    { title: 'تنوع‌بخشی', duration: '15 دقیقه' },
                    { title: 'جمع‌بندی و آزمون', duration: '12 دقیقه' }
                ],
                prerequisite: 3
            },
            5: {
                id: 5,
                title: 'آشنایی با ارز دیجیتال',
                desc: 'بیت‌کوین، اتریوم، بلاک‌چین و کیف پول‌ها - ورود به دنیای کریپتو با اطمینان.',
                icon: '₿',
                level: '🟢 مبتدی',
                duration: '۳ ساعت',
                lessons: [
                    { title: 'بلاک‌چین چیست؟', duration: '20 دقیقه' },
                    { title: 'بیت‌کوین', duration: '20 دقیقه' },
                    { title: 'اتریوم و قراردادهای هوشمند', duration: '20 دقیقه' },
                    { title: 'سایر ارزهای دیجیتال', duration: '18 دقیقه' },
                    { title: 'کیف پول و امنیت', duration: '20 دقیقه' },
                    { title: 'صرافی‌ها و نحوه خرید', duration: '20 دقیقه' },
                    { title: 'استیبل‌کوین‌ها', duration: '15 دقیقه' },
                    { title: 'DeFi و Web3', duration: '20 دقیقه' },
                    { title: 'NFT چیست؟', duration: '15 دقیقه' },
                    { title: 'جمع‌بندی و آزمون', duration: '15 دقیقه' }
                ],
                prerequisite: 4
            }
        };

        let currentUser = null;
        let completedCourses = [];
        let inProgressCourses = [];
        let completedLessons = {};

        // ===== بارگذاری =====
        async function init() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            
            if (!session) {
                window.location.href = 'login.html';
                return;
            }

            currentUser = session.user;
            completedCourses = currentUser.user_metadata?.completed_courses || [];
            inProgressCourses = currentUser.user_metadata?.in_progress_courses || [];
            completedLessons = currentUser.user_metadata?.completed_lessons || {};

            const params = new URLSearchParams(window.location.search);
            const courseId = parseInt(params.get('id'));

            if (!courseId || !coursesData[courseId]) {
                document.getElementById('content').innerHTML = `
                    <div class="loading">
                        ❌ دوره مورد نظر پیدا نشد.
                        <br><br>
                        <a href="courses.html" class="back-btn">⬅ بازگشت به دوره‌ها</a>
                    </div>
                `;
                return;
            }

            renderCourse(coursesData[courseId]);
        }

        // ===== نمایش دوره =====
        function renderCourse(course) {
            const isCompleted = completedCourses.includes(course.id);
            const isInProgress = inProgressCourses.includes(course.id);
            const isEnrolled = isCompleted || isInProgress;

            // بررسی پیشرفت
            const lessonCount = course.lessons.length;
            const completedCount = (completedLessons[course.id] || []).length;
            const progressPercent = lessonCount > 0 ? Math.round((completedCount / lessonCount) * 100) : 0;

            // دکمه ثبت‌نام
            let enrollBtnHTML = '';
            if (isCompleted) {
                enrollBtnHTML = `<button class="enroll-btn enrolled" disabled>✅ دوره تکمیل شده</button>`;
            } else if (isInProgress) {
                enrollBtnHTML = `<button class="enroll-btn enrolled" onclick="startLesson(${course.id}, ${completedCount})">📖 ادامه یادگیری</button>`;
            } else {
                enrollBtnHTML = `<button class="enroll-btn" onclick="enrollCourse(${course.id})">🎓 ثبت‌نام رایگان</button>`;
            }

            // لیست دروس
            const lessonsHTML = course.lessons.map((lesson, index) => {
                const lessonNum = index + 1;
                const isLessonCompleted = (completedLessons[course.id] || []).includes(lessonNum);
                // درس‌ها فقط بعد از ثبت‌نام قابل دسترسی هستن
                const isLessonLocked = !isEnrolled;
                
                return `
                    <div class="lesson-item ${isLessonCompleted ? 'completed' : ''} ${isLessonLocked ? 'locked' : ''}" 
                         onclick="${isLessonLocked ? '' : `startLesson(${course.id}, ${index})`}">
                        <div class="lesson-number">${isLessonCompleted ? '✓' : lessonNum}</div>
                        <div class="lesson-info">
                            <div class="lesson-title">${lesson.title}</div>
                            <div class="lesson-duration">⏱️ ${lesson.duration}</div>
                        </div>
                        <div class="lesson-status">${isLessonLocked ? '🔒' : isLessonCompleted ? '✅' : '▶️'}</div>
                    </div>
                `;
            }).join('');

            document.getElementById('content').innerHTML = `
                <div class="header">
                    <h1>📚 جزئیات دوره</h1>
                    <a href="courses.html">⬅ بازگشت به دوره‌ها</a>
                </div>

                <div class="message" id="message"></div>

                <div class="course-hero">
                    <div class="icon">${course.icon}</div>
                    <div class="level">${course.level}</div>
                    <h1>${course.title}</h1>
                    <p>${course.desc}</p>
                    <div class="course-meta">
                        <span>⏱️ ${course.duration}</span>
                        <span>📁 ${course.lessons.length} درس</span>
                    </div>
                    <div class="course-price">🎁 رایگان</div>
                    ${enrollBtnHTML}
                </div>

                ${isEnrolled ? `
                    <div class="progress-section">
                        <div class="section-title">📊 پیشرفت شما</div>
                        <div class="progress-bar-container">
                            <div class="progress-bar-fill" style="width: ${progressPercent}%"></div>
                        </div>
                        <div class="progress-text">
                            <span>${completedCount} از ${lessonCount} درس تکمیل شده</span>
                            <span>${progressPercent}٪</span>
                        </div>
                    </div>
                ` : ''}

                <div class="lessons-list">
                    <div class="section-title">📋 سرفصل‌های دوره</div>
                    ${!isEnrolled ? `
                        <div style="text-align: center; color: #f59e0b; padding: 15px; background: rgba(245, 158, 11, 0.1); border-radius: 12px; margin-bottom: 15px; font-size: 13px;">
                            🔒 برای دسترسی به درس‌ها، ابتدا در دوره ثبت‌نام کنید.
                        </div>
                    ` : ''}
                    ${lessonsHTML}
                </div>

                <div style="text-align: center; margin-top: 20px;">
                    <a href="courses.html" class="back-btn">⬅ بازگشت به لیست دوره‌ها</a>
                </div>
            `;
        }

        // ===== ثبت‌نام در دوره =====
        async function enrollCourse(courseId) {
            try {
                const newInProgress = [...inProgressCourses, courseId];
                
                const { error } = await supabaseClient.auth.updateUser({
                    data: {
                        in_progress_courses: newInProgress
                    }
                });

                if (error) {
                    showMessage('❌ خطا در ثبت‌نام: ' + error.message, 'error');
                    return;
                }

                showMessage('✅ ثبت‌نام با موفقیت انجام شد! در حال انتقال به دوره...', 'success');
                
                inProgressCourses = newInProgress;
                
                setTimeout(() => {
                    renderCourse(coursesData[courseId]);
                }, 1500);

            } catch (e) {
                showMessage('❌ خطای شبکه', 'error');
            }
        }

        // ===== شروع درس =====
        function startLesson(courseId, lessonIndex) {
            const lessonNum = lessonIndex + 1;
            alert(`📖 درس ${lessonNum}: ${coursesData[courseId].lessons[lessonIndex].title}\n\n(صفحه درس به زودی اضافه می‌شود)`);
        }

        // ===== نمایش پیام =====
        function showMessage(text, type) {
            const message = document.getElementById('message');
            message.textContent = text;
            message.className = 'message ' + type;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ===== راه‌اندازی =====
        init();
    </script>

</body>
</html>
