<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جزئیات دوره | آکادمی شمعدون</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
    <meta name="theme-color" content="#d4af37">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #14141c;
            --bg-card: #1a1a24;
            --gold: #d4af37;
            --gold-light: #f4d47c;
            --gold-dark: #a8862a;
            --blue: #3b82f6;
            --green: #10b981;
            --red: #ef4444;
            --white: #f8fafc;
            --gray: #94a3b8;
        }

        /* ===== تم روز ===== */
        [data-theme="light"] {
            --bg-primary: #f8fafc;
            --bg-secondary: #eef2f7;
            --bg-card: #ffffff;
            --gold: #b8860b;
            --gold-light: #d4af37;
            --gold-dark: #8b6508;
            --blue: #2563eb;
            --green: #059669;
            --red: #dc2626;
            --white: #0f172a;
            --gray: #64748b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background-color: var(--bg-primary);
            background-image:
                radial-gradient(circle at 0% 0%, rgba(212, 175, 55, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(59, 130, 246, 0.06) 0%, transparent 40%),
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 60px 60px, 60px 60px;
            background-attachment: fixed;
            color: var(--white);
            min-height: 100vh;
            direction: rtl;
            overflow-x: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        [data-theme="light"] body {
            background-image:
                radial-gradient(circle at 0% 0%, rgba(184, 134, 11, 0.06) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(37, 99, 235, 0.05) 0%, transparent 40%),
                linear-gradient(rgba(0, 0, 0, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.025) 1px, transparent 1px);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .container { max-width: 900px; margin: 0 auto; padding: 100px 20px 40px; }

        /* ===== Back Button ===== */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--gray);
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            padding: 8px 16px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 10px;
            transition: 0.3s;
            margin-bottom: 20px;
        }
        .back-btn:hover {
            color: var(--gold);
            border-color: var(--gold);
            background: rgba(212, 175, 55, 0.05);
        }

        /* ===== Course Hero ===== */
        .course-hero {
            background: linear-gradient(135deg, var(--bg-card), var(--bg-secondary));
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 25px;
            padding: 30px 25px;
            margin-bottom: 25px;
            text-align: center;
            animation: fadeInUp 0.6s ease-out;
        }
        .course-hero .icon {
            font-size: 70px;
            margin-bottom: 15px;
            width: 120px;
            height: 120px;
            margin-left: auto;
            margin-right: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 16px;
        }
        .course-hero .icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 16px;
        }
        .course-hero h1 {
            color: var(--white);
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 12px;
        }
        .course-hero p {
            color: var(--gray);
            font-size: 14px;
            line-height: 1.8;
            max-width: 600px;
            margin: 0 auto 15px;
        }
        .course-meta {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .course-meta span {
            color: #cbd5e1;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .course-price {
            font-size: 22px;
            font-weight: 900;
            color: var(--green);
            margin-bottom: 15px;
        }

        .enroll-btn {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--bg-primary);
            border: none;
            padding: 15px 40px;
            border-radius: 15px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            font-family: inherit;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .enroll-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.4);
        }
        .enroll-btn.enrolled {
            background: linear-gradient(135deg, var(--green), #059669);
            color: #fff;
        }
        .enroll-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== Section Title ===== */
        .section-title {
            color: var(--white);
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 15px;
            border-bottom: 2px solid rgba(212, 175, 55, 0.3);
            display: inline-block;
            padding-bottom: 5px;
        }

        /* ===== Lessons List ===== */
        .lessons-list {
            background: linear-gradient(135deg, var(--bg-card), var(--bg-secondary));
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
            animation: fadeInUp 0.6s ease-out 0.1s backwards;
        }
        .lesson-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 8px;
            background: rgba(10, 10, 15, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: 0.3s;
            cursor: pointer;
        }
        .lesson-item:hover {
            background: rgba(10, 10, 15, 0.9);
            border-color: rgba(212, 175, 55, 0.3);
        }
        .lesson-item.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .lesson-item.locked:hover {
            background: rgba(10, 10, 15, 0.5);
            border-color: rgba(255, 255, 255, 0.05);
        }
        .lesson-number {
            width: 30px; height: 30px;
            border-radius: 50%;
            background: rgba(212, 175, 55, 0.2);
            color: var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 900;
            flex-shrink: 0;
        }
        .lesson-item.completed .lesson-number {
            background: rgba(16, 185, 129, 0.2);
            color: var(--green);
        }
        .lesson-item.locked .lesson-number {
            background: rgba(100, 116, 139, 0.2);
            color: #64748b;
        }
        .lesson-info { flex: 1; }
        .lesson-title {
            color: var(--white);
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 3px;
        }
        .lesson-duration { color: var(--gray); font-size: 11px; }
        .lesson-status { font-size: 18px; flex-shrink: 0; }

        /* ===== Progress ===== */
        .progress-section {
            background: linear-gradient(135deg, var(--bg-card), var(--bg-secondary));
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
            animation: fadeInUp 0.6s ease-out 0.15s backwards;
        }
        .progress-bar-container {
            width: 100%;
            height: 10px;
            background: rgba(10, 10, 15, 0.8);
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--gold), var(--gold-dark));
            border-radius: 10px;
            transition: width 0.5s ease;
        }
        .progress-text {
            color: var(--gray);
            font-size: 13px;
            display: flex;
            justify-content: space-between;
        }

        /* ===== Feedback ===== */
        .feedback-section {
            background: linear-gradient(135deg, var(--bg-card), var(--bg-secondary));
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            animation: fadeInUp 0.6s ease-out 0.2s backwards;
        }
        .rating-stars {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 20px 0;
            direction: ltr;
        }
        .rating-stars .star {
            font-size: 40px;
            color: #475569;
            cursor: pointer;
            transition: 0.2s;
            user-select: none;
        }
        .rating-stars .star:hover,
        .rating-stars .star.active {
            color: var(--gold);
            transform: scale(1.1);
        }
        #feedbackComment,
        #suggestedTopic {
            width: 100%;
            padding: 12px 15px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: rgba(10, 10, 15, 0.8);
            color: #fff;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            resize: vertical;
            margin-bottom: 15px;
        }
        #feedbackComment:focus,
        #suggestedTopic:focus {
            border-color: var(--gold);
        }
        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            background: rgba(10, 10, 15, 0.6);
            border-radius: 12px;
            margin-bottom: 15px;
            cursor: pointer;
        }
        .checkbox-wrapper input[type="checkbox"] {
            width: 20px; height: 20px;
            accent-color: var(--gold);
            cursor: pointer;
        }
        .checkbox-wrapper label {
            color: #cbd5e1;
            font-size: 13px;
            cursor: pointer;
            flex: 1;
        }
        .btn-submit-feedback {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--bg-primary);
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            font-family: inherit;
            transition: 0.3s;
        }
        .btn-submit-feedback:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.4);
        }

        /* ===== Ratings ===== */
        .ratings-section {
            background: linear-gradient(135deg, var(--bg-card), var(--bg-secondary));
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            animation: fadeInUp 0.6s ease-out 0.25s backwards;
        }
        .ratings-summary {
            text-align: center;
            padding: 20px;
            background: rgba(10, 10, 15, 0.6);
            border-radius: 15px;
            margin-bottom: 20px;
        }
        .avg-number {
            color: var(--gold);
            font-size: 42px;
            font-weight: 900;
        }
        .avg-stars {
            color: var(--gold);
            font-size: 24px;
            margin: 5px 0;
        }
        .avg-count { color: var(--gray); font-size: 13px; }
        .rating-item {
            padding: 15px;
            background: rgba(10, 10, 15, 0.6);
            border-radius: 12px;
            margin-bottom: 10px;
            border-right: 3px solid var(--gold);
        }
        .rating-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .rating-stars-display { color: var(--gold); font-size: 16px; }
        .rating-date { color: #64748b; font-size: 11px; }
        .rating-comment {
            color: #cbd5e1;
            font-size: 13px;
            line-height: 1.7;
            margin: 0;
        }
        .rating-advanced {
            margin-top: 8px;
            padding: 8px 12px;
            background: rgba(59, 130, 246, 0.15);
            border-radius: 8px;
            color: #60a5fa;
            font-size: 12px;
        }

        /* ===== Messages ===== */
        .message {
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
            display: none;
        }
        .message.success {
            background: rgba(16, 185, 129, 0.2);
            color: var(--green);
            border: 1px solid var(--green);
            display: block;
        }
        .message.error {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid var(--red);
            display: block;
        }

        .loading {
            text-align: center;
            padding: 80px 20px;
            color: var(--gray);
            font-size: 16px;
        }

        /* ===================================================== */
        /* 🌙 تم روشن - !important برای غلبه بر رنگ‌های hardcode */
        /* ===================================================== */
        [data-theme="light"] body {
            background-color: #f8fafc !important;
            color: #0f172a !important;
        }
        [data-theme="light"] .back-btn {
            color: #475569 !important;
            border-color: rgba(184, 134, 11, 0.3) !important;
        }
        [data-theme="light"] .back-btn:hover {
            color: #b8860b !important;
            background: rgba(184, 134, 11, 0.08) !important;
        }
        [data-theme="light"] .course-hero {
            background: linear-gradient(135deg, #ffffff, #eef2f7) !important;
        }
        [data-theme="light"] .course-hero h1 {
            color: #0f172a !important;
        }
        [data-theme="light"] .course-hero p {
            color: #475569 !important;
        }
        [data-theme="light"] .course-meta span {
            color: #334155 !important;
        }
        [data-theme="light"] .section-title {
            color: #0f172a !important;
        }
        [data-theme="light"] .lessons-list {
            background: linear-gradient(135deg, #ffffff, #eef2f7) !important;
        }
        [data-theme="light"] .lesson-item {
            background: rgba(241, 245, 249, 0.7) !important;
            border-color: rgba(0, 0, 0, 0.06) !important;
        }
        [data-theme="light"] .lesson-item:hover {
            background: rgba(241, 245, 249, 1) !important;
            border-color: rgba(184, 134, 11, 0.4) !important;
        }
        [data-theme="light"] .lesson-item.locked {
            background: rgba(241, 245, 249, 0.5) !important;
        }
        [data-theme="light"] .lesson-title {
            color: #0f172a !important;
        }
        [data-theme="light"] .lesson-duration {
            color: #64748b !important;
        }
        [data-theme="light"] .progress-section {
            background: linear-gradient(135deg, #ffffff, #eef2f7) !important;
        }
        [data-theme="light"] .progress-bar-container {
            background: rgba(0, 0, 0, 0.08) !important;
        }
        [data-theme="light"] .progress-text {
            color: #64748b !important;
        }
        [data-theme="light"] .feedback-section {
            background: linear-gradient(135deg, #ffffff, #eef2f7) !important;
        }
        [data-theme="light"] .rating-stars .star {
            color: #cbd5e1 !important;
        }
        [data-theme="light"] #feedbackComment,
        [data-theme="light"] #suggestedTopic {
            background: #ffffff !important;
            color: #0f172a !important;
            border-color: rgba(0, 0, 0, 0.1) !important;
        }
        [data-theme="light"] .checkbox-wrapper {
            background: rgba(241, 245, 249, 0.8) !important;
        }
        [data-theme="light"] .checkbox-wrapper label {
            color: #334155 !important;
        }
        [data-theme="light"] .ratings-section {
            background: linear-gradient(135deg, #ffffff, #eef2f7) !important;
        }
        [data-theme="light"] .ratings-summary {
            background: rgba(241, 245, 249, 0.8) !important;
        }
        [data-theme="light"] .rating-item {
            background: rgba(241, 245, 249, 0.8) !important;
        }
        [data-theme="light"] .rating-comment {
            color: #334155 !important;
        }
        [data-theme="light"] .loading {
            color: #64748b !important;
        }

        /* ===== Responsive ===== */
        @media (max-width: 600px) {
            .container { padding: 90px 15px 30px; }
            .course-hero h1 { font-size: 20px; }
            .course-hero .icon { font-size: 55px; }
        }
    </style>
</head>

                duration: '۳ ساعت',
                lessons: [
                    { title: 'بلاک‌چین چیست؟', duration: '۲۰ دقیقه' },
                    { title: 'بیت‌کوین', duration: '۲۰ دقیقه' },
                    { title: 'اتریوم و قراردادهای هوشمند', duration: '۲۰ دقیقه' },
                    { title: 'سایر ارزهای دیجیتال', duration: '۱۸ دقیقه' },
                    { title: 'کیف پول و امنیت', duration: '۲۰ دقیقه' },
                    { title: 'صرافی‌ها و نحوه خرید', duration: '۲۰ دقیقه' },
                    { title: 'استیبل‌کوین‌ها', duration: '۱۵ دقیقه' },
                    { title: 'DeFi و Web3', duration: '۲۰ دقیقه' },
                    { title: 'NFT چیست؟', duration: '۱۵ دقیقه' },
                    { title: 'جمع‌بندی و آزمون', duration: '۱۵ دقیقه' }
                ],
                prerequisite: 4
            }
        };

        let currentUser = null;
        let completedCourses = [];
        let inProgressCourses = [];
        let completedLessons = {};
        let selectedRating = 0;
        let currentCourse = null;
        let isDynamicCourse = false;

        // ===== بارگذاری =====
        async function init() {
            const { data: { session } } = await db.auth.getSession();

            if (!session) {
                window.location.href = 'login.html';
                return;
            }

            currentUser = session.user;
            completedCourses = currentUser.user_metadata?.completed_courses || [];
            inProgressCourses = currentUser.user_metadata?.in_progress_courses || [];
            completedLessons = currentUser.user_metadata?.completed_lessons || {};

            const params = new URLSearchParams(window.location.search);
            const courseId = params.get('id');
            const type = params.get('type');

            // ===== دوره داینامیک =====
            if (type === 'db' || courseId.startsWith('db-') || (!isNaN(parseInt(courseId)) && parseInt(courseId) > 100)) {
                const dbId = parseInt(courseId);
                await loadDynamicCourse(dbId);
                return;
            }

            // ===== دوره ثابت =====
            const staticId = parseInt(courseId);
            if (!staticId || !staticCoursesData[staticId]) {
                document.getElementById('content').innerHTML = `
                    <div class="loading">
                        ❌ دوره مورد نظر پیدا نشد.<br><br>
                        <a href="courses.html" class="back-btn">⬅ بازگشت به دوره‌ها</a>
                    </div>
                `;
                return;
            }

            currentCourse = staticCoursesData[staticId];
            isDynamicCourse = false;
            await renderCourse(currentCourse);
        }

        // ===== بارگذاری دوره داینامیک =====
        async function loadDynamicCourse(dbId) {
            try {
                const { data: course, error: courseError } = await db
                    .from('courses')
                    .select('*')
                    .eq('id', dbId)
                    .single();

                if (courseError || !course) {
                    document.getElementById('content').innerHTML = `
                        <div class="loading">
                            ❌ دوره مورد نظر پیدا نشد.<br><br>
                            <a href="courses.html" class="back-btn">⬅ بازگشت به دوره‌ها</a>
                        </div>
                    `;
                    return;
                }

                const { data: lessons } = await db
                    .from('lessons')
                    .select('*')
                    .eq('course_id', dbId)
                    .order('order_num', { ascending: true });

                currentCourse = {
                    id: 'db-' + course.id,
                    dbId: course.id,
                    title: course.title || 'بدون عنوان',
                    desc: course.description || 'توضیحات ثبت نشده',
                    icon: course.icon || '📚',
                    level: getLevelText(course.level),
                    duration: '—',
                    lessons: (lessons || []).map(l => ({
                        title: l.title,
                        duration: '—',
                        content: l.content,
                        video_url: l.video_url
                    })),
                    prerequisite: null,
                    isDynamic: true
                };

                isDynamicCourse = true;
                await renderCourse(currentCourse);

            } catch (e) {
                console.error('خطا:', e);
                document.getElementById('content').innerHTML = `
                    <div class="loading">
                        ❌ خطا در بارگذاری دوره.<br><br>
                        <a href="courses.html" class="back-btn">⬅ بازگشت به دوره‌ها</a>
                    </div>
                `;
            }
        }

        function getLevelText(level) {
            if (level === 'مبتدی' || level === 'beginner') return '🟢 مبتدی';
            if (level === 'متوسط' || level === 'intermediate') return '🟡 متوسط';
            if (level === 'پیشرفته' || level === 'advanced') return '🔴 پیشرفته';
            return '🟢 مبتدی';
        }

        // ===== نمایش دوره =====
        async function renderCourse(course) {
            const courseKey = isDynamicCourse ? course.dbId : course.id;
            const ratingsData = await loadCourseRatings(course.dbId || course.id);

            const isCompleted = completedCourses.includes(courseKey);
            const isInProgress = inProgressCourses.includes(courseKey);
            const isEnrolled = isCompleted || isInProgress;

            const lessonCount = course.lessons.length;
            const completedCount = (completedLessons[courseKey] || []).length;
            const progressPercent = lessonCount > 0 ? Math.round((completedCount / lessonCount) * 100) : 0;

            let enrollBtnHTML = '';
            if (isCompleted) {
                enrollBtnHTML = `<button class="enroll-btn enrolled" disabled>✅ دوره تکمیل شده</button>`;
            } else if (isInProgress) {
                const completedList = completedLessons[courseKey] || [];
                let nextLesson = 1;
                for (let i = 1; i <= lessonCount; i++) {
                    if (!completedList.includes(i)) {
                        nextLesson = i;
                        break;
                    }
                }
                enrollBtnHTML = `<button class="enroll-btn enrolled" onclick="startLesson(${courseKey}, ${nextLesson})">📖 ادامه یادگیری</button>`;
            } else {
                enrollBtnHTML = `<button class="enroll-btn" onclick="enrollCourse(${courseKey})">🎓 ثبت‌نام رایگان</button>`;
            }

            const lessonsHTML = course.lessons.map((lesson, index) => {
                const lessonNum = index + 1;
                const isLessonCompleted = (completedLessons[courseKey] || []).includes(lessonNum);
                const isLessonLocked = !isEnrolled;

                return `
                    <div class="lesson-item ${isLessonCompleted ? 'completed' : ''} ${isLessonLocked ? 'locked' : ''}" 
                         onclick="${isLessonLocked ? '' : `startLesson(${courseKey}, ${lessonNum})`}">
                        <div class="lesson-number">${isLessonCompleted ? '✓' : lessonNum}</div>
                        <div class="lesson-info">
                            <div class="lesson-title">${escapeHtml(lesson.title)}</div>
                            <div class="lesson-duration">⏱️ ${lesson.duration}</div>
                        </div>
                        <div class="lesson-status">${isLessonLocked ? '🔒' : isLessonCompleted ? '✅' : '▶️'}</div>
                    </div>
                `;
            }).join('');

            document.getElementById('content').innerHTML = `
                <a href="courses.html" class="back-btn">⬅ بازگشت به دوره‌ها</a>

                <div class="message" id="message"></div>

                <div class="course-hero">
                    <div class="icon">
                        ${isImageUrl(course.icon) 
                            ? `<img src="${getCourseIconSrc(course.icon)}" alt="${escapeHtml(course.title)}" style="width:100%;height:100%;object-fit:cover;border-radius:16px;">`
                            : (course.icon || '📚')}
                    </div>
                    <div class="level">${course.level}</div>
                    <h1>${escapeHtml(course.title)}</h1>
                    <p>${escapeHtml(course.desc)}</p>
                    <div class="course-meta">
                        <span>⏱️ ${course.duration}</span>
                        <span>📁 ${course.lessons.length} درس</span>
                        ${ratingsData.count > 0 ? `<span>⭐ ${ratingsData.avg} (${ratingsData.count} نظر)</span>` : ''}
                    </div>
                    <div class="course-price">🎁 رایگان</div>
                    ${enrollBtnHTML}
                </div>

                ${isEnrolled ? `
                    <div class="progress-section">
                        <div class="section-title">📊 پیشرفت شما</div>
                        <div class="progress-bar-container">
                            <div class="progress-bar-fill" style="width: ${progressPercent}%"></div>
                        </div>
                        <div class="progress-text">
                            <span>${completedCount} از ${lessonCount} درس تکمیل شده</span>
                            <span>${progressPercent}٪</span>
                        </div>
                    </div>
                ` : ''}

                <div class="lessons-list">
                    <div class="section-title">📋 سرفصل‌های دوره</div>
                    ${!isEnrolled ? `
                        <div style="text-align: center; color: var(--gold); padding: 15px; background: rgba(212, 175, 55, 0.1); border-radius: 12px; margin-bottom: 15px; font-size: 13px;">
                            🔒 برای دسترسی به درس‌ها، ابتدا در دوره ثبت‌نام کنید.
                        </div>
                    ` : ''}
                    ${lessonsHTML.length === 0 ? '<p style="color:var(--gray); text-align:center; padding:20px;">هنوز درسی برای این دوره ثبت نشده است.</p>' : lessonsHTML}
                </div>

                ${isCompleted ? renderFeedbackForm(courseKey) : ''}
                ${ratingsData.count > 0 ? renderRatings(ratingsData) : ''}

                <div style="text-align: center; margin-top: 20px;">
                    <a href="courses.html" class="back-btn">⬅ بازگشت به لیست دوره‌ها</a>
                </div>
            `;
        }

        // ===== بارگذاری امتیازات =====
        async function loadCourseRatings(courseId) {
            try {
                const { data, error } = await db
                    .from('course_ratings')
                    .select('rating, comment, needs_advanced_course, suggested_topic, created_at, user_id')
                    .eq('course_id', courseId)
                    .order('created_at', { ascending: false });

                if (error || !data || data.length === 0) {
                    return { avg: 0, count: 0, ratings: [] };
                }

                const avg = (data.reduce((sum, r) => sum + r.rating, 0) / data.length).toFixed(1);
                return { avg: parseFloat(avg), count: data.length, ratings: data };

            } catch (e) {
                return { avg: 0, count: 0, ratings: [] };
            }
        }

        // ===== فرم بازخورد =====
        function renderFeedbackForm(courseId) {
            return `
                <div class="feedback-section">
                    <div class="section-title">⭐ بازخورد شما</div>
                    <p style="color: var(--gray); font-size: 13px; margin-bottom: 15px;">
                        شما این دوره را با موفقیت تکمیل کردید! لطفاً بازخورد خود را ثبت کنید.
                    </p>
                    <div class="rating-stars" id="ratingStars">
                        <span class="star" onclick="setRating(1)">★</span>
                        <span class="star" onclick="setRating(2)">★</span>
                        <span class="star" onclick="setRating(3)">★</span>
                        <span class="star" onclick="setRating(4)">★</span>
                        <span class="star" onclick="setRating(5)">★</span>
                    </div>
                    <textarea id="feedbackComment" placeholder="نظر خود را بنویسید (اختیاری)..." rows="3"></textarea>
                    <div class="checkbox-wrapper">
                        <input type="checkbox" id="needsAdvanced" onchange="toggleTopicInput()">
                        <label for="needsAdvanced">📚 آیا مایلید دوره تکمیلی این موضوع تهیه کنیم؟</label>
                    </div>
                    <div id="topicInputWrapper" style="display: none;">
                        <textarea id="suggestedTopic" placeholder="چه موضوعی مدنظرتون هست؟" rows="2"></textarea>
                    </div>
                    <button class="btn-submit-feedback" onclick="submitFeedback(${courseId})">
                        📤 ثبت بازخورد
                    </button>
                    <div class="message" id="feedbackMessage"></div>
                </div>
            `;
        }

        // ===== نمایش نظرات =====
        function renderRatings(ratingsData) {
            const ratingsHTML = ratingsData.ratings.map(r => {
                const stars = '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
                const date = new Date(r.created_at).toLocaleDateString('fa-IR');
                const showAdvanced = r.needs_advanced_course && r.suggested_topic;

                return `
                    <div class="rating-item">
                        <div class="rating-header">
                            <span class="rating-stars-display">${stars}</span>
                            <span class="rating-date">${date}</span>
                        </div>
                        ${r.comment ? `<p class="rating-comment">${escapeHtml(r.comment)}</p>` : ''}
                        ${showAdvanced ? `<div class="rating-advanced">📚 پیشنهاد دوره تکمیلی: ${escapeHtml(r.suggested_topic)}</div>` : ''}
                    </div>
                `;
            }).join('');

            return `
                <div class="ratings-section">
                    <div class="section-title">💬 نظرات کاربران</div>
                    <div class="ratings-summary">
                        <div class="avg-number">${ratingsData.avg}</div>
                        <div class="avg-stars">${'★'.repeat(Math.round(ratingsData.avg))}${'☆'.repeat(5 - Math.round(ratingsData.avg))}</div>
                        <div class="avg-count">از ${ratingsData.count} نظر</div>
                    </div>
                    <div class="ratings-list">
                        ${ratingsHTML}
                    </div>
                </div>
            `;
        }

        function setRating(value) {
            selectedRating = value;
            const stars = document.querySelectorAll('#ratingStars .star');
            stars.forEach((star, index) => {
                if (index < value) {
                    star.classList.add('active');
                } else {
                    star.classList.remove('active');
                }
            });
        }

        function toggleTopicInput() {
            const checkbox = document.getElementById('needsAdvanced');
            const wrapper = document.getElementById('topicInputWrapper');
            wrapper.style.display = checkbox.checked ? 'block' : 'none';
        }

        async function submitFeedback(courseId) {
            const message = document.getElementById('feedbackMessage');

            if (selectedRating === 0) {
                message.textContent = '❌ لطفاً امتیاز خود را انتخاب کنید';
                message.className = 'message error';
                return;
            }

            const comment = document.getElementById('feedbackComment').value.trim();
            const needsAdvanced = document.getElementById('needsAdvanced').checked;
            const suggestedTopic = needsAdvanced ? document.getElementById('suggestedTopic').value.trim() : null;

            try {
                const { error } = await db
                    .from('course_ratings')
                    .upsert({
                        user_id: currentUser.id,
                        course_id: courseId,
                        rating: selectedRating,
                        comment: comment || null,
                        needs_advanced_course: needsAdvanced,
                        suggested_topic: suggestedTopic
                    }, { onConflict: 'user_id,course_id' });

                if (error) {
                    message.textContent = '❌ خطا: ' + error.message;
                    message.className = 'message error';
                    return;
                }

                message.textContent = '✅ بازخورد شما با موفقیت ثبت شد!';
                message.className = 'message success';

                setTimeout(() => {
                    window.location.reload();
                }, 2000);

            } catch (e) {
                message.textContent = '❌ خطای شبکه';
                message.className = 'message error';
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        // ==========================================
        // 🖼️ تشخیص عکس یا ایموجی
        // ==========================================
        function isImageUrl(str) {
            if (!str) return false;
            const s = String(str).trim().toLowerCase();
            return s.endsWith('.jpg') || 
                   s.endsWith('.jpeg') || 
                   s.endsWith('.png') || 
                   s.endsWith('.gif') || 
                   s.endsWith('.webp') || 
                   s.endsWith('.svg') || 
                   s.startsWith('http://') || 
                   s.startsWith('https://') ||
                   s.startsWith('files/');
        }

        function getCourseIconSrc(icon) {
            if (!icon) return '';
            const s = String(icon).trim();
            if (!isImageUrl(s)) return '';
            if (s.startsWith('http')) return s;
            if (s.startsWith('files/')) {
                return 'https://shamdun.github.io/My-First-Project/' + s;
            }
            return 'https://shamdun.github.io/My-First-Project/files/' + s;
        }

        async function enrollCourse(courseId) {
            try {
                const newInProgress = [...inProgressCourses, courseId];

                const { error } = await db.auth.updateUser({
                    data: { in_progress_courses: newInProgress }
                });

                if (error) {
                    alert('❌ خطا در ثبت‌نام: ' + error.message);
                    return;
                }

                inProgressCourses = newInProgress;
                window.location.reload();

            } catch (e) {
                alert('❌ خطای شبکه');
            }
        }

        function startLesson(courseId, lessonNum) {
            if (isDynamicCourse) {
                window.location.href = `lesson.html?course=${courseId}&lesson=${lessonNum}&type=db`;
            } else {
                window.location.href = `lesson.html?course=${courseId}&lesson=${lessonNum}`;
            }
        }

        // ==========================================
        // 🌙 تم شب/روز
        // ==========================================
        function applyTheme() {
            const saved = localStorage.getItem('shamdun-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', saved);
            const icon = document.getElementById('snThemeIcon');
            if (icon) icon.textContent = saved === 'dark' ? '🌙' : '☀️';
        }

        function addThemeButtonToNavbar() {
            const navbarContainer = document.querySelector('.sn-navbar-container');
            if (!navbarContainer) {
                setTimeout(addThemeButtonToNavbar, 200);
                return;
            }
            if (document.getElementById('snThemeBtn')) return;

            const themeBtn = document.createElement('button');
            themeBtn.className = 'sn-action-btn';
            themeBtn.id = 'snThemeBtn';
            themeBtn.setAttribute('aria-label', 'تغییر تم');
            themeBtn.setAttribute('title', 'تغییر تم');
            themeBtn.style.cssText = 'width:42px;height:42px;border-radius:12px;background:rgba(212,175,55,0.08);border:1px solid rgba(212,175,55,0.25);color:var(--gold);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:inherit;';
            themeBtn.innerHTML = '<span id="snThemeIcon">🌙</span>';

            const userArea = navbarContainer.querySelector('.sn-user-area');
            if (userArea) {
                navbarContainer.insertBefore(themeBtn, userArea);
            } else {
                navbarContainer.appendChild(themeBtn);
            }

            themeBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                const current = document.documentElement.getAttribute('data-theme') || 'dark';
                const newTheme = current === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('shamdun-theme', newTheme);
                const icon = document.getElementById('snThemeIcon');
                if (icon) icon.textContent = newTheme === 'dark' ? '🌙' : '☀️';
            });
        }

        setTimeout(applyTheme, 100);
        setTimeout(addThemeButtonToNavbar, 500);
        setTimeout(addThemeButtonToNavbar, 1500);

        init();
    </script>
</body>
</html>
