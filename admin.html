<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل ادمین | آکادمی شمعدون</title>
    
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Tahoma, sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            min-height: 100vh;
            direction: rtl;
        }

        .admin-header {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-bottom: 2px solid #f59e0b;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .admin-header h1 { color: #f59e0b; font-size: 20px; }

        .admin-user {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: #94a3b8;
        }

        .logout-btn {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid #ef4444;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-family: Tahoma;
            font-size: 12px;
            transition: 0.3s;
        }
        .logout-btn:hover { background: rgba(239, 68, 68, 0.3); }

        .tabs {
            display: flex;
            gap: 5px;
            padding: 15px 20px 0;
            overflow-x: auto;
            scrollbar-width: none;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .tabs::-webkit-scrollbar { display: none; }

        .tab-btn {
            background: transparent;
            color: #94a3b8;
            border: none;
            padding: 12px 18px;
            cursor: pointer;
            font-family: Tahoma;
            font-size: 14px;
            font-weight: bold;
            border-radius: 10px 10px 0 0;
            white-space: nowrap;
            transition: 0.3s;
            border-bottom: 3px solid transparent;
        }
        .tab-btn:hover { color: #f59e0b; }
        .tab-btn.active {
            color: #f59e0b;
            border-bottom-color: #f59e0b;
            background: rgba(245, 158, 11, 0.05);
        }

        .container { max-width: 1100px; margin: 0 auto; padding: 20px; }

        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.8));
            border: 1px solid rgba(245, 158, 11, 0.2);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            transition: 0.3s;
        }
        .stat-card:hover {
            transform: translateY(-3px);
            border-color: #f59e0b;
            box-shadow: 0 10px 30px rgba(245, 158, 11, 0.2);
        }

        .stat-card .icon { font-size: 32px; margin-bottom: 10px; }
        .stat-card .value {
            color: #f59e0b;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .stat-card .label { color: #94a3b8; font-size: 13px; }

        .chart-box {
            background: rgba(30, 41, 59, 0.6);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 20px;
        }
        .chart-box h3 { color: #f1f5f9; margin-bottom: 15px; font-size: 16px; }

        .data-table {
            width: 100%;
            background: rgba(30, 41, 59, 0.6);
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .data-table th {
            background: rgba(245, 158, 11, 0.1);
            color: #f59e0b;
            padding: 14px;
            text-align: right;
            font-size: 13px;
            font-weight: bold;
        }

        .data-table td {
            padding: 14px;
            border-top: 1px solid rgba(255,255,255,0.05);
            color: #cbd5e1;
            font-size: 13px;
        }

        .data-table tr:hover td { background: rgba(245, 158, 11, 0.03); }

        .btn {
            padding: 10px 18px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-family: Tahoma;
            font-size: 13px;
            font-weight: bold;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #0f172a;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(245, 158, 11, 0.4);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .btn-danger:hover { background: rgba(239, 68, 68, 0.25); }

        .btn-success {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }
        .btn-success:hover { background: rgba(34, 197, 94, 0.25); }

        .btn-secondary {
            background: rgba(148, 163, 184, 0.1);
            color: #cbd5e1;
            border: 1px solid rgba(148, 163, 184, 0.2);
        }
        .btn-secondary:hover { background: rgba(148, 163, 184, 0.2); }

        .btn-small { padding: 6px 12px; font-size: 12px; }

        .form-box {
            background: rgba(30, 41, 59, 0.6);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(245, 158, 11, 0.2);
        }

        .form-box h3 { color: #f59e0b; margin-bottom: 15px; font-size: 16px; }

        .form-group { margin-bottom: 12px; }

        .form-group label {
            display: block;
            color: #cbd5e1;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px 14px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: #f1f5f9;
            font-family: Tahoma;
            font-size: 13px;
            transition: 0.3s;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #f59e0b;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.show { display: flex; }

        .modal {
            background: #1e293b;
            border-radius: 20px;
            padding: 25px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .modal h2 { color: #f59e0b; margin-bottom: 20px; font-size: 18px; }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: flex-end;
        }

        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background: rgba(30, 41, 59, 0.9);
            border: 2px solid #f59e0b;
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(245, 158, 11, 0.3);
        }

        .login-card h1 {
            color: #f59e0b;
            text-align: center;
            margin-bottom: 25px;
            font-size: 22px;
        }

        .loading { text-align: center; padding: 40px; color: #94a3b8; }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(245, 158, 11, 0.2);
            border-top-color: #f59e0b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1e293b;
            color: #f1f5f9;
            padding: 14px 24px;
            border-radius: 12px;
            border-right: 4px solid #f59e0b;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            z-index: 2000;
            transition: 0.4s;
            font-size: 14px;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.success { border-right-color: #4ade80; }
        .toast.error { border-right-color: #ef4444; }

        @media (max-width: 600px) {
            .admin-header h1 { font-size: 16px; }
            .admin-user span { display: none; }
            .form-row { grid-template-columns: 1fr; }
            .data-table { font-size: 12px; }
            .data-table th, .data-table td { padding: 10px 8px; }
        }
    </style>
</head>
<body>

<!-- صفحه لاگین ادمین -->
<div id="loginScreen" class="login-screen">
    <div class="login-card">
        <h1>🔐 ورود ادمین</h1>
        <div class="form-group">
            <label>ایمیل</label>
            <input type="email" id="adminEmail" placeholder="admin@example.com">
        </div>
        <div class="form-group">
            <label>رمز عبور</label>
            <input type="password" id="adminPassword" placeholder="••••••••">
        </div>
        <button class="btn btn-primary" style="width:100%; justify-content:center; margin-top:10px;" onclick="loginAdmin()">
            ورود
        </button>
        <p id="loginError" style="color:#ef4444; text-align:center; margin-top:15px; font-size:13px;"></p>
    </div>
</div>

<!-- پنل ادمین -->
<div id="adminPanel" style="display:none;">

    <header class="admin-header">
        <h1>🎯 پنل ادمین شمعدون</h1>
        <div class="admin-user">
            <span id="adminEmailShow"></span>
            <button class="logout-btn" onclick="logoutAdmin()">🚪 خروج</button>
        </div>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('dashboard', this)">📊 داشبورد</button>
        <button class="tab-btn" onclick="switchTab('comments', this)">💬 نظرات</button>
        <button class="tab-btn" onclick="switchTab('courses', this)">📚 دوره‌ها</button>
        <button class="tab-btn" onclick="switchTab('lessons', this)">📖 دروس</button>
        <button class="tab-btn" onclick="switchTab('users', this)">👥 کاربران</button>
    </div>

    <div class="container">

        <!-- تب داشبورد -->
        <div id="tab-dashboard" class="tab-content active">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="icon">👥</div>
                    <div class="value" id="statUsers">-</div>
                    <div class="label">کاربران</div>
                </div>
                <div class="stat-card">
                    <div class="icon">📚</div>
                    <div class="value" id="statCourses">-</div>
                    <div class="label">دوره‌ها</div>
                </div>
                <div class="stat-card">
                    <div class="icon">📖</div>
                    <div class="value" id="statLessons">-</div>
                    <div class="label">دروس</div>
                </div>
                <div class="stat-card">
                    <div class="icon">⭐</div>
                    <div class="value" id="statScores">-</div>
                    <div class="label">امتیازات</div>
                </div>
                <div class="stat-card">
                    <div class="icon">💬</div>
                    <div class="value" id="statComments">-</div>
                    <div class="label">نظرات</div>
                </div>
            </div>

            <div class="chart-box">
                <h3>📈 امتیازات ۷ روز گذشته</h3>
                <canvas id="scoresChart" height="100"></canvas>
            </div>
        </div>

        <!-- تب نظرات -->
        <div id="tab-comments" class="tab-content">
            <h2 style="margin-bottom:15px; color:#f59e0b;">💬 نظرات کاربران</h2>
            <div id="commentsList" class="loading">
                <div class="spinner"></div>
                در حال بارگذاری...
            </div>
        </div>

        <!-- تب دوره‌ها -->
        <div id="tab-courses" class="tab-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h2 style="color:#f59e0b;">📚 مدیریت دوره‌ها</h2>
                <button class="btn btn-primary" onclick="openCourseModal()">➕ دوره جدید</button>
            </div>
            <div id="coursesList" class="loading">
                <div class="spinner"></div>
                در حال بارگذاری...
            </div>
        </div>

        <!-- تب دروس -->
        <div id="tab-lessons" class="tab-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h2 style="color:#f59e0b;">📖 مدیریت دروس</h2>
                <button class="btn btn-primary" onclick="openLessonModal()">➕ درس جدید</button>
            </div>
            <div id="lessonsList" class="loading">
                <div class="spinner"></div>
                در حال بارگذاری...
            </div>
        </div>

        <!-- تب کاربران -->
        <div id="tab-users" class="tab-content">
            <h2 style="margin-bottom:15px; color:#f59e0b;">👥 کاربران</h2>
            <input type="text" id="userSearch" placeholder="🔍 جستجوی کاربر..." 
                   style="width:100%; padding:12px; background:rgba(15,23,42,0.8); border:1px solid rgba(255,255,255,0.1); border-radius:10px; color:#f1f5f9; font-family:Tahoma; margin-bottom:15px;"
                   oninput="filterUsers()">
            <div id="usersList" class="loading">
                <div class="spinner"></div>
                در حال بارگذاری...
            </div>
        </div>

    </div>
</div>

<!-- مودال دوره -->
<div id="courseModal" class="modal-overlay">
    <div class="modal">
        <h2 id="courseModalTitle">➕ دوره جدید</h2>
        <input type="hidden" id="courseId">
        <div class="form-group">
            <label>عنوان دوره *</label>
            <input type="text" id="courseTitle">
        </div>
        <div class="form-group">
            <label>توضیحات</label>
            <textarea id="courseDesc" rows="3"></textarea>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>آیکون (ایموجی)</label>
                <input type="text" id="courseIcon" placeholder="📚">
            </div>
            <div class="form-group">
                <label>سطح</label>
                <select id="courseLevel">
                    <option value="مبتدی">مبتدی</option>
                    <option value="متوسط">متوسط</option>
                    <option value="پیشرفته">پیشرفته</option>
                </select>
            </div>
        </div>
        <div class="modal-actions">
            <button class="btn btn-secondary" onclick="closeModal('courseModal')">لغو</button>
            <button class="btn btn-primary" onclick="saveCourse()">💾 ذخیره</button>
        </div>
    </div>
</div>

<!-- مودال درس -->
<div id="lessonModal" class="modal-overlay">
    <div class="modal">
        <h2 id="lessonModalTitle">➕ درس جدید</h2>
        <input type="hidden" id="lessonId">

        <div class="form-group">
            <label>دوره مربوطه *</label>
            <select id="lessonCourse"></select>
        </div>

        <div class="form-group">
            <label>عنوان درس *</label>
            <input type="text" id="lessonTitle">
        </div>

        <div class="form-group">
            <label>محتوا (HTML قابل قبول)</label>
            <textarea id="lessonContent" rows="5"></textarea>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>🎥 لینک ویدیو (اختیاری)</label>
                <input type="text" id="lessonVideo" placeholder="https://...">
            </div>
            <div class="form-group">
                <label>ترتیب</label>
                <input type="number" id="lessonOrder" value="1">
            </div>
        </div>

        <div class="form-group">
            <label>🖼️ لینک تصویر (اختیاری)</label>
            <input type="text" id="lessonImage" placeholder="files/image.jpg یا https://...">
        </div>

        <div class="form-group">
            <label>📄 لینک PDF (اختیاری)</label>
            <input type="text" id="lessonPdf" placeholder="files/lesson.pdf یا https://...">
        </div>

        <div class="form-group">
            <label>📝 لینک Word (اختیاری)</label>
            <input type="text" id="lessonWord" placeholder="files/lesson.docx یا https://...">
        </div>

        <div class="form-group">
            <label>📊 لینک PowerPoint (اختیاری)</label>
            <input type="text" id="lessonPowerpoint" placeholder="files/lesson.pptx یا https://...">
        </div>

        <div class="form-group">
            <label>📚 لینک جزوه (اختیاری)</label>
            <input type="text" id="lessonNotes" placeholder="files/notes.pdf یا https://...">
        </div>

        <div class="modal-actions">
            <button class="btn btn-secondary" onclick="closeModal('lessonModal')">لغو</button>
            <button class="btn btn-primary" onclick="saveLesson()">💾 ذخیره</button>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script src="supabase-config.js"></script>
<script src="admin.js"></script>

</body>
</html>
