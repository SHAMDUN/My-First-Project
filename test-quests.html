<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>تست Quest ها</title>
    <style>
        body { font-family: Tahoma; padding: 20px; background: #0f172a; color: #fff; direction: rtl; }
        pre { background: #1e293b; padding: 15px; border-radius: 10px; white-space: pre-wrap; word-wrap: break-word; font-size: 12px; max-height: 400px; overflow-y: auto; }
        button { background: #f59e0b; color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; padding: 12px 24px; font-family: Tahoma; font-size: 15px; margin: 5px; }
        button:hover { background: #d97706; }
        .ok { color: #4ade80; }
        .err { color: #f87171; }
    </style>
</head>
<body>
    <h1>🎯 تست Quest ها</h1>
    <p>روی دکمه‌ها کلیک کن تا Quest ها رو تکمیل کنی:</p>
    
    <button onclick="testImage()">🖼️ تست تصویر (Quest 3)</button>
    <button onclick="testAudio()">🔊 تست صدا (Quest 4)</button>
    
    <pre id="result">منتظر...</pre>

    <script>
        const API_KEY = 'sk_Lg9fjXt4JVdWMXe7QIWUSBwfAlPP67qO';

        async function testImage() {
            const result = document.getElementById('result');
            result.textContent = '⏳ در حال تولید تصویر...';

            try {
                const response = await fetch('https://gen.pollinations.ai/image/a golden coin?model=flux', {
                    headers: { 'Authorization': `Bearer ${API_KEY}` }
                });

                if (response.ok) {
                    result.innerHTML = '✅ <span class="ok">تصویر با موفقیت تولید شد! Quest 3 تکمیل شد.</span>\n\n' +
                        'حالا برو به صفحه Quests و ببین اعتبار اضافه شده یا نه:\n' +
                        'https://enter.pollinations.ai/quests';
                } else {
                    const text = await response.text();
                    result.textContent = '❌ خطا: ' + response.status + '\n' + text.substring(0, 500);
                }
            } catch (e) {
                result.textContent = '❌ خطا: ' + e.message;
            }
        }

        async function testAudio() {
            const result = document.getElementById('result');
            result.textContent = '⏳ در حال تولید صدا...';

            try {
                const response = await fetch('https://gen.pollinations.ai/audio/سلام?voice=nova', {
                    headers: { 'Authorization': `Bearer ${API_KEY}` }
                });

                if (response.ok) {
                    result.innerHTML = '✅ <span class="ok">صدا با موفقیت تولید شد! Quest 4 تکمیل شد.</span>\n\n' +
                        'حالا برو به صفحه Quests و ببین اعتبار اضافه شده یا نه:\n' +
                        'https://enter.pollinations.ai/quests';
                } else {
                    const text = await response.text();
                    result.textContent = '❌ خطا: ' + response.status + '\n' + text.substring(0, 500);
                }
            } catch (e) {
                result.textContent = '❌ خطا: ' + e.message;
            }
        }
    </script>
</body>
</html>
