<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>استراتژی آپشن بورس تهران | آکادمی شمعدون</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root {
  --bg-primary: #0a0a0f;
  --bg-secondary: #14141c;
  --bg-card: #1a1a24;
  --gold: #d4af37;
  --gold-light: #f4d47c;
  --gold-dark: #a8862a;
  --blue: #3b82f6;
  --green: #10b981;
  --red: #ef4444;
  --white: #f8fafc;
  --gray: #94a3b8;
  --border-subtle: rgba(255,255,255,0.06);
  --border-gold: rgba(212,175,55,0.3);
  --call: #ff9f4a;
  --put: #6fbf73;
}
[data-theme="light"] {
  --bg-primary: #f8fafc;
  --bg-secondary: #eef2f7;
  --bg-card: #ffffff;
  --gold: #b8860b;
  --gold-light: #d4af37;
  --gold-dark: #8b6508;
  --blue: #2563eb;
  --green: #059669;
  --red: #dc2626;
  --white: #0f172a;
  --gray: #64748b;
  --border-subtle: rgba(0,0,0,0.06);
  --border-gold: rgba(184,134,11,0.3);
  --call: #d97706;
  --put: #16a34a;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Vazirmatn', Tahoma, sans-serif;
  background-color: var(--bg-primary);
  background-image:
    radial-gradient(circle at 0% 0%, rgba(212,175,55,0.08) 0%, transparent 40%),
    radial-gradient(circle at 100% 100%, rgba(59,130,246,0.06) 0%, transparent 40%);
  background-attachment: fixed;
  color: var(--white);
  min-height: 100vh;
  direction: rtl;
  padding: 20px;
  transition: background-color 0.3s, color 0.3s;
}
.container { max-width: 1400px; margin: 0 auto; }

.page-header {
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 12px; margin-bottom: 20px;
}
.page-header h1 {
  font-size: 26px; font-weight: 900;
  background: linear-gradient(135deg, var(--gold), var(--gold-light));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.page-header .meta { color: var(--gray); font-size: 12px; margin-top: 4px; }
.page-header .meta span { color: var(--gold); font-weight: 700; }
.live-dot {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  background: var(--green); margin-left: 6px;
  animation: pulse 1.5s infinite; vertical-align: middle;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

.step-card {
  background: linear-gradient(135deg, var(--bg-card), var(--bg-secondary));
  border: 1px solid var(--border-gold);
  border-radius: 20px; padding: 20px; margin-bottom: 20px;
}
[data-theme="light"] .step-card {
  background: linear-gradient(135deg, #ffffff, #eef2f7);
}
.step-title {
  display: flex; align-items: center; gap: 10px;
  font-size: 16px; font-weight: 800; color: var(--gold);
  margin-bottom: 16px; padding-bottom: 12px;
  border-bottom: 1px solid var(--border-subtle);
}
.step-num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; border-radius: 50%;
  background: linear-gradient(135deg, var(--gold), var(--gold-dark));
  color: #fff; font-weight: 900; font-size: 14px;
}

.search-box { display: flex; gap: 10px; margin-bottom: 16px; }
.search-box input {
  flex: 1;
  background: rgba(10,10,15,0.6);
  border: 1px solid var(--border-subtle);
  color: var(--white);
  padding: 11px 16px; border-radius: 12px;
  font-family: inherit; font-size: 14px; outline: none;
  transition: border-color 0.2s;
}
[data-theme="light"] .search-box input { background: rgba(255,255,255,0.8); }
.search-box input:focus { border-color: var(--gold); }
.search-box button {
  background: linear-gradient(135deg, var(--gold), var(--gold-dark));
  color: #fff; border: none; padding: 11px 22px;
  border-radius: 12px; cursor: pointer;
  font-family: inherit; font-size: 13px; font-weight: 800;
}

.base-list {
  display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px;
  min-height: 40px;
}
.base-chip {
  background: rgba(10,10,15,0.5);
  border: 1px solid var(--border-subtle);
  color: var(--gray); padding: 8px 16px;
  border-radius: 20px; font-size: 13px; font-weight: 700;
  cursor: pointer; transition: 0.2s;
}
[data-theme="light"] .base-chip { background: rgba(255,255,255,0.6); }
.base-chip:hover { color: var(--gold); border-color: var(--border-gold); }
.base-chip.active {
  background: linear-gradient(135deg, var(--gold), var(--gold-dark));
  color: #fff; border-color: var(--gold);
}
.base-chip .count {
  background: rgba(255,255,255,0.1);
  padding: 2px 8px; border-radius: 10px;
  font-size: 10px; margin-right: 6px;
}

.strategy-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 12px;
}
.strategy-card {
  background: rgba(10,10,15,0.5);
  border: 2px solid var(--border-subtle);
  border-radius: 14px; padding: 16px;
  cursor: pointer; transition: 0.25s; text-align: center;
}
[data-theme="light"] .strategy-card { background: rgba(255,255,255,0.6); }
.strategy-card:hover {
  border-color: var(--border-gold);
  transform: translateY(-3px);
  box-shadow: 0 10px 25px rgba(212,175,55,0.15);
}
.strategy-card.active {
  border-color: var(--gold);
  background: linear-gradient(135deg, rgba(212,175,55,0.15), rgba(212,175,55,0.05));
  box-shadow: 0 10px 30px rgba(212,175,55,0.25);
}
.strategy-card .icon { font-size: 28px; margin-bottom: 8px; }
.strategy-card .name { font-weight: 800; font-size: 14px; color: var(--white); margin-bottom: 4px; }
.strategy-card .desc { font-size: 11px; color: var(--gray); line-height: 1.6; }
.strategy-card.active .name { color: var(--gold); }

.contract-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 12px;
  max-height: 500px;
  overflow-y: auto;
  padding: 4px;
}
.contract-card {
  background: rgba(10,10,15,0.5);
  border: 2px solid var(--border-subtle);
  border-radius: 14px; padding: 14px;
  cursor: pointer; transition: 0.25s;
}
[data-theme="light"] .contract-card { background: rgba(255,255,255,0.6); }
.contract-card:hover {
  border-color: var(--border-gold);
  transform: translateY(-2px);
}
.contract-card.active {
  border-color: var(--gold);
  background: linear-gradient(135deg, rgba(212,175,55,0.12), rgba(212,175,55,0.03));
  box-shadow: 0 8px 25px rgba(212,175,55,0.2);
}
.contract-card .head {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 10px; padding-bottom: 8px;
  border-bottom: 1px solid var(--border-subtle);
}
.contract-card .code {
  font-size: 13px; font-weight: 800; color: var(--gold);
}
.contract-card .type-badge {
  font-size: 10px; padding: 3px 8px; border-radius: 6px;
  font-weight: 800;
}
.contract-card .type-badge.call {
  background: rgba(255,159,74,0.15); color: var(--call);
  border: 1px solid rgba(255,159,74,0.3);
}
.contract-card .type-badge.put {
  background: rgba(111,191,115,0.15); color: var(--put);
  border: 1px solid rgba(111,191,115,0.3);
}
.contract-card .row {
  display: flex; justify-content: space-between;
  padding: 4px 0; font-size: 12px;
}
.contract-card .row .label { color: var(--gray); }
.contract-card .row .value {
  font-weight: 700; color: var(--white);
  font-variant-numeric: tabular-nums;
}
.contract-card .row .value.pos { color: var(--green); }
.contract-card .row .value.neg { color: var(--red); }

.inputs-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px; margin-bottom: 16px;
}
.input-group { display: flex; flex-direction: column; gap: 6px; }
.input-group label { font-size: 11px; color: var(--gray); font-weight: 700; }
.input-group input, .input-group select {
  background: rgba(10,10,15,0.6);
  border: 1px solid var(--border-subtle);
  color: var(--white);
  padding: 9px 12px; border-radius: 10px;
  font-family: inherit; font-size: 13px;
  outline: none; transition: border-color 0.2s;
  font-variant-numeric: tabular-nums;
}
[data-theme="light"] .input-group input,
[data-theme="light"] .input-group select { background: rgba(255,255,255,0.8); }
.input-group input:focus, .input-group select:focus { border-color: var(--gold); }

.chart-wrap {
  background: var(--bg-secondary);
  border: 1px solid var(--border-subtle);
  border-radius: 14px; padding: 12px;
  position: relative; margin-bottom: 16px;
}
#payoffChart { width: 100%; height: 380px; }

.summary-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px;
}
.summary-card {
  background: rgba(10,10,15,0.5);
  border: 1px solid var(--border-subtle);
  border-radius: 12px; padding: 12px 14px;
}
[data-theme="light"] .summary-card { background: rgba(255,255,255,0.6); }
.summary-card .label { font-size: 11px; color: var(--gray); margin-bottom: 4px; }
.summary-card .value { font-size: 15px; font-weight: 800; color: var(--white); }
.summary-card .value.pos { color: var(--green); }
.summary-card .value.neg { color: var(--red); }

.loading { text-align: center; padding: 30px; color: var(--gray); }
.spinner {
  display: inline-block; width: 16px; height: 16px;
  border: 2px solid var(--border-subtle);
  border-top-color: var(--gold);
  border-radius: 50%; animation: spin 0.8s linear infinite;
  vertical-align: middle; margin-left: 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.error-box {
  background: rgba(239,68,68,0.1);
  border: 1px solid var(--red);
  color: var(--red);
  padding: 14px; border-radius: 12px;
  margin-bottom: 16px; display: none; font-size: 13px;
}

.hidden { display: none !important; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 4px; }

@media (max-width: 768px) {
  .page-header h1 { font-size: 20px; }
  .strategy-grid { grid-template-columns: repeat(2, 1fr); }
  #payoffChart { height: 300px; }
}
</style>
</head>
<body>
<div class="container">

  <div class="page-header">
    <div>
      <h1>📊 استراتژی آپشن بورس تهران</h1>
      <div class="meta">
        <span class="live-dot"></span>
        آخرین بروزرسانی: <span id="lastUpdate">—</span>
        &nbsp;|&nbsp; تعداد قرارداد: <span id="totalCount">—</span>
      </div>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="btn secondary" id="refreshBtn" style="background:rgba(10,10,15,0.6);color:var(--gold);border:1px solid var(--border-gold);padding:10px 20px;border-radius:10px;cursor:pointer;font-family:inherit;font-weight:800;">🔄 بروزرسانی</button>
    </div>
  </div>

  <div id="errorBox" class="error-box"></div>

  <!-- STEP 1 -->
  <div class="step-card">
    <div class="step-title">
      <span class="step-num">۱</span>
      دارایی پایه رو انتخاب کن
    </div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="جستجو در نمادهای پایه (مثلاً: خودرو، اهرم، فولاد...)">
      <button id="searchBtn">🔍</button>
    </div>
    <div class="base-list" id="baseList">
      <div class="loading"><span class="spinner"></span>در حال دریافت داده‌های بازار...</div>
    </div>
  </div>

  <!-- STEP 2 -->
  <div class="step-card hidden" id="step2">
    <div class="step-title">
      <span class="step-num">۲</span>
      استراتژی رو انتخاب کن
    </div>
    <div class="strategy-grid" id="strategyGrid"></div>
  </div>

  <!-- STEP 3 -->
  <div class="step-card hidden" id="step3">
    <div class="step-title">
      <span class="step-num">۳</span>
      قرارداد رو انتخاب کن
    </div>

    <div class="inputs-row" style="margin-bottom:12px;">
      <div class="input-group">
        <label>نوع</label>
        <select id="typeFilter">
          <option value="all">هر دو (Call + Put)</option>
          <option value="call">فقط اختیار خرید (Call)</option>
          <option value="put">فقط اختیار فروش (Put)</option>
        </select>
      </div>
      <div class="input-group">
        <label>مرتب‌سازی</label>
        <select id="sortBy">
          <option value="strike">قیمت اعمال</option>
          <option value="volume">حجم معاملات</option>
          <option value="oi">موقعیت باز</option>
        </select>
      </div>
    </div>

    <div class="contract-list" id="contractList"></div>
  </div>

  <!-- STEP 4 -->
  <div class="step-card hidden" id="step4">
    <div class="step-title">
      <span class="step-num">۴</span>
      نمودار سود/زیان استراتژی
    </div>

    <div class="inputs-row" id="strategyInputs"></div>

    <div class="chart-wrap">
      <div id="payoffChart"></div>
    </div>

    <div class="summary-grid" id="summaryGrid"></div>
  </div>

</div>

<script>
// ================================================================
//  CONFIG
// ================================================================
const BRS_API_KEY = 'BkGvPpQcq7mjWbwKGwHNGg7zVPgvBwpm';
const BRS_API_URL = `https://Api.BrsApi.ir/Tsetmc/Option.php?key=${BRS_API_KEY}`;

// ================================================================
//  STATE
// ================================================================
let allOptions = [];      // همه ۱۵۸۷ قرارداد
let baseGroups = new Map(); // { base_l18: [قراردادها] }
let selectedBase = null;
let selectedStrategy = null;
let selectedContract = null;
let payoffChart = null;

// ================================================================
//  STRATEGIES
// ================================================================
const STRATEGIES = [
  { id: 'protectivePut', name: 'بیمه کردن',   icon: '🛡️', desc: 'خرید دارایی + خرید Put برای محافظت در برابر ریزش' },
  { id: 'coveredCall',   name: 'کاورد کال',   icon: '📈', desc: 'خرید دارایی + فروش Call برای درآمد اضافه' },
  { id: 'longCall',      name: 'خرید Call',   icon: '🚀', desc: 'شرط‌بندی روی صعود با ریسک محدود' },
  { id: 'longPut',       name: 'خرید Put',    icon: '📉', desc: 'شرط‌بندی روی نزول با ریسک محدود' },
  { id: 'straddle',      name: 'استرادل',     icon: '⚡', desc: 'خرید Call + خرید Put برای نوسان بالا' },
];

// ================================================================
//  HELPERS
// ================================================================
function fmt(n, decimals = 0) {
  if (n === null || n === undefined || n === '') return '—';
  const num = Number(n);
  if (isNaN(num)) return String(n);
  return num.toLocaleString('fa-IR', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}
function fmtPercent(n) {
  if (n === null || n === undefined || n === '') return '—';
  const num = Number(n);
  if (isNaN(num)) return '—';
  const cls = num > 0 ? 'pos' : num < 0 ? 'neg' : '';
  const sign = num > 0 ? '+' : '';
  return `<span class="${cls}">${sign}${num.toFixed(2)}%</span>`;
}
function showError(msg) {
  const box = document.getElementById('errorBox');
  box.innerHTML = '❌ ' + msg;
  box.style.display = 'block';
  setTimeout(() => { box.style.display = 'none'; }, 8000);
}

// ================================================================
//  FETCH — دریافت همه آپشن‌ها
// ================================================================
async function fetchAllOptions() {
  const list = document.getElementById('baseList');
  list.innerHTML = '<div class="loading"><span class="spinner"></span>در حال دریافت داده‌های بازار...</div>';
  document.getElementById('refreshBtn').disabled = true;

  try {
    const res = await fetch(BRS_API_URL + '&_=' + Date.now());
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();

    // پاسخ آرایه‌ست
    if (!Array.isArray(json)) {
      throw new Error('ساختار داده نامعتبر است');
    }

    allOptions = json;
    document.getElementById('totalCount').textContent = fmt(allOptions.length);
    if (allOptions.length > 0 && allOptions[0].time) {
      document.getElementById('lastUpdate').textContent = allOptions[0].time;
    }

    // گروه‌بندی بر اساس base_l18
    baseGroups = new Map();
    allOptions.forEach(opt => {
      const base = opt.base_l18 || 'نامشخص';
      if (!baseGroups.has(base)) {
        baseGroups.set(base, []);
      }
      baseGroups.get(base).push(opt);
    });

    renderBaseChips();
    document.getElementById('errorBox').style.display = 'none';
  } catch (err) {
    console.error(err);
    showError('خطا در دریافت داده: ' + err.message);
    list.innerHTML = `<div class="loading">❌ ${err.message}</div>`;
  } finally {
    document.getElementById('refreshBtn').disabled = false;
  }
}

// ================================================================
//  STEP 1 — چیپ‌های دارایی پایه
// ================================================================
function renderBaseChips(filter = '') {
  const list = document.getElementById('baseList');
  const entries = [...baseGroups.entries()]
    .filter(([base]) => !filter || base.includes(filter))
    .sort((a, b) => b[1].length - a[1].length);

  if (entries.length === 0) {
    list.innerHTML = '<div class="loading">نمادی یافت نشد</div>';
    return;
  }

  list.innerHTML = entries.map(([base, opts]) => `
    <div class="base-chip" data-base="${base}">
      ${base}
      <span class="count">${fmt(opts.length)}</span>
    </div>
  `).join('');

  list.querySelectorAll('.base-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      list.querySelectorAll('.base-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      selectedBase = chip.dataset.base;
      document.getElementById('step2').classList.remove('hidden');
      document.getElementById('step2').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
}

// ================================================================
//  STEP 2 — استراتژی‌ها
// ================================================================
function renderStrategies() {
  const grid = document.getElementById('strategyGrid');
  grid.innerHTML = STRATEGIES.map(s => `
    <div class="strategy-card" data-id="${s.id}">
      <div class="icon">${s.icon}</div>
      <div class="name">${s.name}</div>
      <div class="desc">${s.desc}</div>
    </div>
  `).join('');

  grid.querySelectorAll('.strategy-card').forEach(card => {
    card.addEventListener('click', () => {
      grid.querySelectorAll('.strategy-card').forEach(c => c.classList.remove('active'));
      card.classList.add('active');
      selectedStrategy = STRATEGIES.find(s => s.id === card.dataset.id);
      document.getElementById('step3').classList.remove('hidden');
      renderContracts();
      document.getElementById('step3').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
}

// ================================================================
//  STEP 3 — قراردادها
// ================================================================
function renderContracts() {
  const list = document.getElementById('contractList');
  const typeFilter = document.getElementById('typeFilter').value;
  const sortBy = document.getElementById('sortBy').value;

  let filtered = [...(baseGroups.get(selectedBase) || [])];
  if (typeFilter !== 'all') {
    filtered = filtered.filter(c => c.type === typeFilter);
  }
  filtered.sort((a, b) => {
    if (sortBy === 'strike') return (a.price_strike || 0) - (b.price_strike || 0);
    if (sortBy === 'volume') return (b.tvol || 0) - (a.tvol || 0);
    if (sortBy === 'oi') return (b.interest_open || 0) - (a.interest_open || 0);
    return 0;
  });

  if (filtered.length === 0) {
    list.innerHTML = '<div class="loading">قراردادی با این فیلتر یافت نشد</div>';
    return;
  }

  list.innerHTML = filtered.map((c, i) => {
    const typeCls = c.type === 'call' ? 'call' : 'put';
    const typeLabel = c.type === 'call' ? 'خرید' : 'فروش';
    const pl = c.pl || 0;
    const plp = c.plp || 0;
    const plCls = plp > 0 ? 'pos' : plp < 0 ? 'neg' : '';

    return `
      <div class="contract-card" data-idx="${i}">
        <div class="head">
          <span class="code">${c.l18 || '—'}</span>
          <span class="type-badge ${typeCls}">${typeLabel}</span>
        </div>
        <div class="row"><span class="label">قیمت اعمال</span><span class="value">${fmt(c.price_strike)}</span></div>
        <div class="row"><span class="label">آخرین قیمت</span><span class="value">${fmt(pl)}</span></div>
        <div class="row"><span class="label">تغییر</span><span class="value ${plCls}">${plp.toFixed(2)}%</span></div>
        <div class="row"><span class="label">حجم</span><span class="value">${fmt(c.tvol)}</span></div>
        <div class="row"><span class="label">موقعیت باز</span><span class="value">${fmt(c.interest_open)}</span></div>
        <div class="row"><span class="label">روز مانده</span><span class="value">${fmt(c.day_remain)}</span></div>
      </div>
    `;
  }).join('');

  list.querySelectorAll('.contract-card').forEach(card => {
    card.addEventListener('click', () => {
      list.querySelectorAll('.contract-card').forEach(c => c.classList.remove('active'));
      card.classList.add('active');
      selectedContract = filtered[Number(card.dataset.idx)];
      document.getElementById('step4').classList.remove('hidden');
      renderStrategyInputs();
      drawPayoff();
      document.getElementById('step4').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
}

// ================================================================
//  STEP 4 — ورودی‌های استراتژی
// ================================================================
function renderStrategyInputs() {
  if (!selectedStrategy || !selectedContract) return;
  const c = selectedContract;
  const wrap = document.getElementById('strategyInputs');
  const stratId = selectedStrategy.id;

  const strike = c.price_strike || 0;
  const prem = c.pl || 0;
  const spot = c.base_pl || strike;

  let html = `
    <div class="input-group">
      <label>قیمت دارایی پایه (${c.base_l18 || '—'})</label>
      <input type="number" id="inSpot" value="${spot}" step="100">
    </div>
    <div class="input-group">
      <label>قیمت اعمال (Strike)</label>
      <input type="number" id="inStrike" value="${strike}" step="100">
    </div>
  `;

  if (stratId === 'protectivePut' || stratId === 'longPut') {
    html += `
      <div class="input-group">
        <label>پریمیوم Put</label>
        <input type="number" id="inPrem1" value="${prem}" step="10">
      </div>
    `;
  } else if (stratId === 'coveredCall' || stratId === 'longCall') {
    html += `
      <div class="input-group">
        <label>پریمیوم Call</label>
        <input type="number" id="inPrem1" value="${prem}" step="10">
      </div>
    `;
  } else if (stratId === 'straddle') {
    html += `
      <div class="input-group">
        <label>پریمیوم Call</label>
        <input type="number" id="inPrem1" value="${prem}" step="10">
      </div>
      <div class="input-group">
        <label>پریمیوم Put</label>
        <input type="number" id="inPrem2" value="${prem}" step="10">
      </div>
    `;
  }

  html += `
    <div class="input-group">
      <label>تعداد قرارداد</label>
      <input type="number" id="inQty" value="1" min="1">
    </div>
  `;

  wrap.innerHTML = html;
  wrap.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('input', drawPayoff);
  });
}

// ================================================================
//  محاسبه Payoff
// ================================================================
function payoffAt(strategyId, S, K, prem1, prem2, qty, spotPrice) {
  switch (strategyId) {
    case 'protectivePut':
      return ((S - spotPrice) + (Math.max(K - S, 0) - prem1)) * qty;
    case 'coveredCall':
      return ((S - spotPrice) + (prem1 - Math.max(S - K, 0))) * qty;
    case 'longCall':
      return (Math.max(S - K, 0) - prem1) * qty;
    case 'longPut':
      return (Math.max(K - S, 0) - prem1) * qty;
    case 'straddle':
      return (Math.max(S - K, 0) + Math.max(K - S, 0) - prem1 - prem2) * qty;
    default:
      return 0;
  }
}

// ================================================================
//  رسم نمودار
// ================================================================
function drawPayoff() {
  if (!selectedStrategy || !selectedContract) return;

  const stratId = selectedStrategy.id;
  const K = Number(document.getElementById('inStrike')?.value) || selectedContract.price_strike || 0;
  const prem1 = Number(document.getElementById('inPrem1')?.value) || 0;
  const prem2 = Number(document.getElementById('inPrem2')?.value) || 0;
  const qty = Number(document.getElementById('inQty')?.value) || 1;
  const spotPrice = Number(document.getElementById('inSpot')?.value) || K;

  const step = Math.max(Math.round(K * 0.02), 10);
  const min = Math.max(K - step * 15, 0);
  const max = K + step * 15;
  const points = [];
  for (let s = min; s <= max; s += step) {
    points.push({
      time: Math.round(s),
      value: payoffAt(stratId, s, K, prem1, prem2, qty, spotPrice),
    });
  }

  let breakeven = null, maxLoss = Infinity, maxProfit = -Infinity;
  points.forEach((p, i) => {
    if (p.value < maxLoss) maxLoss = p.value;
    if (p.value > maxProfit) maxProfit = p.value;
    if (breakeven === null && i > 0 && points[i-1].value < 0 && p.value >= 0) {
      const x1 = points[i-1].time, y1 = points[i-1].value;
      const x2 = p.time, y2 = p.value;
      breakeven = Math.round(x1 + (0 - y1) * (x2 - x1) / (y2 - y1));
    }
  });
  if (maxLoss === Infinity) maxLoss = 0;
  if (maxProfit === -Infinity) maxProfit = 0;

  const container = document.getElementById('payoffChart');
  container.innerHTML = '';

  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  const textColor = isLight ? '#64748b' : '#94a3b8';
  const gridColor = isLight ? 'rgba(0,0,0,0.06)' : 'rgba(255,255,255,0.05)';

  payoffChart = LightweightCharts.createChart(container, {
    width: container.clientWidth,
    height: container.clientHeight,
    layout: {
      background: { color: 'transparent' },
      textColor: textColor,
      fontFamily: 'Vazirmatn, Tahoma, sans-serif',
    },
    grid: {
      vertLines: { color: gridColor },
      horzLines: { color: gridColor },
    },
    rightPriceScale: { borderColor: gridColor },
    timeScale: {
      borderColor: gridColor,
      timeVisible: false,
      secondsVisible: false,
    },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    localization: {
      priceFormatter: (p) => Math.round(p).toLocaleString('fa-IR'),
      timeFormatter: (t) => Number(t).toLocaleString('fa-IR'),
    },
  });

  // خط صفر
  const zeroSeries = payoffChart.addLineSeries({
    color: isLight ? 'rgba(0,0,0,0.2)' : 'rgba(255,255,255,0.15)',
    lineWidth: 1,
    lineStyle: 2,
    priceLineVisible: false,
    lastValueVisible: false,
    crosshairMarkerVisible: false,
  });
  zeroSeries.setData(points.map(p => ({ time: p.time, value: 0 })));

  // خط Payoff
  const lineSeries = payoffChart.addLineSeries({
    color: '#d4af37',
    lineWidth: 3,
    priceLineVisible: false,
    lastValueVisible: true,
    crosshairMarkerVisible: true,
  });
  lineSeries.setData(points);

  payoffChart.timeScale().fitContent();

  // خلاصه
  document.getElementById('summaryGrid').innerHTML = `
    <div class="summary-card"><div class="label">استراتژی</div><div class="value">${selectedStrategy.name}</div></div>
    <div class="summary-card"><div class="label">دارایی پایه</div><div class="value">${selectedBase}</div></div>
    <div class="summary-card"><div class="label">قیمت اعمال</div><div class="value">${fmt(K)}</div></div>
    <div class="summary-card"><div class="label">پریمیوم</div><div class="value">${fmt(prem1)}</div></div>
    <div class="summary-card"><div class="label">حداکثر ضرر</div><div class="value neg">${fmt(Math.round(maxLoss))}</div></div>
    <div class="summary-card"><div class="label">حداکثر سود</div><div class="value pos">${maxProfit > 1e9 ? 'نامحدود' : fmt(Math.round(maxProfit))}</div></div>
    <div class="summary-card"><div class="label">نقطه سربه‌سر</div><div class="value">${breakeven ? fmt(breakeven) : '—'}</div></div>
  `;

  // ریسایز
  const ro = new ResizeObserver(() => {
    if (payoffChart) {
      payoffChart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
    }
  });
  ro.observe(container);
}

  renderBaseChips(e.target.value.trim());
});
document.getElementById('searchBtn').addEventListener('click', () => {

document.getElementById('sortBy').addEventListener('change', renderContracts);

// ================================================================
//  INIT
// ================================================================
renderStrategies();
fetchAllOptions();
</script>
