<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مقاله | آکادمی شمعدون</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
    <meta name="theme-color" content="#d4af37">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #14141c;
            --bg-card: #1a1a24;
            --gold: #d4af37;
            --gold-light: #f4d47c;
            --gold-dark: #a8862a;
            --green: #10b981;
            --red: #ef4444;
            --blue: #3b82f6;
            --white: #f8fafc;
            --gray: #94a3b8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background-color: var(--bg-primary);
            background-image:
                radial-gradient(circle at 0% 0%, rgba(212, 175, 55, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(59, 130, 246, 0.06) 0%, transparent 40%);
            background-size: 100% 100%, 100% 100%;
            background-attachment: fixed;
            color: var(--white);
            min-height: 100vh;
            direction: rtl;
            overflow-x: hidden;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .main-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 100px 20px 40px;
        }
        /* ===== Back Button ===== */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--gray);
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            padding: 8px 16px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 10px;
            transition: 0.3s;
            margin-bottom: 25px;
        }
        .back-btn:hover {
            color: var(--gold);
            border-color: var(--gold);
            background: rgba(212, 175, 55, 0.05);
        }
        /* ===== Article Header ===== */
        .article-header {
            margin-bottom: 30px;
            animation: fadeInUp 0.6s ease-out;
        }
        .article-category {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(212, 175, 55, 0.15);
            color: var(--gold);
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 800;
            margin-bottom: 15px;
        }
        .article-title {
            font-size: 36px;
            font-weight: 900;
            line-height: 1.4;
            margin-bottom: 20px;
            color: var(--white);
        }
        .article-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            color: var(--gray);
            font-size: 13px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.15);
        }
        .article-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        /* ===== Share Top (NEW) ===== */
        .share-top {
            margin-bottom: 25px;
            padding: 15px 20px;
            background: rgba(20, 20, 28, 0.5);
            border-radius: 15px;
            border: 1px solid rgba(212, 175, 55, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            animation: fadeInUp 0.6s ease-out 0.15s backwards;
        }
        .share-top .share-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--gray);
        }
        /* ===== Cover Image ===== */
        .cover-image {
            width: 100%;
            height: 400px;
            border-radius: 20px;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.2), rgba(20, 20, 28, 0.9));
            background-size: cover;
            background-position: center;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 100px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            animation: fadeInUp 0.6s ease-out 0.1s backwards;
        }
        /* ===== Article Content ===== */
        .article-content {
            background: linear-gradient(135deg, var(--bg-card), var(--bg-secondary));
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 20px;
            padding: 35px;
            line-height: 2;
            font-size: 15.5px;
            color: #cbd5e1;
            animation: fadeInUp 0.6s ease-out 0.2s backwards;
        }
        .article-content h1 {
            color: var(--gold);
            font-size: 26px;
            font-weight: 900;
            margin: 30px 0 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(212, 175, 55, 0.3);
            line-height: 1.5;
        }
        .article-content h1:first-child { margin-top: 0; }
        .article-content h2 {
            color: var(--gold-light);
            font-size: 21px;
            font-weight: 800;
            margin: 25px 0 12px;
            line-height: 1.5;
        }
        .article-content h3 {
            color: var(--white);
            font-size: 17px;
            font-weight: 800;
            margin: 20px 0 10px;
        }
        .article-content p {
            margin-bottom: 15px;
            text-align: justify;
        }
        .article-content ul, .article-content ol {
            margin: 15px 20px 15px 0;
            padding-right: 20px;
        }
        .article-content li { margin-bottom: 8px; }
        .article-content strong { color: var(--gold-light); font-weight: 800; }
        .article-content em { color: var(--gold); }
        .article-content code {
            background: rgba(212, 175, 55, 0.15);
            color: var(--gold-light);
            padding: 2px 8px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            direction: ltr;
            display: inline-block;
        }
        .article-content pre {
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 12px;
            overflow-x: auto;
            margin: 15px 0;
            direction: ltr;
            text-align: left;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .article-content pre code {
            background: transparent;
            padding: 0;
            color: #cbd5e1;
            font-size: 13px;
        }
        .article-content blockquote {
            border-right: 4px solid var(--gold);
            background: rgba(212, 175, 55, 0.05);
            padding: 15px 20px;
            margin: 15px 0;
            border-radius: 8px;
            color: var(--gold-light);
            font-style: italic;
        }
        .article-content a {
            color: var(--blue);
            text-decoration: underline;
            text-decoration-color: rgba(59, 130, 246, 0.4);
            transition: 0.3s;
        }
        .article-content a:hover {
            color: var(--gold);
            text-decoration-color: var(--gold);
        }
        .article-content hr {
            border: none;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.4), transparent);
            margin: 25px 0;
        }
        .article-content img {
            max-width: 100%;
            border-radius: 12px;
            margin: 15px 0;
        }
        .article-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
            font-size: 14px;
        }
        .article-content table th {
            background: rgba(212, 175, 55, 0.1);
            color: var(--gold);
            padding: 10px;
            text-align: right;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }
        .article-content table td {
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        /* ===== Tags ===== */
        .tags-section {
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid rgba(212, 175, 55, 0.15);
            animation: fadeInUp 0.6s ease-out 0.3s backwards;
        }
        .tags-title {
            color: var(--gray);
            font-size: 13px;
            margin-bottom: 12px;
            font-weight: 700;
        }
        .tags-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .tag {
            background: rgba(212, 175, 55, 0.1);
            color: var(--gold);
            border: 1px solid rgba(212, 175, 55, 0.25);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
            transition: 0.3s;
        }
        .tag:hover {
            background: rgba(212, 175, 55, 0.25);
            transform: translateY(-2px);
        }
        /* ===== Share ===== */
        .share-section {
            margin-top: 25px;
            padding: 20px;
            background: rgba(20, 20, 28, 0.5);
            border-radius: 15px;
            border: 1px solid rgba(212, 175, 55, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
            animation: fadeInUp 0.6s ease-out 0.35s backwards;
        }
        .share-title {
            color: var(--gray);
            font-size: 13px;
            font-weight: 700;
        }
        .share-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .share-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            transition: 0.3s;
            font-family: inherit;
            border: none;
            cursor: pointer;
            color: var(--white);
        }
        .share-btn.telegram { background: #0088cc; }
        .share-btn.telegram:hover { background: #006699; transform: translateY(-2px); }
        .share-btn.whatsapp { background: #25d366; }
        .share-btn.whatsapp:hover { background: #1da851; transform: translateY(-2px); }
        .share-btn.twitter { background: #000000; }
        .share-btn.twitter:hover { background: #1a1a1a; transform: translateY(-2px); }
        .share-btn.linkedin { background: #0077b5; }
        .share-btn.linkedin:hover { background: #005885; transform: translateY(-2px); }
        .share-btn.copy {
            background: rgba(148, 163, 184, 0.15);
            border: 1px solid rgba(148, 163, 184, 0.3);
            color: var(--gray);
        }
        .share-btn.copy:hover {
            background: rgba(148, 163, 184, 0.25);
            color: var(--white);
        }
        .share-btn.native {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--bg-primary);
            display: none;
        }
        .share-btn.native:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.4);
        }
        /* ===== Related Posts ===== */
        .related-section {
            margin-top: 45px;
            animation: fadeInUp 0.6s ease-out 0.4s backwards;
        }
        .related-title {
            color: var(--gold);
            font-size: 20px;
            font-weight: 900;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid rgba(212, 175, 55, 0.2);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .related-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }
        .related-card {
            background: linear-gradient(135deg, var(--bg-card), var(--bg-secondary));
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 15px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
        }
        .related-card:hover {
            transform: translateY(-4px);
            border-color: rgba(212, 175, 55, 0.5);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.15);
        }
        .related-image {
            height: 120px;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.15), rgba(20, 20, 28, 0.9));
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }
        .related-content {
            padding: 15px;
            flex: 1;
        }
        .related-category {
            display: inline-block;
            background: rgba(212, 175, 55, 0.15);
            color: var(--gold);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 9px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .related-post-title {
            color: var(--white);
            font-size: 14px;
            font-weight: 800;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        /* ===== Loading / Error ===== */
        .loading-screen {
            text-align: center;
            padding: 100px 20px;
            color: var(--gray);
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(212, 175, 55, 0.2);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        .error-screen {
            text-align: center;
            padding: 80px 20px;
            color: var(--gray);
        }
        .error-screen .icon {
            font-size: 60px;
            margin-bottom: 15px;
            opacity: 0.5;
        }
        .error-screen h2 { color: var(--gold); margin-bottom: 10px; }
        .error-screen a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--bg-primary);
            border-radius: 10px;
            text-decoration: none;
            font-weight: 800;
            font-size: 14px;
        }
        /* ===== Footer ===== */
        .footer {
            text-align: center;
            padding: 30px 20px;
            color: var(--gray);
            font-size: 12px;
            border-top: 1px solid rgba(212, 175, 55, 0.1);
            margin-top: 50px;
        }
        /* ===== Toast ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-card);
            color: var(--white);
            padding: 14px 24px;
            border-radius: 12px;
            border-right: 4px solid var(--gold);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            z-index: 2000;
            transition: 0.4s;
            font-size: 14px;
            font-weight: 700;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.success { border-right-color: var(--green); }
        /* ===== Responsive ===== */
        @media (max-width: 700px) {
            .article-title { font-size: 26px; }
            .article-content { padding: 22px 18px; font-size: 14.5px; }
            .article-content h1 { font-size: 22px; }
            .article-content h2 { font-size: 18px; }
            .cover-image { height: 240px; font-size: 70px; }
            .related-grid { grid-template-columns: 1fr; }
            .share-btn.native { display: inline-flex; }
            .share-top { flex-direction: column; align-items: stretch; }
            .share-top .share-buttons { justify-content: center; }
        }
        @media (max-width: 500px) {
            .main-container { padding: 90px 15px 30px; }
            .article-title { font-size: 22px; }
            .share-section { flex-direction: column; align-items: stretch; }
            .share-buttons { justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="main-container" id="mainContainer">
        <div class="loading-screen">
            <div class="spinner"></div>
            ⏳ در حال بارگذاری مقاله...
        </div>
    </div>
    <footer class="footer">
        © ۱۴۰۵ آکادمی شمعدون | تمامی حقوق محفوظ است
    </footer>
    <div id="toast" class="toast"></div>
    <script src="navbar.js"></script>
    <script src="supabase-config.js"></script>
    <script>
        const CATEGORY_ICONS = {
            'آموزش': '📚',
            'تحلیل تکنیکال': '📈',
            'تحلیل بنیادی': '🔬',
            'روانشناسی': '🧠',
            'ابزارها': '🛠️',
            'اخبار': '📰'
        };

        // ==========================================
        // ابزارها
        // ==========================================
        function toFa(num) {
            if (num === null || num === undefined) return '۰';
            const persianDigits = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
            return String(num).replace(/\d/g, d => persianDigits[d]);
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(iso) {
            if (!iso) return '';
            try {
                const d = new Date(iso);
                return new Intl.DateTimeFormat('fa-IR', { year: 'numeric', month: 'long', day: 'numeric' }).format(d);
            } catch (e) {
                return '';
            }
        }

        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast show ' + type;
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function getSlugFromUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get('slug');
        }

        // ==========================================
        // لود مقاله
        // ==========================================
        async function loadPost() {
            const slug = getSlugFromUrl();
            const container = document.getElementById('mainContainer');

            if (!slug) {
                showError('مقاله پیدا نشد');
                return;
            }

            try {
                const { data, error } = await db
                    .from('blog_posts')
                    .select('*')
                    .eq('slug', slug)
                    .eq('status', 'published')
                    .single();

                if (error || !data) {
                    console.error('Post load error:', error);
                    showError('مقاله مورد نظر پیدا نشد');
                    return;
                }

                // افزایش تعداد بازدید (بی‌صدا)
                db.from('blog_posts')
                    .update({ views: (data.views || 0) + 1 })
                    .eq('id', data.id)
                    .then(() => {});

                renderPost(data);
                loadRelatedPosts(data.category, data.id);
                document.title = data.title + ' | آکادمی شمعدون';

            } catch (e) {
                console.error('Catch error:', e);
                showError('خطا در بارگذاری مقاله');
            }
        }

        // ==========================================
        // نمایش خطا
        // ==========================================
        function showError(msg) {
            const container = document.getElementById('mainContainer');
            container.innerHTML = `
                <div class="error-screen">
                    <div class="icon">🔍</div>
                    <h2>${msg}</h2>
                    <p>شاید آدرس اشتباهه یا مقاله حذف شده</p>
                    <a href="blog.html">📚 بازگشت به وبلاگ</a>
                </div>
            `;
        }

        // ==========================================
        // رندر مقاله
        // ==========================================
        function renderPost(post) {
            const container = document.getElementById('mainContainer');
            const category = post.category || 'آموزش';
            const categoryIcon = CATEGORY_ICONS[category] || '📄';

            // رندر Markdown → HTML
            let contentHtml = '';
            try {
                const rawHtml = marked.parse(post.content || '');
                contentHtml = DOMPurify.sanitize(rawHtml);
            } catch (e) {
                console.error('Markdown error:', e);
                contentHtml = '<p>خطا در نمایش متن مقاله</p>';
            }

            // برچسب‌ها
            const tagsHtml = (post.tags && post.tags.length > 0) ? `
                <div class="tags-section">
                    <div class="tags-title">🏷️ برچسب‌ها</div>
                    <div class="tags-list">
                        ${post.tags.map(t => `
                            <a href="blog.html" class="tag">${escapeHtml(t)}</a>
                        `).join('')}
                    </div>
                </div>
            ` : '';

            // عکس شاخص
            const coverHtml = `
                <div class="cover-image" style="${post.cover_image ? `background-image: url('${post.cover_image}');` : ''}">
                    ${post.cover_image ? '' : categoryIcon}
                </div>
            `;

            // لینک‌های اشتراک‌گذاری
            const shareUrl = encodeURIComponent(window.location.href);
            const shareTitle = encodeURIComponent(post.title);
            const shareRawUrl = window.location.href;
            const shareRawTitle = post.title;

            // دکمه‌های مشترک
            const shareButtonsHtml = `
                <a href="https://t.me/share/url?url=${shareUrl}&text=${shareTitle}" target="_blank" rel="noopener" class="share-btn telegram">
                    ✈️ تلگرام
                </a>
                <a href="https://wa.me/?text=${shareTitle}%20${shareUrl}" target="_blank" rel="noopener" class="share-btn whatsapp">
                    💬 واتساپ
                </a>
                <a href="https://twitter.com/intent/tweet?url=${shareUrl}&text=${shareTitle}" target="_blank" rel="noopener" class="share-btn twitter">
                    🐦 توییتر
                </a>
                <a href="https://www.linkedin.com/sharing/share-offsite/?url=${shareUrl}" target="_blank" rel="noopener" class="share-btn linkedin">
                    💼 لینکدین
                </a>
                <button class="share-btn copy" onclick="copyLink()">
                    🔗 کپی لینک
                </button>
                <button class="share-btn native" onclick="nativeShare('${shareRawTitle.replace(/'/g, "\\'").replace(/"/g, '&quot;')}', '${shareRawUrl}')">
                    📱 اشتراک
                </button>
            `;

            container.innerHTML = `
                <a href="blog.html" class="back-btn">← بازگشت به وبلاگ</a>

                <header class="article-header">
                    <span class="article-category">
                        ${categoryIcon} ${category}
                    </span>
                    <h1 class="article-title">${escapeHtml(post.title)}</h1>
                    <div class="article-meta">
                        <span>✍️ ${escapeHtml(post.author_name || 'مهدی')}</span>
                        <span>📅 ${formatDate(post.published_at || post.created_at)}</span>
                        <span>⏱️ ${toFa(post.read_time || 5)} دقیقه مطالعه</span>
                        <span>👁️ ${toFa(post.views || 0)} بازدید</span>
                    </div>
                </header>

                <div class="share-top">
                    <div class="share-title">📤 اشتراک‌گذاری سریع:</div>
                    <div class="share-buttons">
                        <a href="https://t.me/share/url?url=${shareUrl}&text=${shareTitle}" target="_blank" rel="noopener" class="share-btn telegram">✈️ تلگرام</a>
                        <a href="https://wa.me/?text=${shareTitle}%20${shareUrl}" target="_blank" rel="noopener" class="share-btn whatsapp">💬 واتساپ</a>
                        <button class="share-btn copy" onclick="copyLink()">🔗 کپی</button>
                        <button class="share-btn native" onclick="nativeShare('${shareRawTitle.replace(/'/g, "\\'").replace(/"/g, '&quot;')}', '${shareRawUrl}')">📱 اشتراک</button>
                    </div>
                </div>

                ${coverHtml}

                <div class="article-content">
                    ${contentHtml}
                </div>

                ${tagsHtml}

                <div class="share-section">
                    <div class="share-title">📤 این مقاله رو به اشتراک بذار:</div>
                    <div class="share-buttons">
                        ${shareButtonsHtml}
                    </div>
                </div>

                <div class="related-section" id="relatedSection" style="display:none;">
                    <h2 class="related-title">📚 مقالات مرتبط</h2>
                    <div class="related-grid" id="relatedGrid"></div>
                </div>
            `;

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ==========================================
        // کپی لینک
        // ==========================================
        function copyLink() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                showToast('✅ لینک کپی شد');
            }).catch(() => {
                showToast('❌ خطا در کپی لینک', 'error');
            });
        }

        // ==========================================
        // اشتراک‌گذاری سیستم (Web Share API)
        // ==========================================
        async function nativeShare(title, url) {
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: title,
                        text: title + ' — آکادمی شمعدون',
                        url: url
                    });
                } catch (e) {
                    if (e.name !== 'AbortError') {
                        console.error('Share error:', e);
                    }
                }
            } else {
                copyLink();
            }
        }

        // ==========================================
        // مقالات مرتبط
        // ==========================================
        async function loadRelatedPosts(category, currentId) {
            try {
                const { data, error } = await db
                    .from('blog_posts')
                    .select('id, title, slug, category, cover_image')
                    .eq('status', 'published')
                    .eq('category', category)
                    .neq('id', currentId)
                    .limit(3);

                if (error || !data || data.length === 0) return;

                const section = document.getElementById('relatedSection');
                const grid = document.getElementById('relatedGrid');
                if (!section || !grid) return;

                grid.innerHTML = data.map(p => {
                    const catIcon = CATEGORY_ICONS[p.category] || '📄';
                    return `
                        <a href="blog-post.html?slug=${encodeURIComponent(p.slug)}" class="related-card">
                            <div class="related-image" style="${p.cover_image ? `background-image: url('${p.cover_image}');` : ''}">
                                ${p.cover_image ? '' : catIcon}
                            </div>
                            <div class="related-content">
                                <span class="related-category">${catIcon} ${escapeHtml(p.category || '')}</span>
                                <div class="related-post-title">${escapeHtml(p.title)}</div>
                            </div>
                        </a>
                    `;
                }).join('');

                section.style.display = 'block';
            } catch (e) {
                console.error('Related posts error:', e);
            }
        }

        // ==========================================
        // راه‌اندازی
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => {
            loadPost();
        });
    </script>
</body>
</html>
