<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF ساز | آکادمی شمعدون</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
<style>
:root {
  --bg-primary: #0a0a0f;
  --bg-secondary: #14141c;
  --bg-card: #1a1a24;
  --gold: #d4af37;
  --gold-light: #f4d47c;
  --gold-dark: #a8862a;
  --green: #10b981;
  --red: #ef4444;
  --blue: #3b82f6;
  --white: #f8fafc;
  --gray: #94a3b8;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Vazirmatn', Tahoma, sans-serif;
  background: var(--bg-primary);
  color: var(--white);
  min-height: 100vh;
  direction: rtl;
  padding: 20px;
}
.container { max-width: 1200px; margin: 0 auto; }
.header {
  text-align: center;
  padding: 20px 0;
  border-bottom: 2px solid var(--gold);
  margin-bottom: 25px;
}
.header h1 { color: var(--gold); font-size: 28px; font-weight: 900; margin-bottom: 8px; }
.header p { color: var(--gray); font-size: 14px; }
.layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
.panel {
  background: var(--bg-card);
  border: 1px solid rgba(212, 175, 55, 0.2);
  border-radius: 18px;
  padding: 22px;
}
.panel-title {
  color: var(--gold);
  font-size: 16px;
  font-weight: 800;
  margin-bottom: 18px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.form-group { margin-bottom: 14px; }
.form-group label {
  display: block;
  color: var(--white);
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 6px;
}
.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  padding: 11px 14px;
  background: rgba(10, 10, 15, 0.6);
  border: 2px solid rgba(255, 255, 255, 0.08);
  border-radius: 10px;
  color: var(--white);
  font-family: inherit;
  font-size: 13px;
  outline: none;
  transition: 0.3s;
}
.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus { border-color: var(--gold); }
.form-group textarea {
  min-height: 350px;
  resize: vertical;
  line-height: 1.8;
  font-size: 13px;
}
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.btn {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 12px;
  font-family: inherit;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  transition: 0.3s;
  margin-top: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-primary {
  background: linear-gradient(135deg, var(--gold), var(--gold-dark));
  color: #fff;
  box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3);
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 15px 40px rgba(212, 175, 55, 0.5); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.preview-box {
  background: #fff;
  color: #1a1a24;
  border-radius: 12px;
  padding: 25px;
  max-height: 700px;
  overflow-y: auto;
  font-size: 13px;
  line-height: 1.9;
}
.preview-box h1, .preview-box h2 {
  color: #b8860b;
  margin: 15px 0 10px;
  padding-bottom: 6px;
  border-bottom: 2px solid rgba(212, 175, 55, 0.3);
}
.preview-box h1 { font-size: 20px; }
.preview-box h2 { font-size: 17px; }
.preview-box h3 { color: #1a1a24; font-size: 15px; margin: 12px 0 8px; }
.preview-box p { margin-bottom: 10px; color: #334155; }
.preview-box ul, .preview-box ol { margin: 10px 20px 15px 0; padding-right: 20px; }
.preview-box li { margin-bottom: 5px; color: #334155; }
.preview-box strong { color: #b8860b; }
.preview-box blockquote {
  background: rgba(212, 175, 55, 0.08);
  border-right: 4px solid #d4af37;
  padding: 12px 16px;
  margin: 15px 0;
  border-radius: 6px;
  color: #8b6508;
  font-style: italic;
}
.preview-box table { width: 100%; border-collapse: collapse; margin: 15px 0; font-size: 12px; }
.preview-box th {
  background: rgba(212, 175, 55, 0.15);
  color: #8b6508;
  padding: 8px;
  border: 1px solid rgba(212, 175, 55, 0.3);
  font-weight: 800;
}
.preview-box td { padding: 8px; border: 1px solid rgba(0, 0, 0, 0.08); color: #334155; }
.preview-box hr { border: none; border-top: 1px solid rgba(212, 175, 55, 0.3); margin: 18px 0; }
.preview-box code {
  background: rgba(212, 175, 55, 0.1);
  color: #8b6508;
  padding: 2px 6px;
  border-radius: 4px;
  font-family: 'Courier New', monospace;
  font-size: 12px;
}
.preview-box pre {
  background: #f8fafc;
  padding: 12px;
  border-radius: 8px;
  overflow-x: auto;
  direction: ltr;
  text-align: left;
  border: 1px solid #e2e8f0;
}
.preview-box pre code { background: transparent; padding: 0; color: #334155; }
.empty-state { text-align: center; padding: 80px 20px; color: var(--gray); }
.empty-state .icon { font-size: 60px; margin-bottom: 15px; opacity: 0.4; }
.info-box {
  background: rgba(59, 130, 246, 0.08);
  border: 1px solid rgba(59, 130, 246, 0.3);
  border-radius: 10px;
  padding: 12px 15px;
  margin-bottom: 15px;
  color: #93c5fd;
  font-size: 12px;
  line-height: 1.7;
}
.info-box strong { color: #60a5fa; }
.info-box code {
  background: rgba(59, 130, 246, 0.15);
  color: #60a5fa;
  padding: 1px 6px;
  border-radius: 4px;
  font-family: monospace;
  font-size: 11px;
}
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--bg-card);
  color: var(--white);
  padding: 14px 24px;
  border-radius: 12px;
  border-right: 4px solid var(--gold);
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
  z-index: 2000;
  transition: 0.4s;
  font-size: 14px;
  font-weight: 700;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.success { border-right-color: var(--green); }
.toast.error { border-right-color: var(--red); }

/* ============================================
   🖨️ PRINT AREA — این بخش فقط در زمان چاپ نمایش داده می‌شود
   ============================================ */
#printArea {
  display: none;
}

/* ============================================
   🖨️ استایل‌های چاپ (Media Print)
   ============================================ */
@media print {
  /* مخفی کردن رابط کاربری */
  body > *:not(#printArea) {
    display: none !important;
  }

  /* ریست استایل‌های پایه */
  html, body {
    background: #ffffff !important;
    color: #1a1a24 !important;
    padding: 0 !important;
    margin: 0 !important;
    direction: rtl !important;
    font-family: 'Vazirmatn', Tahoma, sans-serif !important;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }

  /* نمایش ناحیه چاپ */
  #printArea {
    display: block !important;
  }

  /* تنظیمات صفحه */
  @page {
    size: A4 portrait;
    margin: 15mm 12mm 18mm 12mm;
  }

  @page :first {
    margin: 0;
  }

  /* ===== صفحه کاور ===== */
  .print-cover {
    width: 100%;
    height: 267mm; /* ارتفاع A4 منهای margin */
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 40mm 20mm;
    box-sizing: border-box;
    page-break-after: always;
    background: #ffffff;
    position: relative;
  }

  .print-cover-logo {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: linear-gradient(135deg, #d4af37, #a8862a);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 50px;
    margin-bottom: 30px;
    box-shadow: 0 10px 40px rgba(212, 175, 55, 0.4);
  }

  .print-cover-badge {
    display: inline-block;
    background: linear-gradient(135deg, #d4af37, #a8862a);
    color: #fff;
    padding: 8px 24px;
    border-radius: 30px;
    font-size: 13px;
    font-weight: 800;
    margin-bottom: 20px;
  }

  .print-cover h1 {
    color: #b8860b;
    font-size: 32px;
    font-weight: 900;
    margin-bottom: 15px;
    line-height: 1.4;
    border: none;
    padding: 0;
  }

  .print-cover .brand-sub {
    color: #64748b;
    font-size: 16px;
    margin-bottom: 40px;
  }

  .print-cover-divider {
    width: 80px;
    height: 3px;
    background: #d4af37;
    margin: 30px auto;
    border-radius: 2px;
  }

  .print-cover h2 {
    color: #1a1a24;
    font-size: 22px;
    margin-bottom: 15px;
    border: none;
    padding: 0;
  }

  .print-cover-meta {
    margin-top: 50px;
    color: #64748b;
    font-size: 13px;
    line-height: 2.2;
  }

  .print-cover-meta strong {
    color: #1a1a24;
  }

  /* ===== صفحه محتوا ===== */
  .print-content {
    width: 100%;
    background: #ffffff;
    page-break-before: always;
    padding: 0;
  }

  .print-header {
    text-align: center;
    padding-bottom: 12px;
    border-bottom: 3px solid #d4af37;
    margin-bottom: 20px;
  }

  .print-header .brand {
    color: #a8862a;
    font-size: 22px;
    font-weight: 900;
    margin-bottom: 4px;
  }

  .print-header .tagline {
    color: #64748b;
    font-size: 11px;
  }

  .print-title-box {
    background: #fef9e7;
    border: 1px solid rgba(212, 175, 55, 0.35);
    border-radius: 10px;
    padding: 16px 20px;
    margin-bottom: 22px;
  }

  .print-title-box h1 {
    color: #b8860b;
    font-size: 20px;
    font-weight: 900;
    margin-bottom: 8px;
    line-height: 1.5;
    border: none;
    padding: 0;
  }

  .print-title-box .meta {
    color: #64748b;
    font-size: 11px;
    line-height: 1.8;
  }

  /* استایل محتوا */
  .print-body {
    color: #334155;
    font-size: 12px;
    line-height: 1.9;
  }

  .print-body h1,
  .print-body h2 {
    color: #b8860b;
    font-weight: 800;
    margin: 20px 0 10px;
    padding-bottom: 5px;
    border-bottom: 2px solid rgba(212, 175, 55, 0.3);
    page-break-after: avoid;
  }

  .print-body h1 { font-size: 17px; }
  .print-body h2 { font-size: 15px; }
  .print-body h3 {
    color: #1a1a24;
    font-size: 13px;
    font-weight: 800;
    margin: 15px 0 8px;
    page-break-after: avoid;
  }

  .print-body p {
    margin-bottom: 10px;
    text-align: justify;
    color: #334155;
    orphans: 3;
    widows: 3;
  }

  .print-body ul,
  .print-body ol {
    margin: 10px 20px 12px 0;
    padding-right: 20px;
  }

  .print-body li {
    margin-bottom: 5px;
    color: #334155;
    page-break-inside: avoid;
  }

  .print-body strong {
    color: #b8860b;
    font-weight: 800;
  }

  .print-body em {
    color: #b8860b;
  }

  .print-body blockquote {
    background: rgba(212, 175, 55, 0.08);
    border-right: 4px solid #d4af37;
    padding: 10px 14px;
    margin: 12px 0;
    border-radius: 6px;
    color: #8b6508;
    font-style: italic;
    page-break-inside: avoid;
  }

  .print-body hr {
    border: none;
    border-top: 1px solid rgba(212, 175, 55, 0.3);
    margin: 18px 0;
  }

  .print-body table {
    width: 100%;
    border-collapse: collapse;
    margin: 12px 0;
    font-size: 11px;
    page-break-inside: avoid;
  }

  .print-body table th {
    background: rgba(212, 175, 55, 0.15);
    color: #8b6508;
    padding: 8px 6px;
    text-align: right;
    border: 1px solid rgba(212, 175, 55, 0.35);
    font-weight: 800;
  }

  .print-body table td {
    padding: 7px 6px;
    border: 1px solid rgba(0, 0, 0, 0.1);
    color: #334155;
  }

  .print-body code {
    background: rgba(212, 175, 55, 0.1);
    color: #8b6508;
    padding: 1px 5px;
    border-radius: 4px;
    font-family: 'Courier New', monospace;
    font-size: 10px;
  }

  .print-body pre {
    background: #f8fafc;
    padding: 10px;
    border-radius: 8px;
    direction: ltr;
    text-align: left;
    border: 1px solid #e2e8f0;
    page-break-inside: avoid;
  }

  .print-body pre code {
    background: transparent;
    padding: 0;
    color: #334155;
  }

  /* ===== فوتر ===== */
  .print-footer {
    margin-top: 25px;
    padding-top: 12px;
    border-top: 2px solid rgba(212, 175, 55, 0.3);
    text-align: center;
    color: #94a3b8;
    font-size: 10px;
    page-break-inside: avoid;
  }

  .print-footer .brand {
    color: #b8860b;
    font-weight: 800;
    font-size: 11px;
    margin-bottom: 3px;
  }
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>📄 PDF ساز دروس</h1>
    <p>اطلاعات درس رو پر کن، دکمه‌ی ساخت PDF رو بزن</p>
  </div>

  <div class="info-box">
    <strong>💡 راهنما:</strong> محتوای درس رو به فرمت <strong>Markdown</strong> بنویس. Markdown یعنی: <code>##</code> برای تیتر، <code>**متن**</code> برای بولد، <code>-</code> برای لیست، <code>&gt;</code> برای نقل‌قول، و <code>|</code> برای جدول.
  </div>

  <div class="layout">
    <div class="panel">
      <div class="panel-title">📝 اطلاعات درس</div>

      <div class="form-group">
        <label>عنوان درس *</label>
        <input type="text" id="lessonTitle" placeholder="مثال: تفاوت تحلیل تکنیکال و بنیادی">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>دوره *</label>
          <input type="text" id="lessonCourse" placeholder="مثال: مبانی تحلیل تکنیکال">
        </div>
        <div class="form-group">
          <label>شماره درس *</label>
          <input type="number" id="lessonNumber" value="1" min="1">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>سطح</label>
          <select id="lessonLevel">
            <option value="مبتدی">مبتدی</option>
            <option value="مبتدی تا متوسط" selected>مبتدی تا متوسط</option>
            <option value="متوسط">متوسط</option>
            <option value="پیشرفته">پیشرفته</option>
          </select>
        </div>
        <div class="form-group">
          <label>زمان مطالعه (دقیقه)</label>
          <input type="number" id="lessonTime" value="15" min="1">
        </div>
      </div>

      <div class="form-group">
        <label>مدرس</label>
        <input type="text" id="lessonTeacher" value="مهدی — بنیان‌گذار آکادمی شمعدون">
      </div>

      <div class="form-group">
        <label>محتوای درس (Markdown) *</label>
        <textarea id="lessonContent" placeholder="## مقدمه&#10;&#10;متن درس..."></textarea>
      </div>

      <button class="btn btn-primary" id="generateBtn" onclick="generatePDF()">
        📥 ساخت و دانلود PDF
      </button>
    </div>

    <div class="panel">
      <div class="panel-title">👁️ پیش‌نمایش زنده</div>
      <div class="preview-box" id="previewBox">
        <div class="empty-state">
          <div class="icon">📄</div>
          <div>پیش‌نمایش اینجا نمایش داده می‌شود</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ============================================
     🖨️ ناحیه چاپ — این قسمت فقط در زمان چاپ فعال می‌شود
     ============================================ -->
<div id="printArea"></div>

<div class="toast" id="toast"></div>

<script>
// ==========================================
// 📌 پیش‌نمایش زنده
// ==========================================
const contentEl = document.getElementById('lessonContent');
const previewBox = document.getElementById('previewBox');

contentEl.addEventListener('input', updatePreview);

function updatePreview() {
  const md = contentEl.value.trim();
  if (!md) {
    previewBox.innerHTML = `
      <div class="empty-state">
        <div class="icon">📄</div>
        <div>پیش‌نمایش اینجا نمایش داده می‌شود</div>
      </div>
    `;
    return;
  }
  try {
    const rawHtml = marked.parse(md);
    const cleanHtml = DOMPurify.sanitize(rawHtml);
    previewBox.innerHTML = cleanHtml;
  } catch (e) {
    console.error('Preview error:', e);
    previewBox.innerHTML = '<p style="color:#ef4444;">❌ خطا در پیش‌نمایش</p>';
  }
}

// ==========================================
// 📌 Toast
// ==========================================
function showToast(msg, type = 'success') {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast show ' + type;
  setTimeout(() => toast.classList.remove('show'), 4000);
}

// ==========================================
// 📌 Escape HTML
// ==========================================
function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ==========================================
// 📌 ساخت PDF با window.print()
// ==========================================
async function generatePDF() {
  const title = document.getElementById('lessonTitle').value.trim();
  const course = document.getElementById('lessonCourse').value.trim();
  const number = document.getElementById('lessonNumber').value || '1';
  const level = document.getElementById('lessonLevel').value;
  const time = document.getElementById('lessonTime').value || '15';
  const teacher = document.getElementById('lessonTeacher').value.trim() || 'آکادمی شمعدون';
  const content = document.getElementById('lessonContent').value.trim();

  // اعتبارسنجی
  if (!content) {
    return showToast('❌ محتوای درس الزامی است', 'error');
  }

  const finalTitle = title || ('درس شماره ' + number);
  const finalCourse = course || 'آکادمی شمعدون';

  const btn = document.getElementById('generateBtn');
  btn.disabled = true;
  btn.innerHTML = '⏳ در حال آماده‌سازی...';

  try {
    // تبدیل Markdown به HTML
    if (typeof marked === 'undefined') {
      throw new Error('marked لود نشده. صفحه رو رفرش کن.');
    }
    // تبدیل هوشمند: HTML یا Markdown
    let rawHtml;
    const trimmedContent = content.trim();

    // چک کن آیا HTML هست یا Markdown
    const looksLikeHtml = trimmedContent.startsWith('<') && 
                          (trimmedContent.includes('</p>') || 
                           trimmedContent.includes('</h2>') || 
                           trimmedContent.includes('</div>') ||
                           trimmedContent.includes('</svg>') ||
                           trimmedContent.includes('</table>'));

    if (looksLikeHtml) {
      // محتوا HTML هست، مستقیم استفاده کن
      console.log('📄 محتوا HTML تشخیص داده شد');
      rawHtml = content;
    } else {
      // محتوا Markdown هست، تبدیل کن
      console.log('📝 محتوا Markdown تشخیص داده شد');
      rawHtml = marked.parse(content);
    }

    // Sanitize با تنظیمات مخصوص SVG
    const cleanHtml = DOMPurify.sanitize(rawHtml, {
      ADD_TAGS: ['svg', 'path', 'g', 'text', 'line', 'rect', 'circle', 'polygon', 'polyline', 'defs', 'linearGradient', 'stop', 'tspan', 'use', 'symbol', 'marker'],
      ADD_ATTR: ['viewBox', 'xmlns', 'fill', 'stroke', 'stroke-width', 'stroke-dasharray', 'stroke-linecap', 'stroke-linejoin', 'font-size', 'font-weight', 'font-family', 'text-anchor', 'x', 'y', 'x1', 'y1', 'x2', 'y2', 'cx', 'cy', 'r', 'd', 'points', 'width', 'height', 'rx', 'ry', 'opacity', 'transform', 'gradientUnits', 'offset', 'stop-color', 'stop-opacity']
    });

    // تاریخ شمسی
    const today = new Date();
    const dateStr = new Intl.DateTimeFormat('fa-IR', {
      year: 'numeric', month: 'long', day: 'numeric'
    }).format(today);

    // ساخت ناحیه چاپ
    const printArea = document.getElementById('printArea');
    printArea.innerHTML = `
      <!-- صفحه کاور -->
      <div class="print-cover">
        <div class="print-cover-logo">🎓</div>
        <div class="print-cover-badge">📚 دوره‌ی آموزشی</div>
        <h1>${escapeHtml(finalCourse)}</h1>
        <div class="brand-sub">آکادمی شمعدون</div>
        <div class="print-cover-divider"></div>
        <h2>درس ${escapeHtml(number)}: ${escapeHtml(finalTitle)}</h2>
        <div class="print-cover-meta">
          <div>👨‍🏫 مدرس: <strong>${escapeHtml(teacher)}</strong></div>
          <div>📅 تاریخ: <strong>${dateStr}</strong></div>
          <div>⏱ زمان مطالعه: <strong>${escapeHtml(time)} دقیقه</strong></div>
          <div>🎯 سطح: <strong>${escapeHtml(level)}</strong></div>
        </div>
      </div>

      <!-- صفحه محتوا -->
      <div class="print-content">
        <div class="print-header">
          <div class="brand">🎓 آکادمی شمعدون</div>
          <div class="tagline">از عدد تا تصمیم، در ۳۰ ثانیه</div>
        </div>

        <div class="print-title-box">
          <h1>درس ${escapeHtml(number)}: ${escapeHtml(finalTitle)}</h1>
          <div class="meta">
            📚 ${escapeHtml(finalCourse)} &nbsp;|&nbsp; 📅 ${dateStr} &nbsp;|&nbsp; ⏱ ${escapeHtml(time)} دقیقه &nbsp;|&nbsp; 🎯 ${escapeHtml(level)}
          </div>
        </div>

        <div class="print-body">
          ${cleanHtml}
        </div>

        <div class="print-footer">
          <div class="brand">🎓 آکادمی شمعدون</div>
          <div>از عدد تا تصمیم، در ۳۰ ثانیه</div>
          <div style="direction: ltr; margin-top: 4px;">🌐 shamdun.github.io/My-First-Project</div>
        </div>
      </div>
    `;

    // اطمینان از لود فونت‌ها قبل از چاپ
    if (document.fonts && document.fonts.ready) {
      await document.fonts.ready;
    }
    await new Promise(r => setTimeout(r, 600));

    showToast('✅ پنجره چاپ باز می‌شود — گزینه «Save as PDF» را انتخاب کن', 'success');

    // باز کردن پنجره چاپ
    setTimeout(() => {
      window.print();
      btn.disabled = false;
      btn.innerHTML = '📥 ساخت و دانلود PDF';
    }, 300);

  } catch (err) {
    console.error('❌ PDF error:', err);
    showToast('❌ خطا: ' + err.message, 'error');
    btn.disabled = false;
    btn.innerHTML = '📥 ساخت و دانلود PDF';
  }
}

// ==========================================
// 📌 لود اولیه پیش‌نمایش
// ==========================================
updatePreview();

// ==========================================
// 📌 کلیدهای میانبر
// ==========================================
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    generatePDF();
  }
});
</script>

</body>
</html>
